allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "Accepted seed route"
    rule: "Use accepted seed as quantitative reference; residues, losses and rejects without demonstrated product function are not co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_route_outputs
    applies_to: "Downgraded or saleable output"
    rule: "First subdivide by field, lot, operation and destination; then prefer physical causality, with another relationship disclosed and tested when necessary."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "Rework and off-spec seed"
    rule: "Keep burdens with the originating lot, return mass to the named node, count energy/loss once, and exclude it from accepted output until acceptance."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_run_period
    applies_to: "Shared runs and changeovers"
    rule: "Assign once using measured run time, throughput or another causal driver and prevent duplication."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_records
      process_id: "managed_cultivation"
      flow_role: "seed; nutrients; water; crop protection; energy; residues"
      record_type: "field and purchase records"
      raw_fields: "field_id; cycle; area; species; product; mass; composition; water; carrier; energy; destination ; actual supply boundary and meter location; product delivery; direct-abstraction owner; source-to-delivery losses, returns and storage; provider coverage"
      collection_method: "reconcile logs, invoices, meters and application records; Raw aggregation and attribution: sum by field/route and divide by linked accepted seed Route-specific requirements: cultivation_energy_identification: Actual diesel machinery for mustard cultivation; identify pumping supply separately. Raw activity or stage basis: per cultivated hectare, then per kg accepted seed. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route. crop_protection_products_specific_input: Operation managed_cultivation: Expand each recorded active ingredient or formulation. The initial lookup found no single identity valid for all sites, so this card remains unresolved. Original quantity method: measured issued mass reconciled to application logs Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; m3; MJ; kWh; ha"
      frequency: "each operation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all fields and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, logs, field map and reconciliation"
    - protocol_id: cp_harvest_mass_balance
      process_id: "harvest_capture"
      flow_role: "crop; energy; raw seed; residues; loss"
      record_type: "harvest lot records"
      raw_fields: "field_id; lot_id; method; energy; seed_mass; moisture; residue; loss; destination"
      collection_method: "scales, fuel logs and field-loss sampling; Raw aggregation and attribution: reconcile seed, residue and loss Route-specific requirements: harvest_energy_identification: Actual diesel cutting, combining or threshing machinery for the selected mustard route. Raw activity or stage basis: per kg raw seed captured. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg; percent; MJ; kWh"
      frequency: "each harvest lot"
      temporal_coverage: "all cycle harvests"
      site_scope: "all fields and contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, sampling, invoices and lot linkage"
    - protocol_id: cp_conditioning_records
      process_id: "clean_dry_stabilize"
      flow_role: "raw seed; energy; water; stabilized seed; rejects"
      record_type: "lot/run records"
      raw_fields: "lot_id; route; input/output mass; moisture; energy; water; foreign_matter; reject; destination"
      collection_method: "scales, moisture tests, meters and operating logs; Raw aggregation and attribution: lot dry-matter and wet-mass balance Route-specific requirements: conditioning_energy_identification: Actual electric cleaning equipment and drying fans; verified ambient drying has no assumed purchased heat and any heater needs separate identification. Raw activity or stage basis: per kg stabilized seed. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg; percent; MJ; kWh; m3"
      frequency: "each lot or period"
      temporal_coverage: "all linked lots"
      site_scope: "each site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, method, meter logs and signed balance"
    - protocol_id: cp_grading_handoff
      process_id: "grade_handoff"
      flow_role: "stabilized input; energy; accepted; downgrade; reject"
      record_type: "grading/dispatch records"
      raw_fields: "lot_id; run_id; input; moisture; grade; accepted; downgrade; reject; destination; energy"
      collection_method: "scales, grader records, tests and dispatch documents; Raw aggregation and attribution: reconcile all states; accepted mass is denominator Route-specific requirements: grading_energy_identification: Actual electric screens, conveyors and changeover cleaning equipment. Raw activity or stage basis: per kg accepted seed. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg; percent; MJ; kWh"
      frequency: "each run and hand-off"
      temporal_coverage: "all included lots"
      site_scope: "each grading site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, grade certificate, dispatch and destination"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "managed_cultivation"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_moisture_conversion
      applies_to: "seed mass"
      rule: "dry_mass_kg = wet_mass_kg × (1 − moisture_percent/100); report original too"
      inputs:
        - "wet mass"
        - moisture
        - method
      output: "dry and declared-basis mass"
      source_ids:
        - agmarknet-mustard-postharvest
    - id: calc_accepted_yield
      applies_to: "crop cycle"
      rule: "accepted_yield = accepted_seed_mass / harvested_area; exclude downgrade/reject"
      inputs:
        - "accepted mass"
        - area
      output: "kg/ha"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_inputs
      applies_to: "nutrient card"
      rule: "sum product mass × supplier nutrient fraction separately for N, P and K"
      inputs:
        - mass
        - composition
      output: "nutrient/field and /kg seed"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest; conditioning; grading"
      rule: "moisture-adjusted input = outputs + loss; investigate residual"
      inputs:
        - masses
        - moisture
        - destinations
      output: "node balance"
      source_ids:
        - iso-14044-2006
    - id: calc_managed_soil_emissions
      applies_to: "cultivation"
      rule: "apply declared method, preferring country factors, to synthetic/organic N, residues, urea and lime"
      inputs:
        - N
        - residues
        - urea
        - lime
        - factors
      output: "species/compartment flows"
      source_ids:
        - ipcc-2019-managed-soils
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_cultivation_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "seed states"
      requirement: "Preserve species/cultivar, lot, moisture, grade, use, geography, route and hand-off."
      evidence: "lot genealogy; tests; dispatch"
    - id: dq_temporal
      applies_to: "all data"
      requirement: "Cover a full cycle and linked lots; disclose multi-year averaging and exceptional weather."
      evidence: "dated records"
    - id: dq_completeness
      applies_to: "all cards"
      requirement: "Reconcile accepted, downgraded, reworked, rejected, residue and loss paths; explain zero/missing values."
      evidence: "signed balances"
    - id: dq_measurement
      applies_to: "mass; moisture; water; energy"
      requirement: "Use calibrated instruments or documented estimates; retain units, conversions and uncertainty."
      evidence: "calibration and methods"
    - id: dq_route
      applies_to: "alternatives"
      requirement: "Store route shares and changed inventories; do not average mutually exclusive routes without weights."
      evidence: "route evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Verify the concrete identity against the selected actual species/organ, sowing or commodity use, fresh/cured/dried and shell state, grade, provider and declared gate, with Mass/kg support. This PCR retains the semantic route and measurement definition; it does not assert that one fixed UUID covers all alternative states. A fresh-state flow cannot automatically bind a cured/dried output, an ambiguous nut/kernel flow cannot prove both states, and commodity seed cannot establish seed-for-sowing identity. Preserve a verified compatible existing binding only for its supported state; otherwise keep the UUID explicitly unresolved until detail-confirmed. Do not change the product boundary, quantity or route to force a match."
    source_ids: []
  - rule_id: validate_route_boundary
    applies_to: "process map"
    rule: "Require four parent nodes and route deltas; reject oil extraction, meal, flour or condiment manufacture."
    source_ids:
      - niphm-mustard-ipm
      - agmarknet-mustard-postharvest
  - rule_id: validate_nutrient_card
    applies_to: "cultivation"
    rule: "Give every actual fertilizer or amendment product its own card, retaining physical product mass, formulation, nutrient composition and application records. Nutrient quantities are not additional inputs of the same product; collection or group identifiers cannot substitute for a concrete flow identity."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "harvest; conditioning; grading"
    rule: "Reconcile input, internal/accepted output, downgrade, rework, rejects, residues, moisture change and loss."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_rework_rejects
    applies_to: "rejects"
    rule: "Each reject needs rework, downgrade, recovery, treatment or discard; accepted output excludes unresolved rejects and duplicated loops."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_mode_attribution
    applies_to: "batch/continuous"
    rule: "Link inputs, outputs, cleaning and changeovers to runs or periods and prevent duplicate shared burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_stabilization
    applies_to: "conditioned seed"
    rule: "Require before/after mass, moisture, drying route and hand-off; moisture above 8% for claimed short-term storage needs reviewed evidence."
    source_ids:
      - agmarknet-mustard-postharvest
  - rule_id: validate_ranges
    applies_to: "all cards"
    rule: "Where a quantitative range is provided, match identity, bounds, unit, basis and evidence in both languages and the projection. Record missing compatible evidence rather than inventing defaults to satisfy a format."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground product-system package for mustard seed at producer/conditioner hand-off"
  downstream_use: "secondary_dataset; background_dataset after compatibility review"
  allowed_use: "Crop-production and downstream oilseed systems requiring the declared gate, moisture and grade"
  excluded_use: "Treating oil, meal, flour or condiment manufacture as included; unadjusted different species, gate or route"
  required_metadata: "species/cultivar; CPC context; geography; cycle; prior land state; irrigation; harvest; drying; lots; moisture; grade; providers; allocation; route shares"
  required_quality_disclosure: "coverage; measured/estimated shares; missing flows; balance residuals; calibration; uncertainty; aggregation; source age; provisional ranges"
  update_trigger: "Changed species, route, grade/moisture gate, topology, material input/yield, allocation, fixed identity or invalidated source"
