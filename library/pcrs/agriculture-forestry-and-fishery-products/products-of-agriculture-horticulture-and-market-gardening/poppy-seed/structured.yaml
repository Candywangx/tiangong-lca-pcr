allocation_rules:
  - rule_id: single_output_default
    applies_to: "Seed-only field"
    rule: "Capsule, straw and residues without separate collection or independent use remain field residue or waste, not invented co-products."
    source_ids:
      - eu-poppy-2014
  - rule_id: straw_coproduct
    applies_to: "Seed plus saleable capsule/straw"
    rule: "If capsules or straw are separately collected and transferred, record both product masses, moisture, destinations and hand-off points. Assign dedicated operations directly; allocate shared cultivation/harvest burdens by consistent dry mass and disclose choice and sensitivity. Latex is not seed."
    source_ids:
      - eu-poppy-2014
  - rule_id: run_linkage
    applies_to: "Harvest lot or combined operation"
    rule: "Link each input, output, cleaning and changeover event to a unique run; apportion cross-run shared fuel/electricity once by documented time or throughput, never twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field"
      flow_role: "sowing seed, N/P/K products, irrigation, crop protection"
      record_type: "field operation ledger"
      raw_fields: "field, date, area, product, formulation, net mass, water meter"
      collection_method: "invoices, application logs, meters; Raw aggregation and attribution: sum physical products once; compound fertilizer not duplicated"
      unit: "kg, m3, ha"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, weighed/metered logs"
    - protocol_id: cp_field_energy
      process_id: "field"
      flow_role: "field fuel"
      record_type: "equipment log"
      raw_fields: "operation, machine, date, fuel, field"
      collection_method: "fuel slips and machinery logs; Raw aggregation and attribution: assign to actual field work"
      unit: "L"
      frequency: "each operation"
      temporal_coverage: "sowing to pre-harvest"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "slips, work hours"
    - protocol_id: cp_field_emissions
      process_id: "field"
      flow_role: "soil N2O"
      record_type: "nitrogen-balance worksheet"
      raw_fields: "synthetic/organic N, residue N, soil/climate data, method factors"
      collection_method: "declared IPCC or equivalent method; Raw aggregation and attribution: preserve source terms and unit conversions"
      unit: "kg N2O"
      frequency: "each cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "versioned method and input records"
    - protocol_id: cp_crop_harvest
      process_id: "field_harvest"
      flow_role: "mature crop, raw seed, collected capsule/straw, pre-harvest residue, dropped seed, broken capsules"
      record_type: "harvest lot ledger"
      raw_fields: "area, lot, raw seed weight/moisture, collected straw weight, pre-harvest retained residue, sampled dropped-seed mass, broken-capsule mass and separate destinations"
      collection_method: "scale, separate material samples and balance; Raw aggregation and attribution: reconcile mature-crop intermediate once; aggregate dropped seed and capsule fragments separately"
      unit: "kg, ha, %"
      frequency: "each lot"
      temporal_coverage: "harvest period"
      site_scope: "field/lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale tickets, material samples, destinations"
    - protocol_id: cp_harvest_energy
      process_id: "harvest"
      flow_role: "harvest fuel and electricity"
      record_type: "equipment run log"
      raw_fields: "run, fuel, metered power, machine"
      collection_method: "equipment and energy log; Raw aggregation and attribution: apportion shared run only once by time/throughput"
      unit: "L, kWh"
      frequency: "each run"
      temporal_coverage: "harvest period"
      site_scope: "equipment/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel slip, meter, work hours"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "raw seed, electricity, fuel, rejected seed, captured capsule dust, other foreign solids, evaporated water"
      record_type: "farm conditioning run"
      raw_fields: "route switch, before/after mass/moisture, electricity/fuel meters, separately weighed rejected seed/captured dust/other impurities and each destination ; all inlet/outlet material water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; wet-basis moisture/density; supported evaporation and uncertainty"
      collection_method: "weighing, moisture test, meters, separate solid collection; Raw aggregation and attribution: reconcile materials by substance and link raw-seed lot; resolve fugitive dust separately"
      unit: "kg, %, kWh, L"
      frequency: "each conditioning lot"
      temporal_coverage: "before farm gate"
      site_scope: "each conditioning lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "classified scales, tests, energy receipts, destination tickets"
    - protocol_id: cp_gate_lot
      process_id: "conditioning"
      flow_role: "net reference seed"
      record_type: "transfer lot ticket"
      raw_fields: "net mass, moisture, impurities, destination, time"
      collection_method: "weighbridge/calibrated scale and lot testing; Raw aggregation and attribution: sum net delivered mass as reference denominator"
      unit: "kg, %"
      frequency: "each delivery lot"
      temporal_coverage: "farm-gate transfer"
      site_scope: "each delivery lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale ticket, lot ID, test"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "field"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: per_kg_gate
      applies_to: "all field, harvest and conditioning exchanges"
      rule: "Assigned crop-cycle exchange total / net kg seed delivered from same cycle; reconcile intermediate transfers without another upstream burden."
      inputs:
        - "exchange total"
        - "net delivery"
        - "lot linkage"
      output: "exchange per kg reference seed"
      source_ids: []
    - id: drying_loss
      applies_to: "conditional drying"
      rule: "Derive evaporated water from before/after net mass and wet-basis moisture; cross-check dry matter against separately removed seed, capsule dust and other solids."
      inputs:
        - "before/after mass"
        - moisture
        - "three separately recorded solid removals"
      output: "kg water loss and balance gap"
      source_ids: []
    - id: soil_n2o_method
      applies_to: "managed soils"
      rule: "Apply declared regional/tier factors to all applicable N sources; state direct versus indirect boundary."
      inputs:
        - "N inputs"
        - "residue N"
        - "method factors"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-soils
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: lot_identity
      applies_to: "all lots"
      requirement: "Trace raw seed, conditioning and net-delivery lots; retain destination, moisture and impurities."
      evidence: "lot IDs, scale and test records"
    - id: mass_closure
      applies_to: "harvest and conditioning"
      requirement: "Reconcile crop, raw seed, collected straw, pre-harvest residue, dropped seed, broken capsules, rejected seed, captured capsule dust, other impurities and water loss item by item on stated moisture bases; never count a material twice across nodes."
      evidence: "substance-specific material balance"
    - id: conditional_zero
      applies_to: "unused conditioning"
      requirement: "No drying, cleaning or stabilization energy and reject exchanges."
      evidence: "operations and transfer logs"
    - id: source_limit
      applies_to: "food destination"
      requirement: "EU advice is conditional quality management for that market, not a reason to exclude other legitimate unprocessed seed."
      evidence: "destination and compliance records"
validation_rules:
  - rule_id: gate_identity
    applies_to: "reference flow"
    rule: "Match UUID, Mass, kg, farm gate and unprocessed state; never replace with oil, capsule, straw or certified planting seed."
    source_ids: []
  - rule_id: route_and_runs
    applies_to: "harvest technology and runs"
    rule: "Declare hand, combine or sequential operations and throughput; link fuel, seed loss and changeover once."
    source_ids:
      - eu-poppy-2014
      - usu-seed-poppy
  - rule_id: coproduct_decision
    applies_to: "capsule/straw"
    rule: "Require independent transfer for co-product status and disclose actual allocation basis; otherwise use residue/waste."
    source_ids:
      - eu-poppy-2014
  - rule_id: range_review
    applies_to: "all flow cards"
    rule: "Check bound, unit, denominator, evidence and conditional switch; investigate provisional outliers without replacing real data."
    source_ids: []
  - rule_id: moisture_and_contamination
    applies_to: "food destination and drying"
    rule: "Report actual lot moisture and capsule-dust risk; food-guidance numbers are not category-wide acceptance thresholds."
    source_ids:
      - eu-poppy-2014
published_dataset_profile:
  dataset_role: "Foreground package for unprocessed poppy seed at farm gate"
  downstream_use: "secondary_dataset or background_dataset in process and lifecyclemodel construction"
  allowed_use: "Upstream food or oil route modelling with matching seed state, farm-gate boundary and disclosures"
  excluded_use: "Substitute for poppy oil, refined food ingredient, pharmaceutical extraction or certified planting seed"
  required_metadata: "Region, season, field, cultivar/destination, harvest method, lot, net mass, moisture, impurity, conditioning and straw fate"
  required_quality_disclosure: "Mass balance, operation/energy record coverage, conditioning switch, emission method, co-product allocation and uncertainty"
  update_trigger: "Material change to production route, farm-gate seed state, destination, harvest technology or data year"
data_sources:
  - id: "eu-poppy-2014"
    type: "official_guidance"
    reference: "European Commission Recommendation 2014/662/EU, https://eur-lex.europa.eu/eli/reco/2014/662/oj/eng"
    used_for: "Food-route harvest and cleaning risks; conditional quality and contamination disclosure, not universal farm-gate thresholds."
  - id: "usu-seed-poppy"
    type: "extension_guidance"
    reference: "Utah State University, Seed Poppy in the Garden, https://extension.usu.edu/yardandgarden/research/seed-poppy-in-the-garden"
    used_for: "Annual crop, mature capsule harvest, and separation route."
  - id: "agroscope-poppy-2005"
    type: "literature"
    reference: "Frick and Hebeisen, Poppy, an alternative plant, Agroscope, 2005, https://www.agrarforschungschweiz.ch/en/2005/01/poppy-an-alternative-plant/"
    used_for: "Regional field-trial seed-yield example of 2–17 dt/ha (200–1700 kg/ha)."
  - id: "ipcc-2019-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4 Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil N2O method and input completeness."
