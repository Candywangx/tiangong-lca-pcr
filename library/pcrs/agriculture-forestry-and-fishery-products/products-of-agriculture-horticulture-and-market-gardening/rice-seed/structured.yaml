measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and mass-normalized inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report the net mass of released rice seed; exclude packaging mass. Normalize inventory quantities to 1,000 kg of released seed."
  - id: moisture_declaration
    applies_to: "Harvested, conditioned, and released seed mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record mass as received at the measured moisture content and report moisture on the declared test basis. Do not silently convert to dry matter. If dry-matter comparison is used, retain the original mass and moisture and state the conversion formula."
  - id: mass_unit_conversion
    applies_to: "Mass records supplied in g or t"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use the confirmed mass unit group: 1 t = 1,000 kg and 1 g = 0.001 kg. Preserve source units in raw records."
  - id: seed_count_conversion
    applies_to: "Seed counts converted to mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert counts only with a lot- or variety-specific thousand-seed mass measured for the represented lot; retain sample result, moisture, and calculation."
  - id: nutrient_and_active_ingredient_basis
    applies_to: "Fertilizers and crop-protection or seed-treatment products"
    required_property_ref:
      name: "Declared product mass and constituent mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record formulated product mass and, separately, calculated nutrient or active-ingredient mass. Never substitute kg product for kg N, P, K, or active ingredient."
