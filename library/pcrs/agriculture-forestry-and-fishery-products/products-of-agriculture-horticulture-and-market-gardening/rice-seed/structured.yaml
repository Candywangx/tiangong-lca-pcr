  classification_refs: "CPC 3.0:01131 (Rice, seed)"
  covered_products: "Seed of Oryza species intended for sowing, including hybrid and non-hybrid lots and declared breeder, foundation, registered, certified, or equivalent seed classes when produced for sale or transfer as planting seed"
  excluded_products: "Paddy or rice grain not released for sowing; milled rice and milling products; seedlings and transplants; conservation-only genebank accessions"
  representative_product: "Quality-assured rice seed, dried, cleaned, graded, lot-tested, and released for sowing"
  production_route: "Parent-seed receipt and identity control; seed-crop establishment and field management; harvest; drying; cleaning and grading; optional treatment; lot testing, packaging, and storage to dispatch"
  market_state: "Saleable or transferable seed lot at producer or seed-processor dispatch gate, bulk or packaged as declared, untreated or treated as declared"
functional_unit:
  what: "Rice seed released for sowing at the producer or seed-processor dispatch gate"
  how_much: "1,000 kg net seed product"
  how_well: "Lot satisfies the declared jurisdiction, certification or quality-assurance scheme, sampling method, analytical purity, varietal identity or purity, germination, moisture, seed-health, and treatment requirements applicable to that lot"
  how_long_or_cycle: "One declared seed multiplication, conditioning, release, and included storage campaign"
  reference_flow_link: "rf_rice_seed_at_dispatch"
system_boundary:
  rules:
    - rule_id: boundary_required_stages
      applies_to: "foreground_system_boundary"
      rule: "Include parent-seed receipt and identity control, seed-crop establishment and field management, direct field emissions, harvest and field handling, reception, drying, cleaning and grading, lot sampling and testing, optional treatment when applied, packaging, and storage up to the declared dispatch gate."
      source_ids:
        - fao-seeds-toolkit-processing-2018
        - fao-seeds-toolkit-quality-2018
    - rule_id: boundary_upstream_inputs
      applies_to: "upstream_technosphere"
      rule: "Include upstream production and delivery of parent seed, fertilizers, soil amendments, crop-protection products, fuels, electricity, irrigation supply, drying energy, treatment products, and packaging through geographically and technologically appropriate datasets."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_direct_field_emissions
      applies_to: "rice_field_emissions"
      rule: "Quantify rice-field CH4 for flooded or otherwise methane-relevant production and direct and indirect N2O from managed-soil nitrogen inputs using measured emissions or a declared, current, geographically appropriate method. Record all activity data and factors and avoid duplicate elementary-flow reporting."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils
    - rule_id: boundary_land_and_carbon_change
      applies_to: "land_use_and_soil_carbon"
      rule: "Include land-use change, peat or organic-soil drainage, and soil-carbon change when applicable to the represented site and study goal; otherwise disclose the screening basis and exclusion."
      source_ids:
        - ipcc-2019-cropland
    - rule_id: boundary_excluded_downstream
      applies_to: "excluded_downstream"
      rule: "Exclude transport after the dispatch gate, downstream sowing and commercial rice cultivation, use of the harvested commercial crop, and end-of-life of downstream products. Capital goods and breeding research are excluded unless the study goal, applicable program rules, or a materiality assessment requires them."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Parent rice seed entering the multiplication cycle, with supplier, variety or parental line, seed generation or class, treatment state, lot identity, mass, moisture, and quality status declared"
  starting_condition_role: "Upstream technosphere input and seed genealogy anchor"
  product_classification_scope: "Rice seed intended for sowing under CPC 3.0:01131, independent of local certification terminology"
  recursive_input_rule: "Record same-category parent seed as a distinct upstream input with its actual generation or class. Do not make the current data package its own provider and do not recursively apply the same reference output as an unbounded self-loop."
  upstream_dataset_requirement: "Link a separately represented parent-seed dataset with compatible geography, generation, treatment, and quality scope; if unavailable, disclose the data gap, proxy, and cut-off effect rather than assigning zero burden."
  disclosure: "Declare parent-seed generation or class, supplier and geography, seed rate, treatment, any proxy dataset, excluded generations, and whether hybrid parental lines or non-hybrid seed were used."
