allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all_multifunctional_processes"
    rule: "Avoid allocation first by collecting lot- and operation-specific data and subdividing field, drying, cleaning, treatment, packaging, and storage operations. Use system expansion only when the added function and substituted product are explicitly justified."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_causality
    applies_to: "field_and_conditioning_coproducts"
    rule: "If subdivision or justified system expansion is not possible, allocate only by a documented physical causal relationship that reflects how the input or operation generates released seed and each co-product. Do not select mass merely because mass data are available."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_economic_fallback
    applies_to: "field_and_conditioning_coproducts"
    rule: "When no defensible physical causal relationship exists, use economic allocation based on documented, representative prices at the split point. Record price basis, currency, period, geography, moisture and quality state, and sensitivity to price variation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_waste_and_downgraded_material
    applies_to: "rejects_and_residues"
    rule: "Classify a reject as co-product only when a documented beneficial destination and market specification exist. Otherwise treat it as waste and include treatment burdens; do not assign an avoided-product credit without an explicitly justified substitution model."
    source_ids:
      - eu-pef-2021
      - fao-seeds-toolkit-processing-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_inputs
      process_id: "seed_crop_production"
      flow_role: "Parent seed, fertilizers, amendments, crop protection, irrigation, fuels, electricity"
      record_type: "Field register, supplier document, invoice, meter, and equipment log"
      raw_fields: "field_id; lot_id; area; dates; parent_seed_mass; parent_seed_class; product_name; formulation; nutrient_or_active_fraction; applied_mass; irrigation_volume; fuel_type_and_amount; electricity; allocation_key"
      collection_method: "Reconcile source documents and field logs to the represented field and released lot; preserve original units and missing-data flags"
      unit: "Native record units plus kg, m3, MJ, and kWh after controlled conversion"
      frequency: "Each application or operation; aggregate per field and crop cycle"
      temporal_coverage: "Entire represented multiplication crop cycle"
      site_scope: "All fields contributing to the released lot"
      aggregation_rule: "Sum attributable records; allocate shared operations only by the approved Section 7 rule; normalize after released mass is known"
      quality_evidence: "Supplier labels or certificates, calibrated meter evidence, invoice or issue record, operator log, and reconciliation sign-off"
    - protocol_id: cp_crop_outputs
      process_id: "seed_crop_production"
      flow_role: "Harvested seed crop, straw, and field co-products"
      record_type: "Harvest ticket, scale record, moisture test, field map, and disposition record"
      raw_fields: "field_id; lot_id; harvested_mass; moisture; impurity_fraction; straw_mass; residue_management; co_product_mass; destination"
      collection_method: "Link calibrated scale and moisture results to each contributing field and lot"
      unit: "kg, percent moisture, ha"
      frequency: "Each harvest load and final field reconciliation"
      temporal_coverage: "Harvest period for the represented crop cycle"
      site_scope: "All contributing fields"
      aggregation_rule: "Sum loads by lot; retain moisture basis; reconcile products, residues, and losses"
      quality_evidence: "Scale calibration, signed ticket, moisture method, field-lot genealogy, and disposition evidence"
    - protocol_id: cp_field_emission_activity
      process_id: "seed_crop_production"
      flow_role: "CH4 and N2O activity data"
      record_type: "Field register, water-management log, amendment and nutrient record, soil or emission measurement"
      raw_fields: "area; cultivation_days; ecosystem; water_regime_during; pre_season_water_regime; organic_amendment_type_rate_and_timing; soil_type; cultivar; synthetic_N; organic_N; residue_N; mineralized_N; volatilization_and_leaching_context; method_and_factor_ids"
      collection_method: "Collect activity data at the most disaggregated represented field or regime; use measured emissions only when sampling is representative"
      unit: "ha, day, kg amendment, kg N, and method-specific units"
      frequency: "Each management event and crop cycle"
      temporal_coverage: "Full cultivation period plus method-required pre-season period"
      site_scope: "Each field and water regime contributing to the lot"
      aggregation_rule: "Calculate separately by field or regime, then sum and normalize to released mass"
      quality_evidence: "Complete activity-data sheet, method version, factor source and tier, units, conversion check, and reviewer sign-off"
    - protocol_id: cp_conditioning_records
      process_id: "seed_conditioning"
      flow_role: "Reception, drying, cleaning, grading, energy, conditioned product, co-products, and waste"
      record_type: "Lot ledger, scale, moisture test, meter, fuel issue, machine log, and disposition record"
      raw_fields: "lot_id; input_mass_and_moisture; drying_method; electricity; fuel_or_heat; output_mass_and_moisture; clean_seed_mass; downgrade_mass; waste_mass; destinations; runtime"
      collection_method: "Reconcile each lot through reception, drying, cleaning, and grading; use submetering where available"
      unit: "kg, percent moisture, kWh, MJ, hour"
      frequency: "Each lot and operation"
      temporal_coverage: "Entire conditioning campaign represented by the dataset"
      site_scope: "All conditioning sites handling the lot"
      aggregation_rule: "Mass and energy balance by lot; allocate shared utilities only by the approved Section 7 rule"
      quality_evidence: "Scale and meter calibration, moisture test, machine log, lot genealogy, and signed disposition record"
    - protocol_id: cp_release_packaging_storage
      process_id: "lot_release_packaging_storage"
      flow_role: "Sampling, quality tests, treatment, packaging, storage, released mass, and waste"
      record_type: "Sampling record, laboratory certificate, treatment batch, packaging issue, inventory ledger, meter, and dispatch note"
      raw_fields: "lot_id; sampling_method; laboratory; test_dates; purity; varietal_identity_or_purity; germination; moisture; seed_health; treatment_product_and_active; treatment_loading; package_material_and_mass; storage_dates_conditions_and_energy; released_mass; waste"
      collection_method: "Use the declared national, certification, or ISTA-compatible lot sampling and testing procedure; reconcile batch and dispatch records"
      unit: "kg, percent, kWh, day, and test-specific units"
      frequency: "Each lot; storage energy at meter or billing interval"
      temporal_coverage: "From conditioned-lot receipt through dispatch"
      site_scope: "Every release, packaging, and storage site for the represented lot"
      aggregation_rule: "Include only passing released mass in the reference output; normalize all attributed records to 1,000 kg"
      quality_evidence: "Authorized sampler or laboratory evidence, test certificate, treatment and packaging reconciliation, storage log, and dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized_amount = attributable_amount / released_net_seed_mass * 1000 kg"
      inputs:
        - attributable_amount
        - released_net_seed_mass
      output: "Inventory amount per 1,000 kg released rice seed"
      source_ids: []
    - id: calc_nutrient_mass
      applies_to: "Fertilizer and amendment records"
      rule: "constituent_mass = formulated_product_mass * declared_constituent_mass_fraction; keep nutrient convention such as N, P, P2O5, K, or K2O explicit and convert only with a stated stoichiometric factor"
      inputs:
        - product_mass
        - formulation_or_certificate
        - constituent_fraction
        - nutrient_convention
      output: "kg of each declared constituent and kg formulated product"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_moisture_conversion
      applies_to: "Optional dry-matter comparison"
      rule: "dry_mass = as_received_mass * (1 - moisture_fraction_wet_basis); retain as-received mass and do not replace the reference flow"
      inputs:
        - as_received_mass
        - moisture_fraction
        - moisture_basis
      output: "Diagnostic dry mass plus retained original values"
      source_ids:
        - irri-rice-seed-quality
    - id: calc_rice_field_ch4
      applies_to: "Methane-relevant rice fields"
      rule: "For each homogeneous field or regime, CH4 = adjusted_daily_emission_factor * cultivation_period * annual_harvested_area; determine the adjusted factor from the declared baseline and applicable water-regime, pre-season, organic-amendment, and higher-tier soil or cultivar scaling factors, then sum fields and normalize to released seed"
      inputs:
        - area
        - cultivation_days
        - water_regimes
        - organic_amendments
        - soil
        - cultivar
        - selected_factor_set
      output: "kg CH4 per 1,000 kg released rice seed"
      source_ids:
        - ipcc-2019-cropland
    - id: calc_managed_soil_n2o
      applies_to: "Managed-soil nitrogen inputs"
      rule: "Apply the selected IPCC equations to direct and applicable indirect N2O-N from synthetic and organic N, residues, mineralization, volatilization, and leaching or runoff; convert N2O-N to N2O using 44/28 and normalize to released seed"
      inputs:
        - "N inputs by source"
        - "residue and mineralization N"
        - "volatilization and leaching fractions"
        - "selected emission factors"
      output: "kg N2O per 1,000 kg released rice seed"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_allocation
      applies_to: "Shared multifunctional operations"
      rule: "Apply Section 7 hierarchy; record pre-allocation totals, chosen relationship, factor numerator and denominator, allocated totals, and a reconciliation to one"
      inputs:
        - "shared inputs_and_outputs"
        - co_product_quantities_or_values
        - approved_basis
      output: "Allocation factors and allocated inventory by product"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_identity_genealogy
      applies_to: "Parent seed, fields, conditioning, and released lot"
      requirement: "Maintain an unbroken link among parent-seed lot, variety or parental lines, field, harvest loads, conditioning lot, quality-test sample, package or bulk lot, and dispatch."
      evidence: "Lot genealogy, labels, field inspection, and reconciliation records"
    - id: dq_measurement
      applies_to: "Mass, moisture, water, energy, and test results"
      requirement: "Use calibrated or verified instruments appropriate to the declared method; retain original readings, units, calibration status, and corrections."
      evidence: "Calibration certificate, check standard, laboratory accreditation or authorization, and raw result"
    - id: dq_seed_quality
      applies_to: "Released product"
      requirement: "Report the actual applicable release thresholds and results. FAO QDS, OECD, or ISTA material may support the declared route but shall not override stricter or product-specific national rules; hybrid and non-hybrid requirements shall not be conflated."
      evidence: "Applicable rule or scheme, sampling record, test certificate, and release decision"
    - id: dq_temporal_representativeness
      applies_to: "Foreground inventory"
      requirement: "Cover the full crop cycle and all conditioning and storage included before dispatch. Combine seasons or years only with documented production weighting and variability."
      evidence: "Coverage matrix by field, lot, operation, month, and crop year"
    - id: dq_completeness
      applies_to: "Important inputs, outputs, emissions, and wastes"
      requirement: "Reconcile mass and energy records and disclose every estimated, missing, cut-off, proxy, and zero value. A zero shall mean verified absence, not missing data."
      evidence: "Mass and energy balance, missing-data register, cut-off assessment, and reviewer sign-off"
    - id: dq_geographic_technology_match
      applies_to: "Background links and factors"
      requirement: "Select background datasets and emission factors consistent with production geography, electricity supply, irrigation and water regime, fuel, fertilizer route, conditioning technology, and waste treatment."
      evidence: "Dataset selection record and method-factor record"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference_flow"
    rule: "Require product flow UUID 14c42414-b19b-47c4-863f-1b86b50ff6bf, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass UUID 93a60a57-a4c8-11da-a746-0800200c9a66, unit kg, and exactly 1,000 kg net released seed after normalization. UUIDs shall not include dataset versions."
    source_ids: []
  - rule_id: validation_required_qualifiers
    applies_to: "reference_flow_and_metadata"
    rule: "Fail when any required qualifier is absent or when hybrid or non-hybrid route, seed class, treatment, packaging, moisture basis, or dispatch gate is ambiguous."
    source_ids:
      - fao-qds-2006
      - oecd-seed-schemes-2026
  - rule_id: validation_process_coverage
    applies_to: "process_inventory"
    rule: "Require all three process-map entries and a field-to-lot-to-dispatch genealogy. Conditional activities shall be represented by measured values, explicit zero or not-applicable status, or a documented exclusion."
    source_ids:
      - fao-seeds-toolkit-processing-2018
      - fao-seeds-toolkit-quality-2018
  - rule_id: validation_mass_balance
    applies_to: "crop_conditioning_and_release"
    rule: "Require lot-level mass reconciliation across harvested input, conditioned seed, released seed, co-products, waste, samples, moisture change, and documented losses. Investigate unexplained imbalance rather than forcing closure."
    source_ids:
      - fao-seeds-toolkit-processing-2018
  - rule_id: validation_seed_quality
    applies_to: "lot_release"
    rule: "Require representative lot sampling and documented purity, varietal identity or purity, germination, moisture, and other applicable tests under the declared scheme. Verify that thresholds correspond to the exact seed type and jurisdiction."
    source_ids:
      - ista-rules-seed-testing-2026
      - oecd-seed-schemes-2026
      - fao-qds-2006
  - rule_id: validation_field_emissions
    applies_to: "rice_field_emissions"
    rule: "For methane-relevant production require area, cultivation period, during-season and pre-season water regime, organic amendment data, factor set and tier. For managed-soil N2O require N sources and direct and applicable indirect pathways. Fail double counting or undocumented factor substitution."
    source_ids:
      - ipcc-2019-cropland
      - ipcc-2019-managed-soils
  - rule_id: validation_allocation
    applies_to: "multifunctional_processes"
    rule: "Require the Section 7 hierarchy, pre-allocation totals, allocation factors summing to one for the allocated share, split-point values, and sensitivity when economic allocation is used."
    source_ids:
      - eu-pef-2021
  - rule_id: validation_reasoned_estimates
    applies_to: "provisional_ranges"
    rule: "Treat every reasoned_estimate range as a replaceable screening aid, not as foreground evidence or an allowed conformance interval. Require disclosure and replace it before publication-critical use unless explicitly accepted in review."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground rice-seed production data package eligible, after review and verification, for publication as a secondary_dataset and background_dataset"
  downstream_use: "Construction of process datasets for released rice seed and lifecyclemodel projections that consume seed as a planting input"
  allowed_use: "Geography-, crop-year-, route-, seed-class-, quality-, treatment-, packaging-, and storage-matched modelling; transparent regional aggregation with production weighting"
  excluded_use: "Food or feed rice production as the reference product; undisclosed substitution across hybrid and non-hybrid routes or certification regimes; generic use that hides material water regime, parent-seed, quality, treatment, geography, or crop-year differences"
  required_metadata: "PCR id; data owner; geography and sites; crop year and season; Oryza species and variety or hybrid; parent and released seed generation or class; lot genealogy; certification or quality scheme; sampling and test methods and results; treatment; packaging; dispatch gate; included storage; allocation; background datasets; emission methods and factors; reasoned estimates; cut-offs and proxies"
  required_quality_disclosure: "Temporal, geographic, and technological coverage; field and lot completeness; instrument and laboratory evidence; mass and energy balances; uncertainty and variability; missing data; proxies; allocation sensitivity; status of every reasoned estimate"
  update_trigger: "Material change in variety or hybrid route, parent-seed generation, production geography, water regime, field inputs, yield, conditioning or treatment technology, packaging, storage, quality or certification rules, background datasets, emission-factor method, allocation, or evidence that invalidates a screening range"
