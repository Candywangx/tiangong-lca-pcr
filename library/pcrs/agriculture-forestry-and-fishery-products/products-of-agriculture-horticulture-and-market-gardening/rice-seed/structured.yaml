    reference: "IPCC. 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11: N2O Emissions from Managed Soils, and CO2 Emissions from Lime and Urea Application. https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf (retrieved 2026-08-07)"
    used_for: "Direct and indirect managed-soil N2O activity data, equations, factors, and N2O-N to N2O reporting"
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission. Commission Recommendation (EU) 2021/2279 on the use of the Environmental Footprint methods, Annex I Product Environmental Footprint Method, corrected text. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32021H2279R(01) (retrieved 2026-08-07)"
    used_for: "Multifunctionality hierarchy: subdivision or system expansion, physical causal relationship, then another relationship such as economic allocation; electricity subdivision and documentation"
