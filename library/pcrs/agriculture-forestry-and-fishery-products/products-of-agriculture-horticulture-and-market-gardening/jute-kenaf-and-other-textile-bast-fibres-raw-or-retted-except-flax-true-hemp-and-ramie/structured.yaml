      applies_to: "treatment and conditioning"
      rule: "Attribute inputs, outputs, cleaning, rework and rejects to the responsible batch or production period and prevent shared burdens from being counted twice."
      source_ids:
        - fao-ijo-jute-retting-1998
    - rule_id: boundary_destination
      applies_to: "residues and rejects"
      rule: "Record each output hand-off as intended product, downgraded product, recovered material, returned biomass, waste or emission according to actual destination."
