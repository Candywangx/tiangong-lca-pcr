allocation_rules:
  - rule_id: allocation_mass_first
    applies_to: "fibre and intended co-products"
    rule: "First preserve physical mass and moisture balances by batch. Where fibre, sticks, seeds or other outputs are intended products, avoid allocation by subdivision when separately metered; otherwise report and justify the selected physical or economic relation."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_residue_destination
    applies_to: "sticks, bark, fines and crop residues"
    rule: "Do not assign avoided burdens without a declared substitution model. Returned biomass, sold co-product and waste treatment are distinct destinations."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "rework and rejected material"
    rule: "Return reworked material and its additional burdens to the producing batch; exclude downgraded and rejected mass from accepted reference output and prevent double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_cycle
      process_id: "crop_production"
      flow_role: "crop inputs, harvested stems, rejects and soil emissions"
      record_type: "field log, invoice, meter, harvest record"
      raw_fields: "field, species, cultivar, area, dates, seed, nutrient products and composition, irrigation, energy, crop protection, harvest and residues"
      collection_method: "reconcile invoices, application logs, meters and harvest weights; Raw aggregation and attribution: sum by field and route, then normalize through accepted fibre yield"
      unit: "native units plus kg, m3, MJ and ha"
      frequency: "each operation and harvest lot"
      temporal_coverage: "complete declared crop cycle"
      site_scope: "every included field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibrated scales/meters, application and harvest logs"
    - protocol_id: cp_retting_batch
      process_id: "retting_extraction"
      flow_role: "retting/extraction batch inputs and outputs"
      record_type: "batch sheet, meter, weigh ticket, laboratory result"
      raw_fields: "feed mass/moisture, route, time, water, energy, aids, fibre, wastewater, residues and destinations ; process-water control volume, external supply/returns, internal recirculation separately, opening/closing water stocks, product/residue water, measured discharge, evaporation evidence and residual uncertainty"
      collection_method: "batch-level readings and mass/water reconciliation; Raw aggregation and attribution: sum compatible route batches; production-weight aggregation only"
      unit: "kg, m3, MJ, t*km"
      frequency: "each batch"
      temporal_coverage: "all batches supplying the reference lot"
      site_scope: "every included retting/extraction site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch identifiers, meter/scale checks, water-quality and destination evidence"
    - protocol_id: cp_conditioning_lot
      process_id: "washing_drying_grading"
      flow_role: "washing, drying, grade and hand-off"
      record_type: "lot sheet, meter, weigh ticket, grade test"
      raw_fields: "incoming mass/moisture, water, energy, drying route, accepted grade, downgraded grade, rejects and destination ; process-water control volume, external supply/returns, internal recirculation separately, opening/closing water stocks, product/residue water, measured discharge, evaporation evidence and residual uncertainty"
      collection_method: "lot-level measurement and reconciliation; Raw aggregation and attribution: normalize accepted output to 1,000 kg at declared moisture"
      unit: "kg, m3, MJ"
      frequency: "each lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "every included conditioning site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale/meter calibration, moisture and grade test, dispatch record"
  calculation_rules:
    - id: calc_moisture_basis
      applies_to: "material transfers"
      rule: "declared-basis mass = wet mass × (1 − measured moisture fraction)/(1 − declared moisture fraction)"
      inputs:
        - "wet mass"
        - "measured moisture"
        - "declared moisture"
      output: "comparable material mass"
      source_ids:
        - mass-balance-identity
    - id: calc_route_yield
      applies_to: "crop through accepted fibre"
      rule: "accepted fibre yield = accepted declared-basis fibre mass / cultivated area; retain intermediate stem and extraction yields"
      inputs:
        - "accepted fibre"
        - "harvested stems"
        - area
      output: "kg accepted fibre/ha and process yields"
      source_ids:
        - mass-balance-identity
    - id: calc_water_balance
      applies_to: "retting and washing"
      rule: "Use one defined process control volume and matched period in water-mass units. Discharged water = external supplied water + water in incoming product/material + other actual external water inflows + opening water stock - water in all outgoing products/residues - actual evaporation - water in separately exported streams - closing water stock. Convert measured volumes only with a compatible documented density. Internal recirculation remains within that boundary and cancels; do not subtract it again from fresh-water inflow. A genuinely external reclaimed-water receipt is an external inflow. Retain liquid discharge separately from its dry solids/pollutant masses. Prefer measured discharge and use the balance as reconciliation; missing components or unexplained residuals are gaps, not automatic wastewater, evaporation or zero."
      inputs:
        - "water and moisture records"
      output: "wastewater volume"
      source_ids:
        - water-balance-identity
    - id: calc_n_emissions
      applies_to: "managed soil"
      rule: "calculate species and compartments from recorded nitrogen activity data using the declared inventory method"
      inputs:
        - "nitrogen products"
        - residues
        - "method factors"
      output: "separate nitrogen exchanges"
      source_ids:
        - ipcc-2019-managed-soils
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_crop_cycle
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference lot"
      requirement: "Species, raw/retted state, route, moisture basis and grade shall be traceable from field and batch to dispatch."
      evidence: "field, batch, lot and dispatch identifiers"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Reconcile accepted fibre, co-products, downgraded material, rejects, wastewater and residues; explain every material gap."
      evidence: "signed mass and water balances"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover one complete crop cycle and every treatment batch supplying the output; disclose any proxy period."
      evidence: "dated logs and coverage statement"
