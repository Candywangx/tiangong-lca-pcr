allocation_rules:
  - rule_id: allocation_mass_first
    applies_to: "fibre and intended co-products"
    rule: "First preserve physical mass and moisture balances by batch. Where fibre, sticks, seeds or other outputs are intended products, avoid allocation by subdivision when separately metered; otherwise report and justify the selected physical or economic relation."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_residue_destination
    applies_to: "sticks, bark, fines and crop residues"
    rule: "Do not assign avoided burdens without a declared substitution model. Returned biomass, sold co-product and waste treatment are distinct destinations."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "rework and rejected material"
    rule: "Return reworked material and its additional burdens to the producing batch; exclude downgraded and rejected mass from accepted reference output and prevent double counting."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_cycle
      process_id: "crop_production"
      flow_role: "crop inputs, harvested stems, rejects and soil emissions"
      record_type: "field log, invoice, meter, harvest record"
      raw_fields: "field, species, cultivar, area, dates, seed, nutrient products and composition, irrigation, energy, crop protection, harvest and residues"
      collection_method: "reconcile invoices, application logs, meters and harvest weights; Raw aggregation and attribution: sum by field and route, then normalize through accepted fibre yield"
      unit: "native units plus kg, m3, MJ and ha"
      frequency: "each operation and harvest lot"
      temporal_coverage: "complete declared crop cycle"
      site_scope: "every included field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibrated scales/meters, application and harvest logs"
    - protocol_id: cp_retting_batch
      process_id: "retting_extraction"
      flow_role: "retting/extraction batch inputs and outputs"
      record_type: "batch sheet, meter, weigh ticket, laboratory result"
      raw_fields: "feed mass/moisture, route, time, water, energy, aids, fibre, wastewater, residues and destinations"
      collection_method: "batch-level readings and mass/water reconciliation; Raw aggregation and attribution: sum compatible route batches; production-weight aggregation only"
      unit: "kg, m3, MJ, t*km"
      frequency: "each batch"
      temporal_coverage: "all batches supplying the reference lot"
      site_scope: "every included retting/extraction site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch identifiers, meter/scale checks, water-quality and destination evidence"
    - protocol_id: cp_conditioning_lot
      process_id: "washing_drying_grading"
      flow_role: "washing, drying, grade and hand-off"
      record_type: "lot sheet, meter, weigh ticket, grade test"
      raw_fields: "incoming mass/moisture, water, energy, drying route, accepted grade, downgraded grade, rejects and destination"
      collection_method: "lot-level measurement and reconciliation; Raw aggregation and attribution: normalize accepted output to 1,000 kg at declared moisture"
      unit: "kg, m3, MJ"
      frequency: "each lot"
      temporal_coverage: "all lots in reporting period"
      site_scope: "every included conditioning site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale/meter calibration, moisture and grade test, dispatch record"
  calculation_rules:
    - id: calc_moisture_basis
      applies_to: "material transfers"
      rule: "declared-basis mass = wet mass × (1 − measured moisture fraction)/(1 − declared moisture fraction)"
      inputs:
        - "wet mass"
        - "measured moisture"
        - "declared moisture"
      output: "comparable material mass"
      source_ids:
        - mass-balance-identity
    - id: calc_route_yield
      applies_to: "crop through accepted fibre"
      rule: "accepted fibre yield = accepted declared-basis fibre mass / cultivated area; retain intermediate stem and extraction yields"
      inputs:
        - "accepted fibre"
        - "harvested stems"
        - area
      output: "kg accepted fibre/ha and process yields"
      source_ids:
        - mass-balance-identity
    - id: calc_water_balance
      applies_to: "retting and washing"
      rule: "discharge = withdrawal + incoming-water − evaporation − retained-water − reuse ending inventory"
      inputs:
        - "water and moisture records"
      output: "wastewater volume"
      source_ids:
        - water-balance-identity
    - id: calc_n_emissions
      applies_to: "managed soil"
      rule: "calculate species and compartments from recorded nitrogen activity data using the declared inventory method"
      inputs:
        - "nitrogen products"
        - residues
        - "method factors"
      output: "separate nitrogen exchanges"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference lot"
      requirement: "Species, raw/retted state, route, moisture basis and grade shall be traceable from field and batch to dispatch."
      evidence: "field, batch, lot and dispatch identifiers"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Reconcile accepted fibre, co-products, downgraded material, rejects, wastewater and residues; explain every material gap."
      evidence: "signed mass and water balances"
    - id: dq_temporal
      applies_to: "reporting period"
      requirement: "Cover one complete crop cycle and every treatment batch supplying the output; disclose any proxy period."
      evidence: "dated logs and coverage statement"
    - id: dq_route
      applies_to: "alternative routes"
      requirement: "Report route-specific sample count, mass and burdens before aggregation."
      evidence: "route-stratified records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "UUID, Mass property, mass unit group, product state and required qualifiers shall match the declared accepted fibre."
    source_ids: []
  - rule_id: validate_flow_bindings
    applies_to: "all cards"
    rule: "Resolve every parameterized card to a concrete compatible UUID from actual foreground identity, and retain unresolved or internal status exactly as audited."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all cards"
    rule: "Every English, Chinese and structured card shall contain exactly one complete range with matching role, bounds, unit, basis, basis kind and evidence kind."
    source_ids: []
  - rule_id: validate_route_balance
    applies_to: "every route and batch"
    rule: "Input mass shall reconcile with accepted, downgraded, co-product, residue, reject and measured loss outputs after moisture conversion."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejects and rework"
    rule: "Rework shall remain linked to its producing node and shall not be counted both as new input and accepted output."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for raw or retted eligible bast fibre"
  downstream_use: "secondary_dataset; background_dataset after review"
  allowed_use: "fibre-product systems matching species, route, state, moisture, grade, geography and period"
  excluded_use: "flax, true hemp, ramie, cotton, coir, sisal, abaca, yarn, fabric, pulp or chemically modified fibre without a separate model"
  required_metadata: "species; cultivar; field and sites; crop cycle; raw/retted and extraction route; batch mode; moisture; grade; water and energy route; co-product and waste destinations"
  required_quality_disclosure: "temporal, geographic and technological representativeness; route coverage; measured versus estimated shares; mass/water closure; unresolved identities"
  update_trigger: "material change in cultivar, route, water source, retting aid, extraction/drying technology, grade specification, yield, allocation or background identity"
data_sources:
  - id: "fao-ijo-jute-retting-1998"
    type: "official_guidance"
    reference: "FAO and International Jute Organisation, *Improved Retting and Extraction of Jute: Project Findings and Recommendations*, Rome, 1998, https://www.fao.org/fishery/docs/CDrom/aquaculture/a0845t/volume2/docrep/field/381307.htm"
    used_for: "route decomposition, harvesting, sorting, retting, extraction, washing and immediate drying"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11"
    used_for: "managed-soil nitrogen-emission calculation"
  - id: "ipcc-2006-mobile-combustion"
    type: "method_factor"
    reference: "IPCC, 2006 Guidelines for National Greenhouse Gas Inventories, Volume 2, Chapter 3"
    used_for: "direct combustion-emission calculation from foreground fuel use"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "conservation-of-mass identity"
    used_for: "mass balance, yield, allocation and reject validation"
  - id: "water-balance-identity"
    type: "method_factor"
    reference: "process water-balance identity"
    used_for: "retting and washing water reconciliation"
  - id: "area-time-identity"
    type: "method_factor"
    reference: "occupied area multiplied by time"
    used_for: "land-occupation calculation"
