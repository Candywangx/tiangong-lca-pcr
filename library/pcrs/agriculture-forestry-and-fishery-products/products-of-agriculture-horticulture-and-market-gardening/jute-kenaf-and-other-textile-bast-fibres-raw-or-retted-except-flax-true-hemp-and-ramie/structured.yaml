system_boundary:
  rules:
    - rule_id: boundary_producer_gate
      applies_to: "all routes"
      rule: "Include cultivation, harvest and the declared extraction, retting, washing, drying and grading needed to reach the raw or retted producer-gate state; exclude spinning and later manufacture. Use single-period accounting with no storage."
