allocation_rules:
  - rule_id: avoid_allocation_by_subdivision
    applies_to: "separable fields, operations, lots, and products"
    rule: "Subdivide field, harvest, and post-harvest records wherever the relevant inputs and outputs can be separately measured."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: apply_biophysical_causality
    applies_to: "inseparable joint production"
    rule: "When subdivision is not feasible, prefer a documented biophysical causal relationship that reflects how inputs and emissions change with the joint products."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: fallback_economic_allocation
    applies_to: "inseparable co-products without defensible biophysical causality"
    rule: "Use representative economic allocation only when a causal basis is unavailable; declare price source, geography, averaging period, moisture and quality basis, and sensitivity."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: residue_status_decision
    applies_to: "sorghum straw, stover, screenings, and other residues"
    rule: "Classify each residue as retained biomass, waste, or co-product according to actual management and market function before allocation; a residue left on the field is not a zero-burden exported product."
    source_ids:
      - fao-leap-feed-2016
      - ipcc-2019-managed-soils
  - rule_id: allocation_mass_balance
    applies_to: "allocated output set"
    rule: "Apply one allocation rule to a complete, moisture-consistent output set and verify that allocated shares sum to one; report unallocated results when required for review."
    source_ids:
      - fao-leap-feed-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_cultivation"
      flow_role: "seed, fertilizers, amendments, crop protection, irrigation, fuel, electricity, and other field energy"
      record_type: "invoices, issue logs, application logs, meter readings, machinery logs"
      raw_fields: "field_id; operation; date; product_id; formulation; nutrient_or_active_content; quantity; raw_unit; treated_area; irrigation_source; meter_start; meter_end; equipment"
      collection_method: "Reconcile purchase, stock, application, meter, and machinery records to each represented field and crop cycle"
      unit: "kg; kg nutrient; kg active ingredient; m3; L; kWh; MJ; ha"
      frequency: "Each application or operation"
      temporal_coverage: "Full crop cycle and full rotation period where material"
      site_scope: "All fields and directly controlled operations represented by the package"
      aggregation_rule: "Sum by field, product, and operation; convert only with documented factors; normalize after yield and allocation are resolved"
      quality_evidence: "invoices; calibrated-meter records; application logs; equipment logs; stock reconciliation"
    - protocol_id: cp_harvest_outputs
      process_id: "field_cultivation"
      flow_role: "harvested grain, residues, co-products, and field waste"
      record_type: "weighbridge tickets, yield monitor, moisture tests, area records, destination logs"
      raw_fields: "field_id; harvest_date; harvested_area; gross_mass; marketable_mass; moisture; residue_mass; residue_moisture; destination; waste_mass"
      collection_method: "Reconcile harvested mass and area across all represented fields and retain moisture by lot"
      unit: "kg; kg dry matter; fraction moisture; ha"
      frequency: "Each harvest lot"
      temporal_coverage: "Complete harvest for the represented crop cycle"
      site_scope: "All represented fields and storage-transfer points"
      aggregation_rule: "Sum by lot and field; conserve dry matter for moisture conversion; retain excluded and lost masses"
      quality_evidence: "scale calibration; moisture-method record; ticket or yield-monitor export; destination evidence"
    - protocol_id: cp_emission_activity
      process_id: "field_cultivation"
      flow_role: "managed-soil N2O, volatilization, leaching or runoff, and lime or urea CO2"
      record_type: "nutrient applications, residue records, soil and climate data, method parameters"
      raw_fields: "N_by_source; application_date; fertilizer_type; organic_N; residue_dry_mass; residue_N_content; lime_type_mass; urea_mass; soil_class; climate_class; leaching_condition; factor_id"
      collection_method: "Assemble activity data from cp_field_inputs and cp_harvest_outputs; select one declared IPCC tier or reviewed regional method and retain every factor"
      unit: "kg N; kg product; kg dry matter; kg C; dimensionless factors"
      frequency: "Each activity event, aggregated once per crop cycle"
      temporal_coverage: "Full crop cycle and method-required lag or rotation period"
      site_scope: "All represented managed fields"
      aggregation_rule: "Apply equations once per pathway; retain N2O-N before 44/28 conversion and prevent overlap between direct and indirect terms"
      quality_evidence: "source records; factor table and version; formula workbook or reproducible calculation; reviewer check"
    - protocol_id: cp_postharvest_balance
      process_id: "on_farm_postharvest"
      flow_role: "incoming grain, conditioned grain, energy, screenings, waste, and water removal"
      record_type: "scale tickets, moisture tests, meters, fuel and heat logs, storage records"
      raw_fields: "lot_id; input_mass; input_moisture; output_mass; output_moisture; screenings_mass; reject_mass; energy_carrier; energy_amount; storage_days; destination"
      collection_method: "Maintain lot-level input-output, moisture, and energy balance for each included operation"
      unit: "kg; fraction moisture; kWh; MJ; L; day"
      frequency: "Each lot and meter period"
      temporal_coverage: "All included conditioning and storage before farm gate"
      site_scope: "All on-farm equipment and stores represented by the package"
      aggregation_rule: "Conserve dry matter, sum energy by carrier and operation, and normalize to final output"
      quality_evidence: "calibrated scales and moisture meter; utility or fuel records; lot reconciliation; storage log"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all foreground inventory rows"
      rule: "normalized amount = crop-cycle amount × 1,000 kg / allocated final sorghum mass at reference moisture"
      inputs:
        - "crop-cycle amount"
        - "allocated final mass"
        - "reference moisture"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: convert_moisture_basis
      applies_to: "grain and biomass mass"
      rule: "m_at_reference = m_measured × (1 - moisture_measured) / (1 - moisture_reference); use mass fractions and retain both moisture observations"
      inputs:
        - "measured wet mass"
        - "measured moisture fraction"
        - "reference moisture fraction"
      output: "mass at declared reference moisture"
      source_ids: []
    - id: calculate_ipcc_managed_soil_emissions
      applies_to: "managed-soil N pathways"
      rule: "Apply the declared IPCC tier or reviewed regional equations to synthetic and organic N, crop-residue N, applicable soil-N mineralization, volatilization, and leaching or runoff; convert N2O-N to N2O using 44/28"
      inputs:
        - "N activity data"
        - "residue data"
        - "soil and climate class"
        - "method factors"
      output: "direct and indirect N2O plus reported N pathways"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calculate_lime_urea_co2
      applies_to: "lime and urea application"
      rule: "Apply the declared IPCC or reviewed regional method separately by lime material and urea mass; do not merge this pathway with upstream manufacture"
      inputs:
        - "lime mass and type"
        - "urea mass"
        - "method factors"
      output: "field CO2 from lime and urea application"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calculate_allocation_shares
      applies_to: "inseparable co-products"
      rule: "Derive shares from the declared causal or economic basis and divide each product basis by the sum across the complete co-product set"
      inputs:
        - "complete co-product quantities"
        - "causal parameter or representative prices"
      output: "allocation shares summing to 1"
      source_ids:
        - fao-leap-feed-2016
    - id: screen_yield_context
      applies_to: "reported field yield"
      rule: "Compare foreground yield only with matching geography, crop definition, and period in an official dataset; a difference is a review flag, not a replacement value or conformance failure"
      inputs:
        - "foreground yield"
        - geography
        - year
        - "official comparator"
      output: "documented plausibility review"
      source_ids:
        - faostat-crops-livestock
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and inputs"
      requirement: "Product identity, Tiangong UUID, flow type, classification, property, and unit shall match the actual material or service; fallback identities shall be disclosed."
      evidence: "UUID readback and product or supplier specification"
    - id: dq_primary_foreground
      applies_to: "directly controlled processes"
      requirement: "Use primary activity data for foreground field and on-farm post-harvest processes wherever possible."
      evidence: "source-record index and data-collection coverage statement"
    - id: dq_temporal
      applies_to: "crop and rotation data"
      requirement: "Cover the full crop cycle and the full rotation when material; use multiple-year data or disclose variability when one year is not representative."
      evidence: "crop calendar, rotation record, represented years, and variability statement"
    - id: dq_geography_technology
      applies_to: "all inputs and operations"
      requirement: "Represent the actual geography, irrigation route, cultivation practice, equipment, energy carriers, and post-harvest technology."
      evidence: "field list, technology description, and upstream dataset selection record"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile all relevant resources, emissions, products, residues, and wastes within the boundary and document every exclusion."
      evidence: "material and energy balance, system diagram, and exclusion register"
    - id: dq_precision_uncertainty
      applies_to: "measured and calculated values"
      requirement: "Retain instrument resolution, sampling method, variability, assumptions, and uncertainty or a justified range for material values."
      evidence: "calibration, sampling and uncertainty records"
    - id: dq_method_traceability
      applies_to: "calculated emissions and allocation"
      requirement: "Retain method name, version, factor source, equations, intermediate values, and allocation sensitivity."
      evidence: "reproducible calculation artifact and factor register"
    - id: dq_moisture_balance
      applies_to: "grain and residues"
      requirement: "Retain measured moisture and dry-matter balance for every conversion, loss, or conditioning step."
      evidence: "moisture tests and lot-level mass-balance record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "final reference flow"
    rule: "Require product flow ff8b6c96-9f97-4952-8832-abfbc4295b65, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, kg, and exactly 1,000 kg from one final included foreground process."
    source_ids:
      - unsd-cpc-3-01142
  - rule_id: validate_product_scope
    applies_to: "product classification"
    rule: "Reject seed sorghum, sweet sorghum, forage-only routes, and processed sorghum products as the reference product for this PCR."
    source_ids:
      - unsd-cpc-3-01142
  - rule_id: validate_required_qualifiers
    applies_to: "dataset metadata"
    rule: "Fail conformance when any required reference-flow qualifier is missing or when harvest and reference moisture are ambiguous."
    source_ids:
      - fao-leap-feed-2016
      - icrisat-sorghum-handbook-2020
  - rule_id: validate_process_completeness
    applies_to: "process inventory"
    rule: "Require field cultivation and harvest; require post-harvest records when conditioning or storage occurs before farm gate; require upstream links for purchased inputs and justified exclusions."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: validate_mass_moisture_balance
    applies_to: "field and post-harvest outputs"
    rule: "Reconcile dry matter across grain, residues, co-products, wastes, screenings, and water removal; unexplained imbalance shall be investigated and disclosed."
    source_ids:
      - icrisat-sorghum-handbook-2020
  - rule_id: validate_allocation
    applies_to: "co-product systems"
    rule: "Require subdivision or a declared allocation basis, a complete output set, shares summing to one, and sensitivity when economic allocation is used."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: validate_emission_method
    applies_to: "managed-soil and amendment emissions"
    rule: "Require complete activity data, one non-overlapping declared method, explicit factor versions, correct N and chemical-species conversions, and 44/28 conversion from N2O-N to N2O."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validate_no_double_counting
    applies_to: "energy and field emissions"
    rule: "Reject double counting between product-input background datasets, direct combustion, managed-soil pathways, and post-harvest operations."
    source_ids:
      - fao-leap-feed-2016
      - ipcc-2019-managed-soils
  - rule_id: validate_data_quality
    applies_to: "foreground package"
    rule: "Require evidence for representativeness, completeness, consistency, precision or uncertainty, methodological appropriateness, source coverage, and every proxy."
    source_ids:
      - fao-leap-feed-2016
  - rule_id: validate_screening_values
    applies_to: "QA ranges and statistical comparisons"
    rule: "Treat ranges and external yield comparisons as QA flags only; they shall not overwrite foreground values or become conformance thresholds unless a reviewed geography-specific rule explicitly says so."
    source_ids:
      - faostat-crops-livestock
      - ipcc-2019-managed-soils
published_dataset_profile:
  dataset_role: "Foreground agricultural production package eligible, after review, for publication as a secondary_dataset or background_dataset"
  downstream_use: "Process and lifecyclemodel construction for farm-gate non-seed sorghum grain and downstream systems that consume it"
  allowed_use: "Attributional LCA, supply-chain modelling, hotspot analysis, and non-comparative reporting within the declared geography, time, technology, moisture, and allocation scope"
  excluded_use: "Seed production, sweet or forage sorghum, processed products, unsupported geography or technology transfer, and public comparative assertions without applicable review requirements"
  required_metadata: "PCR id and version; product and Tiangong identities; geography; field and farm scope; crop year and rotation; cultivar or species; prior land use; irrigation route; area and yield; moisture basis; included operations; residue fate; allocation; upstream dataset identities; method and factor versions"
  required_quality_disclosure: "Primary-data coverage; temporal, geographic, and technological representativeness; exclusions and proxies; mass and moisture reconciliation; uncertainty; emission-factor tier; allocation sensitivity; unresolved identities and range gaps"
  update_trigger: "Material change in product scope, Tiangong identity, cultivation or conditioning route, geography, yield or moisture basis, allocation, emission method, evidence, or foreground-data quality"
