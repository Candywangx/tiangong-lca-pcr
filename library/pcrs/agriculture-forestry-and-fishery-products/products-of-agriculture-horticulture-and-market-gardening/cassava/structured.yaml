allocation_rules:
  - rule_id: single_root_output
    applies_to: "accepted and downgraded fresh-root grades"
    rule: "Where both grades are sold as fresh cassava, retain their masses and values separately. Subdivide grade-specific sorting burdens first; shared upstream burdens follow the declared study allocation method."
    source_ids:
      - iso-14044
  - rule_id: stem_coproduct
    applies_to: "intentionally marketed stems or leaves"
    rule: "Treat sold planting stems or leaves as separate intended outputs, not as root yield or waste. Avoid allocation through process subdivision where possible; otherwise use a documented causal physical relationship or, where none is defensible, farm-gate economic shares from contemporaneous quantity and price records. Run a sensitivity check."
    source_ids:
      - iso-14044
  - rule_id: residue_burden
    applies_to: "discarded roots and field residues"
    rule: "Keep cultivation and harvest burdens with the crop system; document field return, disposal and any later recovery separately. Do not give an unverified avoided-product credit."
    source_ids:
      - iso-14044
  - rule_id: period_attribution
    applies_to: "crop cycles crossing reporting years"
    rule: "Assign planting and management inputs to the identified harvest cycle once, track date and phase, and never allocate the same retained stem stock or asset burden to two cycles."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_register
      process_id: "field"
      flow_role: "planting and management exchanges, standing area, direct soil N2O"
      record_type: "field register, invoices, meter logs"
      raw_fields: "field_id, cycle_id, planting_date, stem_origin, planted_pieces, material_product, product_mass, water_m3, fuel_L, electricity_kWh, N_input, residue_return, area_ha"
      collection_method: "reconcile invoices, application logs and meters with field operations; record selected N2O method; Raw aggregation and attribution: sum by field-cycle, divide by accepted root kg only after lot linkage"
      unit: "mixed"
      frequency: "each operation"
      temporal_coverage: "full planting-to-lifting cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "purchase invoices, field log, meter readings, method worksheet"
    - protocol_id: cp_harvest_register
      process_id: "harvest"
      flow_role: "lifted roots, stems, residues and root loss"
      record_type: "harvest and sample-plot logs"
      raw_fields: "field_id, cycle_id, lifting_time, lifted_root_kg, retained_stem_kg, marketed_stem_kg, residue_kg, unlifted_sample_kg, fuel_L"
      collection_method: "calibrated scale and representative loss plots; Raw aggregation and attribution: reconcile harvested and unharvested fractions; avoid stem double count"
      unit: "kg, L, ha"
      frequency: "each lifting event"
      temporal_coverage: "all harvest lots"
      site_scope: "each field/harvest"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale tickets, plot design, machine log"
    - protocol_id: cp_gate_lot
      process_id: "gate"
      flow_role: "fresh-root grade and elapsed time"
      record_type: "receiving, grade and dispatch tickets"
      raw_fields: "lot_id, harvest_time, receipt_time, dispatch_time, received_kg, accepted_kg, downgraded_kg, rejected_kg, grade, destination, electricity_kWh"
      collection_method: "calibrated in/out scales, visible quality checks and timestamped tickets; Raw aggregation and attribution: reconcile received and all departures by lot; combine only like market classes"
      unit: "kg, h, kWh"
      frequency: "each gate lot"
      temporal_coverage: "harvest-to-dispatch"
      site_scope: "each farm gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, tickets, reject reason and photos"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "field"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: reference_normalization
      applies_to: "all exchanges"
      rule: "Exchange per kg reference = allocated cycle/lot exchange ÷ accepted fresh-root kg; use a documented allocation share when intended co-products exist."
      inputs:
        - "linked cycle"
        - "lot masses and allocation share"
      output: "kg-reference-normalized exchange"
      source_ids: []
    - id: gate_mass_reconciliation
      applies_to: "gate"
      rule: "discrepancy = received fresh-root kg − accepted kg − downgraded kg − rejected kg; investigate unmeasured loss or scale mismatch."
      inputs:
        - "gate ticket masses"
      output: "mass discrepancy"
      source_ids: []
    - id: cycle_period_linkage
      applies_to: "all processes"
      rule: "Join operation and harvest records by field/cycle and classify each by calendar period; do not duplicate a record in combined reporting."
      inputs:
        - field_id
        - cycle_id
        - dates
      output: "one cycle inventory and period trace"
      source_ids: []
    - id: soil_n2o_method
      applies_to: "soil emission"
      rule: "Select documented jurisdictional or IPCC 2019 managed-soils method and recorded nitrogen inputs; disclose factor, unit and direct/indirect scope."
      inputs:
        - "fertilizer N"
        - "residue N"
        - "soil and method data"
      output: "kg N2O by route"
      source_ids:
        - ipcc-2019-soils
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_register
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: lot_identity
      applies_to: "all root streams"
      requirement: "Use stable field, crop-cycle and lot ids across lifting, sorting and dispatch."
      evidence: "linked tickets"
    - id: root_condition
      applies_to: "reference product"
      requirement: "Report cultivar, use class, damage/rejection rules, and measured time from lifting to gate."
      evidence: "grade sheets and timestamps"
    - id: mass_completeness
      applies_to: "harvest and gate"
      requirement: "Explain nonzero gate discrepancy, unlifted losses and destinations of rejected roots; quantify missing observations."
      evidence: "weighbridge and sampling records"
    - id: temporal_completeness
      applies_to: "crop cycle"
      requirement: "Include establishment across reporting periods and any retained-stem transfer exactly once."
      evidence: "dated field register"
    - id: source_compatibility
      applies_to: "upstream flows"
      requirement: "Record region, technology and unit compatibility of linked backgrounds; list unresolved identities."
      evidence: "data package metadata"
validation_rules:
  - rule_id: reference_identity
    applies_to: "reference flow"
    rule: "Require the verified cassava Product flow, Mass property and kg at the specified farm gate; reject chips, flour, starch and waxed roots as reference substitutes."
    source_ids: []
  - rule_id: range_review
    applies_to: "all flow cards"
    rule: "Verify each range's basis, units and evidence; treat reasoned bounds as provisional QA prompts, not hard inventory defaults."
    source_ids: []
  - rule_id: balance_check
    applies_to: "root streams"
    rule: "Match lifted and gate-received lots; reconcile accepted, downgraded, rejected and recorded discrepancy without double counting."
    source_ids: []
  - rule_id: time_to_gate
    applies_to: "quality"
    rule: "Require lifting and gate times and reject/damage criteria for each lot because fresh roots deteriorate quickly."
    source_ids:
      - fao-fresh-root-handling
  - rule_id: coproduct_check
    applies_to: "stems and grades"
    rule: "Require intentional-output identity, hand-off, allocation shares and no double credit or double burden."
    source_ids:
      - iso-14044
  - rule_id: period_check
    applies_to: "multi-period crops"
    rule: "Verify every planting, management, harvest and retained-stem record is assigned to one cycle and attributed once."
    source_ids: []
