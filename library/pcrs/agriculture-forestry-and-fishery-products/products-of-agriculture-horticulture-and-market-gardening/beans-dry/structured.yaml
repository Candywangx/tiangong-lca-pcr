system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The field-production node hands off a mature standing crop to an independent harvest node. Harvest is independent because it removes the biological output from the field and has distinct energy, shattering, residue, and hand-off records. Harvest hands off uncleaned grain to primary conditioning. Cleaning and grading classify the incoming grain into accepted, downgraded, retained-seed, and rejected states. Drying is a separate preservation node only when a bounded intervention removes moisture after harvest; its usable input state, target moisture, energy, water removal, loss, and lot hand-off shall be recorded."
      source_ids: []
    - rule_id: boundary_field_to_gate
      applies_to: "foreground system"
      rule: "Include managed field production, mature harvest, necessary field pre-drying, threshing or shelling, cleaning, grading, and farm-gate drying needed for the declared reference-product state."
      source_ids:
        - fao-bean-postharvest-compendium
        - fao-postharvest-system
    - rule_id: boundary_route_condition
      applies_to: "conditional operations"
      rule: "Include irrigation, mechanical drying, and other conditional operations only for lots or reporting strata in which they occur; zero activity is recorded when the route is inactive."
      source_ids: []
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream activities"
      rule: "Exclude milling, splitting, cooking, canning, retail packing, off-farm storage, and transport after the farm-gate hand-off."
      source_ids:
        - usda-dry-edible-beans-2021
    - rule_id: boundary_state_separation
      applies_to: "output states"
      rule: "Keep accepted beans, downgraded or damaged beans, retained seed, valuable straw or pod residues, discarded screenings, field shattering, and other losses as distinct states with explicit hand-offs."
      source_ids:
        - fao-bean-postharvest-compendium
    - rule_id: boundary_route_delta
      applies_to: "alternative routes"
      rule: "Stratify rainfed and irrigated production, manual and mechanical harvest, and natural and equipment drying when they change topology, inventory categories, calculation, or validation; do not apply two routes to the same activity interval."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "seed and purchased inputs entering the declared managed field-production cycle"
  starting_condition_role: "foreground production starting condition"
