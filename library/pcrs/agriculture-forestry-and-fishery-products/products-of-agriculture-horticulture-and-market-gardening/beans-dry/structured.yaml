  market_state: "Harvested grain, unprocessed; production mix, at farm gate"
functional_unit:
  what: "Cleaned, graded, mature dry edible bean grain delivered at the declared farm gate"
  how_much: "1,000 kg net mass"
  how_well: "Declared species and market class; declared moisture on wet basis; declared grade or buyer specification; free of separately accounted rejects and residue"
