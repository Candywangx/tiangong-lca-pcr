allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "fields, harvest events, lots, and dryer runs"
    rule: "Prefer subdivision and direct assignment using field, event, lot, run, and destination records before applying allocation."
    source_ids: []
  - rule_id: allocation_intended_outputs
    applies_to: "accepted beans, retained seed, downgraded beans, and valuable residues"
    rule: "Enumerate every intended output and hand-off. When two or more independently valuable outputs leave one node, declare and justify a PCR-specific physical or economic allocation; report a sensitivity to the alternative basis when the choice materially changes results."
    source_ids: []
  - rule_id: allocation_residue_test
    applies_to: "bean straw, pods, screenings, and rejected grain"
    rule: "Treat material as a co-product only when deliberately collected and transferred for beneficial use or sale. Field-retained residues, unrecovered shattering, and discarded rejects remain residue, loss, or waste and receive no product allocation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "reworked, re-cleaned, re-dried, downgraded, or returned material"
    rule: "Link rework to the node that produced the off-spec state, retain its burdens, and add only incremental rework burdens. Never count reworked or downgraded mass simultaneously as accepted output."
    source_ids: []
  - rule_id: allocation_shared_runs
    applies_to: "shared equipment, cleaning, start-up, shutdown, and changeover"
    rule: "Assign shared run burdens once by direct metering where possible, otherwise by documented time, wet-grain throughput, or another causal physical basis; prevent double counting across lots or routes."
    source_ids: []
  - rule_id: allocation_internal_seed
    applies_to: "retained seed returned to a later crop cycle"
    rule: "Record retained seed as an explicit internal or co-product flow. Apply the chosen cross-cycle convention consistently and disclose it; do not erase the seed flow through recursion."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "seed, nutrients, crop protection, and inoculants"
      record_type: "purchase, issue, application, and field records"
      raw_fields: "field id; crop year; species; market class; product identity; formulation; quantity; unit; nutrient composition; application date; treated area; returns"
      collection_method: "reconcile invoices and stock movement to field application records; keep each nutrient product once; Raw aggregation and attribution: sum actual quantities by product and normalize to accepted output from the linked crop cycle"
      unit: "native product unit; kg or m3; nutrient kg"
      frequency: "each application and crop cycle"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field or homogeneous management stratum"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; application logs; stock reconciliation; composition evidence"
    - protocol_id: cp_irrigation_water
      process_id: "field_production"
      flow_role: "irrigation water"
      record_type: "meter or irrigation-event record"
      raw_fields: "field id; event; meter readings or flow rate; duration; source; irrigated area"
      collection_method: "meter difference or calibrated flow rate × operating time; Raw aggregation and attribution: sum delivered field volume and normalize to linked accepted output"
      unit: "m3"
      frequency: "each irrigation event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each irrigated field; rainfed fields recorded as zero"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration or flow-rate check; event log"
    - protocol_id: cp_energy_records
      process_id: "field_production_mature_harvest_cleaning_grading"
      flow_role: "field, harvest, and conditioning energy"
      record_type: "meter, fuel issue, contractor, and equipment log"
      raw_fields: "node; field or lot id; carrier; quantity; unit; start and end meter; operating time; throughput; shared-run rule"
      collection_method: "meter or fuel reconciliation; allocate shared runs once using recorded causal driver; Raw aggregation and attribution: sum by carrier and node; convert with declared factors; normalize to linked output"
      unit: "carrier unit and MJ"
      frequency: "each event or run"
      temporal_coverage: "complete crop cycle and conditioning campaign"
      site_scope: "each field, machine, or facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; invoices; equipment logs; allocation worksheet"
    - protocol_id: cp_field_emission_drivers
      process_id: "field_production"
      flow_role: "direct field emissions"
      record_type: "application, residue, soil, climate, and method record"
      raw_fields: "N product and N content; crop residues returned or removed; soil and climate stratum; emission-factor method; factor version"
      collection_method: "calculate only from collected drivers using the declared inventory method; Raw aggregation and attribution: apply the method by stratum and aggregate substances after retaining compartment and N-to-compound conversions"
      unit: "kg N; kg dry matter; method-specific units"
      frequency: "each application and annual calculation"
      temporal_coverage: "crop cycle with required annual context"
      site_scope: "each field or homogeneous stratum"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "application records; composition evidence; method citation; calculation workbook"
    - protocol_id: cp_mass_reconciliation
      process_id: "field_production_mature_harvest"
      flow_role: "intermediate crop and harvest mass balance"
      record_type: "field and harvest reconciliation"
      raw_fields: "field id; harvested grain; residue; retained field residue; shattering; moisture by state"
      collection_method: "reconcile all measured and estimated output states on a consistent moisture or dry-matter basis; Raw aggregation and attribution: reconcile inputs and outputs before aggregation; normalize to accepted product"
      unit: "kg and % wet-basis moisture"
      frequency: "each harvest event"
      temporal_coverage: "crop cycle"
      site_scope: "each field and harvest event"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale; moisture meter; loss study; reconciliation check"
    - protocol_id: cp_lot_mass_quality
      process_id: "mature_harvest_cleaning_grading"
      flow_role: "lot masses, moisture, and grade states"
      record_type: "weighbridge, scale, moisture, and grade record"
      raw_fields: "lot id; origin; species; market class; incoming mass; outgoing mass; moisture; grade; foreign matter; broken or damaged fraction; destination"
      collection_method: "calibrated weighing and representative quality sampling at every hand-off; Raw aggregation and attribution: conserve dry matter across hand-offs and sum only after lot reconciliation"
      unit: "kg and %"
      frequency: "each lot and hand-off"
      temporal_coverage: "complete harvest and conditioning campaign"
      site_scope: "each lot and conditioning site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; sampling record; grade certificate or buyer specification"
    - protocol_id: cp_co_products_losses
      process_id: "mature_harvest_cleaning_grading"
      flow_role: "residues, co-products, downgrade, retained seed, and losses"
      record_type: "weighing, destination, and loss-study record"
      raw_fields: "producing node; state; mass; moisture; quality; destination; value where allocation is needed; recovery status"
      collection_method: "weigh where possible; otherwise documented sampling and reconciliation; Raw aggregation and attribution: aggregate separately by state and destination; never merge accepted, downgraded, retained-seed, residue, and waste states"
      unit: "kg wet mass and kg dry matter"
      frequency: "each event or lot"
      temporal_coverage: "complete crop cycle and campaign"
      site_scope: "each field, lot, and destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale records; destination receipt; loss study; reconciliation"
    - protocol_id: cp_drying_run
      process_id: "farm_gate_drying"
      flow_role: "wet input, dried output, rejects, moisture, and energy"
      record_type: "dryer-run record"
      raw_fields: "run id; lot id; incoming and outgoing mass; incoming and outgoing moisture; target moisture; carriers; carrier quantities; rejects; start-up; shutdown; destination ; all input/output water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; moisture and density; supported evaporation"
      collection_method: "calibrated weighing, moisture measurement, and energy metering for each run; Raw aggregation and attribution: calculate conserved dry matter and removed water; assign shared energy once; normalize to dried accepted output"
      unit: "kg; % wet basis; carrier unit; MJ"
      frequency: "each dryer run"
      temporal_coverage: "complete drying campaign"
      site_scope: "each dryer and run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and moisture calibration; meter records; dry-matter reconciliation"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "field_production"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: normalize_to_reference
      applies_to: "all inventory amounts"
      rule: "normalized amount = amount assigned to the declared route ÷ accepted reference-product mass × 1,000 kg"
      inputs:
        - "assigned flow amount"
        - "accepted reference-product mass"
      output: "flow amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: wet_to_dry_matter
      applies_to: "bean, residue, and reject mass"
      rule: "dry matter = wet mass × (1 − wet-basis moisture fraction)"
      inputs:
        - "measured wet mass"
        - "measured wet-basis moisture"
      output: "kg dry matter"
      source_ids:
        - fao-grain-drying
    - id: drying_water_balance
      applies_to: "farm-gate drying"
      rule: "Water removed to air = incoming material water + actual external water addition + opening water stock - water in every outgoing accepted/downgraded/reject/residue stream - separately exported liquid water - closing water stock, using matched measured wet masses and moisture fractions or compatible densities. Internal recirculation cancels. Include actual rain uptake/rewetting; separate dry-matter and non-water losses. Establish actual evaporation and receiving air boundary from measurement or a supported closed balance; missing components or unexplained difference do not prove vapour or zero. Normalize once to matched accepted final output."
      inputs:
        - "incoming and outgoing mass and moisture"
        - "reject mass and moisture"
      output: "kg water removed and dry-matter reconciliation"
      source_ids:
        - fao-grain-drying
    - id: field_n2o_method
      applies_to: "direct managed-soil N2O"
      rule: "apply the selected IPCC tier or a documented regional method to actual synthetic N, organic N, crop-residue N, and other required drivers; convert N2O-N to N2O by 44/28"
      inputs:
        - "collected N inputs"
        - "residue treatment"
        - "method factors"
        - "site strata"
      output: "kg N2O by receiving compartment"
      source_ids:
        - ipcc-2019-managed-soils
    - id: lot_output_reconciliation
      applies_to: "harvest, cleaning, grading, and drying"
      rule: "incoming dry matter = accepted dry matter + downgraded dry matter + retained-seed dry matter + valuable-residue dry matter + reject dry matter + unrecovered dry-matter loss, within declared uncertainty"
      inputs:
        - "all state-specific mass and moisture records"
      output: "reconciled output states and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emission_drivers
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and intermediate bean states"
      requirement: "Species, market class, crop year, lot lineage, intended route, and classification exclusions shall be explicit."
      evidence: "field, lot, and product specification records"
    - id: dq_temporal
      applies_to: "production mix"
      requirement: "Cover a representative crop cycle; multi-year averages retain annual values and weighting."
      evidence: "crop-year records and aggregation worksheet"
    - id: dq_route
      applies_to: "alternative production and technology routes"
      requirement: "Rainfed versus irrigated, manual versus mechanical harvest, natural versus equipment drying, and rework routes shall be separately measured and weighted."
      evidence: "route flags, event logs, and production weights"
    - id: dq_mass_moisture
      applies_to: "all bean, residue, reject, and loss states"
      requirement: "Masses shall carry moisture basis where it affects comparison, and every hand-off shall pass dry-matter reconciliation within documented uncertainty."
      evidence: "scale and moisture calibration; reconciliation report"
    - id: dq_nutrient
      applies_to: "agricultural nutrient products"
      requirement: "Preserve actual product identity, quantity, composition, and nutrient convention; demonstrate that compound and organic products were counted once."
      evidence: "invoices, labels or analysis, application records, and nutrient worksheet"
    - id: dq_completeness
      applies_to: "all process nodes"
      requirement: "Record accepted output, downgraded output, retained seed, valuable residues, rejects, shattering, and other losses as separate states with destinations."
      evidence: "mass reconciliation and destination records"
    - id: dq_runs
      applies_to: "conditioning and drying campaigns"
      requirement: "Link energy, cleaning, start-up, shutdown, changeover, outputs, and rejects to a run or reporting period and assign each shared burden once."
      evidence: "run logs, meter records, and allocation worksheet"
    - id: dq_method
      applies_to: "calculated emissions"
      requirement: "Identify method, tier, factor version, units, conversions, and applicable compartments; do not substitute generic substance labels for resolved elementary-flow identities in final datasets."
      evidence: "cited method and calculation workbook"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Confirm the flow UUID, species, market class, unprocessed grain state, farm-gate hand-off, moisture basis, grade, and exclusion of green beans, soybean, and separately classified pulses."
    source_ids: []
  - rule_id: validate_reference_mass
    applies_to: "reference amount"
    rule: "Confirm exactly 1,000 kg net accepted bean grain after the final included node and exclude packaging, foreign material, downgraded grain, retained seed, and rejects."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_route_topology
    applies_to: "alternative routes"
    rule: "Confirm each lot has one declared production, harvest, pre-drying, conditioning, and drying topology; mutually exclusive route intervals shall not be double counted."
    source_ids: []
  - rule_id: validate_process_handoffs
    applies_to: "all nodes"
    rule: "Confirm field output equals harvest input, harvest grain equals conditioning input, and any drying input links to the accepted conditioning lot, after moisture-basis conversion."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_grade_states
    applies_to: "cleaning and grading"
    rule: "Confirm at least accepted and rejected states are declared, and every accepted, downgraded, retained-seed, valuable-residue, reject, and waste state has exactly one hand-off or destination."
    source_ids:
      - usda-dry-edible-beans-2021
  - rule_id: validate_drying
    applies_to: "conditional drying"
    rule: "When drying is active, confirm before and after moisture, dry-matter balance, energy, water removed, rejects, and run identity; when inactive, confirm no equipment-drying burden."
    source_ids:
      - fao-grain-drying
  - rule_id: validate_rework
    applies_to: "off-spec and returned material"
    rule: "Confirm re-cleaned or re-dried material is linked back to its producing node, receives only incremental rework burdens, and is counted once in its final state."
    source_ids: []
  - rule_id: validate_outputs_allocation
    applies_to: "multi-output nodes"
    rule: "Confirm all intended outputs and hand-offs are complete, the attribution decision is declared, residue versus co-product tests are applied, and sensitivity is reported when material."
    source_ids: []
  - rule_id: validate_runs
    applies_to: "batch and campaign records"
    rule: "Confirm inputs, outputs, cleaning, changeover, start-up, and shutdown records are indexed to fields, lots, runs, or periods and no shared burden is assigned twice."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "every inventory flow card"
    rule: "Check each supplied range for complete bounds, unit, basis, evidence and bilingual alignment. Require compatible quantitative evidence for any enforced limit. If no supported bound exists, retain measured quantities and explicitly report range screening unavailable; do not invent a range or declare that check complete. Investigate deviations rather than overwrite measured values."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process or aggregated foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Mature dry edible bean grain at farm gate when species, market class, geography, crop year, production regime, harvest technology, drying route, moisture basis, grade, and co-product treatment match the study"
  excluded_use: "Green beans, soybean, other separately classified pulses, certified planting seed production, milling, cooking, canning, retail packing, off-farm storage, or post-gate transport"
  required_metadata: "reference-flow UUID and qualifiers; CPC context; species; market class; geography; crop year; production and harvest route; conditioning and drying route; moisture basis; grade; field, lot and run coverage; co-product and loss destinations; allocation; inventory method; DQR"
  required_quality_disclosure: "foreground-record coverage; scale, meter and moisture calibration; route weighting; missing-data treatment; range-screen exceptions; mass and dry-matter reconciliation; emission-factor method and version; allocation sensitivity"
  update_trigger: "material change in species or market class, geography, production regime, seed route, harvest or conditioning technology, drying route, grade requirement, co-product destination, allocation method, inventory method, or data representativeness"
data_sources:
  - id: "fao-bean-postharvest-compendium"
    type: "handbook"
    reference: "FAO INPhO, Post-harvest Operations Compendium: Phaseolus beans, https://www.fao.org/fileadmin/user_upload/inpho/docs/Post_Harvest_Compendium_-_Phaesolus_beans.pdf"
    used_for: "bean harvest, field drying, threshing, handling, cleaning, loss, and route decomposition"
  - id: "fao-postharvest-system"
    type: "handbook"
    reference: "FAO, Post-harvest system and food losses, https://www.fao.org/4/ac301e/AC301e03.htm"
    used_for: "distinction among harvest, pre-drying, threshing, cleaning, drying, storage, and processing"
  - id: "fao-grain-drying"
    type: "handbook"
    reference: "FAO, Agricultural engineering in development: Drying, https://www.fao.org/4/t0522e/T0522E08.htm"
    used_for: "wet-basis moisture definition, drying boundary, safe-state purpose, and water-balance calculation"
  - id: "usda-dry-edible-beans-2021"
    type: "official_guidance"
    reference: "USDA Agricultural Marketing Service, Commodity Specification for Dry Edible Beans, Peas and Lentils, August 2021, https://www.ams.usda.gov/sites/default/files/media/CommoditySpecificationforDryEdibleBeansPeasandLentilsAugust2021.pdf"
    used_for: "dry mature bean commodity identity, moisture and quality-state context, and downstream processing distinction"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "direct managed-soil N2O calculation and N2O-N to N2O conversion context"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass and dry matter applied to measured foreground hand-offs"
    used_for: "reference normalization, output-state reconciliation, and allowed 1,000 kg reference amount"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
