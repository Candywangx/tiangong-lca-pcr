allocation_rules:
  - rule_id: al_01
    applies_to: "all nodes"
    rule: "Prefer subdivision and direct attribution of field, machine-period and batch records before allocating shared burdens."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_02
    applies_to: "roots and tops"
    rule: "Field-retained tops are not a sold co-product. For intentionally marketed tops, first use subdivision or a justified physical relationship. Economic allocation is a fallback when that relationship is unavailable; document why."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_03
    applies_to: "grade states"
    rule: "Separate directly measured grade-specific operations. Allocate remaining shared burdens using a defensible physical relationship, or documented gate-matched market values if unavailable. Retain prices, period, all co-products and sensitivity; assigned shares sum to one. Waste handling remains included without product allocation."
    source_ids:
      - ghg-protocol-product-standard-2011
  - rule_id: al_04
    applies_to: "rejects"
    rule: "Reworked material retains accumulated burden and is counted only at final hand-off."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
