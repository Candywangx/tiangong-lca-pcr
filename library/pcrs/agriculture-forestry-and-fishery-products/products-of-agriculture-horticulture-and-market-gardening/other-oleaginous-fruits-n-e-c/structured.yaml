allocation_rules:
  - rule_id: allocation_period
    applies_to: "perennial production"
    rule: "Attribute establishment, immature years, and replacement burdens across an evidenced productive life to the declared harvest period; do not repeat them in annual records."
    source_ids: []
  - rule_id: allocation_grade
    applies_to: "sorted outputs"
    rule: "Only the accepted declared grade enters the reference quantity. Downgraded material sold for an independently intended use is a separate product output with measured mass, destination and its share of inseparable upstream burdens after subdivision. Rejected material without a product function is waste; keep its physical mass, fate and management burdens."
    source_ids: []
  - rule_id: allocation_residue
    applies_to: "residues and rejects"
    rule: "Waste receives no co-product share. Retain all production burdens associated with generating discarded material and its attributable collection/treatment burdens with the producing saleable route; absence of a product function never erases these burdens. Only an independently intended output with evidenced identity, recipient, function, quantity and hand-off may enter the complete product allocation denominator. Revenue or a possible substitution use alone does not establish avoided-production credit."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared infrastructure"
    rule: "Attribute irrigation, equipment, cooling, and packing assets once using recorded area, machine time, mass, or another causal driver."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and returns"
    rule: "Attribute the rework loop to its producing node and do not count returned material again as new input."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_production_inputs
      process_id: "managed_production_harvest"
      flow_role: "annual inputs"
      record_type: "invoice, operation, and meter records"
      raw_fields: "species; area; product; quantity; nutrient assay; energy carrier; water; date"
      collection_method: "reconcile purchasing, storage, and field logs to declared area; Raw aggregation and attribution: sum by species and harvest period; normalize to accepted fresh fruit"
      unit: "native units plus kg, m3, MJ"
      frequency: "each event and period total"
      temporal_coverage: "complete declared harvest period"
      site_scope: "every included field or orchard"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meters, operation logs, calibration, inventory reconciliation"
    - protocol_id: cp_harvest_records
      process_id: "managed_production_harvest"
      flow_role: "harvest and residues"
      record_type: "batch weights and field logs"
      raw_fields: "batch; mass; species; maturity; moisture; grade; reject class; destination"
      collection_method: "calibrated weighing reconciled with area and container records; Raw aggregation and attribution: sum batches while retaining species and state"
      unit: "kg"
      frequency: "every harvest batch"
      temporal_coverage: "complete harvest window"
      site_scope: "all included harvest points"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets, scale calibration, batch and destination records"
    - protocol_id: cp_emission_calculation
      process_id: "managed_production_harvest"
      flow_role: "direct emissions"
      record_type: "calculation record"
      raw_fields: "N inputs; residues; soil and climate; factor; receiving compartment"
      collection_method: "apply declared method version to the same input records; Raw aggregation and attribution: calculate each substance and compartment separately"
      unit: "kg substance"
      frequency: "each harvest period"
      temporal_coverage: "same period as production inputs"
      site_scope: "all included productive area"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method version, input trace, factor source, reproducible calculation"
    - protocol_id: cp_conditioning_batch
      process_id: "sorting_stabilization"
      flow_role: "sorting and stabilization"
      record_type: "matched batch record"
      raw_fields: "input and output mass; grade; temperature; moisture; water; energy; rejects; wastewater; time"
      collection_method: "batch weighing, metering, and mass balance; Raw aggregation and attribution: match incoming and outgoing batch; keep wet and dry routes separate"
      unit: "kg, m3, kWh, MJ"
      frequency: "each batch"
      temporal_coverage: "all included conditioning batches"
      site_scope: "declared farm or primary site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and meter calibration, batch sheet, signed mass balance"
    - protocol_id: cp_packing_lot
      process_id: "packing_handoff"
      flow_role: "packing and hand-off"
      record_type: "packing lot and delivery records"
      raw_fields: "fruit mass; material; accessories; reuse count; scrap; grade; gate"
      collection_method: "reconcile issues, weights, and delivery ticket by lot; Raw aggregation and attribution: aggregate by material and lot; attribute reusable packaging by actual loss"
      unit: "kg or item"
      frequency: "each packing lot"
      temporal_coverage: "all included hand-off lots"
      site_scope: "every included packing point"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "bill of materials, weigh ticket, delivery ticket, inventory reconciliation"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "managed_production_harvest"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all nodes"
      rule: "node amount × 1000 / accepted fresh mass at declared gate"
      inputs:
        - "node amount"
        - "accepted fresh mass"
      output: "amount per 1,000 kg reference product"
      source_ids: []
    - id: calc_perennial_attribution
      applies_to: "perennial route"
      rule: "establishment or replacement total × declared period share"
      inputs:
        - establishment
        - replacement
        - "productive life"
        - "attribution method"
      output: "amount attributed to declared harvest period"
      source_ids: []
    - id: calc_batch_balance
      applies_to: "sorting and packing"
      rule: "incoming mass = accepted + downgraded + rejected + documented loss"
      inputs:
        - "matched inputs and outputs"
      output: "balance difference and flows"
      source_ids: []
    - id: calc_soil_emissions
      applies_to: "soil emissions"
      rule: "declared method applied to source-specific nutrients and residues"
      inputs:
        - nutrients
        - residues
        - factors
        - compartments
      output: "mass of each specific emission"
      source_ids:
        - ipcc-2019-managed-soils
    - id: packing_waste_output_specific_exchanges
      applies_to: "packing_handoff"
      rule: "Enumerate rejected fruit and each actual packaging-waste material as separate actual streams. Measure each physical stream with its own composition, state, native unit, lot/period and destination; instantiate one atomic card per specific stream and boundary role. Distinguish waste transfer, purchased treatment and substance-specific discharge; do not treat a disposal service as the wastewater itself or duplicate treatment burdens. Keep stock, rework, marketed downgrade and discarded waste separate, and count physical mixtures once without also counting their components as additional exits. Retain the linked protocol and actual process attribution. Reconstruct each attributable raw numerator on its recorded stage basis, then normalize once to the matched accepted reference output. Missing identity, quantity, unit or destination blocks dataset completeness; absence requires evidence, not an assumed zero."
      inputs:
        - cp_packing_lot
      output: "Separate atomic exchanges; completeness required"
      source_ids: []
    - id: soil_nitrogen_emissions_identity_and_fate
      applies_to: "managed_production_harvest"
      rule: "Identify every actual emitted substance and receiving compartment separately. Quantify each supported pathway with its own activity, method, chemical-species basis and native unit; distinguish elemental N/P ledgers from final compounds. Soil nutrient retention or a mass-balance residual is not automatically an emission. This replaces an ambiguous aggregate exchange, not the collection obligation. Before dataset completeness, create one concrete card per actual exchange, verify a compatible UUID or retain an explicit unresolved identity, and record quantity, unit, stage/period, destination and evidence. Reconstruct the raw attributable numerator from the linked protocol and normalize once to the matched accepted reference output. Missing data is not zero; no range of the former aggregate is an individual-stream default."
      inputs:
        - cp_emission_calculation
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all product flows"
      requirement: "Species, production system, fresh state, maturity, moisture, grade, lot, and gate are complete and consistent."
      evidence: "batch and delivery records"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Mass, energy, water, nutrients, packaging, rejects, and direct emissions cover the declared period and every included site."
      evidence: "completeness reconciliation and mass balance"
    - id: dq_temporal
      applies_to: "all nodes"
      requirement: "Production inputs, harvest, and conditioning batches come from the same or explicitly aligned harvest period."
      evidence: "dated records and attribution schedule"
    - id: dq_route
      applies_to: "conditional nodes"
      requirement: "Inactive treatment is evidenced and recorded as zero; oil extraction or manufacture is absent from the fresh-product boundary."
      evidence: "route map, equipment, and batch records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "dataset"
    rule: "Declare one named residual species, one production system, one fresh state, grade, and farm/harvest gate."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Reference output equals exactly 1,000 kg accepted fresh product with all required qualifiers."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "all routes"
    rule: "Fail when oil extraction, refining, manufacture, distribution, or retail is included."
    source_ids: []
  - rule_id: validate_period
    applies_to: "perennial route"
    rule: "Establishment, immature period, replacement, and shared assets have one auditable cross-period attribution."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "sorting and packing"
    rule: "Fail when matched-batch mass balance exceeds declared measurement uncertainty."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejects and rework"
    rule: "Downgrade, rework, recovery, and disposal destinations are mutually exclusive and not duplicated as accepted output."
    source_ids: []
  - rule_id: validate_flow_binding
    applies_to: "all cards"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all cards"
    rule: "Every lower bound is no greater than its upper bound; inactive conditional routes equal zero; foreground records supersede provisional screens."
    source_ids: []
