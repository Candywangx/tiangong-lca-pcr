  - rule_id: allocation_gin
    applies_to: "lint and cottonseed"
    rule: "Prefer subdivision; otherwise declared economic allocation with mass sensitivity."
    source_ids:
      - iso-14044
      - mass-balance-identity
  - rule_id: allocation_reject
    applies_to: "rework/rejects"
    rule: "Return rework once; route rejects by destination and exclude from accepted output."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_runs
    applies_to: "gin runs"
    rule: "Assign startup, cleaning and changeover once by meter or throughput-time driver."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_trace
      process_id: "cotton_cultivation"
      flow_role: "land and identity"
      record_type: "field log"
      raw_fields: "field, area, dates, cultivar"
      collection_method: "records and maps; Raw aggregation and attribution: preserve strata"
      unit: "ha"
      frequency: "field-cycle"
      temporal_coverage: "complete cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "maps and logs"
    - protocol_id: cp_field_inputs
      process_id: "cotton_cultivation"
      flow_role: "inputs"
      record_type: "invoice/application log"
      raw_fields: "identity, amount, analysis, date"
      collection_method: "reconcile purchase and use; Raw aggregation and attribution: sum once nutrient_supply_specific_input: Operation cotton_cultivation: Record this flow with the stated material state, route and destination. Original quantity method: measure each supplied product once and calculate nutrient content Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. crop_protection_specific_input: Record this flow with the stated material state, route and destination.  Amount rule: measured formulation and active substance Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "native"
      frequency: "event"
      temporal_coverage: "complete cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices and logs"
    - protocol_id: cp_irrigation
      process_id: "cotton_cultivation"
      flow_role: "water"
      record_type: "meter"
      raw_fields: "volume, source, field"
      collection_method: "meter or balance; Raw aggregation and attribution: sum delivered"
      unit: "m3"
      frequency: "event"
      temporal_coverage: "complete cycle"
      site_scope: "irrigated fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration"
    - protocol_id: cp_energy
      process_id: "cultivation_harvest"
      flow_role: "energy"
      record_type: "meter/fuel log"
      raw_fields: "carrier, quantity, equipment"
      collection_method: "reconcile meters and invoices; Raw aggregation and attribution: by node Route-specific requirements: field_energy_identification: Actual diesel field machinery for establishment and crop care; identify irrigation-pump power independently and retain field/crop-cycle attribution. Raw activity or stage basis: per ha planted in one crop cycle. (route-energy-fao) harvest_energy_identification: Actual diesel harvesting machinery and pre-gate lot movement; manual or other-power routes need their own evidence instead of this input. Raw activity or stage basis: per 1000 kg accepted seed cotton. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "MJ; kWh"
      frequency: "operation"
      temporal_coverage: "full route"
      site_scope: "all equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices and meters"
    - protocol_id: cp_field_emissions
      process_id: "cotton_cultivation"
      flow_role: "emissions"
      record_type: "calculation"
      raw_fields: "N, factors, compartments"
      collection_method: "disclosed IPCC tier; Raw aggregation and attribution: field then aggregate"
      unit: "kg/ha"
      frequency: "field-cycle"
      temporal_coverage: "complete cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor provenance"
    - protocol_id: cp_mass_balance
      process_id: "cultivation_harvest"
      flow_role: "biomass"
      record_type: "lot mass"
      raw_fields: "intake, accepted, reject, loss, moisture"
      collection_method: "calibrated scales; Raw aggregation and attribution: close per lot"
      unit: "kg"
      frequency: "lot"
      temporal_coverage: "all lots"
      site_scope: "all included fields and harvest lots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration"
    - protocol_id: cp_gin_batch
      process_id: "cotton_ginning"
      flow_role: "batch flows"
      record_type: "batch log"
      raw_fields: "intake, lint, seed, trash, energy, grade, controls"
      collection_method: "scales and meters; Raw aggregation and attribution: close per batch Route-specific requirements: gin_energy_identification: Actual electric gin machinery, conveying fans and controls. Drying heat requires identification of the installed burner/supply; retain existing cottonseed/lint allocation and do not assign whole-gin energy to both products. Raw activity or stage basis: per 1000 kg accepted lint. (cotton-gin-energy) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg; MJ; kWh"
      frequency: "batch"
      temporal_coverage: "all batches"
      site_scope: "all included gin lines"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration and bale records"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: calc_moisture
      applies_to: "biomass"
      rule: "dry mass = wet mass × (1 − moisture fraction)"
      inputs:
        - "wet mass"
        - moisture
      output: "dry mass"
      source_ids:
        - mass-balance-identity
    - id: calc_emissions
      applies_to: "soil"
      rule: "apply declared IPCC tier once to collected N activity"
      inputs:
        - "N activity"
        - factors
      output: "direct emissions"
      source_ids:
        - ipcc-2019-refinement
    - id: calc_normalization
      applies_to: "nodes"
      rule: "After the selected seed-cotton or lint route balance and co-product attribution, final exchange = attributable raw exchange total * 1,000 kg / matched accepted reference-state output mass in kg. For a local intensity q_i = Q/O_i, first recover its contribution Q = q_i*O_i using actual linked throughput; do not treat O_i as final output or divide a final-reference amount again."
      inputs:
        - totals
        - "accepted output"
      output: "per 1000 kg"
      source_ids:
        - mass-balance-identity
    - id: calc_gin_balance
      applies_to: "gin"
      rule: "intake = lint + seed + trash + moisture change + loss"
      inputs:
        - "batch masses"
      output: "balance"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product"
      requirement: "Route, gate, cultivar, moisture and grade present."
      evidence: "lot/bale record"
    - id: dq_completeness
      applies_to: "all"
      requirement: "One complete crop cycle and all linked batches; missingness quantified."
      evidence: "reconciliation"
    - id: dq_calibration
      applies_to: "quantities"
      requirement: "Current calibration or uncertainty assessment."
      evidence: "certificates"
    - id: dq_strata
      applies_to: "routes"
      requirement: "Alternative routes remain separate until transparent weighting."
      evidence: "stratum ledger"
validation_rules:
  - rule_id: validate_route
    applies_to: "reference"
    rule: "Exactly one route and gate declared."
    source_ids: []
  - rule_id: validate_reference_identity
    applies_to: "reference"
    rule: "Before activation bind exact Product UUID, property and unit group."
    source_ids: []
  - rule_id: validate_nutrients
    applies_to: "cultivation"
    rule: "Give every actual fertilizer or amendment product its own card, retaining physical product mass, formulation, nutrient composition and application records. Nutrient quantities are not additional inputs of the same product; collection or group identifiers cannot substitute for a concrete flow identity."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "harvest/gin"
    rule: "Close mass balance within declared uncertainty."
    source_ids: []
  - rule_id: validate_states
    applies_to: "outputs"
    rule: "Every accepted, downgraded, reworked and discarded state has one destination."
    source_ids: []
  - rule_id: validate_runs
    applies_to: "gin"
    rule: "Startup, cleaning and changeover are assigned once."
    source_ids: []
  - rule_id: validate_route_deltas
    applies_to: "alternative routes"
    rule: "Name the parent activity, evidence each changed inventory/calculation/validation category, and select one mutually exclusive route per stratum."
    source_ids: []
  - rule_id: validate_conditioning_states
    applies_to: "ginning"
    rule: "Record raw seed-cotton intake, any drying/moisture-conditioning inputs, prepared moisture-safe lint, cottonseed, trash, dust, rejects, loss and each hand-off."
    source_ids: []
  - rule_id: validate_single_period
    applies_to: "all routes"
    rule: "Confirm one linked accounting interval and require single-period records; no storage, replacement or termination."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground cotton production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "studies matching route, geography, grade and technology"
  excluded_use: "yarn, fabric or oil without downstream processes; substitution between seed cotton and lint"
  required_metadata: "route, gate, crop year, cultivar, irrigation, harvest, moisture, grade, gin technology, allocation and destinations"
  required_quality_disclosure: "coverage, calibration, route weights, balance, emission tier, allocation sensitivity and unresolved identities"
  update_trigger: "changed agronomy, technology, yield, grade, markets, allocation, emission method or identity"
data_sources:
  - id: "usda-cotton-ginning"
    type: "official_guidance"
    reference: "USDA Cotton Ginners Handbook"
    used_for: "ginning boundary and records"
  - id: "ipcc-2019-refinement"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4"
    used_for: "field emissions"
  - id: "iso-14044"
    type: "standard"
    reference: "ISO 14044:2006"
    used_for: "allocation"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "conservation of mass with moisture adjustment"
    used_for: "balances and normalization"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "fao-gap-framework-2003"
    type: "official_guidance"
    reference: "FAO Committee on Agriculture, COAG/2003/6, Development of a Framework for Good Agricultural Practices, section IV paragraphs 24–26 and Annex, https://www.fao.org/4/y8704e/y8704e.htm"
    used_for: "Generic monitoring and farm-record context only; crop-specific routes, lifetimes, quantitative ranges and LCA allocation are PCR choices requiring separate applicable evidence."
  - id: "cotton-gin-energy"
    type: "handbook"
    reference: "Funk and Hardin (2017), Energy Utilization and Conservation in Cotton Gins, Cotton Ginners Handbook. https://www.cotton.org/journal/2017-21/2/156.cfm"
    used_for: "Electric conveying/gin equipment and separate drying demand; no per-bale intensity or fuel identity is imposed."
  - id: "route-energy-fao"
    type: "official_guidance"
    reference: "FAO, Energy-smart food for people and climate (2011), Annex 2; and Energy use in agriculture and industry, Annex IV. https://www.fao.org/4/i2454e/i2454e00.pdf ; https://www.fao.org/4/Q1085e/q1085e0d.htm"
    used_for: "Equipment/carrier possibilities only; site records govern applicability. No intensity, fuel share or default recipe is adopted."
