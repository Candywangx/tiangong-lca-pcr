system_boundary:
  rules:
    - rule_id: boundary_field
      applies_to: "cultivation"
      rule: "Include crop-attributed preparation, planting, nutrients, protection, irrigation, energy and direct emissions."
      source_ids:
        - ipcc-2019-refinement
        - fao-gap-framework-2003
    - rule_id: boundary_harvest
      applies_to: "harvest"
      rule: "Separate harvest, grading, rejects, loss and farm hand-off from crop growth."
      source_ids:
        - fao-gap-framework-2003
        - mass-balance-identity
    - rule_id: boundary_gin
      applies_to: "ginning"
      rule: "Include intake, conditioning, separation, cleaning, grading and bale preparation; stop before spinning."
      source_ids:
        - usda-cotton-ginning
    - rule_id: boundary_routes
      applies_to: "alternatives"
      rule: "Keep rainfed/irrigated, picker/stripper and saw/roller technology strata separate before weighting."
      source_ids:
        - fao-gap-framework-2003
        - usda-cotton-ginning
    - rule_id: boundary_route_delta_evidence
      applies_to: "production and technology deltas"
      rule: "Managed cultivation is the production parent. Irrigation changes water, pumping energy and field-emission records; harvest equipment changes energy, losses and contamination; saw versus roller ginning changes conditioning, separation, cleaning and quality records. These routes coexist in the category but are mutually exclusive within one stratum."
      source_ids:
        - fao-gap-framework-2003
        - usda-cotton-ginning
    - rule_id: boundary_conditioning_stabilization
      applies_to: "ginned route"
      rule: "Raw seed cotton enters ginning; drying or moisture conditioning, separation and cleaning prepare moisture-safe graded lint for bale hand-off. Conditioning energy and service inputs are recorded in gin energy; cottonseed is an intended co-product; trash, moisture change, dust, rejects and loss remain separately classified."
      source_ids:
        - usda-cotton-ginning
        - mass-balance-identity
    - rule_id: boundary_single_period
      applies_to: "all routes"
      rule: "Model one crop cycle and its linked harvest and gin batches in one linked accounting interval; single-period; no storage, replacement or termination is included. Temporary holding is assigned to the linked lot."
      source_ids:
        - mass-balance-identity
