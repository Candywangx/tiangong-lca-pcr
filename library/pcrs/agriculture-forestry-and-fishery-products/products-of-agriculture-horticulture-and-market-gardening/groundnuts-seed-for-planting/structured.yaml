allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "field and conditioning processes"
    rule: "Avoid allocation by separately recording seed multiplication, conditioning, treatment, packaging, rejects, and fate-specific handling whenever the processes can be subdivided."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intended_outputs
    applies_to: "intentional product outputs"
    rule: "If a residue or off-grade stream is intentionally sold or transferred as a product, identify its destination and apply a declared attribution method only after product status is evidenced."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_seed_quality
    applies_to: "accepted seed and downgraded lots"
    rule: "Do not allocate seed-quality burdens to commodity grain or a downgraded stream unless the alternate output is intentionally produced, separately identified, and included in the declared gate."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_fallback
    applies_to: "multiple intended outputs"
    rule: "If subdivision is not possible, use a declared mass, physical-property, economic, or other defensible method, disclose the rationale, and test a materially different method as sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reject_fate
    applies_to: "rejects and waste"
    rule: "Keep field residue, conditioning rejects, packaging waste, storage losses, treatment, recovery, and disposal distinct; do not credit a displaced product without destination and substitution evidence."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Every rejected or off-spec seed state is explicitly routed as reworked, downgraded, recovered, or discarded. A rework loop or boundary exit is linked to the producing conditioning node, and rejected material is excluded from accepted output until a new documented quality-release event occurs. Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_seed_lot_records
      process_id: "field_groundnut_seed_multiplication"
      flow_role: "source seed or source seed lot"
      record_type: "seed lot record"
      raw_fields: "lot; class; cultivar or source-lot role; treatment; mass; moisture; supplier or source field"
      collection_method: "lot certificate, receiving record, calibrated scale; Raw aggregation and attribution: sum by field or source-lot unit and normalize to harvested seed crop"
      unit: "kg and declared attributes"
      frequency: "per lot"
      temporal_coverage: "crop cycle"
      site_scope: "field or production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "certificate, receiving record, scale"
    - protocol_id: cp_nutrient_input_records
      process_id: "field_groundnut_seed_multiplication"
      flow_role: "nutrient and amendment inputs; required specific-emission identification and calculation"
      record_type: "application record"
      raw_fields: "product; formulation; nutrient content; mass; date; field; method; substance name; receiving compartment; reported unit and elemental/compound basis; method and factor source; actual activity; period; quantity uncertainty; related existing exchanges"
      collection_method: "invoice, label, application log, service record; Raw aggregation and attribution: sum product and nutrient mass by field; managed_soil_nitrogen_emissions_to_air_specific_emission: Identify each applicable gaseous nitrogen species emitted from managed soil in the actual groundnut seed field. Preserve nutrient-input records, method tier, direct/indirect pathways and soil/climate applicability. Retain the original accepted-seed denominator and nitrogen-input calculation basis. The former 0 to 1000 screen in an unspecified flow unit does not define a valid species amount or default. This is a mandatory identification and calculation requirement, not an exchange. Before dataset completeness, instantiate one concrete elementary card per actual substance and receiving compartment. Retain kg substance separately from kg elemental N; convert only from the method-reported basis using the documented composition or stoichiometric fraction of the identified species. Never equate all nitrogen with a chosen compound or add elemental-N and compound masses as separate releases. Preserve source activity, factor units, period, uncertainty, boundary and original normalization; link to an existing matching card instead of counting a duplicate. Verify a compatible UUID or explicitly register the concrete unresolved identity. Missing identity, method or activity evidence does not establish zero or justify omission."
      unit: "kg product and kg nutrient; kg of each identified substance and kg N recorded separately"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, label, application record"
    - protocol_id: cp_irrigation_records
      process_id: "field_groundnut_seed_multiplication"
      flow_role: "irrigation and withdrawal"
