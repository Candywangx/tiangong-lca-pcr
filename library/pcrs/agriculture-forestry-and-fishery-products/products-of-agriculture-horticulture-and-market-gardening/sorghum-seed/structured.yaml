    - id: dq_temporal_geographic
      applies_to: "All foreground data"
      requirement: "Cover a complete declared crop cycle and all represented post-harvest lots; report site geography, crop year, technology, irrigation, and storage duration."
      evidence: "field and batch population with completeness reconciliation; eu-pef-2021"
    - id: dq_measurement
      applies_to: "Mass, moisture, energy, water, and quality tests"
      requirement: "Use calibrated equipment and representative sampling; retain method, date, laboratory, uncertainty or resolution, and missing-data treatment."
      evidence: "calibration certificates, sampling plans, laboratory reports, and meter records"
    - id: dq_emission_factors
      applies_to: "Calculated field emissions"
