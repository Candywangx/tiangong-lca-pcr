      unit: "kg, moisture fraction, kWh, MJ, kg fuel"
      frequency: "each batch"
      temporal_coverage: "all batches represented"
      site_scope: "each dryer/handling site"
      aggregation_rule: "batch mass and dry-matter balance; aggregate by output mass"
      quality_evidence: "calibration, meter, moisture-test, and batch records"
    - protocol_id: cp_conditioning_records
      process_id: "seed_cleaning_conditioning"
      flow_role: "input, electricity, marketable seed, rejects"
      record_type: "conditioning batch and quality records"
      raw_fields: "lot_id; input_mass; output_mass; reject_mass_by_fate; electricity; germination; analytical_purity; varietal_purity; moisture; test_method; test_date"
      collection_method: "scales, meter, cleaning logs, representative laboratory samples"
      unit: "kg, kWh, percent or fraction"
      frequency: "each lot/batch"
      temporal_coverage: "all represented lots"
      site_scope: "each conditioning line/site"
      aggregation_rule: "reconcile mass by lot; aggregate by conditioned output mass"
      quality_evidence: "calibration, batch, sampling, laboratory report, and lot-chain records"
    - protocol_id: cp_final_lot_records
      process_id: "treatment_packaging_storage"
      flow_role: "treatment, packaging, energy, final product, wastes"
      record_type: "formulation, packaging, storage, and dispatch records"
      raw_fields: "lot_id; active_substance; formulation_mass; coating_mass; packaging_material_mass; electricity; fuel; storage_duration; temperature_humidity; final_net_mass; waste_mass_and_fate"
      collection_method: "batch sheets, issue records, meters, scales, storage logs, dispatch records"
      unit: "kg, kWh, MJ, day"
      frequency: "each lot and storage period"
      temporal_coverage: "from conditioning to producer-gate dispatch"
      site_scope: "each treatment, packing, and storage site"
      aggregation_rule: "aggregate by dispatched net seed mass and declared storage duration"
      quality_evidence: "batch sign-off, calibration, inventory reconciliation, label, and dispatch record"
  calculation_rules:
    - id: calc_inventory_normalization
      applies_to: "All foreground rows"
      rule: "Divide the reconciled amount attributable to represented lots by final net marketable seed mass; preserve process-specific intermediate bases before final normalization."
      inputs:
        - "collected amounts"
        - "lot links"
        - "final net seed mass"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_drying_water_balance
      applies_to: "drying_water_vapour"
      rule: "Dry matter = wet mass × (1 − wet-basis moisture fraction); water removed = input water mass − output water mass. Investigate rather than force-close unexplained imbalance."
      inputs:
        - "input/output mass and moisture"
      output: "kg water removed and mass-balance discrepancy"
      source_ids:
        - mass-balance-identity
    - id: calc_managed_soil_n2o
      applies_to: "Direct and indirect field N2O"
      rule: "Apply the appropriate IPCC 2019 Chapter 11 Tier 1, Tier 2, or documented higher-tier equations to synthetic N, organic N, crop residues, volatilisation, and leaching/runoff; convert N2O-N to N2O consistently and prevent double counting."
      inputs:
        - "kg N by source"
        - "residue N"
        - "applicable factors"
        - "climate/soil/management context"
      output: "kg direct and indirect N2O per reference flow"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_coproduct_allocation
      applies_to: "Saleable residues and rejects"
      rule: "Implement the declared hierarchy and calculate shares from the recorded physical relation or contemporaneous economic values; shares across allocated outputs must sum to 1."
      inputs:
        - "output quantities"
        - moisture
        - functions
        - prices
        - "allocation choice"
      output: "allocated inventory per output"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
