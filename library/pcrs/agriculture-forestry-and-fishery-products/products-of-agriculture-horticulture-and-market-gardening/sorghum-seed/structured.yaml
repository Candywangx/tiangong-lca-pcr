allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "All multifunctional operations"
    rule: "First avoid allocation through process subdivision and direct measurement of seed, residues, rejects, and treatment/packaging operations."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residues
    applies_to: "Crop residues retained on field"
    rule: "Do not assign a separate product burden to retained residues; include their nutrient return and associated field emissions in the seed-crop system."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_saleable_coproducts
    applies_to: "Removed residues or cleaning rejects with economic use"
    rule: "Apply system expansion when a justified displaced function is documented; otherwise use a documented physical causal relation, and use economic allocation only when no defensible physical relation exists. Record masses, moisture, prices, period, geography, and allocation shares."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_wastes
    applies_to: "Materials legally and physically treated as waste"
    rule: "Assign treatment burdens to the seed system until the documented waste boundary; do not create an avoided-product credit without a supported substitution case."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_records
      process_id: "seed_crop_cultivation"
      flow_role: "seed, nutrient, water, energy, yield, residues, emissions activity"
      record_type: "field and lot records"
      raw_fields: "field_id; lot_id; area; dates; seed_mass; fertiliser_product_mass; nutrient_N_P_K; amendment_mass; crop_protection_product_and_active; irrigation; fuel; electricity; harvested_mass; moisture; residue_mass_and_fate"
      collection_method: "calibrated meters/scales, invoices, application logs, field logs, and laboratory analysis"
      unit: "native unit plus kg, kg nutrient, kWh, MJ, ha"
      frequency: "each application and harvest event"
      temporal_coverage: "complete represented crop cycle"
      site_scope: "each included field/site"
      aggregation_rule: "reconcile purchases, applications, stocks, and harvested lots; normalize only after final marketable output is known"
      quality_evidence: "calibration, invoice, batch, application, sampling, and lot-chain records"
    - protocol_id: cp_postharvest_records
      process_id: "postharvest_drying"
