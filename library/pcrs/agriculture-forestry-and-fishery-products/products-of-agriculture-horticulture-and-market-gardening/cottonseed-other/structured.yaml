allocation_rules:
  - rule_id: allocation_gin_coproducts
    applies_to: "cultivation and ginning"
    rule: "Treat lint and cottonseed as intended co-products. Subdivide metered process burdens first; allocate remaining inseparable burdens by economic value using matched quantities and representative prices."
    source_ids:
      - cottonseed-storage-2018
  - rule_id: allocation_sensitivity
    applies_to: "lint/cottonseed"
    rule: "Report mass-allocation sensitivity and prices, currency, period, moisture, grades and value shares; no default substitution credit."
    source_ids: []
  - rule_id: allocation_residuals
    applies_to: "gin/storage outputs"
    rule: "Give no co-product credit to waste. Treat recovered material as product only with intended use, positive value and separate hand-off."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared infrastructure"
    rule: "Attribute by measured use, runtime, throughput or another causal driver and count each burden once."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "rejects"
    rule: "Return rework to its node; downgraded saleable output remains product and discarded material remains waste."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity
      process_id: "cotton_field_production"
      flow_role: "inputs"
      record_type: "collected"
      raw_fields: "field; area; cultivar; dates; product; assay; amount; meter; carrier"
      collection_method: "invoices, logs and meters; Raw aggregation and attribution: sum by field and identity Route-specific requirements: field_energy_input_identification: Actual diesel field machinery for cotton establishment, crop care and harvest; attribute shared cotton outputs under the existing allocation rules. Raw activity or stage basis: per cultivated hectare and crop cycle. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route. field_nutrient_inputs_specific_input: Operation cotton_field_production: Record all mineral fertilizers, organic fertilizers and nutrient-bearing amendments once, preserving product, assay and event. Original quantity method: collect each applied product once and calculate nutrients from assay Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. field_crop_protection_input_specific_input: Operation cotton_field_production: Record each actual formulation by active ingredient, concentration and event. Original quantity method: measured formulation by product and application event Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "ha; kg; L; m3; kWh; MJ"
      frequency: "each event"
      temporal_coverage: "full crop cycle"
      site_scope: "each field/farm"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, logs, field map"
    - protocol_id: cp_harvest_balance
      process_id: "cotton_field_production"
      flow_role: "seed cotton/residues"
      record_type: "collected/calculated"
      raw_fields: "field; mass; module; moisture; trash; reject; residue; fate"
      collection_method: "scales, tickets, samples, balance; Raw aggregation and attribution: sum accepted lot; separate fate"
      unit: "kg; %"
      frequency: "each harvest/lot"
      temporal_coverage: "full harvest"
      site_scope: "each field/harvest unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale checks, tickets, samples"
    - protocol_id: cp_field_emissions
      process_id: "cotton_field_production"
      flow_role: "soil emissions"
      record_type: "calculated"
      raw_fields: "N products; assay; timing; residues; soil; climate; irrigation; factors"
      collection_method: "approved method on matched records; Raw aggregation and attribution: calculate pathways then sum"
      unit: "kg"
      frequency: "crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "input trace, factors, worksheet"
    - protocol_id: cp_gin_lot_balance
      process_id: "cotton_ginning"
      flow_role: "input/outputs/residuals"
      record_type: "collected/calculated"
      raw_fields: "lot; origin; input/output mass/moisture/grade; reject; destination"
      collection_method: "scales, sampling, reconciliation; Raw aggregation and attribution: reconcile lot then aggregate"
      unit: "kg; %; item"
      frequency: "each lot/shift"
      temporal_coverage: "full campaign"
      site_scope: "each gin line/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, tickets, grade, balance"
    - protocol_id: cp_gin_utility
      process_id: "cotton_ginning"
      flow_role: "energy/water"
      record_type: "collected/calculated"
      raw_fields: "meter; purchase; runtime; power; water; period"
      collection_method: "meters, invoices, runtime; Raw aggregation and attribution: allocate shared total once Route-specific requirements: gin_energy_input_identification: Actual electric gin machinery, conveying fans and controls. Drying heat requires identification of the installed burner/supply; retain existing cottonseed/lint allocation and do not assign whole-gin energy to both products. Raw activity or stage basis: per 1,000 kg accepted cottonseed. (cotton-gin-energy) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kWh; MJ; kg; L; m3"
      frequency: "shift/bill"
      temporal_coverage: "full campaign"
      site_scope: "each gin/meter"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, invoice, log"
    - protocol_id: cp_gin_emissions
      process_id: "cotton_ginning"
      flow_role: "particulate"
      record_type: "measured/calculated"
      raw_fields: "source; control; fraction; concentration; flow; runtime; factor"
      collection_method: "test or approved permit method; Raw aggregation and attribution: calculate by source/fraction without overlap"
      unit: "kg; mg/m3; m3; h"
      frequency: "test/period"
      temporal_coverage: "representative campaign"
      site_scope: "each source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "report, permit, controls, runtime"
    - protocol_id: cp_storage_lot
      process_id: "cottonseed_handling_storage"
      flow_role: "cottonseed/energy/package/loss"
      record_type: "collected/calculated"
      raw_fields: "lot; mass; moisture; temperature; foreign matter; duration; runtime; package; reject"
      collection_method: "scales, probes, meters, logs; Raw aggregation and attribution: reconcile input, accepted, reject, moisture Route-specific requirements: storage_energy_input_identification: Actual electric cottonseed conveying, aeration and temperature control over the declared storage period; no-storage routes require no invented storage load. Raw activity or stage basis: per 1,000 kg accepted cottonseed. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route. cottonseed_packaging_input_specific_input: Operation cottonseed_handling_storage: Record packaging that remains with product at hand-off and preserve reuse cycles. Original quantity method: measured packaging divided by verified reuse cycles Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; %; C; h; kWh; item"
      frequency: "receipt/daily/dispatch"
      temporal_coverage: "full storage period"
      site_scope: "each bin/pile/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, monitoring, inspection, ticket"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "cotton_field_production"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_field_normalization
      applies_to: "field flows"
      rule: "field flow / accepted seed-cotton mass × seed-cotton need per 1,000 kg cottonseed"
      inputs:
        - "field flow"
        - area
        - yield
        - "gin balance"
      output: "normalized field flow"
      source_ids: []
    - id: calc_gin_balance
      applies_to: "gin lot"
      rule: "input = lint + cottonseed + recovered outputs + waste + moisture reconciliation"
      inputs:
        - "matched mass/moisture"
      output: "reconciled yield"
      source_ids:
        - cotton-ginners-handbook-2016
    - id: calc_storage_balance
      applies_to: "storage"
      rule: "incoming dry matter = accepted + rejected/lost dry matter ± justified uncertainty"
      inputs:
        - "mass and moisture"
      output: "accepted seed/loss"
      source_ids:
        - cottonseed-storage-2018
    - id: calc_economic_allocation
      applies_to: "co-products"
      rule: "share_i = quantity_i × price_i / sum(quantity × price)"
      inputs:
        - quantities
        - grades
        - prices
      output: "burden shares"
      source_ids: []
    - id: calc_shared_services
      applies_to: "shared assets"
      rule: "total service × documented causal share, counted once"
      inputs:
        - "total and driver"
      output: "node/lot amount"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference"
      requirement: "Prove non-planting, whole/fuzzy state, cultivar, crop year, moisture, foreign matter, grade, storage and gate."
      evidence: "specification, lot ticket, inspection"
    - id: dq_traceability
      applies_to: "chain"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "concrete flow identity evidence"
    - id: dq_mass_balance
      applies_to: "gin/storage"
      requirement: "Reconcile wet and dry balances and investigate gaps beyond justified uncertainty."
      evidence: "scales, moisture tests, balance"
    - id: dq_allocation
      applies_to: "co-products"
      requirement: "Retain quantities, grades, prices, period, currency, shares and mass sensitivity."
      evidence: "sales/market evidence, worksheet"
    - id: dq_temporal
      applies_to: "all"
      requirement: "Cover a complete crop cycle and gin/storage period; disclose proxies and abnormal events."
      evidence: "dates and exception log"
    - id: dq_completeness
      applies_to: "all cards"
      requirement: "Report applicable value or documented zero/not-applicable and retain concrete selections for sets."
      evidence: "completeness and binding evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference"
    rule: "Reject planting, delinted or crushed seed and derived products; require whole fuzzy non-planting cottonseed and qualifiers."
    source_ids: []
  - rule_id: validate_process_chain
    applies_to: "map"
    rule: "Require cultivation/harvest and ginning; include storage only when before gate and impose no inactive-route amount."
    source_ids: []
  - rule_id: validate_gin_balance
    applies_to: "ginning"
    rule: "Require matched input and complete lint, cottonseed, useful output, waste and moisture reconciliation."
    source_ids:
      - cotton-ginners-handbook-2016
  - rule_id: validate_coproduct_allocation
    applies_to: "crop/gin"
    rule: "Require explicit lint/cottonseed attribution, economic inputs and mass sensitivity; reject double allocation."
    source_ids: []
  - rule_id: validate_flow_identitys
    applies_to: "inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "cards"
    rule: "Require role, bounds, unit, basis and evidence; lower <= upper and inactive conditional routes impose no amount."
    source_ids: []
  - rule_id: validate_reject_routing
    applies_to: "rejects"
    rule: "Route each off-spec stream once and exclude rejected mass from accepted output."
    source_ids: []
  - rule_id: validate_shared_burdens
    applies_to: "shared services"
    rule: "Require a causal driver and prove each shared burden is counted once."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground cottonseed production dataset with explicit co-product attribution"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of whole fuzzy non-planting cottonseed at the declared gin/farm gate"
  excluded_use: "planting or delinted seed; lint, linters, hulls, oil, cake, meal, crushing, extraction or feed manufacture"
  required_metadata: "cultivar; geography; crop year; irrigation; harvest; gin; lot; moisture; foreign matter; fuzz state; storage; gate; balance; allocation"
  required_quality_disclosure: "coverage, uncertainty, proxies, mixed origins, unresolved identities, allocation sensitivity and representativeness"
  update_trigger: "material change in region, production, harvest, gin, yield, moisture/storage, product state, price or allocation"
data_sources:
  - id: "feedipedia-cottonseed"
    type: "extension_guidance"
    reference: "Feedipedia, Cotton seeds, https://feedipedia.review.fao.org/node/742"
    used_for: "identity, route, uses and exclusions"
  - id: "cotton-ginners-handbook-2016"
    type: "handbook"
    reference: "National Cotton Council, Cotton Ginners Handbook, https://journal.cotton.org/article/20-2-154/"
    used_for: "gin boundary, separation, moisture, energy, waste and air emissions"
  - id: "cottonseed-storage-2018"
    type: "literature"
    reference: "Ashley et al., Cottonseed Air-Handling and Storage Requirements, Journal of Cotton Science 22:47-59, https://www.cotton.org/journal/2018-22/1/47.cfm"
    used_for: "co-product ratio, moisture, aeration, handling and storage"
  - id: "ncc-seedcotton-handling"
