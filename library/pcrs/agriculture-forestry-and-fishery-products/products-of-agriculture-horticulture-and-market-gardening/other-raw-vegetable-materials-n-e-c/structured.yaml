    - rule_id: first_conditioning_limit
      applies_to: "recovery and first conditioning"
      rule: "Include only recovery, cleaning, extraction, grading, drying or stabilization needed to reach the first declared handoff; exclude later manufacture and packaging."
      source_ids:
        - mycoprotein-production-review-2019
        - fao-forest-seed-handling-1985
    - rule_id: periods_and_assets
      applies_to: "multi-period sources and shared equipment"
      rule: "Link seed-source management and shared infrastructure burdens to declared service periods, consuming nodes and outputs exactly once."
      source_ids:
        - fao-forest-seed-handling-1985
    - rule_id: reject_route
