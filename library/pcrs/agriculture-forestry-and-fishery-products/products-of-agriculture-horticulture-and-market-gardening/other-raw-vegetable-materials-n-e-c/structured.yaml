  - rule_id: parameterized_binding
    applies_to: "concrete flow identity verification"
    rule: "Expand each parameterized card to verified concrete flows from foreground records and retain concrete flow identity verification; do not attach a fixed UUID to the card."
    source_ids: []
  - rule_id: nutrient_consolidation
    applies_to: "konjac cultivation"
    rule: "Record each actual nutrient product once with its composition and nutrient basis; do not misclassify non-fertilizer inputs as agricultural fertilizer."
    source_ids: []
  - rule_id: output_and_reject_paths
    applies_to: "multiple outputs and rejected states"
    rule: "Every intended product, off-spec output, rework, residue and waste has one handoff or disposal path; the reference product cannot be counted at two gates."
    source_ids: []
  - rule_id: period_and_shared_asset
    applies_to: "period and shared infrastructure"
    rule: "Service period, consuming nodes, attribution method and evidence are complete, replacement or termination events are recorded, and no burden is duplicated."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for one named raw vegetable-material route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use in a process or lifecycle model when product, route, gate, geography, time and quality state match the application."
  excluded_use: "Category averaging, cross-route proxies, unverified substitution for downstream processing, and automatic publication with unresolved concrete flows."
  required_metadata: "product and route; species/strain; run/field/provenance; gate; moisture and quality metrics; geography and time; technology; yield; attribution; concrete flow identity verification; missing data"
  required_quality_disclosure: "coverage period, representativeness, mass balance, instruments and calibration, substituted data, unresolved UUIDs, reasoned-estimate ranges and sensitivity"
  update_trigger: "Material change in product, route, gate, technology, source, yield, attribution, concrete flow identity verification."
