    reference: "Finnigan et al. (2019), Mycoprotein: The Future of Nutritious Nonmeat Protein, a Symposium Review, Current Developments in Nutrition 3(6), nzz021, DOI 10.1093/cdn/nzz021"
    used_for: "mycoprotein fermentation, recovery and product-state decomposition"
