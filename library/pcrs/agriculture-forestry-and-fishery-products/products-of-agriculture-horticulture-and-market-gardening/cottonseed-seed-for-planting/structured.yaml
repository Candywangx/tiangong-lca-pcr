product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.products-of-agriculture-horticulture-and-market-gardening.cottonseed-seed-for-planting"
  classification_refs: "CPC 3.0 01431 (mapping context only); mapping relation: exact"
  covered_products: "Viable, cleaned cottonseed designated and graded for planting; cultivar and treatment status declared."
  excluded_products: "Cotton lint; cottonseed sold for crushing, oil or feed; cotton oil and meal; seed cotton before ginning; seed sold without planting-grade evidence."
  representative_product: "Cleaned planting cottonseed from cotton grown for seed propagation."
  production_route: "Managed seed crop → harvest of seed cotton → gin separation → optional mechanical or acid delinting → seed cleaning/grading → optional stabilization/treatment → accepted seed hand-off. Irrigated and rainfed cultivation are alternate managed-production routes; mechanical and acid delinting are alternate treatment routes, while no delinting is allowed only when the declared market specification accepts it."
  market_state: "Seed-grade, cleaned, viable cottonseed at the declared farm-gate transaction; package and treatment state disclosed."
functional_unit:
  what: "Accepted cottonseed grown and conditioned for planting"
  how_much: "1 kg of accepted net seed mass"
  how_well: "Declared cultivar, seed grade, purity/germination evidence, moisture, delinting and treatment state"
  how_long_or_cycle: "One identified cotton growing season and linked conditioning lot"
  reference_flow_link: "reference_seed_output"
system_boundary:
  rules:
    - rule_id: full_pre_gate_chain
      applies_to: "reference product"
      rule: "Include crop inputs, field operations, harvest, movement to gin/conditioner, ginning, cleaning, grading, conditional delinting/stabilization/treatment and linked waste handling through accepted seed hand-off, even when services occur off farm."
      source_ids:
        - usda-aphis-cotton-seed-2012
        - usda-ars-ginning-2015
    - rule_id: separate_output_states
      applies_to: "gin and conditioner"
      rule: "Record lint, seed for planting, non-planting seed, linters, gin trash, residues and waste by actual destination; no rejected mass in accepted seed."
      source_ids:
        - usda-ars-ginning-2015
        - usda-ams-acid-delinting
    - rule_id: route_condition
      applies_to: "delinting"
      rule: "Acid delinting is conditional; record acid, water, neutralizer, effluent and removed lint when used. Mechanical route records energy and removed material. Do not invent acid chemistry, conversion efficiency or universal yield."
      source_ids:
        - usda-ams-nop-5029
        - usda-ams-acid-delinting
    - rule_id: field_emissions
      applies_to: "managed soil"
      rule: "Calculate direct and indirect N2O from recorded N sources under a declared geographic method; do not apply a generic flow amount without a documented factor."
      source_ids:
        - ipcc-2019-soils-ch11
    - rule_id: post_gate_exclusion
      applies_to: "accepted seed"
      rule: "Exclude distribution after the declared hand-off, sowing of sold seed, cotton oil milling, crushing and subsequent crop production."
      source_ids:
        - unsd-cpc-01431
    - rule_id: shared_asset_boundary
      applies_to: "shared gin and conditioner assets"
      rule: "A shared asset such as a gin meter, seed cleaner or ventilation unit is attributed across the farm/lot nodes and actual service period that consume it; record the meter or machine-hour basis once."
      source_ids:
        - usda-ars-ginning-2015
    - rule_id: reporting_period
      applies_to: "production mix"
      rule: "A single-period basis covers the identified crop season and linked conditioning campaign. If seed remains held after that period, collect and disclose the additional activity as a distinct case before aggregation."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Cultivated cotton field with disclosed planted seed provenance, management period and land history."
  starting_condition_role: "Foreground managed biological production, then separately traced harvest and conditioning states."
  product_classification_scope: "Planting-grade cottonseed only at final accepted hand-off; seed cotton and gin outputs remain intermediate or co-products."
  recursive_input_rule: "Purchased cotton planting seed used to establish the next crop is an input with its own upstream dataset; do not recursively regenerate it using this same foreground lot."
  upstream_dataset_requirement: "Attach provider datasets for purchased planting seed, fertilizers, crop protection, fuels, electricity, water service, delinting reagents and contracted conditioning where material."
  disclosure: "Declare farm/ginning/conditioning sites, ownership of pre-handoff services, season, irrigation, harvest method, ginning method, delinting and treatment route, rejects and all intended sale outputs."
