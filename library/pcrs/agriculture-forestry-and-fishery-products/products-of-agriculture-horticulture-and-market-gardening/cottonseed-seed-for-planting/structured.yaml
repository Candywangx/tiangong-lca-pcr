allocation_rules:
  - rule_id: joint_gin_output
    applies_to: "gin separation"
    rule: "First separate physical subprocesses where meters and mass records allow. For inseparable ginning burdens jointly generating lint and fuzzy seed, use lot-specific dry-mass allocation among intentionally sold outputs; show masses and calculated shares. Gin trash receives a share only when documented as a saleable intended product; disposal waste does not. Preserve a sensitivity result using economic allocation when value data exist, because lint and seed have different economic functions."
    source_ids:
      - usda-ars-ginning-2015
  - rule_id: seed_grade_attr
    applies_to: "grading and conditioning"
    rule: "Keep planting seed, saleable non-planting cottonseed and saleable linters as distinct outputs. Attribute inseparable common conditioning burdens to saleable outputs by measured dry mass; direct delinting, grading, rework and treatment burdens to the lots that actually receive them. Disclose saleable output set and shares."
    source_ids:
      - usda-ams-acid-delinting
  - rule_id: reject_loop
    applies_to: "grading, stabilization and release"
    rule: "Rework mass and repeated energy remain linked to the producing lot until final disposition. A failed lot that becomes non-planting seed is a downgraded co-product; disposed material is waste and receives no output allocation. Never count a returned lot twice as accepted seed."
    source_ids:
      - usda-ams-acid-delinting
  - rule_id: shared_service
    applies_to: "farm, gin and conditioner"
    rule: "Attribute shared machinery, gin meters, ventilation, buildings and cleaning to documented consuming fields/lots and service periods; prefer measured machine hours or energy, then throughput only if operating conditions are comparable. Attribute each shared burden once."
    source_ids:
      - usda-ars-ginning-2015
  - rule_id: production_mix
    applies_to: "irrigated/rainfed fields and conditioning routes"
    rule: "Calculate each route separately through its own accepted seed mass, then mass-weight final results across accepted seed only. Keep mutually exclusive delinting routes and treatment states separate in inventory disclosure."
    source_ids:
      - usda-aphis-cotton-seed-2012
      - usda-ams-nop-5029
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The dry-mass rule is this PCR's attribution decision for a common material-separation service; it is a modelling convention requiring explicit disclosure, not a claim that mass and economic functions are equivalent. Record as-received moisture and conversion basis. If output ownership or measurement is incomplete, mark allocation inconclusive instead of assigning all gin burdens to seed. [Sources: usda-ars-ginning-2015, usda-ams-acid-delinting]"
    source_ids: []
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "crop_management"
      flow_role: "planted seed, fertilizer, pesticides, irrigation and field fuel"
      record_type: "field ledger and invoices"
      raw_fields: "field ID; crop season; planted seed kg; product and nutrient kg; application dates; irrigation m3; pump energy; field area ; actual supply boundary and meter location; product delivery; direct-abstraction owner; source-to-delivery losses, returns and storage; provider coverage"
      collection_method: "supplier records, meters and application logs; Raw aggregation and attribution: sum by field and allocate shared operation by actual area or machine time field_crop_protection_products_specific_input: Operation crop_management: Record every crop-protection product separately with its formulation, active-substance content, application time, and field. Original quantity method: Record each actual product, formulation, amount, timing, and field; retain product and active-substance masses separately. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg, m3, MJ, ha"
      frequency: "each application"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dated invoices, calibration and irrigation meter evidence"
    - protocol_id: cp_soil_emissions
      process_id: "crop_management"
      flow_role: "managed-soil N inputs and emissions"
      record_type: "calculation worksheet"
      raw_fields: "mineral and organic N kg; crop residue N; soil/region; emission factors; irrigation status"
      collection_method: "field N ledger and declared IPCC or national method; Raw aggregation and attribution: calculate direct and indirect pathways separately; convert N2O-N to N2O once"
      unit: "kg N and kg N2O"
      frequency: "each season"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor source, assumptions and worksheet"
    - protocol_id: cp_harvest
      process_id: "seed_cotton_harvest"
      flow_role: "harvested seed cotton, losses and energy"
      record_type: "harvest log"
      raw_fields: "field ID; date; harvested seed-cotton kg; moisture; loss estimate; residue destination; fuel/energy"
      collection_method: "weighbridge, harvest logs and field checks; Raw aggregation and attribution: sum matched harvested lots; reconcile to gin intake"
      unit: "kg, MJ"
      frequency: "each harvest"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale tickets and fuel records"
    - protocol_id: cp_gin_balance
      process_id: "gin_separation"
      flow_role: "seed cotton, lint, fuzzy seed and trash"
      record_type: "gin batch ledger"
      raw_fields: "lot/run ID; source field; incoming kg/moisture; lint kg; fuzzy seed kg; trash kg; destinations"
      collection_method: "gin scales and output sale/transfer tickets; Raw aggregation and attribution: mass-balance each run, then aggregate traceable lots"
      unit: "kg"
      frequency: "each gin run"
      temporal_coverage: "linked harvest/conditioning campaign"
      site_scope: "each gin and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration and sale records"
    - protocol_id: cp_delint_balance
      process_id: "seed_delinting"
      flow_role: "delinting route, reagents and residues"
      record_type: "conditioning batch ledger"
      raw_fields: "lot/run ID; mechanical/acid/bypass route; incoming fuzzy seed kg; acid/water/neutralizer kg; delinted seed kg; linters kg; effluent/waste kg"
      collection_method: "batch meter, chemical inventory and waste manifest; Raw aggregation and attribution: reconcile dry-equivalent incoming/outgoing material and reagent inventory acid_residue_specific_output: For acid route record reacted lint, excess or unreacted acid solution, neutralization products, dust and wastewater by actual destination; recirculated reagent stays within the node, and untreated residue is not a product. For acid route record reacted lint, excess or unreacted acid solution, neutralization products, dust and wastewater by actual destination; recirculated reagent stays within the node, and untreated residue is not a product. This is a mandatory specific-output collection requirement, not a selected exchange. Preserve every actual waste, residue, reject and co-product from this operation. Create separate cards for physically distinct streams with actual material, composition/state, quantity, receiving route and Product/Waste role before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. A genuinely mixed stream may remain one physically defined mixture supported by composition records; never invent separation or count its components again. Keep liquid and solid treatment quantities separate. Preserve original period, output balance, reference normalization and allocation rules; missing records do not establish zero or exclusion. usda-ams-acid-delinting"
      unit: "kg"
      frequency: "each conditioning run"
      temporal_coverage: "linked seed lot"
      site_scope: "each conditioner and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "chemical invoices, meter and waste records"
    - protocol_id: cp_shared_services
      process_id: "gin_separation"
      flow_role: "shared energy, cleaning and assets"
      record_type: "service meter log"
      raw_fields: "meter period; kWh/fuel; machine hours; active run IDs; changeover/cleaning; building use"
      collection_method: "utility meters and maintenance logs; Raw aggregation and attribution: assign each shared service once to observed consuming lots by energy or hours delint_energy_specific_input: Operation seed_delinting: Record mechanical or acid equipment energy by route and run, including drying and ventilation when used. Original quantity method: Record mechanical or acid equipment energy by route and run, including drying and ventilation when used. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kWh, MJ, h"
      frequency: "each run or meter period"
      temporal_coverage: "linked campaign"
      site_scope: "gin and conditioner"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter logs and allocation worksheet"
    - protocol_id: cp_grade_balance
      process_id: "seed_grading"
      flow_role: "accepted, rework, downgraded and waste states"
      record_type: "grading ledger"
      raw_fields: "lot ID; incoming kg; purity; germination; accepted kg; rework kg; non-planting kg; waste kg; destinations"
      collection_method: "scales, lab reports and disposition log; Raw aggregation and attribution: track repeat passes and final disposition without duplicate accepted mass"
      unit: "kg, %"
      frequency: "each lot and rework pass"
      temporal_coverage: "conditioning campaign"
      site_scope: "each conditioner"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lab certificate and scale records"
    - protocol_id: cp_stabilization
      process_id: "seed_stabilization"
      flow_role: "pre/post seed condition and treatment"
      record_type: "storage or treatment log"
      raw_fields: "lot ID; pre/post kg, moisture and germination; dates; energy; treatment product and kg; residue/damage kg"
      collection_method: "lot scale, moisture and germination tests, treatment meters; Raw aggregation and attribution: sum event inputs once and link to final lot seed_treatment_input_specific_input: If applied, record each treatment formulation, amount and service by lot; mark untreated lots explicitly. If applied, record each treatment formulation, amount and service by lot; mark untreated lots explicitly. This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied. usda-ams-nop-5029 stabilization_loss_specific_output: Record damaged or nonviable seed and treatment residues with actual disposal or downgrade path. Record damaged or nonviable seed and treatment residues with actual disposal or downgrade path. This is a mandatory specific-output collection requirement, not a selected exchange. Preserve every actual waste, residue, reject and co-product from this operation. Create separate cards for physically distinct streams with actual material, composition/state, quantity, receiving route and Product/Waste role before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. A genuinely mixed stream may remain one physically defined mixture supported by composition records; never invent separation or count its components again. Keep liquid and solid treatment quantities separate. Preserve original period, output balance, reference normalization and allocation rules; missing records do not establish zero or exclusion. usda-ams-nop-5029"
      unit: "kg, %, MJ"
      frequency: "each lot/event"
      temporal_coverage: "pre-handoff interval"
      site_scope: "each conditioning site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "test results, treatment label and meter logs"
    - protocol_id: cp_release
      process_id: "seed_release"
      flow_role: "net accepted reference seed"
      record_type: "release and shipment ledger"
      raw_fields: "lot ID; accepted net kg; cultivar/class; purity; germination; moisture; delinting/treatment route; hand-off date; failed kg and disposition"
      collection_method: "certification/test certificate and final scale ticket; Raw aggregation and attribution: sum unique accepted lot IDs only"
      unit: "kg, %"
      frequency: "each release lot"
      temporal_coverage: "one marketing season"
      site_scope: "each producer/conditioner"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed test, release and transfer records"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "crop_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: normalized_input
      applies_to: "all foreground quantities"
      rule: "Quantity per kg = lot-attributed quantity / unique accepted seed kg."
      inputs:
        - "process quantity"
        - "accepted seed mass"
      output: "normalized amount"
      source_ids: []
    - id: dry_mass
      applies_to: "gin and conditioning outputs"
      rule: "Dry mass = as-received mass × (1 − measured moisture fraction); use same moisture convention for compared streams."
      inputs:
        - "as-received kg"
        - "measured moisture"
      output: "dry kg"
      source_ids: []
    - id: joint_share
      applies_to: "inseparable joint service"
      rule: "Output share = saleable output dry kg / sum saleable intended output dry kg; apply once to joint burden."
      inputs:
        - "saleable output dry masses"
        - "common service amount"
      output: "allocated burden"
      source_ids:
        - usda-ars-ginning-2015
    - id: field_n2o
      applies_to: "managed soil"
      rule: "Use selected regional IPCC/national direct and indirect pathway equations; store all N inputs, factors and units."
      inputs:
        - "N source inventory"
        - region
        - "selected factors"
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-soils-ch11
    - id: mix_average
      applies_to: "production mix"
      rule: "Sum route burden / sum unique accepted seed mass after route allocation."
      inputs:
        - "route burdens"
        - "accepted seed mass"
      output: "production mix per kg"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_soil_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "released seed"
      requirement: "Match cultivar, seed class, planting purpose, lot tests and the verified reference-flow identity."
      evidence: "release certificate and scale ticket"
    - id: coverage
      applies_to: "field through release"
      requirement: "Link farm field, harvest, gin run, conditioning lot and accepted seed output; disclose missing subcontractor records."
      evidence: "cross-site lot chain"
    - id: balance
      applies_to: "gin and conditioner"
      requirement: "Reconcile input/output mass at measured moisture and explain differences; no silent zero for lint or rejects."
      evidence: "balance worksheet and moisture tests"
    - id: route_quality
      applies_to: "conditional processes"
      requirement: "Document irrigated/rainfed, acid/mechanical/no delinting and seed treatment status with associated inputs and waste."
      evidence: "operation logs"
    - id: temporal
      applies_to: "production mix"
      requirement: "Use one identified crop season and linked conditioning campaign; disclose older proxy data and changes."
      evidence: "dated logs and meter periods"
validation_rules:
  - rule_id: seed_identity
    applies_to: "reference output"
    rule: "Require verified flow UUID, net accepted kg, sowing purpose, cultivar/class, germination/purity evidence and declared moisture; reject oilseed or lint substitution."
    source_ids: []
  - rule_id: gate_completeness
    applies_to: "boundary"
    rule: "Verify every pre-handoff farm, gin, transporter and conditioner node or contracted service is included once; disclose the actual gate and ownership."
    source_ids: []
  - rule_id: mass_and_outputs
    applies_to: "gin and conditioner"
    rule: "Check seed cotton, lint, fuzzy seed, linters, accepted and downgraded seed, trash and waste disposition with moisture-compatible balance; accepted mass is unique."
    source_ids: []
  - rule_id: route_exclusivity
    applies_to: "production and treatment"
    rule: "Require irrigated/rainfed field evidence and one evidenced delinting route per lot; acid route requires reactant, neutralization and residue records; treatment status is explicit."
    source_ids: []
  - rule_id: batch_trace
    applies_to: "shared runs"
    rule: "Match meters, changeovers, cleaning and shared infrastructure to consuming lots and periods; each shared burden is assigned once."
    source_ids: []
  - rule_id: reject_resolution
    applies_to: "grading and release"
    rule: "Every off-grade mass has a rework, downgrade, recovery or disposal path; repeated passes do not create extra accepted mass."
    source_ids: []
  - rule_id: allocation_audit
    applies_to: "multi-output service"
    rule: "Require measured saleable output masses, allocation shares summing to one, direct burdens assigned first and economic sensitivity when prices exist; mark incomplete evidence inconclusive."
    source_ids: []
  - rule_id: soil_n2o_basis
    applies_to: "field emissions"
    rule: "Verify source-specific N inputs, regional factor source, direct/indirect separation and N2O-N conversion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground planting-cottonseed production-mix dataset"
  downstream_use: "secondary_dataset; background_dataset for downstream seed supply, cotton farming process and lifecyclemodel projections"
  allowed_use: "Sowing-grade cleaned cottonseed with matching route, seed grade and declared hand-off."
  excluded_use: "Cotton lint, unprocessed seed cotton, oilseed cottonseed, cotton oil/meal, post-gate distribution or crop grown from released seed."
  required_metadata: "reference flow UUID and mass; cultivar/seed class; region and season; farm/gin/conditioner chain; irrigation, harvest, gin and delinting routes; treatment; moisture, purity and germination; output destinations and allocation shares."
  required_quality_disclosure: "Record coverage, subcontractor data gaps, tests and calibration, moisture correction, field-emission method, allocation and economic sensitivity, proxy data and uncertainty."
  update_trigger: "New seed standard or flow identity; changed route/gate; improved gin or conditioner records; changed regional field emission factors."
