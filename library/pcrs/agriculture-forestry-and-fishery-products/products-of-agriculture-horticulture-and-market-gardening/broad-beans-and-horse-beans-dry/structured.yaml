  - id: mature_crop_harvest
    name: "Mature harvest and pre-drying"
    inclusion: "required"
    inclusion_condition: "always; pre-drying may be zero"
    role: "independent capture parent with manual, windrow and combine technology delta records"
    quantitative_reference: "kg standing crop entering harvest"
  - id: threshing_cleaning
    name: "Threshing and cleaning"
    inclusion: "required"
    inclusion_condition: "may be physically integrated with harvest but quantitatively distinct"
    role: "primary conditioning to clean grain"
    quantitative_reference: "kg collected material"
  - id: moisture_stabilization
    name: "Moisture-controlled drying"
    inclusion: "conditional"
    inclusion_condition: "grain above declared gate moisture or active drying/aeration"
    role: "preservation to stable moisture"
    quantitative_reference: "kg clean grain entering drying"
  - id: farm_gate_grading
    name: "Grading and hand-off"
    inclusion: "required"
    inclusion_condition: "always"
    role: "sorting to accepted, downgraded, rework and reject states"
    quantitative_reference: "kg conditioned grain"
