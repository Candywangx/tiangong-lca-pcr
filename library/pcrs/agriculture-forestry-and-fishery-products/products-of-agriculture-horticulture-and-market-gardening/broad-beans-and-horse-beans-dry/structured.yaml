      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net grain mass at measured farm-gate moisture; exclude packaging, foreign matter, residues, downgraded grain and rejects."
  - id: moisture_conversion
    applies_to: "grain before/after drying"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and % wet basis"
    rule: "Preserve dry matter: dry matter = wet mass × (1 − moisture fraction); convert only from paired mass and moisture observations."
