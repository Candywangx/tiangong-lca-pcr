allocation_rules:
  - rule_id: allocation_output_classification
    applies_to: "all outputs"
    rule: "Assign each quantity once to accepted product, valuable co-product, field-returned residue, rework, downgraded product, waste or loss at one hand-off."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_residue_default
    applies_to: "straw/stems/leaves/hulls"
    rule: "Field-returned material has no co-product allocation; removed material is a co-product only with beneficial destination and positive value, otherwise waste."
    source_ids:
      - vce-faba-bean-2024
      - ipcc-2019-managed-soils
  - rule_id: allocation_economic_precedence
    applies_to: "independently valuable co-products"
    rule: "Subdivide directly assignable operations first. For remaining common burdens with independently intended products, use economic allocation at the first independent farm-gate hand-off: share_i = (quantity_i * price_i) / sum(quantity_j * price_j), using the complete output set, matched period, compatible gates and currency. Disclose representative price sources, transactions, variability, moisture and sensitivity to mass allocation. Missing, unstable or nonrepresentative prices are an allocation evidence gap; they do not justify ignoring an actual co-product or declaring a single-output system. A single-output treatment applies only when evidence shows that other material has no independently intended product function. Do not invent a price or treat an unavailable price as zero; an unresolved allocation denominator blocks a complete allocated result."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "damaged/off-spec grain"
    rule: "Retain burdens through re-cleaning/re-grading, count loop energy once, and classify material only at final hand-off."
    source_ids: []
  - rule_id: allocation_route_period
    applies_to: "mixed routes/shared runs"
    rule: "Attribute field burdens by crop cycle and post-harvest burdens by metered lot or throughput share; assign shared cleaning/changeover once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_cycle
      process_id: "managed_field_production"
      flow_role: "inputs, area and emission drivers"
      record_type: "field log/invoice/meter"
      raw_fields: "crop; field; dates; area; seed; each nutrient product/analysis; treatments; water; carriers; lime/urea; prior crop ; actual supply boundary and meter location; product delivery; direct-abstraction owner; source-to-delivery losses, returns and storage; provider coverage"
      collection_method: "reconcile logs, invoices, meters and maps; Raw aggregation and attribution: retain product rows; sum like identities; allocate shared use by documented driver"
      unit: "native units, kg, L, m3, MJ, kWh, ha"
      frequency: "each operation"
      temporal_coverage: "crop cycle"
      site_scope: "each field/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, map, application/meter log"
    - protocol_id: cp_harvest_lot
      process_id: "mature_crop_harvest"
      flow_role: "crop, collected state, residues and losses"
      record_type: "ticket/sample/log"
      raw_fields: "lot; maturity; route; pre-drying; masses; moisture; fractions; shatter; residue dry matter/destination; energy"
      collection_method: "scales plus representative loss sampling; Raw aggregation and attribution: reconcile standing, collected, residue and loss; weight routes by accepted output"
      unit: "kg, %, kg DM, MJ, kWh"
      frequency: "field/lot"
      temporal_coverage: "harvest period"
      site_scope: "field/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, sample design, log"
    - protocol_id: cp_conditioning_lot
      process_id: "threshing_cleaning"
      flow_role: "clean grain, residues, rejects and energy"
      record_type: "batch/meter/scale"
      raw_fields: "lot; route; mass/moisture; residue mass/moisture/destination/value; rejects; energy/changeover"
      collection_method: "calibrated instruments and destination records; Raw aggregation and attribution: close wet/dry mass balance; assign shared burdens once"
      unit: "kg, %, kg DM, MJ, kWh"
      frequency: "lot/run"
      temporal_coverage: "campaign"
      site_scope: "line/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, batch sheet, receipt"
    - protocol_id: cp_drying_lot
      process_id: "moisture_stabilization"
      flow_role: "stable grain, energy, water and loss"
      record_type: "dryer/meter/moisture log"
      raw_fields: "lot; technology; paired mass/moisture; duration; temperature; airflow; carriers; losses ; all input/output water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; moisture and density; supported evaporation; actual material/state/destination; representative stream measurement; all other component/stock terms; unexplained residual and uncertainty"
      collection_method: "calibrated mass/moisture and energy records; Raw aggregation and attribution: preserve dry matter; calculate water; assign energy/loss"
      unit: "kg, %, MJ, kWh, h, °C"
      frequency: "lot"
      temporal_coverage: "campaign"
      site_scope: "drying route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, dryer/meter/inspection log"
    - protocol_id: cp_grading_lot
      process_id: "farm_gate_grading"
      flow_role: "accepted, downgraded, rework and rejects"
      record_type: "grading/scale/sales record"
      raw_fields: "lot; incoming mass/moisture; criteria; each output mass/destination/value; rework; energy; date"
      collection_method: "scale/sorter reconciled to destination; Raw aggregation and attribution: accepted + downgraded + rejects = input − measured loss; rework only at final hand-off"
      unit: "kg, %, currency/kg, MJ, kWh"
      frequency: "lot"
      temporal_coverage: "reporting period"
      site_scope: "grading site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, ticket, invoice, receipt"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "managed_field_production"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_moisture_dry_matter
      applies_to: "moisture conversion"
      rule: "dry matter = wet mass × (1 − wet-basis moisture fraction); normalized wet mass = dry matter / (1 − target fraction)"
      inputs:
        - "paired mass/moisture"
      output: "dry matter and normalized mass"
      source_ids:
        - fao-grain-drying
    - id: calc_removed_water
      applies_to: "drying"
      rule: "incoming water minus outgoing water; do not count as dry-matter loss"
      inputs:
        - "paired mass/moisture"
      output: "kg water"
      source_ids:
        - fao-grain-drying
    - id: calc_accepted_yield
      applies_to: "field/reference"
      rule: "accepted net grain divided by cultivated area; disclose failed area and moisture"
      inputs:
        - output
        - area
        - moisture
      output: "kg/ha"
      source_ids: []
    - id: calc_residue_n
      applies_to: "returned residue"
      rule: "selected national method or IPCC Equation 11.6, separating above/below ground and removed/burned fractions"
      inputs:
        - yield
        - "residue DM/N"
        - "destination fractions"
      output: "kg residue N returned"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "post-harvest lots"
      rule: "incoming dry matter = accepted + downgraded + valuable residue + final waste/loss dry matter; investigate residual"
      inputs:
        - "all states/moisture"
      output: "closure error/flag"
      source_ids: []
    - id: calc_route_mix
      applies_to: "route alternatives"
      rule: "sum(route result × accepted-output share); enter shared burdens once"
      inputs:
        - "route inventories/shares"
      output: "production mix"
      source_ids: []
    - id: calc_economic_allocation
      applies_to: "valuable outputs"
      rule: "output value / sum independently valuable output values on same period/moisture basis"
      inputs:
        - "masses/prices/moisture"
      output: "allocation fractions"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_cycle
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "grain"
      requirement: "Demonstrate *Vicia faba*, mature dry-grain purpose, market name, grade and non-seed hand-off."
      evidence: "crop/lot/specification/invoice"
    - id: dq_temporal
      applies_to: "route"
      requirement: "Link one representative crop cycle to its post-harvest lots; justify averaging and retain failed crops."
      evidence: "dated records"
    - id: dq_measurement
      applies_to: "mass/moisture/energy/water"
      requirement: "Use calibrated instruments or documented invoices/meters; retain basis, uncertainty and substitutions."
      evidence: "calibration and raw records"
    - id: dq_completeness
      applies_to: "output states"
      requirement: "Reconcile accepted, downgraded, reworked, residue, waste, shattering, handling and removed-water states."
      evidence: "node balances/receipts"
    - id: dq_route_specificity
      applies_to: "alternatives"
      requirement: "Keep winter/spring, rainfed/irrigated, manual/mechanical and natural/mechanical drying records separate before mixing."
      evidence: "route-coded records"
    - id: dq_flow_identity
      applies_to: "parameterized/unmapped rows"
      requirement: "Resolve every emitted Product exchange and substance/compartment-specific elementary exchange to verified UUIDs before TIDAS publication."
      evidence: "resolution record"
    - id: dq_range_review
      applies_to: "quantitative rows"
      requirement: "Use ranges only as QA screens; investigate exceptions and retain foreground values."
      evidence: "QA note/raw record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference output"
    rule: "Require the stated product/property/unit-group UUIDs, 1,000 kg, mature dry *Vicia faba*, moisture, grade and farm-gate hand-off."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "package"
    rule: "Reject green beans, planting seed sold as seed, other pulse species, downstream processing or post-gate transport in the reference output."
    source_ids: []
  - rule_id: validate_processes
    applies_to: "graph"
    rule: "Require field production, harvest, threshing/cleaning and grading; require drying when moisture exceeds target or active drying/aeration occurs."
    source_ids:
      - fao-grain-postharvest
      - fao-predrying
  - rule_id: validate_route_delta
    applies_to: "alternatives"
    rule: "Name parent and real topology/inventory/calculation/data/validation delta; require shares for coexisting routes and forbid unqualified merging of mutually exclusive routes."
    source_ids: []
  - rule_id: validate_mode_indexing
    applies_to: "cycles/lots/runs"
    rule: "Link inputs, outputs, cleaning and changeover to cycles/lots/periods; prevent duplicate shared-run burdens."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_output_states
    applies_to: "all output nodes"
    rule: "Give every accepted, downgraded, reworked, valuable residue, returned residue, waste and loss one class and hand-off; rejected material cannot be accepted output."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "multi-output nodes"
    rule: "Require explicit single-output/economic decision, values and period; require mass sensitivity when values are weak and prevent double hand-offs."
    source_ids: []
  - rule_id: validate_moisture
    applies_to: "drying/final grain"
    rule: "Require paired mass/moisture, dry-matter preservation, separate removed water and investigation of unexplained loss."
    source_ids:
      - fao-grain-drying
  - rule_id: validate_rework
    applies_to: "rejects"
    rule: "Point rework to cleaning or grading, retain prior burdens, count loop energy once and record final destination."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "Flow Cards"
    rule: "Check each supplied range for complete bounds, unit, basis, evidence and bilingual alignment. Require compatible quantitative evidence for any enforced limit. If no supported bound exists, retain measured quantities and explicitly report range screening unavailable; do not invent a range or declare that check complete. Investigate deviations rather than overwrite measured values."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for mature dry *Vicia faba* grain at farm gate"
  downstream_use: "secondary_dataset; background_dataset after representativeness review"
  allowed_use: "farm-gate footprints and supply-chain models for unprocessed dry broad/faba/horse bean grain with declared moisture, grade and route"
  excluded_use: "green beans; planting seed; other pulses; processed ingredients; undisclosed generic pulse proxy"
  required_metadata: "identity; geography; crop cycle; season route; irrigation; prior crop; harvest/threshing/drying/grading; moisture; grade; market; route shares; destinations; allocation; hand-off"
  required_quality_disclosure: "age/coverage; primary share; calibration; substitutions; range exceptions; mass balance; residue destinations; emission method; allocation/sensitivity; unresolved identities"
  update_trigger: "material change in cultivar, route, input regime, yield/climate, technology, moisture/grade, destination/value, allocation/emission method, or data older than five years"
data_sources:
  - id: "vce-faba-bean-2024"
    type: "extension_guidance"
    reference: "Virginia Cooperative Extension, *Faba Bean: A Multipurpose Specialty Crop for the Mid-Atlantic USA*, SPES-590, https://www.pubs.ext.vt.edu/SPES/spes-590/spes-590.html"
    used_for: "identity, green/dry distinction, cool-season production, residue return"
  - id: "fao-grain-postharvest"
    type: "official_guidance"
    reference: "FAO, *Agricultural engineering in development: Grain and post-harvest systems*, https://www.fao.org/4/T0522E/T0522E03.htm"
    used_for: "harvest, pre-drying, threshing, cleaning, drying and about 14% storage moisture"
  - id: "fao-predrying"
    type: "official_guidance"
    reference: "FAO, *Agricultural engineering in development: Pre-drying*, https://www.fao.org/4/T0522E/T0522E06.htm"
    used_for: "pre-drying boundary, route conditions and field-delay losses"
  - id: "fao-grain-drying"
    type: "handbook"
    reference: "FAO, *Farm structures in tropical climates: Grain drying*, https://www.fao.org/4/s1250e/S1250E0u.htm"
    used_for: "wet-basis moisture, dry-matter conversion and drying controls"
  - id: "feedipedia-faba-bean"
    type: "handbook"
    reference: "Feedipedia (INRAE, CIRAD, AFZ and FAO), *Faba bean (Vicia faba)*, https://feedipedia.review.fao.org/node/4926"
    used_for: "identity, maturity, 1.1–9 t/ha yield span, shattering/splitting and 12% storage moisture"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement, Volume 4, Chapter 11*, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "managed-soil emissions, N-fixing pulse residue N and destination double-counting prevention"
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct/indirect N2O and lime/urea CO2 method context; factors require actual applicability and site activity, not a product default."
