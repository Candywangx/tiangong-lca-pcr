allocation_rules:
  - rule_id: period_attribution
    applies_to: "orchard establishment"
    rule: "Attribute recorded establishment inputs over documented benefiting bearing years using saleable fresh-fruit mass; revise for actual retirement, replacement or material yield changes, without a universal lifetime."
    source_ids:
      - ioc-olive-growing
  - rule_id: fruit_grade_attribution
    applies_to: "table/oil grades"
    rule: "Allocate shared orchard inputs between table/oil fruit lots by saleable fresh-fruit mass; assign grade-specific harvest or sorting inputs directly, and never treat rejected fruit as a co-product."
    source_ids:
      - uc-harvest-2013
  - rule_id: double_count_prevention
    applies_to: "all phases"
    rule: "Record each orchard event once; assign each physical mixed fertilizer product to one input card by N first, then P, then K-only, while tracking other nutrient contents analytically without duplicate exchanges."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_establish
      process_id: "establish"
      flow_role: "trees, land, water and fuel"
      record_type: "primary activity record"
      raw_fields: "trees, land, water and fuel"
      collection_method: "planting and invoice records, meter and machine logs; Raw aggregation and attribution: sum by block and year; link cohort to bearing years"
      unit: "trees; ha; m3; L"
      frequency: "each planting event"
      temporal_coverage: "all establishment and replacement years"
      site_scope: "orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "planting invoices, plot map, meter readings"
    - protocol_id: cp_manage
      process_id: "manage"
      flow_role: "distinct fertilizer products, nutrient composition, protection, irrigation, energy, pruning and fruit state"
      record_type: "primary activity record"
      raw_fields: "distinct fertilizer products, nutrient composition, protection, irrigation, energy, pruning and fruit state"
      collection_method: "unique product ID, product mass and N/P/K fractions from invoice or formulation; application logs, meters, harvest estimates; Raw aggregation and attribution: one exchange per physical fertilizer product; sum nutrients analytically and all activity per block-year"
      unit: "kg product; kg N/P/K; m3; L; kWh; ha"
      frequency: "each operation"
      temporal_coverage: "each managed calendar or crop year"
      site_scope: "orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, composition declarations, equipment log, meter readings, pruning tickets"
    - protocol_id: cp_emissions
      process_id: "manage"
      flow_role: "direct N2O and nitrate activity"
      record_type: "primary activity record"
      raw_fields: "direct N2O and nitrate activity"
      collection_method: "record N products, soil and receiving medium; apply declared local method; Raw aggregation and attribution: calculate separately by species and medium"
      unit: "kg N; kg N2O; kg nitrate-N"
      frequency: "annual"
      temporal_coverage: "each managed year"
      site_scope: "orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "N ledger and cited factor method"
    - protocol_id: cp_harvest
      process_id: "harvest"
      flow_role: "picked and uncollected fruit, harvest fuel"
      record_type: "primary activity record"
      raw_fields: "picked and uncollected fruit, harvest fuel"
      collection_method: "weighbridge tickets and field loss survey; Raw aggregation and attribution: sum picked plus observed uncollected; retain harvest method"
      unit: "kg; L"
      frequency: "each harvest lot"
      temporal_coverage: "whole harvest window"
      site_scope: "block and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, tickets, survey sheets"
    - protocol_id: cp_sort
      process_id: "sort"
      flow_role: "accepted, downgraded and rejected fruit, olive vegetation, non-plant matter, energy"
      record_type: "primary activity record"
      raw_fields: "accepted, downgraded and rejected fruit, olive vegetation, non-plant matter, energy"
      collection_method: "grade tickets, separate fruit/vegetation/contaminant weighing and electricity meter; Raw aggregation and attribution: reconcile gross incoming mass with fruit grades, olive vegetation, other matter, loss and stock change"
      unit: "kg; kWh"
      frequency: "each sorted lot"
      temporal_coverage: "all on-farm graded lots"
      site_scope: "farm grading site and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "grade tickets, scale calibration, meter logs"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "establish"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: annualize_establishment
      applies_to: "new and replacement trees"
      rule: "Attribute measured establishment-year inputs to benefiting bearing-year output; update on retirement and replacement."
      inputs:
        - "block cohorts"
        - "planting dates"
        - "input logs"
        - "bearing-year fruit mass"
      output: "kg input/kg accepted fruit"
      source_ids:
        - ioc-olive-growing
    - id: fruit_reconcile
      applies_to: "picked or sorted lot"
      rule: "Gross incoming lot = accepted + downgraded + rejected fruit + separated olive vegetation + non-plant matter + measured loss + stock change."
      inputs:
        - "weighed gross lot input"
        - "fruit grades"
        - "vegetation and non-plant matter"
      output: "kg discrepancy"
      source_ids:
        - mass-balance-identity
    - id: fruit_normalize
      applies_to: "all orchard-year inputs"
      rule: "Divide linked block-year inputs by saleable fresh-fruit kg for the same benefiting periods; retain non-bearing years for attribution."
      inputs:
        - "block-year activity and saleable fruit mass"
      output: "per kg reference fruit"
      source_ids: []
    - id: nutrient_convert
      applies_to: "nutrient products"
      rule: "Create one exchange per physical product; multiply its mass by each documented elemental nutrient fraction and retain N, P, K versus oxide label basis."
      inputs:
        - "unique product ID"
        - "product mass"
        - "declared nutrient fractions"
      output: "kg N, P and K"
      source_ids:
        - uc-fertilizing-olives
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_periods
      applies_to: "orchard cohort"
      requirement: "Retain establishment, non-bearing, bearing, replacement and retirement periods and attribution version."
      evidence: "block map and annual ledger"
    - id: dq_route
      applies_to: "fruit lot"
      requirement: "Retain table/oil destination, cultivar, maturity, damage, harvest method and fresh-fruit gate state."
      evidence: "lot and grade tickets"
    - id: dq_mass
      applies_to: "harvest and grading"
      requirement: "Calibrate scales and reconcile fruit balance; flag missing, estimated and stock-change records."
      evidence: "scale certificates and reconciliation"
    - id: dq_inputs
      applies_to: "all process inputs"
      requirement: "Separate actual materials and carriers; never populate an inactive conditional process with default values."
      evidence: "meter, invoices and operation logs"
    - id: dq_emissions
      applies_to: "soil emissions"
      requirement: "Trace species, receiving medium, activity and applicable method; leave unresolved flows unmapped."
      evidence: "method sheet and N ledger"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Check whole-fruit UUID, 1 kg net mass and required qualifiers; oil or cured fruit cannot substitute for fresh fruit."
    source_ids:
      - ioc-table-olives
  - rule_id: validate_periods
    applies_to: "perennial cohorts"
    rule: "Check all establishment, non-bearing, bearing, replacement and retirement periods are allocated once and traceably."
    source_ids:
      - ioc-olive-growing
  - rule_id: validate_route
    applies_to: "harvest and grading"
    rule: "Record hand or mechanical harvest and table/oil grade; inactive grading has no exchanges."
    source_ids:
      - uc-harvest-2013
  - rule_id: validate_balance
    applies_to: "fruit lot"
    rule: "Review fruit, separated olive vegetation and non-plant matter against gross lot mass, reject destinations and damage class without double-counting transfers."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_range
    applies_to: "each flow card"
    rule: "Investigate out-of-screen observations without rejecting supported real measurements solely because of a provisional interval."
    source_ids: []
published_dataset_profile:
  dataset_role: "block- and lot-specific fresh-olive foreground data package"
  downstream_use: "secondary_dataset; may serve as background_dataset after geographic and temporal matching"
  allowed_use: "farm-gate whole-fruit modelling with table/oil fruit destination split"
  excluded_use: "not an olive-oil, cured-fruit or universal region/tree-age default dataset"
  required_metadata: "block, geography, cultivar, tree age, establishment/bearing/replacement years, irrigation, harvest, grading and fruit destination"
  required_quality_disclosure: "weighing and loss checks, cross-period attribution, unmapped exchanges, provisional ranges and data gaps"
  update_trigger: "block change, replanting, harvest technology, grading location, quality definition or method-factor change"
data_sources:
  - id: "ioc-olive-growing"
    type: "official_guidance"
    reference: "International Olive Council, Olive Growing, https://www.internationaloliveoil.org/wp-content/uploads/2019/12/Olivicultura_eng.pdf"
    used_for: "orchard establishment, management and harvest route"
  - id: "ioc-table-olives"
    type: "official_guidance"
    reference: "International Olive Council, Table olives, https://www.internationaloliveoil.org/olive-world/table-olives/"
