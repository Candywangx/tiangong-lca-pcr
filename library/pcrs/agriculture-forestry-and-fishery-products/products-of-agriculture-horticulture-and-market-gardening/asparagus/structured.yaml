allocation_rules:
  - rule_id: allocation_establishment_over_life
    applies_to: "stand establishment"
    rule: "Attribute establishment burdens across actual represented productive years and marketable output; disclose lifetime, failed area, replacement, and early termination without double counting."
    source_ids:
      - osu-asparagus-production
      - uc-asparagus-production
  - rule_id: allocation_market_and_rejects
    applies_to: "harvest preparation"
    rule: "Reconcile incoming spear mass to marketable asparagus and rejected or trimmed material; treat rejects as waste unless a documented product specification, buyer, quantity, and destination establish a co-product."
    source_ids:
      - osu-asparagus-production
  - rule_id: allocation_secondary_output
    applies_to: "valorized residue"
    rule: "For an intentional secondary product, report quantity and hand-off and apply an explicitly justified allocation or substitution method; no default economic value or avoided burden applies."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "stand_establishment"
      flow_role: "planting material, nutrients, water, and accepted area"
      record_type: "field, purchase, application, and meter records"
      raw_fields: "field_id; date; planting_material_type; units_planted; failed_units; product_mass; nutrient_concentration; irrigation_volume; established_area"
      collection_method: "reconcile purchases and applications to each establishment field; Raw aggregation and attribution: sum by field and preserve failures and replacements"
      unit: "plant; kg; m3; ha"
      frequency: "each operation"
      temporal_coverage: "complete establishment campaign"
      site_scope: "every represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, labels, meters, field maps, and acceptance records"
    - protocol_id: cp_field_year_records
      process_id: "annual_field_management"
      flow_role: "nutrients, water, electricity, residues, and emission activity"
      record_type: "field-year log, invoice, meter, and application record"
      raw_fields: "field_id; year; stand_age; area; product_identity; product_mass; nutrient_concentration; irrigation_volume; electricity; residue_mass; dry_matter; residue_nitrogen; destination"
      collection_method: "reconcile all records to the same field-year; Raw aggregation and attribution: sum by field-year before reference-flow normalization"
      unit: "ha; kg; kg nutrient; m3; kWh"
      frequency: "each event and annual close"
      temporal_coverage: "full year including postharvest fern management"
      site_scope: "every represented productive field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, labels, analyses, meters, and disposition records"
    - protocol_id: cp_harvest_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "harvest-ready and gross harvested spears"
      record_type: "harvest log and scale record"
      raw_fields: "field_id; harvest_date; harvest_pass; gross_mass; field_loss; harvest_method; area"
      collection_method: "link every harvest lot to field and date; Raw aggregation and attribution: sum by field-year without merging stand ages before normalization"
      unit: "kg; ha"
      frequency: "each harvest pass"
      temporal_coverage: "complete harvest window"
      site_scope: "every represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales and harvest tickets"
    - protocol_id: cp_handling_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "water, packaging, marketable output, and rejects"
      record_type: "lot, scale, meter, packaging, and waste records"
      raw_fields: "lot_id; source_field; gross_input; wash_water; packaging_material; packaging_mass; marketable_mass; grade; colour; trim_state; reject_mass; reject_reason; destination"
      collection_method: "preserve lot-level mass and utility reconciliation through transfer; Raw aggregation and attribution: reconcile input, product, rejects, and mass change before aggregation primary_packaging_input_specific_input: Operation harvest_and_farm_gate_preparation: Record flexible bands, sleeves, and bags supplied with the product by material; record rigid trays and crates separately. Original quantity method: Measure packaging issued to transferred product and identify returnable packaging separately. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. rigid_packaging_input_specific_input: Operation harvest_and_farm_gate_preparation: Record rigid trays and crates supplied with the product by material and return cycle. Original quantity method: Measure packaging issued to transferred product, and record returnable-container turns separately. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; m3"
      frequency: "each lot or shift"
      temporal_coverage: "complete harvest and packing period"
      site_scope: "every represented handling line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales, meters, grade inspection, and destination receipts"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "stand_establishment"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_establishment_attribution
      applies_to: "establishment"
      rule: "Divide establishment quantity by attributed lifetime marketable output of the same stand and update expected years with actual years."
      inputs:
        - "establishment quantity"
        - cohort
        - "productive-life assumption"
        - "annual output"
      output: "establishment burden per kg marketable asparagus"
      source_ids:
        - osu-asparagus-production
        - uc-asparagus-production
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer inputs"
      rule: "Product mass multiplied by documented nutrient fraction equals kg N, P2O5, or K2O."
      inputs:
        - "product mass"
        - "nutrient concentration"
        - area
      output: "nutrient-equivalent input"
      source_ids:
        - uc-ipm-asparagus-fertilization
        - osu-asparagus-production
    - id: calc_field_normalization
      applies_to: "annual inputs"
      rule: "Final field-year contribution = attributable complete field-year quantity / matched marketable asparagus output in kg * 1,000 kg. The quotient before scaling is a per-kg intensity only. Add establishment contributions already expressed per kg multiplied by 1,000 once; never divide an already normalized contribution by output again."
      inputs:
        - "field-year quantity"
        - "marketable mass"
      output: "quantity per 1,000 kg reference product"
      source_ids: []
    - id: calc_product_balance
      applies_to: "harvest and handling"
      rule: "Gross harvested mass plus or minus measured mass change equals marketable product plus rejects and trimmings."
      inputs:
        - gross
        - marketable
        - reject
        - trim
        - "and mass-change records"
      output: "reconciled output quantities"
      source_ids: []
    - id: calc_managed_soil_emissions
      applies_to: "managed-soil nitrogen emissions"
      rule: "Apply the declared applicable IPCC or accepted regional equations to synthetic, organic, and returned-residue nitrogen; preserve conversions and prevent double counting."
      inputs:
        - "nitrogen activity data"
        - factors
        - "climate and management qualifiers"
      output: "direct and indirect nitrogen emissions"
      source_ids:
        - ipcc-2019-managed-soils
    - id: planting_material_input_identity_and_fate
      applies_to: "stand_establishment"
      rule: "For the original planting_material_input collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults. Retained source-specific collection screen: 14800–34600 plants/ha; basis: viable planting units per established hectare. Apply only to the matching concrete form, route and numerator unit, not to all alternatives or final normalized exchange."
      inputs:
        - cp_establishment_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - osu-asparagus-production
        - penn-state-asparagus-production
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_year_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve farm-gate state, colour route, grade, size, trim, washing, packaging, geography, production year, and stand age."
      evidence: "lot specification and field records"
    - id: dq_period_linkage
      applies_to: "establishment and annual management"
      requirement: "Link every field-year to one establishment cohort and disclose replacements, abandonment, productive years, and termination."
      evidence: "field map, planting record, and production history"
    - id: dq_mass_balance
      applies_to: "harvest and handling"
      requirement: "Reconcile harvest-ready, gross, marketable, rejected, and trimmed masses and explain differences."
      evidence: "calibrated scales and lot records"
    - id: dq_input_completeness
      applies_to: "all foreground inputs"
      requirement: "Preserve nutrient basis, irrigation source, electricity coverage, packaging material, and residue destination for every represented field or lot."
      evidence: "invoices, labels, meters, and logs"
    - id: dq_method_transparency
      applies_to: "calculations"
      requirement: "Record method version, factors, productive-life denominator, exclusions, and replacement of provisional estimates."
      evidence: "calculation file and review record"
