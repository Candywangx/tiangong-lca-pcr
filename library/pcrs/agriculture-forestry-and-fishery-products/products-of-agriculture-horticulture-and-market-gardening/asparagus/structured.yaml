        - penn-state-asparagus-production
        - umn-asparagus-harvest
    - rule_id: boundary_field_emissions
      applies_to: "managed soil and residues"
      rule: "Include applicable direct and indirect nitrogen emissions and returned-residue nitrogen using one declared method, avoiding double counting."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_fate
      applies_to: "fern and rejected material"
      rule: "Distinguish field return, feed, composting, treatment, productive use, and disposal; an unspecified residue is not a co-product."
