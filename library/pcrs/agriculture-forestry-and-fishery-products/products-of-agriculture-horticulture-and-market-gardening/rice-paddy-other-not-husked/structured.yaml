allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "Multi-output operations"
    rule: "First avoid allocation by process subdivision or system expansion where technically justified and consistently modelled."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_residue_status
    applies_to: "Straw and other residues"
    rule: "Straw retained, incorporated, or burned in-field is not a co-product output; record its fate and associated inputs or emissions. Straw leaving as a product or waste must be classified by actual destination."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_physical_relation
    applies_to: "Unavoidable allocation"
    rule: "If allocation cannot be avoided, use a relevant underlying physical relationship between inputs, outputs, and functions and document it."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "No defensible physical relation"
    rule: "Use another relationship, including economic allocation, only when a physical relationship is not possible; disclose prices, reference period, and a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_disclosure
    applies_to: "All allocated datasets"
    rule: "Report unallocated totals, allocation factors, allocated totals, method rationale, and mass-balance reconciliation. This PCR prescribes no universal straw allocation factor."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_identity_yield
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Crop identity, area, dates, output, land"
      record_type: "Field and harvest record"
      raw_fields: "cultivar/species; field ID; geography; area; establishment method; sowing/transplanting and harvest dates; harvested wet mass; moisture; impurities; losses"
      collection_method: "Field log, calibrated scale, moisture meter, and geospatial or cadastral record"
      unit: "ha; day; kg; % wet basis"
      frequency: "Each field and crop cycle"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each included farm or field stratum"
      aggregation_rule: "Sum mass and area only after preserving field strata; report weighted moisture method"
      quality_evidence: "Instrument IDs, calibration, field logs, weighbridge or scale tickets"
    - protocol_id: cp_material_inputs
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Seed, fertilizer, amendments, crop protection"
      record_type: "Purchase and application record"
      raw_fields: "product; supplier; amount; nutrient or active content; application date; method; field; retained-seed status"
      collection_method: "Invoice plus application log and stock reconciliation"
      unit: "kg product; kg nutrient or active ingredient"
      frequency: "Each application"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each included farm or field stratum"
      aggregation_rule: "Sum by exact product and field; do not combine product mass with nutrient or active mass"
      quality_evidence: "Invoices, labels, application logs, stock records"
    - protocol_id: cp_water_management
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Irrigation and methane controls"
      record_type: "Meter, pump, and field-water record"
      raw_fields: "delivered water; source; pump energy; flooding/drainage dates; water depth; pre-season regime; organic amendments; cultivation period"
      collection_method: "Meter or calibrated pump record plus field observation; AWD tube where AWD is claimed"
      unit: "m3 or kg; day; cm"
      frequency: "Each irrigation event and regime change"
      temporal_coverage: "Pre-season and complete crop cycle"
      site_scope: "Each included field or water-management stratum"
      aggregation_rule: "Sum delivered water; preserve regime-day strata for methane calculation"
      quality_evidence: "Meter calibration, pump curve, field log, AWD tube observations"
    - protocol_id: cp_energy_operations
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Fuel, electricity, machinery, drying"
      record_type: "Meter, purchase, and operating-hour record"
      raw_fields: "fuel type and amount; electricity; equipment; hours; operation; drying load; allocation key"
      collection_method: "Meter, invoice, fuel log, and equipment-hour record"
      unit: "kg, L, kWh, MJ, h"
      frequency: "Each operation or billing period"
      temporal_coverage: "Complete crop cycle and included storage"
      site_scope: "Each farm and shared facility"
      aggregation_rule: "Allocate shared use using documented physical driver; disclose conversion factors"
      quality_evidence: "Invoices, meter readings, equipment logs, calibration or density source"
    - protocol_id: cp_residue_management
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Straw, residues, rejects"
      record_type: "Mass and destination record"
      raw_fields: "residue type; fresh mass; moisture; dry mass; retained/incorporated/burned/exported fate; buyer or waste destination"
      collection_method: "Scale or sampled yield ratio with measured moisture; destination document"
      unit: "kg fresh; % moisture; kg dry matter"
      frequency: "Each harvest and removal"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each included field or facility"
      aggregation_rule: "Sum by fate and destination; estimated amounts remain separately flagged"
      quality_evidence: "Scale tickets, sampling record, sales or waste transfer record"
    - protocol_id: cp_postharvest_condition
      process_id: "paddy_cultivation_and_farm_gate_handoff"
      flow_role: "Cleaning, drying, storage, handover"
      record_type: "Batch and facility record"
      raw_fields: "intake and output mass; moisture before/after; rejects; energy; drying start; storage duration; handover condition"
      collection_method: "Batch scales, moisture meter, dryer and storage log"
      unit: "kg; % wet basis; kWh or MJ; day"
      frequency: "Each batch"
      temporal_coverage: "Harvest through farm-gate handover"
      site_scope: "Each included on-farm facility"
      aggregation_rule: "Reconcile batch mass, moisture, rejects, and reference output"
      quality_evidence: "Batch logs, meter readings, calibration, handover record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory flows"
      rule: "Normalized amount = crop-cycle amount × 1,000 / measured reference-paddy wet mass. Preserve the unnormalized record and factor."
      inputs:
        - "Crop-cycle flow amount"
        - "reference-paddy wet mass"
      output: "Amount per 1,000 kg paddy"
      source_ids:
        - epd-international-food-beverage-2025-03
    - id: calc_yield
      applies_to: "Crop performance"
      rule: "Wet yield = measured harvested paddy wet mass / harvested area; report moisture alongside yield."
      inputs:
        - "Paddy wet mass"
        - "harvested area"
        - moisture
      output: "kg/ha at stated moisture"
      source_ids:
        - fao-rice-production-guidelines
    - id: calc_water_mass
      applies_to: "Irrigation water"
      rule: "Water mass = measured volume × documented density; do not include rainfall as irrigation input."
      inputs:
        - "Delivered volume"
        - density
      output: "kg water"
      source_ids:
        - irri-alternate-wetting-drying
    - id: calc_rice_methane_ipcc
      applies_to: "Rice methane"
      rule: "CH4 crop = sum over water-regime strata of adjusted daily emission factor × cultivation period × harvested area. Derive the adjusted factor from the applicable baseline factor and water-regime-during-cultivation, pre-season-water, organic-amendment, soil, and cultivar factors for the selected IPCC tier."
      inputs:
        - Area
        - "cultivation days"
        - "water-regime strata"
        - "organic amendments"
        - "applicable factors"
      output: "kg CH4 per crop and per 1,000 kg paddy"
      source_ids:
        - ipcc-2019-cropland-rice
    - id: calc_soil_n2o_ipcc
      applies_to: "Managed-soil N2O"
      rule: "Calculate direct and indirect N2O-N from the applicable synthetic-N, organic-N, crop-residue, mineralisation, volatilisation, and leaching terms for the selected IPCC tier; convert N2O-N to N2O using the method's molecular-weight ratio and normalize once."
      inputs:
        - "Nitrogen inputs"
        - residues
        - area
        - "climate and management factors"
      output: "kg N2O per crop and per 1,000 kg paddy"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_lime_urea_co2_ipcc
      applies_to: "Lime and urea CO2"
      rule: "Apply the selected IPCC carbon-emission factors to recorded lime and urea applications, convert carbon to CO2 as specified by the method, and normalize once."
      inputs:
        - "Lime and urea amounts and types"
        - factors
      output: "kg fossil CO2 per crop and per 1,000 kg paddy"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_moisture_dry_matter
      applies_to: "Paddy and biomass"
      rule: "Dry mass = wet mass × (1 − moisture fraction on wet basis). Do not replace the wet-mass reference flow with dry mass."
      inputs:
        - "Wet mass"
        - "wet-basis moisture fraction"
      output: "kg dry matter"
      source_ids:
        - fao-rice-postharvest-operations
    - id: calc_allocation
      applies_to: "Co-product systems"
      rule: "Apply the documented hierarchy and factor to unallocated totals; factors must sum to one for the allocated system and mass balance must reconcile."
      inputs:
        - "Unallocated inventory"
        - "output quantities or other justified drivers"
        - factors
      output: "Allocated inventory and reconciliation"
      source_ids:
        - eu-pef-2021-2279
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product and production route"
      requirement: "Exact CPC 01132 paddy identity, cultivar/species, establishment route, irrigation class, geography, and crop season are declared."
      evidence: "Dataset metadata and field records"
    - id: dq_measurement
      applies_to: "Mass, moisture, water, energy"
      requirement: "Scales, moisture meters, water meters, and energy meters are calibrated or their uncertainty is documented."
      evidence: "Calibration certificates, instrument logs, uncertainty statement"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Data cover a complete crop cycle and any included on-farm storage; multi-year averaging preserves year-level records and weather context."
      evidence: "Dated records and aggregation workbook"
    - id: dq_completeness
      applies_to: "Inputs, outputs, and emissions"
      requirement: "Material, water, energy, residue, loss, and direct-emission records reconcile to the declared boundary; exclusions and missing observations are explicit."
      evidence: "Completeness checklist and mass balance"
    - id: dq_geography_technology
      applies_to: "Foreground and linked datasets"
      requirement: "Geography, irrigation and establishment technology, electricity, and upstream inputs match the represented system or are disclosed as proxies."
      evidence: "Representativeness assessment and dataset links"
    - id: dq_ghg_method
      applies_to: "CH4, N2O, and CO2"
      requirement: "State IPCC tier, equation version, factors, water-regime strata, nitrogen terms, and all overrides; do not substitute unlabelled generic emission values."
      evidence: "Calculation workbook and source references"
    - id: dq_residue_allocation
      applies_to: "Straw and other outputs"
      requirement: "Residue fate, product or waste status, moisture, destination, allocation hierarchy, and sensitivity are documented."
      evidence: "Destination records and allocation worksheet"
    - id: dq_postharvest
      applies_to: "Cleaning, drying, storage"
      requirement: "Included operations, losses, energy, timing, duration, and moisture before and after are batch-reconciled."
      evidence: "Batch and facility records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Dataset identity"
    rule: "Fail if the product is seed rice, husked, milled, broken, parboiled, or otherwise outside CPC 01132, or if the reference flow UUID is not bdbb913b-620c-42a0-baf6-c5802a2b6c4b."
    source_ids:
      - epd-international-food-beverage-2025-03
  - rule_id: validate_reference_mass
    applies_to: "Quantitative reference"
    rule: "Fail if the reference output is not 1,000 kg as-received wet mass using the specified Mass property and Units of mass group, or if moisture basis is absent."
    source_ids:
      - fao-rice-postharvest-operations
  - rule_id: validate_qualifiers
    applies_to: "Required metadata"
    rule: "Fail if any required reference-flow qualifier is missing; report whether the absence blocks comparability or calculation."
    source_ids:
      - fao-rice-production-guidelines
      - ipcc-2019-cropland-rice
  - rule_id: validate_boundary
    applies_to: "Included and excluded activities"
    rule: "Fail if a required foreground operation or applicable direct field emission is omitted without justification, or if downstream milling or off-farm processing is included without an explicit boundary deviation."
    source_ids:
      - fao-rice-production-guidelines
      - ipcc-2019-managed-soils
  - rule_id: validate_activity_data
    applies_to: "Foreground records"
    rule: "Fail if seed, material, water, energy, output, or residue records rely on an unlabelled default; flag missing calibration, unit basis, time, field, or product identity."
    source_ids:
      - fao-rice-production-guidelines
      - irri-alternate-wetting-drying
  - rule_id: validate_emissions
    applies_to: "CH4, N2O, and lime/urea CO2"
    rule: "Fail if applicable direct emissions are absent, double counted, or calculated without traceable activity data, tier, factors, equations, and normalization."
    source_ids:
      - ipcc-2019-cropland-rice
      - ipcc-2019-managed-soils
  - rule_id: validate_allocation
    applies_to: "Co-products and residues"
    rule: "Fail if allocation is used before avoidance is considered, residue status is unclear, factors do not reconcile, or an economic method lacks price-period disclosure and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validate_storage_ready
    applies_to: "Storage-ready claim"
    rule: "When storage-ready paddy is claimed, fail if measured moisture exceeds 14% wet basis or if drying timing and storage status are not recorded. Do not apply this rule to paddy explicitly declared as harvested or otherwise not storage-ready."
    source_ids:
      - fao-rice-postharvest-operations
  - rule_id: validate_traceability
    applies_to: "Sources and calculations"
    rule: "Fail if source IDs, TianGong flow UUIDs, foreground records, conversion factors, or calculation workbooks cannot be traced to the submitted data package."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground paddy-cultivation data package and reviewed farm-gate process projection"
  downstream_use: "LCA process and lifecycle-model construction for food, feed, and other paddy-rice supply chains"
  allowed_use: "CPC 01132 unprocessed, not-husked paddy represented at the declared farm gate and moisture basis"
  excluded_use: "Seed rice; husked, milled, broken, parboiled, or packaged rice; generic rice datasets without verifiable product and boundary identity"
  required_metadata: "All reference-flow qualifiers; process boundary; field and crop-cycle identity; source links; foreground collection protocols; IPCC tier and factors; residue fate; allocation; data-quality disclosures"
  required_quality_disclosure: "Temporal, geographic, and technological representativeness; completeness; instrument calibration or uncertainty; proxies; missing records; calculation choices"
  update_trigger: "Change in product classification, farm-gate condition, production route, water regime, geography, crop season, process boundary, emission method, residue fate, allocation, or material data source"
