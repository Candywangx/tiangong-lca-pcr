    rule: "Activated cleaning or drying/storage nodes need linked input/output mass, energy and reject disposition; absent nodes get no invented default burden or global moisture threshold."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: valid_balance
    applies_to: "Grade, rework, shared runs"
    rule: "Reconcile accepted, downgraded, rejected and drying water by linked lot within a disclosed tolerance; keep straw/chaff and uncaptured seed as separately observed fates, not an invented elementary exchange; rejected grain needs a disposition and linked rework before acceptance; count shared energy once."
    source_ids:
