    applies_to: "Dataset use"
    rule: "Exclude pressing/meal and disclose any separately sold residue or screenings with attribution method."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
published_dataset_profile:
  dataset_role: "Foreground crop and first farm-gate grain data package; review is needed before publication."
  downstream_use: "secondary_dataset; background_dataset only where region, year, route, grade and moisture are representative."
  allowed_use: "Comparable raw whole safflower grain at the farm gate with declared routes and state."
  excluded_use: "Planting seed, extracted oil, meal, processed feed, unknown gate or unknown moisture state."
  required_metadata: "Crop year, region, field area, cultivar/oil class, irrigation, harvest route, grade, actual moisture, conditioning, storage, allocation, gate and UUIDs."
  required_quality_disclosure: "Field/lot coverage, measured versus allocated values, balance residual, unresolved flow identities and regional applicability."
  update_trigger: "New verified planting-seed identity, changed market route, new primary records, changed regional practice or revised product flow."
data_sources:
  - id: "uc-safflower-production"
    type: "extension_guidance"
    reference: "University of California Agriculture and Natural Resources, Safflower Production in California, Publication 21565, https://oilseeds.ucdavis.edu/sites/g/files/dgvnsk14771/files/inline-files/21565e.pdf"
    used_for: "Harvest mode, losses, farm conditioning and downstream oil/meal distinction; California thresholds are regional."
  - id: "wisconsin-safflower"
    type: "extension_guidance"
    reference: "University of Wisconsin and University of Minnesota extension, Safflower, Alternative Field Crops Manual (1992), https://corn.aae.wisc.edu/Crops/Safflower.aspx"
    used_for: "Crop system, irrigation, harvest, cleaning, drying and buyer/storage distinction."
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct/indirect N2O and lime/urea CO2 method context; factors require actual applicability and site activity, not a product default."
