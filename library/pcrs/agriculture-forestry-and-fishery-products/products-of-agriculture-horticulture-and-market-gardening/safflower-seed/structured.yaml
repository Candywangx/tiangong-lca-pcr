      collection_method: "Reconcile issue log and meters; Raw aggregation and attribution: Sum by field/year/input"
      unit: "ha; kg; L; m3; kWh"
      frequency: "Each event"
      temporal_coverage: "Full crop cycle"
      site_scope: "Each field"
      aggregation_rule: "per declared reference flow"
