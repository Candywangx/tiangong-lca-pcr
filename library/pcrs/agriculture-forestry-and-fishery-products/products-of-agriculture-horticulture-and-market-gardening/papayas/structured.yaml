allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_marketable_output: Allocate crop-cycle inputs and direct cultivation exchanges to marketable fresh papaya using marketable mass as the primary output basis. source_ids: iso-14044-2006."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_rejects: Treat field and gate rejects as waste unless a documented receiving route creates a separately specified co-product. Do not assign avoided-product credit within this PCR. source_ids: iso-14044-2006, fao-gap-framework-2003."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_reusable_containers: Model reusable harvest containers and crates by recorded service cycles; assign their production burden across documented uses and retain consumed packaging as a separate input. source_ids: iso-14044-2006, codex-cxc-53-2003."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_papaya_establishment_records
      process_id: "papaya_crop_establishment"
      flow_role: "planting material and occupied area"
      record_type: "field establishment record"
      raw_fields: "cultivar; material type; supplier; quantity; field or protected-unit id; planted area; cycle start"
      collection_method: "supplier record, planting log, and area register; Raw aggregation and attribution: reconcile planted quantity and area to the same cycle"
      unit: "seedling, kg, ha"
      frequency: "each cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "purchase record, planting log, and field map"
    - protocol_id: cp_papaya_input_records
      process_id: "papaya_crop_management"
      flow_role: "water, fuel, nutrient products, crop protection, and emissions basis"
      record_type: "input and application record"
      raw_fields: "product; formulation; nutrient or active ingredient; quantity; source; application date; irrigation meter; fuel meter; field id"
      collection_method: "invoice review, meter reading, application log, and source register; Raw aggregation and attribution: sum applications and meter periods after field and cycle reconciliation papaya_mobile_fuel_specific_input: Operation papaya_crop_management: Record fuel used by tractors, pumps, sprayers, mowers, and other mobile or field machinery that crosses the cultivation boundary. Original quantity method: Meter, invoice, or equipment log allocated to the papaya field or protected unit. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. papaya_crop_protection_specific_input: Operation papaya_crop_management: Record only crop-protection products actually applied, retaining active ingredient, formulation, application rate, and target treatment. The product identity requires foreground binding before publication. Original quantity method: Product mass and declared active-ingredient mass by application event. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. papaya_soil_nitrogen_emissions_specific_emission: Calculate direct and indirect managed-soil nitrogen emissions from the declared fertilizer, amendment, and returned-residue nitrogen basis using one declared method. Apply the declared method factor to the documented nitrogen input and retained residue basis; do not duplicate an emission already supplied by an upstream dataset. This is a mandatory emission-identification requirement, not an aggregate elementary exchange. Identify every applicable substance and actual receiving compartment separately, with compatible units, measured activity or justified calculation method, parameter applicability and uncertainty. Preserve the original operation, period, allocation and final-reference normalization. Reconcile direct and indirect pathways and upstream coverage once; do not substitute total nitrogen, total combustion emissions or a generic pollutant for a named compound. Separately document actual environmental returns, with their material and destination, if relevant. Before dataset completeness create each required specific exchange, confirm a compatible UUID or explicitly retain its unresolved identity. Missing records do not establish zero or inapplicability. ipcc-2019-managed-soils"
      unit: "kg product, kg nutrient, m3, MJ, kg fuel"
      frequency: "each application or meter period"
      temporal_coverage: "full declared cycle"
      site_scope: "each represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meters, calibration checks, and application records"
    - protocol_id: cp_papaya_harvest_records
      process_id: "papaya_harvest"
      flow_role: "containers, harvest, rejects, and residue"
      record_type: "harvest lot and residue record"
      raw_fields: "lot id; date; field id; gross mass; grade; reject mass; residue mass; container use; destination"
      collection_method: "calibrated scale, lot sheet, container log, and residue estimate; Raw aggregation and attribution: aggregate only lots sharing field, cycle, cultivar, grade, and gate papaya_harvest_containers_specific_input: Record reusable or single-use harvest containers entering the harvest operation and distinguish reusable service cycles from consumed packaging material. Count container uses and record material mass when a consumed container crosses the boundary. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg and container-use"
      frequency: "each harvest lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "each harvest lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale check, lot reconciliation, and destination evidence"
    - protocol_id: cp_papaya_gate_records
      process_id: "papaya_gate_preparation"
      flow_role: "receiving, washing, packaging, output, and gate rejects"
      record_type: "packing or gate batch record"
      raw_fields: "batch id; received mass; wash water; wash loss; packaging type and mass; cooling; accepted mass; reject mass; destination; gate; stream material/product identity; composition and contamination state; native quantity and unit; item-mass/density conversion evidence; lot; net product and packaging mass; reuse/rework; recipient; treatment route; matched reference output"
      collection_method: "batch sheet, water meter, packaging issue record, and scale; Raw aggregation and attribution: reconcile batch input to accepted output and separately identified losses papaya_primary_packaging_specific_input: Operation papaya_gate_preparation: Record only primary packaging applied before the declared gate, including material, mass, reusable cycles, and packaging loss. Original quantity method: Count packages and record consumed material mass per marketable output lot. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default.; papaya_gate_rejects_specific_output: For each papaya gate-preparation lot, reconcile received fruit, accepted fruit, downgraded fruit, trimming, damaged fruit and handling loss independently from discarded packaging. Identify fruit streams by actual physical state and destination, and packaging by each actual material. Marketable downgraded fruit is not automatically waste; retain its evidenced product/waste role. Preserve the original per-1,000-kg marketable-output activity basis and stage-to-final-output attribution without normalizing twice. This is a mandatory collection and calculation requirement, not an inventory exchange. Before dataset completeness, create one physically specific card for each actual exported stream, including composition, state, native quantity/property, destination and evidenced product/waste role. Use only a compatible verified UUID, or explicitly register the concrete unresolved identity. Do not invent a packaging recipe, assume segregation, infer zero from missing evidence or omit a required stream. A real single mixed stream may remain one composition-defined identity only with collection/transfer evidence and compatible treatment; never duplicate it with its component exports. Keep separately handled liquid and solid streams distinct. Preserve original attribution, period, mass/water balances, reference denominator and treatment/service boundaries; link existing matching exchanges rather than count duplicates. Former aggregate ranges are not individual-stream defaults or limits."
      unit: "kg, m3, package-use; kg separately for each stream; native liquid volume separately; count and mass distinct"
      frequency: "each gate batch"
      temporal_coverage: "full period before declared hand-off"
      site_scope: "each declared farm or first packing-site gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and meter checks, packaging records, and destination records"
  calculation_rules:
    - id: calc_marketable_normalization
      applies_to: "all processes"
      rule: "Normalize each collected quantity to the accepted marketable papaya mass at the declared gate: quantity / marketable_gate_mass."
      inputs:
        - field
        - cycle
        - lot
        - "and gate records"
      output: "quantity per kg or 1,000 kg marketable papaya"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer and soil amendments"
      rule: "product_mass × declared nutrient fraction; retain product mass and nutrient-equivalent result as separate fields."
      inputs:
        - "product invoice"
        - formulation
        - "and declared N/P2O5/K2O fraction"
      output: "product mass and nutrient mass"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_soil_nitrogen_emissions
      applies_to: "managed soil emissions"
      rule: "Apply one selected IPCC-compatible factor method to documented nitrogen inputs and returned residue nitrogen, with no duplicate upstream emission."
      inputs:
        - "nutrient records"
        - "residue basis"
        - "method factor"
      output: "declared soil-emission flows"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest and gate preparation"
      rule: "gross harvested mass = marketable output + rejects + residue or process loss, with any documented stock change shown separately."
      inputs:
        - "harvest lots"
        - "gate batches"
        - "reject and residue records"
      output: "reconciled mass-balance check"
      source_ids:
        - codex-cxc-53-2003
    - id: calc_reusable_container_burden
      applies_to: "harvest containers and crates"
      rule: "Divide container production burden by documented service cycles and assign the used-cycle share to the represented papaya output."
      inputs:
        - "container mass"
        - material
        - "expected or observed service cycles"
      output: "container burden per declared output"
      source_ids:
        - iso-14044-2006
    - id: papaya_gate_rejects_specific_output
      applies_to: "papaya_gate_preparation"
      rule: "For each papaya gate-preparation lot, reconcile received fruit, accepted fruit, downgraded fruit, trimming, damaged fruit and handling loss independently from discarded packaging. Identify fruit streams by actual physical state and destination, and packaging by each actual material. Marketable downgraded fruit is not automatically waste; retain its evidenced product/waste role. Preserve the original per-1,000-kg marketable-output activity basis and stage-to-final-output attribution without normalizing twice. This is a mandatory collection and calculation requirement, not an inventory exchange. Before dataset completeness, create one physically specific card for each actual exported stream, including composition, state, native quantity/property, destination and evidenced product/waste role. Use only a compatible verified UUID, or explicitly register the concrete unresolved identity. Do not invent a packaging recipe, assume segregation, infer zero from missing evidence or omit a required stream. A real single mixed stream may remain one composition-defined identity only with collection/transfer evidence and compatible treatment; never duplicate it with its component exports. Keep separately handled liquid and solid streams distinct. Preserve original attribution, period, mass/water balances, reference denominator and treatment/service boundaries; link existing matching exchanges rather than count duplicates. Former aggregate ranges are not individual-stream defaults or limits."
      inputs:
        - cp_papaya_gate_records
      output: "actual stream-specific exchanges, destinations and nonduplicated mass balance"
      source_ids:
        - codex-cxc-53-2003
    - id: papaya_field_residue_identity_and_fate
      applies_to: "papaya_harvest"
      rule: "Reconcile crop residue, harvest loss and biomass by measured wet/dry basis and actual fate. Retained or incorporated biomass is an internal residue ledger used to calculate supported decomposition and nutrient pathways, not a purchased resource or an invented elementary biomass exchange. Separately collected material requires its actual product/waste identity and destination; environmental releases require identified substances and receiving compartments. This replaces an ambiguous aggregate exchange, not the collection obligation. Before dataset completeness, create one concrete card per actual exchange, verify a compatible UUID or retain an explicit unresolved identity, and record quantity, unit, stage/period, destination and evidence. Reconstruct the raw attributable numerator from the linked protocol and normalize once to the matched accepted reference output. Missing data is not zero; no range of the former aggregate is an individual-stream default."
      inputs:
        - cp_papaya_harvest_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - fao-gap-framework-2003
    - id: papaya_gate_wastewater_identity_and_fate
      applies_to: "papaya_gate_preparation"
      rule: "Identify each actually separate material stream, composition, state and recipient. Keep spent preservation agents, brine, animal/plant material, packaging, drainage and intended co-products separate when separately handled; instantiate only streams actually evidenced at this operation. A physically mixed stream may have one composition-defined identity only with compatible treatment evidence, without also counting its components as additional exports. Distinguish marketed outputs, internal rework, waste transfer, purchased treatment and elementary discharge; do not duplicate treatment burdens. This replaces an ambiguous aggregate exchange, not the collection obligation. Before dataset completeness, create one concrete card per actual exchange, verify a compatible UUID or retain an explicit unresolved identity, and record quantity, unit, stage/period, destination and evidence. Reconstruct the raw attributable numerator from the linked protocol and normalize once to the matched accepted reference output. Missing data is not zero; no range of the former aggregate is an individual-stream default."
      inputs:
        - cp_papaya_gate_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - codex-cxc-53-2003
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all product and input flows"
      requirement: "Declare cultivar, material or product identity, field or protected-unit id, gate, and identity evidence gap status where no fixed or parameterized binding exists."
      evidence: "source records, labels, invoices, and dataset metadata"
    - id: quality_measurement
      applies_to: "mass, water, fuel, nutrient, and packaging rows"
      requirement: "Use calibrated scales or meters where available; otherwise document the estimation method, conversion factor, and uncertainty."
      evidence: "calibration record, meter log, or estimation worksheet"
    - id: quality_temporal
      applies_to: "all processes"
      requirement: "Cover the complete declared production cycle and harvest campaign, and disclose missing periods or substituted records."
      evidence: "cycle calendar, lot register, and data-quality note"
    - id: quality_completeness
      applies_to: "inventory and emissions"
      requirement: "Reconcile field inputs, harvest, accepted output, rejects, residue, water, nutrient basis, and packaging to the declared gate."
      evidence: "mass balance, application log, and gate batch reconciliation"
    - id: quality_disclosure
      applies_to: "dataset package"
      requirement: "Preserve all required qualifiers, boundary decisions, allocation choice, concrete flow identity verification."
      evidence: "dataset metadata and PCR conformance checklist"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validation_identity: The dataset must identify papaya cultivar or product category, field or protected unit, production route, cycle, declared gate, and all evidence gap input or output identities. source_ids: fao-gap-framework-2003."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validation_mass_balance: For every harvest and gate batch, gross harvested or received mass must reconcile to marketable output, rejects, residue, wastewater or wash loss, packaging loss, and any disclosed stock change. source_ids: codex-cxc-53-2003."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validation_normalization: Every normalized inventory value must use the same declared marketable gate mass and must not mix farm-gate and first-packing-site outputs. source_ids: iso-14044-2006."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validation_nutrient_emissions: Nutrient-equivalent inputs and managed-soil emissions must identify their basis and use one non-duplicative calculation method. source_ids: ipcc-2019-managed-soils."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validation_temporal: The dataset must cover the represented production cycle and harvest campaign or explicitly disclose missing records and substitutions. source_ids: fao-gap-framework-2003."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh whole papaya"
  downstream_use: "Secondary dataset for farm-to-gate LCA and background dataset input to product-system models when the declared gate and qualifiers match"
  allowed_use: "Comparative or attributional modelling of fresh whole papaya when cultivar, geography, route, cycle, gate, marketable output, and inventory completeness are compatible"
  excluded_use: "Processed papaya products; generic fruit substitution; transport, retail, consumer, or end-of-life claims beyond the declared gate; datasets with unreported rejects or residue fate"
  required_metadata: "Papaya identity and cultivar, geography, route, field or protected-unit id, cycle dates, area, irrigation source, nutrient and crop-protection basis, harvest and grade, washing, cooling, packaging, reject and residue destinations, declared gate, reference mass, concrete flow identity verification, and identity evidence gap coverage"
  required_quality_disclosure: "Measurement basis, collection period, completeness, mass-balance result, allocation rule, provisional ranges, data substitutions, uncertainty, and evidence gap UUID or flow identities"
  update_trigger: "Change in cultivation route, irrigation system, nutrient or crop-protection programme, harvest or gate handling, packaging, accepted product definition, method factors, or resolved identity mappings"
