allocation_rules:
  - rule_id: allocation_saleable_reject
    applies_to: "saleable fruit, actual co-products and disposal rejects"
    rule: "Subdivide directly measured operations first. Disposal rejects and retained losses do not receive a co-product share: retain their production and treatment burdens with the producing saleable route. Only an independently intended and transferred product with evidenced function may enter justified joint-product allocation; document quantities, basis and sensitivity once. Do not divert crop burdens by a simple saleable/waste mass split."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_establishment
    applies_to: "perennial establishment"
    rule: "Allocate over documented productive years and annual saleable output; disclose sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intercrop_shared_area
    applies_to: "shared plots"
    rule: "Use measured area/time shares or documented physical/economic basis consistently."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_inputs
      process_id: "p_cultivation"
      flow_role: "inputs"
      record_type: "invoices, logs, meters"
      raw_fields: "product; nutrient; amount; water; date; area"
      collection_method: "record reconciliation; Raw aggregation and attribution: sum by plot/product"
      unit: "kg; kg nutrient; m3"
      frequency: "per operation"
      temporal_coverage: "full crop cycle"
      site_scope: "each plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier declaration; meter check"
    - protocol_id: cp_harvest_records
      process_id: "p_harvest"
      flow_role: "harvest energy"
      record_type: "logs and invoices"
      raw_fields: "equipment; energy; hours; crates"
      collection_method: "log/invoice reconciliation; Raw aggregation and attribution: sum by operation Route-specific requirements: harvest_energy_identification: Vaccinium harvest must distinguish hand picking, mechanical picking and the actual cranberry harvest/water-handling route. Identify the machine or pump and contracted coverage before selecting energy; no common fuel is imposed across these routes. Raw activity or stage basis: per 1 kg harvested fruit. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kWh; L; h; kg"
      frequency: "per event"
      temporal_coverage: "harvest season"
      site_scope: "each line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale ticket; invoice"
    - protocol_id: cp_harvest_mass_balance
      process_id: "p_harvest_p_conditioning_p_rejects"
      flow_role: "outputs"
      record_type: "scale and destination records"
      raw_fields: "input; saleable; reject; loss; destination"
      collection_method: "lot weighing; Raw aggregation and attribution: input = outputs + loss"
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "harvest and conditioning"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale; reconciliation"
    - protocol_id: cp_establishment_records
      process_id: "p_establishment"
      flow_role: "establishment"
      record_type: "land and planting register"
      raw_fields: "area; year; plants; productive years"
      collection_method: "register and supplier records; Raw aggregation and attribution: allocate by output"
      unit: "ha; year; kg/item"
      frequency: "annual"
      temporal_coverage: "establishment onward"
      site_scope: "each plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; register"
    - protocol_id: cp_conditioning_records
      process_id: "p_conditioning"
      flow_role: "utilities"
      record_type: "meter and production log"
      raw_fields: "utility; lot; time"
      collection_method: "meter or documented allocation; Raw aggregation and attribution: allocate by output"
      unit: "kWh; m3; h"
      frequency: "lot/month"
      temporal_coverage: "conditioning period"
      site_scope: "site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter; log"
    - protocol_id: cp_managed_soil_nitrogen
      process_id: "p_cultivation"
      flow_role: "direct and indirect soil emissions"
      record_type: "nitrogen activity and method ledger"
      raw_fields: "N sources and amounts; amendments; residue N and fate; area; dates; climate; soil; volatilisation; leaching; precursor; factors and units; receiving medium; upstream owner; stocks; accepted output"
      collection_method: "Reconcile compatible N activity by pathway, retain source worksheets and method applicability, then attribute and normalize once. For each nitrogen pathway, record whether it is quantified locally, included once in a named compatible upstream process, demonstrably inapplicable, or unresolved. Choose the IPCC tier and applicable climate/soil/input categories before selecting factors; retain N activity, factor units, uncertainty and molecular conversions. NH3/NOx and nitrate/other leached species require justified partitioning rather than treating total precursor N as one compound. Audit actual urea and liming application CO2 separately from manufacture and N2O; document method, carbon basis and upstream ownership. Inventory other applicable land-use, soil-carbon, pesticide, phosphorus, combustion and water-regime emissions under a compatible documented method; four nitrogen cards alone do not establish complete emission coverage. Material unquantified pathways prevent dataset completeness."
      unit: "kg N; kg compound"
      frequency: "application and period close"
      temporal_coverage: "complete represented plot/season"
      site_scope: "actual plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "activity records; original factor source; precursor balance; uncertainty"
    - protocol_id: cp_species_route_evidence
      process_id: "p_cultivation_p_harvest_p_conditioning"
      flow_role: "route and parameter applicability"
      record_type: "field register and source assessment"
      raw_fields: "species; cultivar; geography; soil; water regime; purpose; operations; parameter source; compatibility; output"
      collection_method: "Separate blueberry shrub production from cranberry-bed production. Record species, substrate/soil, acidity management, irrigation and actual flooding or wet/dry harvest, where used. Do not apply blueberry nutrition or irrigation assumptions to cranberry beds, or infer that every cranberry harvest is flooded. Record species/cultivar, location, soil and tissue evidence where relevant, stand age, actual operations, yield, loss and reporting period. For each adopted agronomic parameter, retain a primary or regional source and explain product, climate, soil, technology and period compatibility. The cited regional guidance supports route questions, not universal rates. Data gaps block claims for the affected dataset; this PCR does not manufacture site measurements."
      unit: "native units with explicit conversions"
      frequency: "route/season and material change"
      temporal_coverage: "complete represented period"
      site_scope: "actual source plots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "farm records; source applicability decision; uncertainty and unresolved-data register"
  calculation_rules:
    - id: calc_normalize_saleable_mass
      applies_to: "all flow rows"
      rule: "Period quantity / saleable fruit mass at outlet."
      inputs:
        - quantity
        - "saleable mass"
      output: "per kg saleable fruit"
      source_ids:
        - iso-14040-2006
    - id: calc_establishment_allocation
      applies_to: "p_establishment"
      rule: "Establishment burden × reporting share / annual saleable output."
      inputs:
        - burden
        - years
        - output
      output: "allocated burden"
      source_ids:
        - iso-14044-2006
    - id: calc_mass_balance
      applies_to: "harvest and conditioning"
      rule: "Reconcile input, saleable output, rejects and loss within scale uncertainty."
      inputs:
        - "lot records"
      output: "reconciled totals"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_nutrient_basis
      applies_to: "fertilizer and amendments"
      rule: "Product mass × supplier-declared nutrient fraction; retain both values."
      inputs:
        - product
        - declaration
      output: "product and nutrient mass"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_managed_soil_nitrogen
      applies_to: "p_cultivation"
      rule: "Select compatible direct and indirect methods for fertilizer, organic amendments, returned residues and applicable managed-soil sources. Direct N2O-N = sum of eligible N activity times applicable EF1-family factors plus separately applicable sources; indirect N2O-N = volatilised N precursor times EF4 plus leached/runoff N precursor times EF5, where applicable. Convert N2O-N by44/28 once. Quantify NH3 and nitrate with separately justified species-specific loss fractions, not by assigning all NH3+NOx to NH3 or all leached N to nitrate. Convert NH3-N by17/14 and nitrate-N by62/14 once. Keep components, source pools, media, method uncertainty and burden owner distinct; already covered emissions are not repeated. Missing applicable data prevent completeness; do not invent an emission default."
      inputs:
        - cp_managed_soil_nitrogen
      output: "molecular emission amounts per declared reference flow"
      source_ids:
        - ipcc-managed-soils-2019
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_managed_soil_nitrogen
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Declare species/cultivar, state, grade, outlet and route; unresolved identities block review."
      evidence: "lot and supplier records"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Cover cycle and reconcile inputs, saleable output, rejects and losses."
      evidence: "protocol records"
    - id: dq_temporal
      applies_to: "all rows"
      requirement: "State reporting period, crop cycle and perennial allocation."
      evidence: "farm register"
    - id: dq_measurement
      applies_to: "quantitative rows"
      requirement: "Prefer calibrated scales/meters and retain assumptions and uncertainty."
      evidence: "calibration records"
    - id: dq_disclosure
      applies_to: "published datasets"
      requirement: "Disclose missing data, estimates, irrigation, amendments, rejects and allocation."
      evidence: "quality statement"
