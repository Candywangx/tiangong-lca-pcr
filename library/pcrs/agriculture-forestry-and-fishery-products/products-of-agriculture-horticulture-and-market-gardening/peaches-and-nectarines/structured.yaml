      rule: "Include the attributable orchard establishment, nursery-stock supply, immature years, replacement and termination contribution as well as the bearing-year crop cycle. Use the documented benefiting productive-life output basis: for each native activity pool E, year y receives E*Q_y/sum(Q_y) over the evidenced completed cohort life or site-specific actual-plus-forecast trajectory; do not pool unlike numerator units. Add directly measured bearing-year operations once, then apply Section 7 and final normalization. Missing history or a nonpositive/unknown lifetime output denominator blocks completeness, not permission to exclude establishment. Supplier-covered nursery production is linked once; no invented universal lifetime."
