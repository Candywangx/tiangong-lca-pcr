                - source_iso_14044
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separable blocks, species, cultivars, or runs"
    rule: "Avoid allocation by separately measuring peach and nectarine activities whenever records permit."
    source_ids:
      - source_iso_14044
  - rule_id: allocation_shared_crop_output
    applies_to: "jointly managed outputs"
    rule: "If subdivision is impossible, allocate by documented net marketable mass and disclose mix, basis, and sensitivity."
    source_ids:
      - source_iso_14044
  - rule_id: allocation_residue_route
    applies_to: "culls, residues, and diverted fruit"
    rule: "Treat culls and residues as waste unless a separate product hand-off is documented; do not apply an automatic avoided-burden credit."
    source_ids:
      - source_iso_14044
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_inputs
      process_id: "orchard_management"
      flow_role: "orchard inputs, land, water, residues"
      record_type: "invoices, meters, spray logs, field records"
      raw_fields: "block_id; species; cultivar; area; irrigation; electricity; fuel; fertilizer and nutrient basis; crop protection; residues ; cohort; establishment/immature/replacement/termination events with native units; annual accepted outputs including zero years; completed-life or evidenced remaining-output trajectory; supplier coverage"
      collection_method: "Collect primary records and reconcile to block and cycle; Raw aggregation and attribution: Sum by block and cycle; disclose shared-record allocation orchard_machinery_fuel_specific_input: Operation orchard_management: Fuel consumed by tractors, sprayers, mowers, or other mobile orchard machinery is recorded when consumed on site. Original quantity method: Fuel issue records or equipment logs assigned to the crop cycle Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; L; m3; kWh; MJ; m2"
      frequency: "Each application or meter period"
      temporal_coverage: "Complete crop cycle and harvest year"
      site_scope: "Each block or documented aggregation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; meters; logs; area records"
    - protocol_id: cp_harvest_records
      process_id: "harvest_field_handling"
      flow_role: "gross harvest, fuel, losses"
      record_type: "harvest tickets, weighbridge, bin and fuel logs"
      raw_fields: "block_id; harvest date; species; cultivar; gross mass; fuel; damaged fruit; destination"
      collection_method: "Weigh and reconcile to receiving and loss records; Raw aggregation and attribution: Sum by lot and retain assumptions harvest_machinery_fuel_specific_input: Operation harvest_field_handling: Fuel consumed by harvest machinery or field transport before hand-off is recorded. Original quantity method: Fuel log or issue record assigned to the harvest operation Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; L; MJ"
      frequency: "Each lot or shift"
      temporal_coverage: "Harvest window in crop cycle"
      site_scope: "Block, crew, or contractor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; fuel receipts; supervisor approval"
    - protocol_id: cp_packhouse_records
      process_id: "onsite_sort_cool_pack"
      flow_role: "conditioning, packaging, rejects, net output"
      record_type: "facility meters, run sheets, pack-out reports"
      raw_fields: "run_id; incoming mass; net mass; species; cultivar; grade; electricity; water; package mass/count; rejects"
      collection_method: "Collect facility records and reconcile mass balance; Raw aggregation and attribution: Sum by run and allocate shared services by throughput or mass primary_packaging_materials_specific_input: Operation onsite_sort_cool_pack: Record primary containers or wraps when they form part of the declared fresh-fruit market state. Original quantity method: Actual material mass or container count assigned to included product Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; kWh; m3; item"
      frequency: "Each run or operating day"
      temporal_coverage: "Declared inclusion period and harvest season"
      site_scope: "Included facility or line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters; QA records; waste receipts"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "orchard_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_net_marketable_output
      applies_to: "harvest and packing"
      rule: "Net marketable output = gross fruit − losses − rejects − declared diversions; do not subtract transferred streams twice."
      inputs:
        - "gross fruit"
        - losses
        - rejects
      output: "kg net marketable fruit"
      source_ids:
        - source_usda_ams_fresh_fruit_grades
        - source_iso_14044
    - id: calc_crop_cycle_normalization
      applies_to: "all flows"
      rule: "Crop-cycle amount / kg net marketable output for the same declared scope."
      inputs:
        - "crop-cycle amount"
        - "net output"
      output: "amount per kg reference flow"
      source_ids:
        - source_iso_14044
    - id: calc_nutrient_basis
      applies_to: "fertilizer and amendments"
      rule: "Convert actual products using label, analysis, or supplier certificate; retain product and nutrient masses."
      inputs:
        - "product mass"
        - concentration
      output: "kg product and kg N/P/K"
      source_ids:
        - source_ucanr_peach_fertilizer
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: dq_identity_and_qualifiers
      applies_to: "reference product and cycle records"
      requirement: "Declare species, cultivar, production system, geography, harvest year, maturity/quality grade, hand-off, and conditioning."
      evidence: "metadata; product description; grade records"
    - id: dq_mass_balance
      applies_to: "harvest and packing"
      requirement: "Reconcile gross fruit, marketable product, losses, rejects, and diversions; investigate differences."
      evidence: "weigh tickets; pack-out; waste receipts"
    - id: dq_temporal_and_site_coverage
      applies_to: "orchard and facility aggregation"
      requirement: "Cover the complete crop cycle and identify every contributing block or facility; disclose gaps."
      evidence: "crop calendar; block register; run list"
validation_rules:
  - rule_id: validation_reference_qualifiers
    applies_to: "reference flow and metadata"
    rule: "Reject a dataset missing required qualifiers, hand-off, or net product-mass basis."
    source_ids:
      - source_usda_ams_fresh_fruit_grades
  - rule_id: validation_crop_cycle_completeness
    applies_to: "orchard and harvest"
    rule: "Check inputs, harvest lots, marketable output, and known losses share the same time and site scope."
    source_ids:
      - source_ucanr_peach_nectarine_cultural
      - source_iso_14044
  - rule_id: validation_water_exclusivity
    applies_to: "irrigation water"
    rule: "Do not count the same volume as supplied irrigation water and direct withdrawal."
    source_ids:
      - source_iso_14044
  - rule_id: validation_product_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Require a balance from gross fruit to net marketable output, losses, and rejects."
    source_ids:
      - source_iso_14044
published_dataset_profile:
  dataset_role: "Primary foreground crop-production dataset; may be released as a secondary dataset after review"
  downstream_use: "Support process and lifecyclemodel construction for fresh peaches and nectarines at hand-off"
  allowed_use: "Compare orchard and harvest when qualifiers, boundary, geography, crop cycle, and quality are compatible"
  excluded_use: "Processed fruit, retail or consumer footprints, post-handoff transport, or a different product state"
  required_metadata: "species; cultivar; production system; geography; orchard age; area; harvest year/cycle; hand-off; grade; net mass; loss routes"
  required_quality_disclosure: "Site and period coverage; measured versus estimated inputs; yield/loss reconciliation; nutrient basis; allocations; exclusions"
  update_trigger: "New crop-cycle evidence, production or irrigation change, market-state convention change, new factor guidance, or boundary/identity inconsistency"
