allocation_rules:
  - rule_id: a_field
    applies_to: "Cultivation and harvest"
    rule: "Attribute joint field/harvest burdens to collected seed when residues remain in the field. A physically removed and marketed stalk/head output needs measured mass and a disclosed allocation basis; do not automatically give it zero burden."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: a_grade
    applies_to: "Cleaning and grading"
    rule: "Reconcile accepted, downgraded, reworked and waste mass. Directly assign metered separable work to its output run; disclose a consistent measured driver for truly shared burdens when more than one saleable output exists."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: a_rework
    applies_to: "Reject return"
    rule: "Link reject/re-cleaning loops to their original and follow-on run; charge added work once and count the material as accepted only after successful recovery."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: a_mode
    applies_to: "Field, batch and continuous runs"
    rule: "Attribute shared machinery, cleaning and changeover to logged field/lot/period by recorded time, throughput or other causal driver; no duplicate charge across sequential runs."
    source_ids:
      - ndsu-sunflower-guide-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_field
      process_id: "sunflower_cultivation"
      flow_role: "Inputs and irrigation"
      record_type: "Field, invoice, application and meter logs"
      raw_fields: "field_id, area, year, seed_kg, product_kg, nutrient_kg, water_m3, fuel_L, kWh, emission_species, emission_method, factor_source, date"
      collection_method: "Reconcile applications with invoices and meter reads; Raw aggregation and attribution: Sum by field and link to harvested lots"
      unit: "ha, kg, m3, L, kWh"
      frequency: "Each event"
      temporal_coverage: "Full crop year"
      site_scope: "Each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Receipts, meter records and calculation factors"
    - protocol_id: cp_harvest
      process_id: "sunflower_harvest"
      flow_role: "Capture and loss"
      record_type: "Combine, scale and field notes"
      raw_fields: "field_id, lot_id, date, bulk_kg, moisture_pct, foreign_matter_pct, loss, residue_fate, fuel_L"
      collection_method: "Weigh lots and measure condition; Raw aggregation and attribution: Sum distinct lots; link downstream"
      unit: "kg, %, L"
      frequency: "Each harvest lot"
      temporal_coverage: "Harvest period"
      site_scope: "Field and machine run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale ticket, moisture test, field observation"
    - protocol_id: cp_clean
      process_id: "sunflower_cleaning"
      flow_role: "Prepared seed and screen-outs"
      record_type: "Cleaner run log"
      raw_fields: "lot_id, run_id, inlet_kg, outlet_kg, reject_kg, moisture_pct, kWh, reject_fate"
      collection_method: "Weigh inlet/outlet and meter service; Raw aggregation and attribution: Reconcile mass and linked returns"
      unit: "kg, %, kWh"
      frequency: "Each run"
      temporal_coverage: "All in-boundary runs"
      site_scope: "Farm cleaner"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale and meter log"
    - protocol_id: cp_grade
      process_id: "sunflower_grading"
      flow_role: "Quality/destination states"
      record_type: "Sorting and sale records"
      raw_fields: "lot_id, run_id, class, grade, accepted_kg, downgraded_kg, reject_kg, destination, return_link"
      collection_method: "Weigh by state and destination; Raw aggregation and attribution: Balance distinct states; avoid duplicate returns"
      unit: "kg"
      frequency: "Each run"
      temporal_coverage: "All in-boundary runs"
      site_scope: "Farm sorter"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Grade sheet, sale and reject tickets"
    - protocol_id: cp_dry
      process_id: "sunflower_drying"
      flow_role: "Preservation and water loss"
      record_type: "Bin/dryer and meter log"
      raw_fields: "lot_id, run_id, method, inlet_kg, inlet_moisture, outlet_kg, outlet_moisture, reject_kg, fan_kWh, fuel_L, days"
      collection_method: "Weigh/test before and after; meter energy; Raw aggregation and attribution: Balance dry solids and sum sequential stages once"
      unit: "kg, %, kWh, L, day"
      frequency: "Each run"
      temporal_coverage: "All on-farm treatment before hand-off"
      site_scope: "Farm bin or dryer"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, moisture test and meter log"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: c_norm
      applies_to: "All inventory"
      rule: "Divide distinct field-, lot- or run-linked quantities by actual accepted seed kg at the declared hand-off."
      inputs:
        - "Raw amount"
        - "accepted kg"
        - "trace links"
      output: "Per kg reference seed"
      source_ids:
        - ndsu-sunflower-guide-2020
    - id: c_dry
      applies_to: "Drying"
      rule: "Dry solids = wet mass × (1 − wet-basis moisture fraction); compare inlet and outlet plus reject dry solids before estimating evaporated water."
      inputs:
        - "Mass and moisture on inlet"
        - "outlet and reject"
      output: "Dry-solids residual and water loss"
      source_ids:
        - ndsu-sunflower-drying-2022
    - id: c_field_emissions
      applies_to: "Field emissions"
      rule: "Create a species-specific calculated exchange only when a named species, method and factor source are verified against field records; otherwise flag the exchange as unresolved."
      inputs:
        - "Field records"
        - species
        - method
        - "factor source"
      output: "Method-specific calculated exchange or unresolved finding"
      source_ids:
        - ndsu-sunflower-guide-2020
    - id: c_sort
      applies_to: "Cleaning and grading"
      rule: "Input mass = accepted + downgraded + rejected + measured loss, allowing separately measured moisture change."
      inputs:
        - "Weigh and moisture records"
      output: "Run mass residual"
      source_ids:
        - ndsu-sunflower-guide-2020
  data_quality_requirements:
    - id: q_identity
      applies_to: "Reference output"
      requirement: "Verify whole commodity seed, market class, grade, actual in-farm hand-off and moisture; no sowing-seed output under the fixed UUID."
      evidence: "Lot and transfer records"
    - id: q_time
      applies_to: "Foreground package"
      requirement: "Capture one full crop cycle and all fields and included treatment runs; disclose gaps."
      evidence: "Dated field and machine logs"
    - id: q_mass
      applies_to: "All seed states"
      requirement: "Reconcile harvest, cleaning, grading and drying mass with moisture and rejects; flag unexplained residual."
      evidence: "Scale calibration and reconciliation sheet"
    - id: q_route
      applies_to: "Irrigation and drying"
      requirement: "Preserve actual water and drying route, metered energy, sequential run links and reject destination."
      evidence: "Meter and equipment logs"
validation_rules:
  - rule_id: v_identity
    applies_to: "Reference output"
    rule: "Reject missing class, measured moisture, grade or actual hand-off, and reject sowing seed bound to a62436d6-249c-4ac3-b5f4-653d0f277519."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: v_boundary
    applies_to: "Inventory"
    rule: "Verify cultivation, harvest and each actual on-farm cleaning, grading, drying and storage step up to hand-off; do not infer farm-gate grade from the platform label."
    source_ids:
      - ndsu-sunflower-guide-2020
      - ndsu-sunflower-drying-2022
  - rule_id: v_route
    applies_to: "Alternative routes"
    rule: "Require metered irrigation and pump records for irrigated fields and metered fan/fuel records for drying; link sequential technologies."
    source_ids:
      - ndsu-sunflower-guide-2020
      - ndsu-sunflower-drying-2022
  - rule_id: v_balance
    applies_to: "Lots and rejects"
    rule: "Reconcile accepted, downgraded, rejected, returned and lost mass with moisture; a reject becomes accepted only after a linked successful run."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: v_emissions
    applies_to: "Field elementary flows"
    rule: "Do not accept an anonymous field-emission row or unverified generic factor; require each calculated exchange to name species, method and factor source."
    source_ids:
      - ndsu-sunflower-guide-2020
  - rule_id: v_once
    applies_to: "Shared runs"
    rule: "Check field and period attribution, cleaning changeovers and returned lots to prevent double counting."
    source_ids:
      - ndsu-sunflower-guide-2020
published_dataset_profile:
  dataset_role: "Foreground whole-sunflower-seed production at an identified in-farm hand-off"
  downstream_use: "secondary_dataset or background_dataset for agricultural whole-seed inputs"
  allowed_use: "Oil crushing, confection/food or bird-food seed input when class, grade and moisture match"
  excluded_use: "Sowing-seed production, oil, kernels, meal, roasted foods or unrecorded farm-gate grade"
  required_metadata: "Farm/region, crop year, class, field/lot, variety if known, hand-off, moisture, grade, conditioning/drying scope, irrigation route"
  required_quality_disclosure: "Record coverage, scale/moisture evidence, upstream datasets, missing emission estimates, mass-balance residual and allocation choice"
  update_trigger: "Material change in market class, hand-off, water/drying technology, input mix, grade standard or region"
