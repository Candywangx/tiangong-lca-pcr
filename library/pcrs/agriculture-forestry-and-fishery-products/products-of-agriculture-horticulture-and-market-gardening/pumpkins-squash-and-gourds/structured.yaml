allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "single product crop lots"
    rule: "Keep all burdens with the represented pumpkin, squash, or gourd product when no separately marketed co-product leaves the declared boundary."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_marketed_coproduct
    applies_to: "separately marketed seeds, fruit, or other outputs"
    rule: "Identify every separately marketed co-product, quantify each output at its hand-off state, and apply the study's documented physical or economic allocation method consistently across the represented lot."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_and_reject
    applies_to: "residues, rejects, trims, and losses"
    rule: "Keep residues, rejects, trims, and losses as waste or residue flows unless a documented downstream market and co-product decision supports another treatment. Do not count the same mass as both accepted product and co-product."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_material_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "planting material and planting material loss"
      record_type: "seed invoices, transplant receipts, planting log"
      raw_fields: "product type; cultivar; supplier or source; quantity; viable-unit count; treatment; field; date; loss and fate"
      collection_method: "collect invoices and field planting logs; reconcile supplied, planted, and rejected quantities; Raw aggregation and attribution: aggregate by field, product type, and crop cycle"
      unit: "kg or viable plant"
      frequency: "each delivery and planting event"
      temporal_coverage: "declared crop cycle"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice or transfer record plus planting log"
    - protocol_id: cp_nutrient_application_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "nutrient inputs and nutrient-derived emissions"
      record_type: "input invoice, product label, application log, soil or emission record"
      raw_fields: "product; nutrient analysis; amount; field; date; application method; soil or drainage observations"
      collection_method: "collect supplier records and field logs; calculate nutrient quantities and method-based emissions; Raw aggregation and attribution: sum by nutrient, field, and crop cycle"
      unit: "kg product, kg nutrient, or kg emission"
      frequency: "each application and crop cycle"
      temporal_coverage: "declared crop cycle and method period"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "product analysis and application record"
    - protocol_id: cp_irrigation_and_water_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "irrigation water and source withdrawal"
      record_type: "meter log, delivery record, pump log, source record"
      raw_fields: "source; withdrawal; delivered volume; meter; application method; field; date; distribution loss"
      collection_method: "collect meter or delivery records and reconcile source withdrawal to delivered water; Raw aggregation and attribution: sum by source and field, retaining withdrawal and delivery separately"
      unit: "m3"
      frequency: "each irrigation event or monthly where metering supports it"
      temporal_coverage: "declared crop cycle"
      site_scope: "each water source and field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record or documented estimation basis"
    - protocol_id: cp_field_energy_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "field fuel and electricity"
      record_type: "fuel log, invoice, equipment log, electricity meter"
      raw_fields: "carrier; amount; equipment; field; operating hours; date; meter; allocation basis ; actual locally burned fuel, fuel quantity/unit, density and net calorific value, fossil/biogenic fraction, combustion-only factor and unit, supplier/service boundary, existing combustion coverage"
      collection_method: "collect direct records and allocate shared equipment by operating time, area, or measured use; Raw aggregation and attribution: aggregate by carrier and field after allocation field_fuel_input_specific_input: Fuel used by tractors, pumps, sprayers, and other mobile field equipment is recorded from fuel logs, invoices, or equipment records by field and crop cycle. Sum fuel deliveries or equipment-specific consumption allocated to the represented field and crop cycle. This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied. fao-fruit-vegetable-preparation-2004 ; Apply the combustion-only boundary in the energy-emission calculation rule; purchased power or inclusive services remain separate upstream burdens."
      unit: "L, kg, MJ, or kWh"
      frequency: "each delivery or monthly"
      temporal_coverage: "declared crop cycle"
      site_scope: "represented field or shared farm asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, or equipment record"
    - protocol_id: cp_crop_protection_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "crop protection products"
      record_type: "product inventory and application log"
      raw_fields: "formulation; active ingredient; amount; rate; treated area; field; date; weather or method note"
      collection_method: "collect product and application records for each event; Raw aggregation and attribution: sum by formulation and active ingredient crop_protection_input_specific_input: Operation field_establishment_and_cultivation: Each herbicide, insecticide, fungicide, biological control, or adjuvant product is recorded by formulation, active ingredient, application rate, and treated area where available. Original quantity method: Record each product and application event; retain formulation, active ingredient, treated area, and documented application rate. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg product or kg active ingredient"
      frequency: "each application event"
      temporal_coverage: "declared crop cycle"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "product label and application record"
    - protocol_id: cp_land_area_and_cycle_records
      process_id: "field_establishment_and_cultivation"
      flow_role: "land occupation"
      record_type: "field register and crop calendar"
      raw_fields: "field area; planting date; harvest date; crop cycle; protected or open field state"
      collection_method: "collect field boundary and calendar records; calculate area-time occupation; Raw aggregation and attribution: calculate occupied area-time before output normalization"
      unit: "ha·crop cycle"
      frequency: "each field and crop cycle"
      temporal_coverage: "declared crop cycle"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field register and crop calendar"
    - protocol_id: cp_harvest_and_yield_records
      process_id: "harvest_and_field_handling"
      flow_role: "harvested crop, reject, and residue"
      record_type: "harvest ticket, weighbridge record, grade log"
      raw_fields: "field; lot; product type; date; harvested mass; grade; reject; residue; fate"
      collection_method: "weigh or document each harvest lot and reconcile grades and fates; Raw aggregation and attribution: aggregate by product type, field, and crop cycle"
      unit: "kg"
      frequency: "each harvest lot"
      temporal_coverage: "declared harvest period"
      site_scope: "each represented field and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale record and grade or fate log"
    - protocol_id: cp_harvest_energy_records
      process_id: "harvest_and_field_handling"
      flow_role: "harvest fuel and particulate activity"
      record_type: "fuel log, equipment record, emission observation"
      raw_fields: "carrier; amount; equipment; harvest lot; operating hours; method; date"
      collection_method: "collect direct energy records and document any emission estimate method; Raw aggregation and attribution: allocate shared use by operating time or lot mass harvest_fuel_input_specific_input: Fuel for harvesting equipment and field handling is recorded when used before the farm-gate hand-off. Sum fuel use assigned to harvest lots and field handling activities before the declared hand-off. This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied. fao-fruit-vegetable-preparation-2004"
      unit: "L, kg, MJ, or kg particulate"
      frequency: "each harvest event or monthly"
      temporal_coverage: "declared harvest period"
      site_scope: "represented harvest equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel record and equipment log"
    - protocol_id: cp_residue_and_reject_fate_records
      process_id: "harvest_and_field_handling"
      flow_role: "field residue and reject fate"
      record_type: "fate log, transfer receipt, field observation"
      raw_fields: "stream; mass; moisture; fate; destination; date; field; lot"
      collection_method: "weigh or estimate each stream and retain the declared destination; Raw aggregation and attribution: aggregate by stream and fate without double counting"
      unit: "kg wet biomass"
      frequency: "each harvest lot or fate event"
      temporal_coverage: "declared harvest period"
      site_scope: "each represented field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fate record or documented field observation"
    - protocol_id: cp_conditioning_input_output_records
      process_id: "on_farm_primary_conditioning"
      flow_role: "conditioning product, reject, and accepted output"
      record_type: "batch ticket, scale record, grade log"
      raw_fields: "lot; input mass; output mass; reject mass; process date; product state; grade; destination"
      collection_method: "weigh each conditioning batch and reconcile all outputs; Raw aggregation and attribution: aggregate by lot and product type after mass reconciliation"
      unit: "kg"
      frequency: "each conditioning batch"
      temporal_coverage: "declared conditioning period"
      site_scope: "each represented conditioning line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale record and batch ticket"
    - protocol_id: cp_conditioning_water_records
      process_id: "on_farm_primary_conditioning"
      flow_role: "conditioning water and wastewater"
      record_type: "water meter, discharge log, treatment record"
      raw_fields: "water input; wastewater output; source; meter; treatment; date; batch"
      collection_method: "collect water and discharge records and reconcile input and output volumes; Raw aggregation and attribution: sum by batch and destination"
      unit: "m3"
      frequency: "each batch or metered reporting period"
      temporal_coverage: "declared conditioning period"
      site_scope: "each conditioning line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter and discharge or treatment record"
    - protocol_id: cp_conditioning_energy_records
      process_id: "on_farm_primary_conditioning"
      flow_role: "conditioning electricity and particulate activity"
      record_type: "electricity meter, equipment log, emission observation"
      raw_fields: "carrier; amount; equipment; batch; operating hours; date; allocation basis"
      collection_method: "collect direct energy records and allocate shared use by operating time or batch mass; Raw aggregation and attribution: aggregate by carrier and product lot"
      unit: "kWh, MJ, or kg particulate"
      frequency: "each batch or metered reporting period"
      temporal_coverage: "declared conditioning period"
      site_scope: "each conditioning line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter or equipment record"
    - protocol_id: cp_primary_packaging_records
      process_id: "on_farm_primary_conditioning"
      flow_role: "primary packaging and packaging waste"
      record_type: "packaging invoice, issue log, waste log"
      raw_fields: "material; format; count; mass; reuse cycles; lot; damaged mass; fate"
      collection_method: "collect material and issue records and reconcile supplied, used, and discarded packaging; Raw aggregation and attribution: aggregate by material and product lot packaging_waste_output_specific_output: Packaging losses and discarded single-use packaging leaving the conditioning activity are recorded separately from the product output. Record packaging damaged or discarded during the represented conditioning run and identify its downstream waste route. This is a mandatory specific-output collection requirement, not a selected exchange. Preserve every actual waste, residue, reject and co-product from this operation. Create separate cards for physically distinct streams with actual material, composition/state, quantity, receiving route and Product/Waste role before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. A genuinely mixed stream may remain one physically defined mixture supported by composition records; never invent separation or count its components again. Keep liquid and solid treatment quantities separate. Preserve original period, output balance, reference normalization and allocation rules; missing records do not establish zero or exclusion. iso-14044-2006"
      unit: "kg packaging or item count"
      frequency: "each delivery and conditioning batch"
      temporal_coverage: "declared conditioning period"
      site_scope: "each conditioning line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier specification and issue or waste record"
  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all inventory rows"
      rule: "Divide the reconciled process amount by accepted marketable farm-gate product mass and multiply by 1,000 kg."
      inputs:
        - "process amount"
        - "accepted product mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_nutrient_quantity
      applies_to: "nutrient inputs"
      rule: "Multiply formulated product mass by the documented nutrient fraction and retain the declared N, P or P2O5, and K or K2O basis."
      inputs:
        - "product mass"
        - "nutrient analysis"
      output: "nutrient mass"
      source_ids:
        - fao-fruit-vegetable-preparation-2004
    - id: calculate_nutrient_emissions
      applies_to: "direct N2O, NH3, nitrate, and phosphate rows"
      rule: "Apply the selected documented emission or loss method to collected nutrient inputs and site conditions; do not use an unqualified default when a site method is declared."
      inputs:
        - "nutrient input"
        - "site method inputs"
      output: "emission or loss amount"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_fossil_energy_emissions
      applies_to: "field and conditioning energy"
      rule: "Calculate only the fossil CO2 physically released by fuel combustion inside this foreground operation. For each actually burned fuel, use measured fuel mass or volume converted by documented density and net calorific value to the activity unit of its compatible combustion-only kg CO2 factor; sum fuel-specific releases, attribute once and normalize once to matched accepted final output. Preserve fossil versus biogenic carbon. Purchased electricity, purchased heat and inclusive transport or machinery-service life-cycle factors are upstream burdens, not local elementary CO2 releases. Link those supply/service datasets once; if combustion is explicitly disaggregated, exclude that same combustion from the linked dataset boundary. Do not add supply-chain CO2 or CO2-equivalent totals to this substance-mass card. Demonstrated absence of local fossil combustion makes this card inapplicable; missing records do not establish zero."
      inputs:
        - "fossil energy record"
        - factor
      output: "fossil CO2 amount"
      source_ids:
        - ipcc-2006-energy-combustion-boundary
    - id: reconcile_harvest_outputs
      applies_to: "harvest and conditioning outputs"
      rule: "Sum accepted product, rejects, residues, trims, and documented losses and compare with the corresponding input mass within the declared measurement tolerance."
      inputs:
        - "input mass"
        - "output mass components"
      output: "reconciled output and loss record"
      source_ids:
        - mass-balance-identity
    - id: calculate_land_occupation
      applies_to: "cultivated land occupation"
      rule: "Multiply represented field area by the declared crop occupation period and normalize to accepted product mass."
      inputs:
        - "field area"
        - "crop dates"
        - "accepted product mass"
      output: "area-time per 1,000 kg product"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: planting_material_input_identity_and_fate
      applies_to: "field_establishment_and_cultivation"
      rule: "For the original planting_material_input collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_planting_material_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - fao-fruit-vegetable-preparation-2004
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_nutrient_application_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: quality_product_identity
      applies_to: "all product rows"
      requirement: "Declare pumpkin, squash, or gourd type, cultivar or variety, lot, grade, maturity, and farm-gate state; do not merge unlike product states before reconciliation."
      evidence: "product specification and lot records"
    - id: quality_mass_reconciliation
      applies_to: "harvest and conditioning"
      requirement: "Reconcile field harvest, accepted output, reject, residue, trim, wastewater, packaging, and documented losses at each process hand-off."
      evidence: "weighbridge, scale, batch, and fate records"
    - id: quality_input_completeness
      applies_to: "field and conditioning inputs"
      requirement: "Provide direct records, a justified zero, or a documented exclusion for planting material, nutrients, crop protection, water, land, energy, and packaging."
      evidence: "field register, invoices, meters, logs, and exclusion note"
    - id: quality_temporal_geographic_scope
      applies_to: "all rows"
      requirement: "Identify field, site, production geography, crop cycle, harvest period, and any storage or conditioning period represented by each record."
      evidence: "field and crop calendar plus batch records"
    - id: quality_method_and_factor_disclosure
      applies_to: "calculated emissions and conversions"
      requirement: "Record the method, factor basis, nutrient basis, moisture basis, and any allocation or shared-meter calculation used to derive values."
      evidence: "calculation worksheet and cited method source"
    - id: quality_uncertainty_and_estimate_label
      applies_to: "estimated or modelled rows"
      requirement: "Mark estimates, assumptions, and ranges as provisional and replace them with measured or reviewed records when available."
      evidence: "data-quality note and supporting record status"
validation_rules:
  - rule_id: validation_product_identity
    applies_to: "reference product and all product rows"
    rule: "Confirm product type, cultivar or variety, crop cycle, geography, maturity, grade, moisture, and farm-gate state are declared and consistent across linked records."
    source_ids:
      - usda-ams-pumpkins-standard
  - rule_id: validation_mass_balance
    applies_to: "field harvest and primary conditioning"
    rule: "Confirm each process hand-off reconciles input mass to accepted product, rejects, residues, trims, wastewater where applicable, packaging, and documented losses without double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_reference_normalization
    applies_to: "all normalized amounts"
    rule: "Confirm every normalized amount uses accepted marketable farm-gate product as the denominator and is expressed per 1,000 kg reference product."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_boundary_disclosure
    applies_to: "dataset metadata and process notes"
    rule: "Confirm the starting condition, included operations, farm-gate hand-off, prior land use, storage or conditioning, residue fates, and exclusions are disclosed."
    source_ids:
      - fao-fruit-vegetable-preparation-2004
      - iso-14044-2006
  - rule_id: validation_calculated_emissions
    applies_to: "nutrient and energy emissions"
    rule: "Confirm each calculated emission identifies its activity input, method or factor source, unit basis, and calculation record; do not silently substitute a different basis."
    source_ids:
      - ipcc-2019-managed-soils-n2o
      - ipcc-2006-volume-4-crops
  - rule_id: validation_parameterized_identity_resolution
    applies_to: "all parameterized rows and reference flow"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_local_combustion_boundary
    applies_to: "energy and fossil CO2"
    rule: "Verify every local CO2 amount against actual in-boundary fuel combustion and compatible combustion-only factors; reconcile upstream electricity, heat, fuel-supply and inclusive-service coverage so the same release is counted once."
    source_ids:
      - ipcc-2006-energy-combustion-boundary
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Foreground crop inventory construction and downstream process or lifecyclemodel projections for fresh pumpkins, squash, and gourds"
  allowed_use: "Farm-gate datasets that preserve product identity, crop-cycle scope, measured or calculated inputs, direct emissions, output reconciliation, and declared conditioning or packaging state"
  excluded_use: "Processed food products; seed or nursery datasets; distribution, retail, cooking, or end-of-life studies; datasets with evidence gap product state or missing output reconciliation"
  required_metadata: "canonical PCR id; CPC reference; product type and cultivar; field and production geography; crop cycle and harvest period; cultivation system; planting material; irrigation source and method; nutrient and crop-protection records; energy; yield; reject and residue fates; conditioning; packaging; farm-gate state"
  required_quality_disclosure: "Data source and measurement method; temporal and geographic representativeness; estimated or missing values; nutrient, moisture, and emission-factor basis; allocation decision; parameterized-flow UUID resolution status; uncertainty and range treatment"
  update_trigger: "Change in product boundary, crop route, classification scope, concrete flow identity verification"
