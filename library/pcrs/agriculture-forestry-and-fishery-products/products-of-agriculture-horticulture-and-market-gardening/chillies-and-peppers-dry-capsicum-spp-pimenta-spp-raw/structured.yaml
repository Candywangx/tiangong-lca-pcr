system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The managed production node records the crop or fruiting-tree object, geography, planted area or orchard area, seedling or tree stock, irrigation, nutrient and pest-management inputs, field energy, land use and relevant direct emissions. Capsicum and Pimenta routes may have different planting periods, perennial infrastructure and establishment attribution; collect each route rather than applying one crop factor. Harvest is a distinct node because it creates a measured fresh-fruit hand-off with collection loss. Drying stabilizes this moist, perishable input to a measured whole dry state; first cleaning and grading hand off accepted, downgraded, rejected and waste streams separately. | codex-cxs-353-2022; codex-cxs-358-2024; ipcc-2019-managed-soils"
      source_ids: []
    - rule_id: boundary_raw_dried
      applies_to: "reference product"
      rule: "Include drying and first cleaning needed for whole raw dried fruit; exclude crushing, milling, extraction, blending and later treatment."
      source_ids:
        - un-cpc-3-exp-2025
        - codex-cxs-353-2022
        - codex-cxs-358-2024
    - rule_id: boundary_route_identity
      applies_to: "production"
      rule: "Keep Capsicum annual/seasonal and Pimenta perennial inventories separate; declare whether cultivation is collected or supplied as an upstream fruit dataset."
      source_ids:
        - codex-cxs-353-2022
        - codex-cxs-358-2024
    - rule_id: boundary_drying_delta
      applies_to: "drying"
      rule: "Declare natural/solar and mechanical steps, their batch or continuous mode, energy and service inputs, moisture change and weather exposure; include all steps before the gate."
      source_ids:
        - unece-ddp-24-2013
        - mass-balance-identity
    - rule_id: boundary_output_states
      applies_to: "harvest, drying, sorting"
      rule: "Separate accepted dry fruit, downgraded fruit, rejected fruit, stems/foreign material, other recoverable residues, evaporated water and unexplained loss by fate."
      source_ids:
        - mass-balance-identity
