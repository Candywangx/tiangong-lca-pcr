dataset_production:
  collection_protocols:
    - protocol_id: cp_perennial_vine_records
      process_id: "perennial_vine_management"
      flow_role: "propagation, vine phases, support, pollination, standing crop"
      record_type: "field register"
      raw_fields: "species; source; mass; vine count/age; establishment/replacement; support/shade; pollination; dates; harvest-ready mass"
      collection_method: "Reconcile plot, propagation and observation records by route and period; Raw aggregation and attribution: stratify before attribution and aggregation"
      unit: "kg; count; date"
      frequency: "each event and season"
      temporal_coverage: "all burden-bearing years"
      site_scope: "farm and plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dated records, invoices, species record and sign-off"
    - protocol_id: cp_management_inputs
      process_id: "perennial_vine_management"
      flow_role: "nutrients, irrigation, energy"
      record_type: "invoice, log, meter"
      raw_fields: "product; composition; mass; water source/volume; pump hours/rate; carrier/quantity; node; date"
      collection_method: "record each event and calculate only with verified factors; Raw aggregation and attribution: sum by actual product/carrier before normalization"
      unit: "kg; m3; kWh; L; MJ"
      frequency: "each application or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "farm, plot and equipment route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, calibration, log and factor record"
    - protocol_id: cp_residue_and_emission_records
      process_id: "perennial_vine_management"
      flow_role: "residues and emissions"
      record_type: "weighing log and calculation sheet"
      raw_fields: "material; mass; destination; substance; basis; compartment; activity; factor; method"
      collection_method: "weigh exported residues and calculate identified emissions only; Raw aggregation and attribution: reconcile destinations; aggregate after resolution cultivation_residues_specific_output: Mandatory material, quantity and boundary-role identification, not a selected exchange. Preserved collection scope: Identity and quantity rule: Measure residues by retained, recovered, treated or discarded destination; in-situ material is not also exported as waste. Raw activity or stage basis: per 1 kg accepted green uncured pods. Retain every actual material and fate, including materials not represented by the conditional card. Record actual composition/state, native property/unit, measured quantity, cohort/period, recipient, treatment responsibility and unique handover; keep original throughput, normalization and allocation duties. Before completeness, instantiate only actual distinct physical exchanges with compatible UUIDs or exact unresolved identities. A real mixed stream remains one measured composition-defined identity; do not invent segregation or duplicate mixture/component exports. Retained/deferred stock, in-situ residues and soil returned directly to the environment keep their actual balance/stock/return roles, not assumed technosphere waste exports; establish method and boundary responsibility before any elementary exchange. Independently sold recovery needs its actual Product handover and must not also be this waste. Missing records are not zero and the retired class-level numerical screen is not a component limit."
      unit: "kg"
      frequency: "each removal and calculation period"
      temporal_coverage: "complete reporting period"
      site_scope: "plot and destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, receipt, method citation and review"
    - protocol_id: cp_selective_harvest_rounds
      process_id: "selective_pod_harvest"
      flow_role: "harvest, rejects, losses, energy"
      record_type: "lot sheet"
      raw_fields: "round/date; plot; species; maturity; masses; retained status; carrier; labour mode"
      collection_method: "weigh each round and link equipment records; Raw aggregation and attribution: sum linked rounds and keep rejects separate"
      unit: "kg; MJ; date"
      frequency: "every round"
      temporal_coverage: "all contributing rounds"
      site_scope: "plot, round and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, signed lot sheet and energy log"
    - protocol_id: cp_primary_conditioning
      process_id: "on_farm_primary_conditioning"
      flow_role: "input, handled pods, removed matter"
      record_type: "handling sheet"
      raw_fields: "lot; input/output mass; holding time; operations; rejects/destination; no-curing declaration"
      collection_method: "weigh before/after and document no curing or deliberate drying; Raw aggregation and attribution: reconcile input, output, rejects and loss"
      unit: "kg; hour"
      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "handling area and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, time log, checklist and photos/equivalent"
    - protocol_id: cp_green_pod_grading
      process_id: "green_pod_grading_handoff"
      flow_role: "accepted grade, off-grade, rework, hand-off"
      record_type: "grading/dispatch record"
      raw_fields: "lot; species; maturity; grade; input; accepted; off-grade; rework; destination; date; uncured state"
      collection_method: "weigh each state and link accepted lots to pre-curing dispatch; Raw aggregation and attribution: reconcile all states and remove rework duplication"
      unit: "kg; date"
      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "grading site and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, grade specification, dispatch and no-curing declaration"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "perennial_vine_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed amount / accepted reference mass"
      inputs:
        - "attributed amount"
        - "accepted mass"
      output: "amount per kg reference product"
      source_ids:
        - reference-normalization-definition
    - id: calc_period_attribution
      applies_to: "establishment, replacement, shared infrastructure"
      rule: "attributed burden = recorded burden × documented service share"
      inputs:
        - burden
        - nodes
        - period
        - "share basis"
      output: "period-attributed burden"
      source_ids: []
    - id: calc_harvest_round_sum
      applies_to: "repeated selective harvest"
      rule: "period mass = sum of linked round masses; rejects and retained pods separate"
      inputs:
        - round
        - harvested
        - reject
        - "retained status"
      output: "period harvested/rejected mass"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "handling and grading"
      rule: "difference = input - accepted - rejects - retained/transferred outputs"
      inputs:
        - "input and all state masses"
      output: "difference and completeness flag"
      source_ids:
        - reference-normalization-definition
    - id: propagation_material_identity_and_fate
      applies_to: "perennial_vine_management"
      rule: "For the original propagation_material collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_perennial_vine_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_residue_and_emission_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_state
      applies_to: "reference product and lots"
      requirement: "Species, maturity, grade, uncured/undried state, moisture basis and farm-gate hand-off are complete."
      evidence: "species, grade, lot, no-curing and dispatch records"
    - id: dq_temporal_completeness
      applies_to: "perennial route and harvest"
      requirement: "Cover all burden-bearing phases and contributing rounds and disclose exclusions."
      evidence: "plot history, phase, round and replacement records"
    - id: dq_route_separation
      applies_to: "alternative routes"
      requirement: "Preserve route differences until weighting is reproducible."
      evidence: "route-coded records and aggregation sheet"
    - id: dq_mass_balance
      applies_to: "harvest, handling, grading"
      requirement: "Reconcile each round/lot and investigate differences beyond site tolerance."
      evidence: "signed balance and calibration record"
    - id: dq_flow_resolution
      applies_to: "concrete flow identity evidence"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "exchange-resolution and detail evidence"
