allocation_rules:
  - rule_id: allocation_perennial_periods
    applies_to: "establishment, replacement and productive years"
    rule: "Attribute once across the declared productive period using accepted green-pod mass from that period; retain phase/year links and disclose unproductive years."
    source_ids: []
  - rule_id: allocation_repeated_harvest
    applies_to: "selective harvest rounds"
    rule: "Assign round-specific inputs, energy, rejects and output directly; allocate truly shared burdens by harvested mass across relevant rounds without period-level duplication."
    source_ids: []
  - rule_id: allocation_shared_infrastructure
    applies_to: "supports, shade, irrigation, tools and other shared assets"
    rule: "Enumerate consuming nodes and service periods, choose one documented use-time, area or productive-output basis and prevent duplication."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "residues and rejected or off-grade pods"
    rule: "Discard receives no avoided-burden credit; a recovered product leaving the boundary is separate and requires disclosed allocation or substitution and sensitivity."
