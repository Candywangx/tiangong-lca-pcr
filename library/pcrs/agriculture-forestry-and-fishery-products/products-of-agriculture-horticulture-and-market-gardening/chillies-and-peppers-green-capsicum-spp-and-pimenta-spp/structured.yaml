allocation_rules:
  - rule_id: allocation_single_crop_cycle
    applies_to: "inputs and emissions shared by fields or protected units"
    rule: "Allocate shared inputs and emissions to the represented crop cycle using measured area, operating time, or mass output; document the selected driver and do not allocate by unrecorded assumptions."
    source_ids:
      - fao-56-crop-evapotranspiration-1998
  - rule_id: allocation_marketable_and_reject_outputs
    applies_to: "harvest, grading, and gate preparation"
    rule: "Keep marketable green fruit, unmarketable fruit, trimming, and residue as separate outputs. Apply the declared allocation or treatment rule only when a reject has a documented productive use; otherwise retain it as waste or residue."
    source_ids:
      - codex-fresh-fruits-vegetables-2003
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting_material_input"
      record_type: "seed or transplant lot and planting record"
      raw_fields: "material type, cultivar, supplier, lot, viable quantity, planted area, planting date"
      collection_method: "collect supplier documents and field planting logs; Raw aggregation and attribution: sum planted quantity by crop cycle and area"
      unit: "seed, plant, or kg"
      frequency: "each establishment event"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lot document and field-log reconciliation"
    - protocol_id: cp_nutrient_records
      process_id: "crop_establishment_crop_management"
