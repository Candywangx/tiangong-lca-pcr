      collection_method: "collect invoices, application logs, labels, nutrient plans, and soil-test records; Raw aggregation and attribution: convert product to nutrient basis and sum by crop cycle"
      unit: "kg product, kg N, kg P2O5, or kg K2O"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label or supplier specification and application-log check"
    - protocol_id: cp_field_area_records
      process_id: "crop_establishment_crop_management"
