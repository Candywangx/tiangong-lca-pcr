      collection_method: "survey or farm record review; Raw aggregation and attribution: calculate area-time and normalize to output"
      unit: "ha and dates"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "area map and date record"
    - protocol_id: cp_irrigation_records
      process_id: "crop_management"
