      record_type: "water delivery record"
      raw_fields: "source, meter, delivery volume, date, irrigation method, field, losses"
      collection_method: "collect meter, pump, delivery, or water-balance records; Raw aggregation and attribution: sum delivered water and reconcile source records"
      unit: "m3"
      frequency: "each irrigation event or monthly total"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter reading or documented water balance"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop_protection_input"
      record_type: "spray or treatment record"
      raw_fields: "product, formulation, active ingredient, amount, area, date, method, target"
      collection_method: "collect regulated application logs and product labels; Raw aggregation and attribution: sum by product and active ingredient crop_protection_input_specific_input: Operation crop_management: Record each pesticide, biological control product, adjuvant, or other crop-protection input applied to the represented field or protected unit. Original quantity method: Record product name, formulation, active ingredient, application date, applied area, and product amount from the spray or treatment record. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg or L product"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "application record and label check"
    - protocol_id: cp_energy_records
      process_id: "crop_management"
      flow_role: "management_fuel_input and management_electricity_input"
      record_type: "meter, invoice, fuel issue, or equipment-hour record"
      raw_fields: "fuel or electricity, equipment, date, operating hours, field or line, allocation driver"
      collection_method: "collect meters, invoices, fuel logs, and operating records; Raw aggregation and attribution: allocate shared services by documented driver management_fuel_input_specific_input: Operation crop_management: Record diesel or other fuel used by tractors, sprayers, cultivation equipment, and field support vehicles assigned to the represented crop cycle. Original quantity method: Sum fuel issue, invoice, or equipment-hour records and allocate shared machinery to the represented crop cycle. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kWh, L, or MJ"
      frequency: "each event or monthly total"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, protected unit, or pack-house line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter, invoice, or operating-log reconciliation"
    - protocol_id: cp_emission_calculation_records
