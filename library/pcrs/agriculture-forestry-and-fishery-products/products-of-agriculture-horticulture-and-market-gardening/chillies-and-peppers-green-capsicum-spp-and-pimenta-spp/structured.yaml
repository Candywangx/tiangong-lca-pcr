system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and crop management"
      rule: "Include field or protected-unit preparation, establishment, crop management, crop-cycle inputs, and harvest preparation that produce the declared fresh green fruit; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-56-crop-evapotranspiration-1998
        - usda-nrcs-nutrient-management-590
    - rule_id: boundary_gate_conditioning
      applies_to: "harvest and primary conditioning"
      rule: "End the foreground system at the declared farm-gate or pack-house gate and include cutting, grading, trimming, washing, cooling, and primary packing when they occur before that gate."
      source_ids:
        - codex-fresh-fruits-vegetables-2003
        - fao-good-hygiene-fresh-produce-2003
    - rule_id: boundary_soil_nitrogen
      applies_to: "nutrient inputs, crop residues, and managed soil"
      rule: "Estimate applicable direct and indirect nitrogen emissions using one declared method and recorded nutrient inputs and residue fate; avoid double counting a nitrogen pathway."
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - rule_id: boundary_residue_fate
      applies_to: "field residue, rejects, and trim"
      rule: "Record field return, composting, feed use, treatment, or disposal separately; material without a demonstrated productive use remains a residue or waste flow."
      source_ids:
        - codex-fresh-fruits-vegetables-2003
        - fao-good-hygiene-fresh-produce-2003
