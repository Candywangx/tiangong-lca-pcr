      collection_method: "collect supplier, issue, and return records; Raw aggregation and attribution: allocate reusable packaging by documented service trips primary_container_packaging_specific_input: Operation harvest_and_gate_preparation: Record reusable or single-use primary containers that cross the boundary before the declared farm-gate or pack-house gate. Original quantity method: Record packaging material mass by type, reuse count, supplier, and loss or return route. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. handling_packaging_specific_input: Operation harvest_and_gate_preparation: Record crates, pallets, and handling packaging used before the declared gate, including whether each item is reusable and how reuse is allocated. Original quantity method: Allocate the packaging burden by documented trips, service life, return rate, and the marketable fruit carried. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
