          role: "Drying water loss"
          name: "Water vapour emitted to air during cocoa drying (UUID unresolved)"
          flow_type: "elementary"
          property_unit: "Mass / kg water"
          description: "Calculate water removed from wet beans; it is not dried-bean product. Raw activity or stage basis: per 1 kg wet cocoa beans at farm-gate reference. This is an elementary output to air, not a waste sent to treatment. Account for rejected bean solids separately; do not include solids or drainage in the evaporated-water mass. No universal numeric bound is established by the cited balance identity or method. Derive a lot/site-specific check from measured inputs, outputs, moisture, growth where applicable, stocks, losses and uncertainty on compatible bases. Report numeric screening unavailable until supported; retain the measured exchange and investigate residuals without clipping or substituting a default."
          amount:
            expression: "Determine supported evaporation on a closed water-mass control volume: incoming material water + actual added water + opening water stock - water in all accepted/co-product/reject/residue exits - separate liquid discharge/exports - closing water stock. Use measured wet mass times wet-basis moisture for each material stream, and compatible density for liquid volumes. Internal recirculation cancels. Retain actual rain/rewetting where relevant; total fresh/dry mass difference is not all water. Independently support all terms and the evaporation pathway; investigate an unexplained or negative balance rather than force it into a vapour release or clip it to zero. Keep water quantities distinct from dry-solids loss and other volatiles. Attribute and normalize the evidenced water release once using the original matched final reference."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per declared reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_cocoa_drying_batch_records
              source_ids:
