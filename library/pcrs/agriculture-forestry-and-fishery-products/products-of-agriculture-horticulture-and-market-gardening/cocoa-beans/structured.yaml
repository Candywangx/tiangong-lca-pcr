allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Sequential wet, fermented, dried and graded bean states are not co-products and receive no allocation between states. First subdivide by pod lot, fermentation batch, drying batch and grading lot. Record every intended output hand-off before applying allocation."
    source_ids: []
  - rule_id: allocation_01
    applies_to: "sequential cocoa states"
    rule: "Do not allocate burdens between wet, fermented wet, dried and graded beans; link them by mass and moisture balances."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_02
    applies_to: "pod breaking and fermentation"
    rule: "Treat pod husk, placenta, pulp and sweatings as residues by default. An intended co-product requires a named destination, quantity, quality specification and hand-off."
    source_ids:
      - icco-cocoa-harvesting-post-harvest
      - fao-cocoa-ota-code
  - rule_id: allocation_03
    applies_to: "intended co-products"
    rule: "Prefer subdivision. If intended outputs remain, use measured mass allocation for comparable material outputs; use an economic sensitivity when functions differ materially and retain price period and denominator."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "rejects and downgrade"
    rule: "Do not allocate rejected beans to accepted cocoa output. A downgraded saleable lot requires its own intended-output hand-off; recovered material retains producing-node burden unless a documented recovery boundary exists."
    source_ids:
      - icco-cocoa-quality-requirements
      - fao-cocoa-ota-code
  - rule_id: allocation_05
    applies_to: "batches and perennial phases"
    rule: "Attach shared equipment, cleaning, changeover, drying platforms and plantation phase burdens to the generating run, crop year or phase exactly once."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_cocoa_perennial_phase_records
      process_id: "cocoa_managed_production"
      flow_role: "planting material, land occupation, perennial phases"
      record_type: "block register and planting/removal record"
      raw_fields: "block_id; area; cultivar; phase; tree_count; establishment_date; replacement_date; termination_date; crop_year"
      collection_method: "reconcile phase events and area to each represented cocoa block; Raw aggregation and attribution: annualize establishment, replacement and termination by block and represented year"
      unit: "ha; tree; date; kg reference output"
      frequency: "annual and event-based"
      temporal_coverage: "represented perennial phases and crop years"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "block register; land record; phase review"
    - protocol_id: cp_cocoa_nutrient_records
      process_id: "cocoa_managed_production"
      flow_role: "nutrient and soil-amendment inputs"
      record_type: "invoice, field log and nutrient statement"
      raw_fields: "product; nutrient_content; quantity; date; block_id; purpose; supplier; reporting_basis"
      collection_method: "reconcile product quantities and nutrient content to each field event; Raw aggregation and attribution: aggregate by product, nutrient, block and crop year without merging reporting bases"
      unit: "kg product; kg nutrient; ha"
      frequency: "each application event"
      temporal_coverage: "complete represented crop year"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; product labels; nutrient statements; field logs"
    - protocol_id: cp_cocoa_crop_protection_records
      process_id: "cocoa_managed_production"
      flow_role: "crop-protection products"
      record_type: "product record and application log"
      raw_fields: "product; active_substance; rate; quantity; date; block_id; target; method; operator"
      collection_method: "reconcile product identity, active substance and dose to each application; Raw aggregation and attribution: aggregate by product, active substance, block and crop year"
      unit: "kg or L product; kg active substance; ha"
      frequency: "each application"
      temporal_coverage: "complete represented crop year"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "product label; application log; operator record"
    - protocol_id: cp_cocoa_water_records
      process_id: "cocoa_managed_production"
      flow_role: "irrigation, process water, recirculation and wastewater"
      record_type: "meter record, water invoice or documented estimate"
      raw_fields: "source; delivered_volume; withdrawal; meter_id; block_id; date; recirculation; discharge; quality"
      collection_method: "separate irrigation and post-harvest water and reconcile withdrawals to discharge; Raw aggregation and attribution: aggregate by use, source, block or process and route; do not merge wastewater with supply"
      unit: "m3 water; kg pollutant where measured"
      frequency: "each event or meter period"
      temporal_coverage: "complete represented crop year and post-harvest route"
      site_scope: "included farm and post-harvest equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meter; invoice; water log; discharge record"
    - protocol_id: cp_cocoa_energy_records
      process_id: "cocoa_managed_production_and_post_harvest_route_processes"
      flow_role: "field, pod-opening, drying, grading and storage energy or service"
      record_type: "meter, invoice, fuel ticket or service log"
      raw_fields: "carrier; quantity; equipment; operation; run_id; batch_id; original_unit; service_scope"
      collection_method: "reconcile carrier use or service quantity to the generating run or batch; Raw aggregation and attribution: aggregate by process and batch; allocate shared services once by documented driver"
      unit: "kWh; MJ; L fuel; service unit"
      frequency: "each run, batch or meter period"
      temporal_coverage: "complete represented crop year and included extension"
      site_scope: "all included field and post-harvest equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration; invoice; fuel ticket; service log"
    - protocol_id: cp_cocoa_emission_records
      process_id: "cocoa_managed_production_and_post_harvest_route_processes"
      flow_role: "managed-soil, residue, fermentation and combustion emissions"
      record_type: "emission-model record or measurement record"
      raw_fields: "activity; substance; method; factor_set; factor_version; medium; quantity; uncertainty"
      collection_method: "calculate or measure each pathway with one declared applicable method; Raw aggregation and attribution: keep pathways separate and retain factor, activity basis and uncertainty"
      unit: "kg substance; kg CO2e; ha; kg activity"
      frequency: "each event and calculation period"
      temporal_coverage: "complete represented crop year and included extension"
      site_scope: "all included field and post-harvest emission sources"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method citation; factor file; measurement report; model version"
    - protocol_id: cp_cocoa_harvest_lot_records
      process_id: "cocoa_pod_harvest"
      flow_role: "mature pod harvest, field loss and hand-off"
      record_type: "harvest lot ticket and field record"
      raw_fields: "block_id; crop_year; maturity; pod_mass; harvest_date; field_loss; receiver; lot_id"
      collection_method: "reconcile harvested pods, field losses and receiver hand-off for each lot; Raw aggregation and attribution: sum harvested pods, field losses and hand-offs by block, crop year and lot"
      unit: "kg pods; kg loss; date; lot"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest season"
      site_scope: "all included cocoa blocks and receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lot ticket; field log; scale record; receiver evidence"
    - protocol_id: cp_cocoa_pod_extraction_records
      process_id: "cocoa_pod_breaking_extraction"
      flow_role: "pod input, wet beans, husk, placenta and rejects"
      record_type: "pod-opening run sheet and scale record"
      raw_fields: "run_id; pod_input; wet_bean_output; husk; placenta; reject_mass; equipment; operator; date"
      collection_method: "close the pod-input mass balance and record every destination per opening run; Raw aggregation and attribution: reconcile pod input to wet beans, husk, placenta, rejects and unexplained difference"
      unit: "kg as received; kg wet beans; date; run"
      frequency: "each pod-opening run"
      temporal_coverage: "all included pod-breaking operations"
      site_scope: "included farm or post-harvest facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale; run sheet; destination ticket; mass-balance review"
    - protocol_id: cp_cocoa_fermentation_batch_records
      process_id: "cocoa_fermentation"
      flow_role: "wet-bean input, fermentation operation, drainage and fermented output"
      record_type: "fermentation batch log"
      raw_fields: "batch_id; input_mass; method; container; start_date; end_date; turns; temperature; drainage; output_mass; reject_mass"
      collection_method: "link wet-bean input, batch conditions, drainage, fermented output and rejects; Raw aggregation and attribution: aggregate by batch and link each output to its input lot without double counting"
      unit: "kg wet beans; kg drainage; °C; days; date"
      frequency: "each fermentation batch and turn"
      temporal_coverage: "complete included fermentation route"
      site_scope: "all included fermentation containers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch log; temperature record; turning record; drainage ticket; quality check"
    - protocol_id: cp_cocoa_drying_batch_records
      process_id: "cocoa_drying_stabilization"
      flow_role: "fermented wet input, drying energy, dried output and water loss"
      record_type: "drying log and moisture sample record"
      raw_fields: "batch_id; wet_input; method; platform_or_dryer; weather_or_fuel; start_time; end_time; temperature; moisture; output_mass; reject_mass ; all inlet/outlet material water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; wet-basis moisture/density; supported evaporation and uncertainty"
      collection_method: "reconcile wet input, dry output and loss using documented moisture samples; Raw aggregation and attribution: calculate wet-to-dry balance per batch and preserve measured moisture basis"
      unit: "kg wet input; kg dry beans; percent moisture; °C; days; MJ"
      frequency: "each drying batch and moisture sample"
      temporal_coverage: "complete included drying route"
      site_scope: "all included drying platforms and dryers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "drying log; moisture test; fuel or weather record; smoke-control record"
    - protocol_id: cp_cocoa_grade_lot_records
      process_id: "cocoa_cleaning_grading"
      flow_role: "dried input, accepted grades, downgraded product, shell, dust and rejects"
      record_type: "inspection, grading and scale record"
      raw_fields: "lot_id; input_mass; grade; moisture; defects; accepted_mass; downgrade_mass; shell_mass; dust_mass; reject_mass; destination"
      collection_method: "enumerate every grade and material destination and reconcile the lot mass balance; Raw aggregation and attribution: sum accepted grades, intended downgrade, residues and rejects separately by lot"
      unit: "kg; percent moisture; grade code; date"
      frequency: "each grading lot"
      temporal_coverage: "complete included cleaning and grading route"
      site_scope: "all included grading equipment and lots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "inspection sheet; calibrated scale; moisture and defect record; destination evidence"
    - protocol_id: cp_cocoa_quality_records
      process_id: "cocoa_fermentation_and_cocoa_cleaning_grading"
      flow_role: "moisture, fermentation, mould, insects, foreign matter and grade decision"
      record_type: "laboratory or documented lot inspection record"
      raw_fields: "sample_id; lot_id; moisture; fermentation_index; mould; insects; foreign_matter; defect_class; grade_decision; method; coverage"
      collection_method: "retain sampling plan, analytical method, result and decision for each lot; Raw aggregation and attribution: link quality decisions to lot and route state; do not convert rejected material to accepted output"
      unit: "percent; score; kg sample; date"
      frequency: "each lot and quality decision"
      temporal_coverage: "complete included fermentation, drying and grading route"
      site_scope: "all lots used for declared outputs"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lab report; sampling plan; method version; inspector sign-off"
    - protocol_id: cp_cocoa_storage_records
      process_id: "cocoa_storage_gate"
      flow_role: "accepted dried beans, packaging, storage service, output and loss"
      record_type: "warehouse record and storage-period balance"
      raw_fields: "lot_id; opening_mass; packaging; warehouse; start_date; end_date; conditions; receipts; outputs; losses; closing_mass ; opening and closing stock; receipts; dispatch; other external transfers; measured rejects; independently evidenced losses; paired rework; moisture/component basis; unexplained balance"
      collection_method: "Measure each actual stream and reconcile opening stock + receipts = accepted dispatch + other external transfers + rejected removals + independently evidenced physical losses + closing stock on matching moisture/component bases. Pair rework/returns and keep retained material in stocks. Unexplained residual is an evidence gap, not an automatic waste or release. Preserve attribution and normalize once to matched accepted final output."
      unit: "kg dried beans; kg loss; storage days; packaging unit"
      frequency: "each storage period and lot"
      temporal_coverage: "complete pre-gate storage period"
      site_scope: "all included warehouses and lots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "warehouse log; scale record; condition log; packaging record"
    - protocol_id: cp_cocoa_residue_destination_records
      process_id: "route_wide_cocoa_processes"
      flow_role: "shell, pulp, sweatings, dust, rejects and other residues"
      record_type: "destination ticket, recovery record or treatment/disposal record"
      raw_fields: "residue_type; quantity; destination; receiver; intended_function; treatment; disposal; date; lot_id"
      collection_method: "document whether each material is a named co-product, recovery, retained residue or waste and record hand-off; Raw aggregation and attribution: classify and aggregate each destination separately; keep undocumented destinations as unresolved"
      unit: "kg material; destination code; date"
      frequency: "each residue event"
      temporal_coverage: "complete included route and storage period"
      site_scope: "all included field, processing and storage sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "destination ticket; receiver evidence; treatment record; waste manifest"
  calculation_rules:
    - id: calc_01
      applies_to: "cocoa_stand_management"
      rule: "Annualize establishment, replacement and termination only across represented years and allocate to same-block wet reference output."
      inputs:
        - "perennial phase"
        - area
        - "crop years and reference output"
      output: "annualized phase burdens linked to same-block wet output"
      source_ids: []
    - id: calc_02
      applies_to: "route-wide processes"
      rule: "Reconcile each node independently and retain moisture basis for every conversion. Do not use generic cocoa yield when lot data exist."
      inputs:
        - pod
        - wet
        - fermented
        - "dried and graded masses"
      output: "reconciled node mass balances with moisture basis"
      source_ids: []
    - id: calc_03
      applies_to: "route-wide processes"
      rule: "Base result: sum burdens only through wet-bean hand-off and divide by net accepted wet-bean mass. Extended result: add only linked downstream burdens and divide the combined attributable total by the matched final extended-state output. Retain both denominators and the measured lot conversion; an extended inventory per kg wet input is labelled an extension intensity, never the base farm-gate inventory."
      inputs:
        - "process totals and reference output"
      output: "inventory per 1 kg wet reference and separate extended-route dry-output result"
      source_ids: []
    - id: calc_04
      applies_to: "cocoa_stand_management and included processing"
      rule: "Apply one declared geographically and temporally appropriate method per pathway; retain factor, unit, activity basis and uncertainty."
      inputs:
        - nutrient
        - residue
        - "fuel and water records"
      output: "pathway-specific method results with factors and uncertainty"
      source_ids: []
    - id: calc_05
      applies_to: "route-wide intended outputs"
      rule: "Subdivide first, then allocate shared burdens once by the declared mass or economic method; residue and waste treatment remain separate unless product hand-off exists."
      inputs:
        - "intended outputs and allocation denominator"
      output: "shared burdens attributed once with declared allocation denominator"
      source_ids: []
    - id: calc_06
      applies_to: "cocoa_storage_gate"
      rule: "Measure the actual damaged/rejected/lost stream by lot and destination, with mutually exclusive material quantities. Reconcile opening stock + receipts = accepted dispatch + other external transfers + rejected removals + independently evidenced physical loss + closing stock on matched moisture/component bases. Rework returned across this node is one paired transfer, or retained in closing stock if still held; it is not another final output. An unexplained balance difference is an investigation item, not automatically a physical waste or emission. Do not add removed lots to receipts, omit closing stock, or subtract a loss again when it is already part of this reported stream. Attribute and normalize each supported exported quantity once to accepted final output."
      inputs:
        - "storage opening"
        - receipts
        - "outputs and closing"
      output: "reconciled storage loss and unexplained balance differences"
      source_ids: []
    - id: cocoa_field_emissions_identity_and_fate
      applies_to: "cocoa_managed_production"
      rule: "Identify every actual emitted substance and receiving compartment separately. Quantify each supported pathway with its own activity, method, chemical-species basis and native unit; distinguish elemental N/P ledgers from final compounds. Soil nutrient retention or a mass-balance residual is not automatically an emission. This replaces an ambiguous aggregate exchange, not the collection obligation. Before dataset completeness, create one concrete card per actual exchange, verify a compatible UUID or retain an explicit unresolved identity, and record quantity, unit, stage/period, destination and evidence. Reconstruct the raw attributable numerator from the linked protocol and normalize once to the matched accepted reference output. Missing data is not zero; no range of the former aggregate is an individual-stream default."
      inputs:
        - cp_cocoa_emission_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: cocoa_fermentation_sweatings_identity_and_fate
      applies_to: "cocoa_fermentation"
      rule: "Identify each actually separate material stream, composition, state and recipient. Keep spent preservation agents, brine, animal/plant material, packaging, drainage and intended co-products separate when separately handled; instantiate only streams actually evidenced at this operation. A physically mixed stream may have one composition-defined identity only with compatible treatment evidence, without also counting its components as additional exports. Distinguish marketed outputs, internal rework, waste transfer, purchased treatment and elementary discharge; do not duplicate treatment burdens. This replaces an ambiguous aggregate exchange, not the collection obligation. Before dataset completeness, create one concrete card per actual exchange, verify a compatible UUID or retain an explicit unresolved identity, and record quantity, unit, stage/period, destination and evidence. Reconstruct the raw attributable numerator from the linked protocol and normalize once to the matched accepted reference output. Missing data is not zero; no range of the former aggregate is an individual-stream default."
      inputs:
        - cp_cocoa_residue_destination_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids:
        - icco-cocoa-harvesting-post-harvest
        - fao-cocoa-ota-code
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_cocoa_emission_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    []
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Confirm UUID 3c54da37-f1ab-4b4c-8363-5c32b638005c, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66 and Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66; retain farm-gate fresh/unprocessed metadata."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_02
    applies_to: "state identity"
    rule: "Reject use of the reference UUID for fermented, dried, graded, cocoa waste or cocoa paste material without a reviewed identity decision."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: validation_03
    applies_to: "process graph"
    rule: "Require production-to-harvest-to-pod-opening-to-wet-bean hand-offs for every wet-reference result, even with postharvest_extension=false. Check pod, wet-bean, husk/placenta and loss records and contracted-service scope. Reject a pod-only result labelled as wet beans. For an extension, additionally validate each included fermentation, drying, grading and storage hand-off."
    source_ids:
      - icco-cocoa-harvesting-post-harvest
      - fao-cocoa-ota-code
  - rule_id: validation_04
    applies_to: "mass balance"
    rule: "Reconcile each lot's inputs, accepted outputs, intended co-products, residues, rejects, storage losses and moisture-related water loss within measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_05
    applies_to: "fermentation"
    rule: "Require batch id, dates, method, drainage, output hand-off and inspection evidence; unresolved off-spec routing blocks the extended route."
    source_ids:
      - fao-cocoa-ota-code
      - icco-cocoa-harvesting-post-harvest
  - rule_id: validation_06
    applies_to: "drying"
    rule: "Require method, input/output, final moisture and smoke or contamination control. Use 6–8% only as screening; measured lot moisture governs."
    source_ids:
      - icco-cocoa-processing
      - icco-cocoa-quality-requirements
  - rule_id: validation_07
    applies_to: "grades and rejects"
    rule: "Every accepted grade and intended downgrade has a hand-off; mouldy, broken, contaminated or off-spec material cannot be counted as accepted beans."
    source_ids:
      - fao-cocoa-production-guide
      - icco-cocoa-quality-requirements
  - rule_id: validation_08
    applies_to: "allocation"
    rule: "Confirm every intended output, residue destination and allocation denominator. Sequential states are not allocated against each other and shared burdens are not double-counted."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "data quality"
    rule: "Check crop-year coverage, lot completeness, moisture basis, protocol linkage, sources, method version and units for every important quantitative flow."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: validation_10
    applies_to: "boundary disclosure"
    rule: "Require a fresh wet-bean base result with extraction included. Report any downstream extension as a separate boundary/result with its own state, gate and measured conversion; extension operations must not be folded into the base wet farm-gate inventory. State storage and downstream exclusions."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed foreground cocoa-bean route; background_dataset use requires separate review"
  downstream_use: "construction of process and lifecycle-model datasets for cultivated cocoa beans with explicit wet farm-gate or extended dried-gate state"
  allowed_use: "comparative or attributional LCA when geography, crop year, production system, state, moisture basis, route, grade, gate and allocation are compatible"
  excluded_use: "cocoa paste, liquor, butter, powder, chocolate, prepared foods, cocoa waste treatment, consumer products or dried-bean data omitting declared state conversion"
  required_metadata: "reference UUID; property and unit-group UUIDs; cultivar; geography; block/supplier; crop year; production system; wet reference condition; extension flag; fermentation/drying; moisture; grade; residues; rejects; storage; gate; allocation; uncertainty"
  required_quality_disclosure: "measured versus calculated values, coverage, sources, unresolved route UUIDs, range use, sampling basis, missing destinations and balance exceptions"
  update_trigger: "change in platform identity, state semantics, cultivation route, fermentation/drying technology, quality requirements, allocation rule, emission method or material range/boundary evidence"
