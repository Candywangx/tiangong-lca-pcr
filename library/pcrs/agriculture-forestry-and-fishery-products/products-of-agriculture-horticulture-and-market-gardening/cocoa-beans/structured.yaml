measurement_rules:
  - id: measurement_01
    applies_to: "all cocoa states"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record pods, wet beans in pulp, fermented wet beans, dried beans, graded beans, husk, pulp, sweatings, shells, rejects and losses on an as-received or dry-matter basis. Never mix wet and dry bases in one balance."
  - id: measurement_02
    applies_to: "reference and post-harvest conversion"
    required_property_ref:
      name: "mass and moisture"
      uuid: ""
    required_unit: "kg; percent wet basis"
    rule: "Measure moisture for every conversion-critical lot. Use dry-matter conservation only when sampling basis and moisture method are documented."
  - id: measurement_03
    applies_to: "perennial phases"
    required_property_ref:
      name: "area-time and crop-year identity"
      uuid: ""
    required_unit: "ha·year; crop year; phase"
    rule: "Link establishment, immature, productive, replacement and termination phases to the same block and represented crop years before annualizing."
  - id: measurement_04
