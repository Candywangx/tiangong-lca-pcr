allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation by subdividing field production, post-harvest handling, residue management, and storage or delivery processes where records allow."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Treat maize stover, cobs, husks, screenings, broken grain, spoiled grain, and dust as wastes when they are discarded or treated without product credit."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Use physical mass allocation for maize grain and removed residues only when both are co-products and no more causal subdivision is available."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Use economic allocation only when maize grain, stover, cobs, screenings, or other outputs are marketable co-products and price evidence is available."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Disclose any substitution or avoided-burden treatment separately with evidence for the displaced product and market."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Residue fate must be declared as field return, removal for feed, bedding, fuel, soil amendment, open burning, waste treatment, or another evidenced route."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_input_records
      process_id: "field_maize_production"
      flow_role: "maize seed input"
      record_type: "planting record"
      raw_fields: "seed product; variety or hybrid; seed count or mass; field id; planting date"
      collection_method: "invoice, seed tag, planter monitor, or farm log"
      unit: "kg or seed count converted to kg"
      frequency: "per planting event"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "sum seed input and normalize to harvested grain output"
      quality_evidence: "invoice, seed tag, farm log, or planter monitor"
    - protocol_id: cp_fertilizer_input_records
      process_id: "field_maize_production"
      flow_role: "fertilizer inputs"
      record_type: "fertilizer application record"
      raw_fields: "product; nutrient content; product mass; application date; field id"
      collection_method: "invoice, applicator record, or farm operation log"
      unit: "kg product and kg nutrient"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "sum product and nutrient mass and normalize to harvested grain output"
      quality_evidence: "invoice, applicator record, or farm log"
    - protocol_id: cp_irrigation_water_records
      process_id: "field_maize_production"
      flow_role: "irrigation water"
      record_type: "irrigation record"
      raw_fields: "water source; volume or mass; pumping period; field id"
      collection_method: "meter reading, pumping log, or water invoice"
      unit: "kg or m3 converted to kg"
      frequency: "per irrigation event"
      temporal_coverage: "crop cycle"
      site_scope: "irrigated maize field"
      aggregation_rule: "sum irrigation water and convert to mass where needed"
      quality_evidence: "meter record, pumping log, or water invoice"
    - protocol_id: cp_field_fuel_records
      process_id: "field_maize_production"
      flow_role: "field machinery fuel"
      record_type: "field operation fuel record"
      raw_fields: "operation; machine; fuel type; fuel quantity; field id"
      collection_method: "fuel log, invoice, or machine telematics"
      unit: "kg or L converted to kg"
      frequency: "per field operation"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "sum fuel by operation and normalize to harvested grain output"
      quality_evidence: "fuel log, invoice, or telematics record"
    - protocol_id: cp_crop_protection_records
      process_id: "field_maize_production"
      flow_role: "crop protection product"
      record_type: "crop protection application record"
      raw_fields: "product; active ingredient; formulated product mass; application date; field id"
      collection_method: "spray log, applicator record, or product invoice"
      unit: "kg active ingredient or kg product"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "sum active ingredient or product mass and normalize to harvested grain output"
      quality_evidence: "spray log, product label, applicator record"
    - protocol_id: cp_land_use_records
      process_id: "field_maize_production"
      flow_role: "land occupation"
      record_type: "field area record"
      raw_fields: "field id; planted area; crop duration"
      collection_method: "farm field record or GIS area record"
      unit: "ha and crop duration"
      frequency: "per crop cycle"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "multiply area by crop duration where area-time is required"
      quality_evidence: "field map, GIS record, or farm record"
    - protocol_id: cp_harvested_grain_records
      process_id: "field_maize_production"
      flow_role: "harvested maize grain"
      record_type: "harvest and receiving record"
      raw_fields: "field id; harvest date; harvested mass; moisture content; grain destination"
      collection_method: "combine monitor, weighbridge, calibrated scale, or elevator ticket"
      unit: "kg at recorded moisture basis"
      frequency: "per harvest event"
      temporal_coverage: "crop cycle"
      site_scope: "maize field and receiving point"
      aggregation_rule: "sum harvested mass and convert to declared moisture basis"
      quality_evidence: "scale ticket, elevator ticket, or harvest log"
    - protocol_id: cp_residue_management_records
      process_id: "field_maize_production"
      flow_role: "maize stover, cobs, husks, or field residue"
      record_type: "residue handling record"
      raw_fields: "field id; residue stream; mass or area; fate"
      collection_method: "baling ticket, scale record, field log, or residue management plan"
      unit: "kg, bale count converted to kg, or ha"
      frequency: "per residue handling event"
      temporal_coverage: "crop cycle"
      site_scope: "maize field"
      aggregation_rule: "sum residue mass crossing the boundary and declare fate"
      quality_evidence: "scale record, baling ticket, or field log"
    - protocol_id: cp_postharvest_energy_records
      process_id: "harvest_and_postharvest_handling"
      flow_role: "drying and handling energy"
      record_type: "facility energy record"
      raw_fields: "meter id; fuel type; energy quantity; process line; grain mass and moisture change"
      collection_method: "meter reading, utility bill, fuel invoice, dryer log, or equipment log"
      unit: "kWh, MJ, kg fuel, or L fuel"
      frequency: "per drying batch, storage campaign, or reporting period"
      temporal_coverage: "post-harvest campaign"
      site_scope: "dryer, cleaner, storage, or elevator facility"
      aggregation_rule: "allocate energy to maize grain and normalize to saleable grain output"
      quality_evidence: "meter record, fuel invoice, dryer log, or utility bill"
    - protocol_id: cp_storage_treatment_records
      process_id: "harvest_and_postharvest_handling"
      flow_role: "storage pest-control or fumigation product"
      record_type: "treatment record"
      raw_fields: "product; active ingredient; dose; treated mass; storage bin; date"
      collection_method: "treatment log or contractor certificate"
      unit: "kg active ingredient or kg product"
      frequency: "per treatment"
      temporal_coverage: "storage period"
      site_scope: "storage bin or facility"
      aggregation_rule: "sum treatment mass and normalize by treated grain mass or storage duration"
      quality_evidence: "treatment log, product label, or contractor certificate"
    - protocol_id: cp_saleable_grain_records
      process_id: "harvest_and_postharvest_handling"
      flow_role: "saleable maize grain"
      record_type: "saleable output record"
      raw_fields: "lot id; accepted mass; moisture basis; grade; destination"
      collection_method: "calibrated scale, elevator ticket, or dispatch record"
      unit: "kg"
      frequency: "per lot or shipment"
      temporal_coverage: "post-harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "sum accepted saleable grain at declared moisture basis"
      quality_evidence: "scale calibration, grade record, and dispatch ticket"
    - protocol_id: cp_reject_and_loss_records
      process_id: "harvest_and_postharvest_handling"
      flow_role: "screenings, broken grain, dust, and spoiled grain"
      record_type: "reject or loss record"
      raw_fields: "batch id; reject stream; mass; fate"
      collection_method: "scale record, bin reconciliation, or waste contractor record"
      unit: "kg"
      frequency: "per batch or reporting period"
      temporal_coverage: "post-harvest campaign"
      site_scope: "dryer, cleaner, or storage facility"
      aggregation_rule: "sum reject and loss streams by fate"
      quality_evidence: "scale ticket, inventory reconciliation, or waste record"
    - protocol_id: cp_storage_energy_records
      process_id: "storage_and_delivery"
      flow_role: "storage electricity"
      record_type: "storage energy record"
      raw_fields: "meter id; energy quantity; storage period; stored mass"
      collection_method: "meter reading or utility bill"
      unit: "kWh or MJ"
      frequency: "per storage period"
      temporal_coverage: "declared storage duration"
      site_scope: "storage site"
      aggregation_rule: "allocate storage energy by stored mass and duration"
      quality_evidence: "meter record or utility bill"
    - protocol_id: cp_delivery_transport_records
      process_id: "storage_and_delivery"
      flow_role: "delivery transport fuel"
      record_type: "transport service record"
      raw_fields: "route; distance; vehicle; fuel quantity or tonne-km; delivered mass"
      collection_method: "fuel log, carrier invoice, dispatch record, or route model"
      unit: "kg fuel or tonne-km"
      frequency: "per shipment"
      temporal_coverage: "delivery period"
      site_scope: "declared delivery route"
      aggregation_rule: "sum route-specific transport service and normalize to delivered grain"
      quality_evidence: "carrier invoice, dispatch record, or fuel log"
    - protocol_id: cp_delivered_grain_records
      process_id: "storage_and_delivery"
      flow_role: "declared delivered maize grain"
      record_type: "delivery or dispatch record"
      raw_fields: "lot id; delivered mass; delivery date; receiver or gate; moisture basis"
      collection_method: "weighbridge, calibrated scale, or dispatch record"
      unit: "kg"
      frequency: "per shipment"
      temporal_coverage: "delivery period"
      site_scope: "declared delivery route"
      aggregation_rule: "sum delivered grain mass at declared moisture basis"
      quality_evidence: "dispatch record, scale ticket, or delivery note"
    - protocol_id: cp_storage_loss_records
      process_id: "storage_and_delivery"
      flow_role: "storage loss or damaged grain"
      record_type: "storage loss record"
      raw_fields: "lot id; loss mass; damage category; fate"
      collection_method: "inventory reconciliation, scale record, or disposal record"
      unit: "kg"
      frequency: "per storage period or lot"
      temporal_coverage: "declared storage duration"
      site_scope: "storage site"
      aggregation_rule: "sum storage loss and declare fate"
      quality_evidence: "inventory reconciliation, scale record, or disposal record"
  calculation_rules:
    - id: normalize_harvested_grain
      applies_to: "harvested grain mass"
      rule: "convert harvested mass from recorded moisture to declared moisture basis, then normalize to reference output"
      inputs:
        - cp_harvested_grain_records
        - cp_saleable_grain_records
      output: "kg harvested maize grain per reference output"
      source_ids:
        - fao-maize-postharvest-operations
    - id: calculate_water_withdrawal
      applies_to: "irrigation water withdrawal"
      rule: "convert metered irrigation volume to mass and normalize to harvested grain output"
      inputs:
        - cp_irrigation_water_records
        - cp_harvested_grain_records
      output: "kg water withdrawal per reference output"
      source_ids: []
    - id: calculate_soil_n2o
      applies_to: "managed soil N2O"
      rule: "apply declared IPCC tier or reviewed regional method using synthetic N, organic N, residue N, mineralized N, and leaching or volatilization parameters where required"
      inputs:
        - cp_fertilizer_input_records
        - cp_residue_management_records
      output: "kg N2O per reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_field_energy_co2
      applies_to: "field energy fossil CO2"
      rule: "fuel quantity multiplied by declared fuel emission factor, normalized to harvested grain output"
      inputs:
        - cp_field_fuel_records
        - cp_harvested_grain_records
      output: "kg fossil CO2 from field energy per reference output"
      source_ids: []
    - id: calculate_postharvest_energy_co2
      applies_to: "post-harvest energy fossil CO2"
      rule: "drying, handling, and storage energy multiplied by declared emission factors, normalized to saleable grain output"
      inputs:
        - cp_postharvest_energy_records
        - cp_saleable_grain_records
      output: "kg fossil CO2 from post-harvest energy per reference output"
      source_ids: []
    - id: reconcile_grain_mass_balance
      applies_to: "grain, residue, and loss mass balance"
      rule: "reconcile harvested grain input with saleable grain, moisture change, screenings, dust, broken grain, spoiled grain, and storage loss"
      inputs:
        - cp_harvested_grain_records
        - cp_saleable_grain_records
        - cp_reject_and_loss_records
        - cp_storage_loss_records
      output: "mass-balance reconciliation and loss rate"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_grain_identity
      applies_to: "reference product and saleable output"
      requirement: "CPC 01122 scope, non-seed status, crop year, geography, declared gate, grain class or intended use, moisture basis, and grade or quality specification must be declared."
      evidence: "elevator ticket, grade certificate, sale contract, or dispatch record"
    - id: dq_mass_records
      applies_to: "mass records"
      requirement: "Mass values must identify record date, site or batch, unit, moisture basis where relevant, and measurement device or source record."
      evidence: "calibration record, weighbridge ticket, scale log, combine monitor, or supplier primary activity record"
    - id: dq_moisture_conversion
      applies_to: "moisture adjustment"
      requirement: "Moisture adjustments must state measured moisture, target moisture basis, and formula or tool used for conversion."
      evidence: "moisture meter record, dryer log, grade record, or calculation sheet"
    - id: dq_temporal_coverage
      applies_to: "crop-cycle data"
      requirement: "Field production data should cover the declared maize crop cycle; weather-sensitive comparative work should disclose whether one-year or multi-year average data are used."
      evidence: "crop-year production records"
    - id: dq_nitrogen_method
      applies_to: "nitrogen emissions"
      requirement: "Nitrogen input, residue N assumptions, volatilization, leaching, and selected IPCC tier or regional method must be documented before N2O or nitrate values are final."
      evidence: "fertilizer logs, residue records, soil method calculation, IPCC or regional method sheet"
    - id: dq_loss_and_residue_fate
      applies_to: "residues and losses"
      requirement: "Stover, cobs, husks, screenings, dust, broken grain, spoiled grain, and storage losses must have declared fate before allocation or waste treatment is finalized."
      evidence: "residue management record, scale ticket, waste record, sale record, or storage reconciliation"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "reference flow uses kg non-seed maize grain at a declared moisture basis"
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "dataset metadata distinguishes CPC 01122 maize grain from maize seed, forage maize, sweet corn, and processed maize products"
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "crop year, geography, declared gate, grade or intended use, storage inclusion, and delivery inclusion are declared"
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "field production and post-harvest handling are separated when records allow"
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "fertilizer, fuel, irrigation, crop protection, drying energy, storage energy, transport, and packaging inputs are addressed when in scope"
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "N2O, nitrate, fossil CO2, water withdrawal, land occupation, and residue fate are considered when in scope"
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "harvested grain, saleable grain, moisture change, rejected material, and storage loss are reconciled by mass balance"
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "allocation method is declared when stover, cobs, screenings, or other co-products receive product credit"
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "values outside source-backed or internally reviewed ranges include a method note and evidence rationale"
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
