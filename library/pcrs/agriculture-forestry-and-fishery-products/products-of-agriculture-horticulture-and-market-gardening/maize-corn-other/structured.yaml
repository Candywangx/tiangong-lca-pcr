system_boundary:
  rules:
    - rule_id: sb_crop_cycle
      applies_to: "foreground crop production"
      rule: "Include field preparation, sowing, crop management, irrigation when used, fertilization, crop protection, harvest, and every on-farm cleaning, drying, handling, and storage operation performed before the declared farm gate."
      source_ids:
        - fao-leap-feed-2016
    - rule_id: sb_upstream_inputs
      applies_to: "purchased and transferred inputs"
      rule: "Record seed, fertilizers, organic amendments, crop-protection products, fuels, electricity, supplied water, machinery or contracted services when material, and packaging when used; link each technosphere input to a geographically and technologically representative upstream dataset or disclose the proxy."
      source_ids:
        - fao-leap-feed-2016
        - eu-pef-2021
    - rule_id: sb_field_emissions
      applies_to: "managed-soil and field emissions"
      rule: "Calculate direct and indirect N2O associated with synthetic and organic N, crop residues, and relevant soil-N mineralization; calculate CO2 from lime and urea where applied; include NH3, NO, nitrate leaching, and other material field emissions using the most specific accepted regional method and collected activity data."
      source_ids:
        - ipcc-2019-managed-soils
        - eea-emep-agricultural-soils-2023
    - rule_id: sb_land_and_soil
      applies_to: "land occupation, land-use change, and soil carbon"
      rule: "Record occupied area and crop-cycle duration. Assess land-use change and soil-carbon stock change when required by the selected LCA method or when recent land conversion, drainage, biochar, or a material management change is present; disclose the method, period, and exclusions."
      source_ids:
        - eu-pef-2021
        - fao-leap-feed-2016
    - rule_id: sb_residues
      applies_to: "stover, cobs, husks, and other crop residues"
      rule: "Treat residue retained, mulched, incorporated, grazed in situ, or burned as a field-management pathway and account for its relevant emissions. Record residue crossing the farm gate as a co-product only when its quantity and destination are evidenced."
      source_ids:
        - ipcc-2019-managed-soils
        - eea-emep-agricultural-soils-2023
    - rule_id: sb_postharvest_gate
      applies_to: "post-harvest operations"
      rule: "Include drying, cleaning, aeration, conveying, and storage only to the extent performed before the declared farm gate; report incoming and outgoing grain mass and moisture so drying loss is separated from dry-matter loss."
      source_ids:
        - fao-grain-drying
        - fao-postharvest-loss-2019
    - rule_id: sb_default_exclusions
      applies_to: "default farm-gate profile"
      rule: "Exclude planting-seed production, off-farm distribution after the gate, merchant or industrial storage, milling, starch or oil extraction, fermentation, cooking, feed manufacture, and product use or end-of-life unless added as separately identified downstream processes."
      source_ids:
        - fao-leap-feed-2016
