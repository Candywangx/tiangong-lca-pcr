allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "All nodes"
    rule: "First avoid allocation by separately metering nodes and linking each crop cycle or lot once."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intercrop
    applies_to: "Intercropped fields"
    rule: "Assign crop-specific inputs directly and shared operations by area, time or another causal driver; shares sum to one."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_status
    applies_to: "Haulm and shells"
    rule: "Without evidenced beneficial hand-off a stream is residue/waste with no co-product credit; beneficial hand-off makes it an intended co-product."
    source_ids:
      - iso-14044-2006
      - feedipedia-bambara-byproducts-2016
  - rule_id: allocation_coproduct
    applies_to: "Intended co-products"
    rule: "Where subdivision cannot avoid allocation, use contemporaneous farm-gate economic allocation and report mass-allocation sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "Rework/rejects"
    rule: "Retain rework burdens in the producing lot, count material only at final disposition, and never count rejects as accepted output."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_cycle_records
      process_id: "crop_production"
      flow_role: "All crop inputs/outputs"
      record_type: "Field logs, invoices, meters and yield records"
      raw_fields: "field; cycle; area; route; input product and composition; water; energy; yield; residues; loss; emission method"
      collection_method: "Link every event to harvested field; Raw aggregation and attribution: sum then normalize by accepted product; causal attribution for intercrop"
      unit: "original unit"
      frequency: "event/cycle"
      temporal_coverage: "full cycle"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, labels, area and yield records"
    - protocol_id: cp_harvest_lot_records
      process_id: "lift_and_recover"
      flow_role: "Harvest inputs/outputs"
      record_type: "Harvest log, scales and samples"
      raw_fields: "field; lot; method; energy; pod; haulm; soil; loss; destinations"
      collection_method: "Link each lot to one field; Raw aggregation and attribution: reconcile collected and uncollected states"
      unit: "kg; MJ"
      frequency: "lot"
      temporal_coverage: "campaign"
      site_scope: "field/technology"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale checks, sampling and receipts"
    - protocol_id: cp_pod_conditioning_records
      process_id: "pod_conditioning"
      flow_role: "Conditioning inputs/outputs"
      record_type: "Lot sheet, scales, moisture and equipment logs"
      raw_fields: "input/output mass/moisture; route; energy; debris; reject; time"
      collection_method: "Measure every state; Raw aggregation and attribution: dry-solids balance then normalize"
      unit: "kg; %; MJ"
      frequency: "lot"
      temporal_coverage: "all lots"
      site_scope: "site/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, route log and closure"
    - protocol_id: cp_shelling_records
      process_id: "shell_dry_pods"
      flow_role: "Shelling inputs/outputs"
      record_type: "Batch sheet and destinations"
      raw_fields: "pod mass/moisture; route; energy; seed; shells; rejects; rework"
      collection_method: "Measure every batch; Raw aggregation and attribution: balance and count rework once"
      unit: "kg; %; MJ"
      frequency: "batch"
      temporal_coverage: "all shelled lots"
      site_scope: "sheller"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, logs and closure"
    - protocol_id: cp_final_lot_records
      process_id: "clean_grade_final_dry"
      flow_role: "Final lot inputs/outputs"
      record_type: "Grade sheet, scales, moisture and dispatch"
      raw_fields: "shell state; mass/moisture; grade; energy; accepted; downgrade; reject; rework"
      collection_method: "Measure every state; Raw aggregation and attribution: balance then normalize to 1,000 kg"
      unit: "kg; %; MJ"
      frequency: "lot"
      temporal_coverage: "all sales lots"
      site_scope: "site/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, grade and dispatch records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All cards"
      rule: "amount / accepted mass × 1,000 kg"
      inputs:
        - "linked amount"
        - "accepted mass"
      output: "amount per reference flow"
      source_ids: []
    - id: calc_moisture_balance
      applies_to: "Drying"
      rule: "dry solids = wet mass × (1 − moisture fraction); water loss from paired states"
      inputs:
        - mass
        - moisture
        - "removed matter"
      output: "corrected mass and water to air"
      source_ids:
        - fao-grain-handling
    - id: calc_shelling_balance
      applies_to: "Shelling"
      rule: "pods = seed + shells + rejects + moisture change within uncertainty"
      inputs:
        - "batch states"
      output: "shelling yield and residues"
      source_ids:
        - feedipedia-bambara-byproducts-2016
    - id: calc_managed_soil_n2o
      applies_to: "Crop production"
      rule: "selected IPCC tier using actual synthetic/organic N and residue N; convert N2O-N to N2O"
      inputs:
        - "nutrient composition"
        - residues
        - area
        - factors
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_intercrop_attribution
      applies_to: "Shared operations"
      rule: "shared amount × disclosed causal share; shares sum to one"
      inputs:
        - "shared record and driver"
      output: "Bambara share"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product"
      requirement: "Verify species, dry and shell states, grade and hand-off; segregate planting seed and processed products."
      evidence: "specification, inspection and dispatch"
    - id: dq_completeness
      applies_to: "System"
      requirement: "Cover all contributing fields/lots and reconcile pods, seed, haulm, shells, debris, rework, rejects and losses."
      evidence: "linked node balances"
    - id: dq_nutrients
      applies_to: "Nutrient supply"
      requirement: "Retain every concrete product and composition inside the one card and resolve final exchanges to UUIDs."
      evidence: "invoices, labels and applications"
    - id: dq_measurement
      applies_to: "Quantities"
      requirement: "Preserve raw units, instrument checks, method and uncertainty."
      evidence: "calibration and workbook"
    - id: dq_routes
      applies_to: "Alternatives"
      requirement: "Keep sole/intercrop, manual/mechanized, ambient/heated shelling and active/inactive final-drying routes distinct."
      evidence: "route codes"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail when UUID, mass property/group, species, dry/shell state, moisture basis or farm-gate hand-off is missing."
    source_ids: []
  - rule_id: validate_route_topology
    applies_to: "Process map"
    rule: "Require production, independent harvest, pod conditioning, shelling and grading for the dry shelled reference product."
    source_ids:
      - sa-dard-bambara-2020
      - fao-pulse-loss-2020
  - rule_id: validate_nutrient_cardinality
    applies_to: "Crop inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Lots"
    rule: "Input equals accepted, co-product, downgrade, reject, debris, loss and moisture change within disclosed uncertainty."
    source_ids: []
  - rule_id: validate_grade_handoffs
    applies_to: "Grading"
    rule: "Require accepted, downgraded and rejected destinations and exclude rejects from reference output."
    source_ids:
      - fao-pulse-loss-2020
  - rule_id: validate_rework
    applies_to: "Rework"
    rule: "Require producing-lot link, one final disposition and no duplicated output or burden."
    source_ids: []
  - rule_id: validate_multioutput
    applies_to: "Haulm/shells"
    rule: "Require intended-product, residue or waste status, destination and attribution decision before credit."
    source_ids:
      - iso-14044-2006
      - feedipedia-bambara-byproducts-2016
  - rule_id: validate_run_attribution
    applies_to: "Cycles/lots"
    rule: "Require indexing and shares that reconcile to one; count shared burden once."
    source_ids: []
  - rule_id: validate_range_condition
    applies_to: "Conditional cards"
    rule: "Shelling ranges always apply; final-drying ranges apply only when final drying is active and use zero when inactive. Provisional ranges are QA screens, not limits."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground farm-production and conditioning dataset for mature dry Bambara beans"
  downstream_use: "secondary_dataset or background_dataset when geography, shelled state and route match"
  allowed_use: "Dry shelled *Vigna subterranea* seed at farm gate with matching qualifiers"
  excluded_use: "Fresh, planting-seed, cooked, roasted, milled, canned, oil and post-farm activities"
  required_metadata: "Geography; crop year; area; route; yield; irrigation; nutrient products/composition; technologies; shell state; moisture; grade; destinations; allocation; coverage"
  required_quality_disclosure: "Primary-data share, estimates, calibration, balance closure, representativeness, UUID gaps, allocation sensitivity and unresolved destinations"
  update_trigger: "Material change in product state, geography, yield, field practice, technology, grade, residue market, allocation, emission method or upstream data"
data_sources:
  - id: "fao-forgotten-foods-2023"
    type: "official_guidance"
    reference: "FAO, *Compendium of Forgotten Foods* (2023), https://openknowledge.fao.org/3/cc5044en/cc5044en.pdf"
    used_for: "Identity, dry seed and exclusions"
  - id: "sa-dard-bambara-2020"
    type: "extension_guidance"
    reference: "North West Province DARD, *Bambara Groundnut: A Crop for the Future* (2020), https://dard.nwpg.gov.za/wp-content/uploads/2022/05/Bambara-groundnut-a-crop-for-the-future.pdf"
    used_for: "Subterranean pods, lifting, inputs and residues"
  - id: "sa-daff-bambara-2016"
    type: "extension_guidance"
    reference: "South Africa DAFF, *Bambara Groundnuts Production Guideline* (2016), https://nda.gov.za/phocadownloadpap/Brochures_and_Production_Guidelines/Bambara.pdf"
    used_for: "Field management, nutrients and water"
  - id: "tanzania-naliendele-2001"
    type: "official_guidance"
    reference: "Tanzania MAFS/Naliendele, *Farmer seed experts...* (2001), https://www.fao.org/fileadmin/templates/esw/esw_new/documents/Links/Publications_Tanzania/38_Farmer_seed_experts_Naliendele.pdf"
    used_for: "Digging/lifting, drying and storage"
  - id: "fao-pulse-loss-2020"
    type: "official_guidance"
    reference: "FAO, *Improving the Storability and Availability of Pulses by Reducing Post-Harvest Losses* (2020), https://www.fao.org/platform-food-loss-waste/resources/news/news-detail/COVID-19-Series-Improving-the-Storability-and-Availability-of-Pulses-by-Reducing-Post-Harvest-Losses/en"
    used_for: "Harvest, drying, cleaning and damage control"
  - id: "fao-grain-handling"
    type: "handbook"
    reference: "FAO, *Farm structures in tropical climates*, Chapter 9, https://www.fao.org/4/s1250e/S1250E0u.htm"
    used_for: "Moisture, drying and storage quality"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4 Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil N2O and residue N"
  - id: "feedipedia-bambara-byproducts-2016"
    type: "literature"
    reference: "INRAE/CIRAD/AFZ/FAO Feedipedia (2016), https://feedipedia.review.fao.org/node/529"
    used_for: "Shell/offal states and feed destinations"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, confirmed 2022, https://www.iso.org/standard/38498.html"
    used_for: "Allocation and inventory treatment"
