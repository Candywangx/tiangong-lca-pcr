allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "All nodes"
    rule: "First avoid allocation by separately metering nodes and linking each crop cycle or lot once."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intercrop
    applies_to: "Intercropped fields"
    rule: "Assign crop-specific inputs directly and shared operations by area, time or another causal driver; shares sum to one."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_status
    applies_to: "Haulm and shells"
    rule: "Without evidenced beneficial hand-off a stream is residue/waste with no co-product credit; beneficial hand-off makes it an intended co-product."
    source_ids:
      - iso-14044-2006
      - feedipedia-bambara-byproducts-2016
  - rule_id: allocation_coproduct
    applies_to: "Intended co-products"
    rule: "Where subdivision cannot avoid allocation, use contemporaneous farm-gate economic allocation and report mass-allocation sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "Rework/rejects"
    rule: "Retain rework burdens in the producing lot, count material only at final disposition, and never count rejects as accepted output."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_cycle_records
      process_id: "crop_production"
      flow_role: "All crop inputs/outputs"
      record_type: "Field logs, invoices, meters and yield records"
      raw_fields: "field; cycle; area; route; input product and composition; water; energy; yield; residues; loss; emission method"
      collection_method: "Link every event to harvested field; Raw aggregation and attribution: sum then normalize by accepted product; causal attribution for intercrop"
      unit: "original unit"
      frequency: "event/cycle"
      temporal_coverage: "full cycle"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, labels, area and yield records"
    - protocol_id: cp_harvest_lot_records
      process_id: "lift_and_recover"
      flow_role: "Harvest inputs/outputs"
      record_type: "Harvest log, scales and samples"
      raw_fields: "field; lot; method; energy; pod; haulm; soil; loss; destinations"
