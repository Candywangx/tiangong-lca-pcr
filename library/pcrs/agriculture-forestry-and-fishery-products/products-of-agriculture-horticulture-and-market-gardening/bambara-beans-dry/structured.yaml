        - sa-dard-bambara-2020
        - tanzania-naliendele-2001
    - rule_id: boundary_conditioning
      applies_to: "Conditioning"
      rule: "Include soil removal, pod detachment, drying, cleaning, grading and conditional final drying."
      source_ids:
        - fao-pulse-loss-2020
        - fao-grain-handling
    - rule_id: boundary_shell_state
      applies_to: "Shelling"
      rule: "Require shelling before the CPC 01708 reference-product hand-off. Keep dry pods as an intermediate and never combine pod and shelled-seed mass without a measured balance."
      source_ids:
        - feedipedia-bambara-byproducts-2016
    - rule_id: boundary_exclusions
      applies_to: "Downstream"
      rule: "Exclude cooking, roasting, milling, canning, oil extraction, post-farm storage/transport and planting-seed certification."
      source_ids:
        - fao-forgotten-foods-2023
