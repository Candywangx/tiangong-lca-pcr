      record_type: "Grade sheet, scales, moisture and dispatch"
      raw_fields: "shell state; mass/moisture; grade; energy; accepted; downgrade; reject; rework ; all input/output water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; moisture and density; supported evaporation"
      collection_method: "Measure every state; Raw aggregation and attribution: balance then normalize to 1,000 kg"
      unit: "kg; %; MJ"
      frequency: "lot"
      temporal_coverage: "all sales lots"
      site_scope: "site/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, grade and dispatch records"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "crop_production"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All cards"
      rule: "amount / accepted mass × 1,000 kg"
      inputs:
        - "linked amount"
        - "accepted mass"
      output: "amount per reference flow"
      source_ids: []
    - id: calc_moisture_balance
      applies_to: "Drying"
      rule: "dry solids = wet mass × (1 − moisture fraction); water loss from paired states"
      inputs:
        - mass
        - moisture
        - "removed matter"
      output: "corrected mass and water to air"
      source_ids:
        - fao-grain-handling
    - id: calc_shelling_balance
      applies_to: "Shelling"
      rule: "pods = seed + shells + rejects + moisture change within uncertainty"
      inputs:
        - "batch states"
      output: "shelling yield and residues"
      source_ids:
        - feedipedia-bambara-byproducts-2016
    - id: calc_managed_soil_n2o
      applies_to: "Crop production"
      rule: "selected IPCC tier using actual synthetic/organic N and residue N; convert N2O-N to N2O"
      inputs:
        - "nutrient composition"
        - residues
        - area
        - factors
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_intercrop_attribution
      applies_to: "Shared operations"
      rule: "shared amount × disclosed causal share; shares sum to one"
      inputs:
        - "shared record and driver"
      output: "Bambara share"
      source_ids:
        - iso-14044-2006
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_crop_cycle_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product"
      requirement: "Verify species, dry and shell states, grade and hand-off; segregate planting seed and processed products."
      evidence: "specification, inspection and dispatch"
    - id: dq_completeness
      applies_to: "System"
      requirement: "Cover all contributing fields/lots and reconcile pods, seed, haulm, shells, debris, rework, rejects and losses."
      evidence: "linked node balances"
    - id: dq_nutrients
      applies_to: "Nutrient supply"
      requirement: "Retain every concrete product and composition inside the one card and resolve final exchanges to UUIDs."
      evidence: "invoices, labels and applications"
    - id: dq_measurement
      applies_to: "Quantities"
      requirement: "Preserve raw units, instrument checks, method and uncertainty."
      evidence: "calibration and workbook"
    - id: dq_routes
      applies_to: "Alternatives"
      requirement: "Keep sole/intercrop, manual/mechanized, ambient/heated shelling and active/inactive final-drying routes distinct."
      evidence: "route codes"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail when UUID, mass property/group, species, dry/shell state, moisture basis or farm-gate hand-off is missing."
    source_ids: []
  - rule_id: validate_route_topology
    applies_to: "Process map"
    rule: "Require production, independent harvest, pod conditioning, shelling and grading for the dry shelled reference product."
    source_ids:
      - sa-dard-bambara-2020
      - fao-pulse-loss-2020
  - rule_id: validate_nutrient_cardinality
    applies_to: "Crop inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Lots"
    rule: "Input equals accepted, co-product, downgrade, reject, debris, loss and moisture change within disclosed uncertainty."
    source_ids: []
  - rule_id: validate_grade_handoffs
    applies_to: "Grading"
    rule: "Require accepted, downgraded and rejected destinations and exclude rejects from reference output."
    source_ids:
      - fao-pulse-loss-2020
  - rule_id: validate_rework
    applies_to: "Rework"
    rule: "Require producing-lot link, one final disposition and no duplicated output or burden."
    source_ids: []
  - rule_id: validate_multioutput
    applies_to: "Haulm/shells"
    rule: "Require intended-product, residue or waste status, destination and attribution decision before credit."
    source_ids:
      - iso-14044-2006
      - feedipedia-bambara-byproducts-2016
  - rule_id: validate_run_attribution
    applies_to: "Cycles/lots"
    rule: "Require indexing and shares that reconcile to one; count shared burden once."
    source_ids: []
  - rule_id: validate_range_condition
    applies_to: "Conditional cards"
    rule: "Shelling ranges always apply; final-drying ranges apply only when final drying is active and use zero when inactive. Provisional ranges are QA screens, not limits."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground farm-production and conditioning dataset for mature dry Bambara beans"
  downstream_use: "secondary_dataset or background_dataset when geography, shelled state and route match"
  allowed_use: "Dry shelled *Vigna subterranea* seed at farm gate with matching qualifiers"
  excluded_use: "Fresh, planting-seed, cooked, roasted, milled, canned, oil and post-farm activities"
  required_metadata: "Geography; crop year; area; route; yield; irrigation; nutrient products/composition; technologies; shell state; moisture; grade; destinations; allocation; coverage"
  required_quality_disclosure: "Primary-data share, estimates, calibration, balance closure, representativeness, UUID gaps, allocation sensitivity and unresolved destinations"
  update_trigger: "Material change in product state, geography, yield, field practice, technology, grade, residue market, allocation, emission method or upstream data"
data_sources:
  - id: "fao-forgotten-foods-2023"
    type: "official_guidance"
    reference: "FAO, *Compendium of Forgotten Foods* (2023), https://openknowledge.fao.org/3/cc5044en/cc5044en.pdf"
    used_for: "Identity, dry seed and exclusions"
