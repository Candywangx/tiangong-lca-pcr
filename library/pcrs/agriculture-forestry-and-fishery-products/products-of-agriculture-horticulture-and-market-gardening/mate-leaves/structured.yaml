allocation_rules:
  - rule_id: allocation_01
    applies_to: "intended outputs"
    rule: "Enumerate accepted dry leaves and every independently sold fine-twig or lower-grade output with a single hand-off; residues and rejects are not automatically co-products."
    source_ids:
      - chifarelli-2024-yerba-mate-lca
  - rule_id: allocation_02
    applies_to: "multiple intended products"
    rule: "Prefer measured subdivision; if a process is inseparable, declare a programme-specific physical or other allocation method and rationale rather than assuming a universal split."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_03
    applies_to: "perennial phases"
    rule: "Link establishment, immature, productive, replacement and termination events to represented years and their outputs; assign each event once with declared service years."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_04
    applies_to: "shared sites and assets"
    rule: "Attribute vehicles, sapeco heat system, dryers, grader and storage once to consuming nodes, lots, sites and periods using logged time, throughput or other evidenced physical driver."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "rejects and rework"
    rule: "Keep burdens with the producing lot until documented sale, recovery, treatment or disposal; rework cannot create a second accepted output or duplicate energy input."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_mate_site_year
      process_id: "mate_stand_management"
      flow_role: "perennial inputs and emissions"
      record_type: "field ledger and meters"
      raw_fields: "stand, phase, year, area, planting, fertilizer, crop protection, irrigation, fuel, electricity, shared driver"
      collection_method: "dated field log, invoice and calibrated meter; Raw aggregation and attribution: sum within site-year then output-weight across sites"
      unit: "ha; year; kg; m3; L; kWh"
      frequency: "each event or month"
      temporal_coverage: "full represented year and attributable establishment"
      site_scope: "every supplying stand"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "map, invoice, calibration and activity log"
    - protocol_id: cp_mate_harvest_lot
      process_id: "mate_harvest"
      flow_role: "removed, collected and residual biomass"
      record_type: "harvest lot"
      raw_fields: "stand, date, collected mass, leaf/twig fraction, field residue, cutting fuel, receipt link"
      collection_method: "field tally and net scale; Raw aggregation and attribution: link once to receipt lot"
      unit: "kg; L"
      frequency: "each harvest"
      temporal_coverage: "complete harvest season"
      site_scope: "every supplying block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale ticket and traceable lot record"
    - protocol_id: cp_mate_processing_lot
      process_id: "mate_first_conditioning_mate_sapeco_mate_drying_mate_grade_gate"
      flow_role: "each material state, energy, grade, reject and gate"
      record_type: "processing and dispatch lot"
      raw_fields: "incoming lot, tare, weights and moisture by stage, fuel by type, electricity, dryer time, grades, rework, reject and buyer"
      collection_method: "paired scale, moisture sample, meter and dispatch record; Raw aggregation and attribution: reconcile stage by stage, then mass-weight across sites"
      unit: "kg; percent; MJ; L; kWh; h"
      frequency: "each lot and each rework event"
      temporal_coverage: "complete processing period"
      site_scope: "every included facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and moisture calibration, fuel invoice, meter log and destination receipt"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "mate_stand_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calculation_01
      applies_to: "dry matter"
      rule: "dry matter kg = as-received kg × (1 − wet-basis moisture fraction); compare paired stage balances and separate evaporated water"
      inputs:
        - "lot mass and moisture"
      output: "stage dry-matter balance"
      source_ids:
        - iarc-mate-processing
    - id: calculation_02
      applies_to: "accepted output"
      rule: "fresh input = accepted dry product + intended co-products + rejects + measured water loss + other measured losses + investigated residual, on consistent basis"
      inputs:
        - "stage scale"
        - "composition and moisture"
      output: "reconciled processing lot"
      source_ids:
        - chifarelli-2024-yerba-mate-lca
    - id: calculation_03
      applies_to: "multi-site normalization"
      rule: "sum attributed site and process burdens divided by sum accepted dry reference mass; keep every site's numerator and denominator"
      inputs:
        - site-year
        - "lot and dispatch records"
      output: "amount per 1 kg dry maté"
      source_ids:
        - iso-14044-2006
    - id: calculation_04
      applies_to: "period and shared service"
      rule: "event burden × documented period and service-driver share; shares across all recipients must sum to one"
      inputs:
        - event
        - period
        - "asset and recipient logs"
      output: "attributable burden per lot"
      source_ids:
        - iso-14044-2006
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: quality_01
      applies_to: "reference identity"
      requirement: "Verify an exact compatible dry maté product-flow UUID before active or published use."
      evidence: "confirmed Tiangong flow record and product specification"
    - id: quality_02
      applies_to: "site and period"
      requirement: "List all contributing stands, dryers, phases and crop years, with geographic and temporal representativeness and excluded units."
      evidence: "site register, field map and inclusion decision"
    - id: quality_03
      applies_to: "mass and grades"
      requirement: "Retain paired mass/moisture observations for fresh, treated, dried and dispatched states; trace intended grades, rejects and rework."
      evidence: "scale, moisture and destination records"
    - id: quality_04
      applies_to: "heat and shared assets"
      requirement: "Name sapeco and dryer fuel, energy meter, shared consumers, service period and attribution driver."
      evidence: "meter, fuel and equipment logs"
validation_rules:
  - rule_id: validation_01
    applies_to: "identity and gate"
    rule: "Accepted reference is dry unblended *Ilex paraguariensis* leaf material, with moisture, leaf/twig fraction, treatment route and primary-processing gate declared; exact UUID is required for active use."
    source_ids:
      - fao-yerba-mate-forest-products
      - iarc-mate-processing
  - rule_id: validation_02
    applies_to: "phase and sites"
    rule: "Each site-year, planting or replacement event and processing site links to a represented phase, harvest lot and output period exactly once."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_03
    applies_to: "material balance"
    rule: "Reconcile fresh, prepared, heat-treated, dried, accepted, downgraded, rejected and lost mass using measured moisture; investigate unexplained residuals."
    source_ids:
      - chifarelli-2024-yerba-mate-lca
  - rule_id: validation_04
    applies_to: "co-products and rework"
    rule: "A separately sold twig or lower grade needs mass, buyer and attribution decision; rejected material needs rework or exit and cannot count twice as accepted."
