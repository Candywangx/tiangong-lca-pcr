allocation_rules:
  - rule_id: allocation_avoid_where_measured
    applies_to: "all nodes"
    rule: "Subdivide and measure route, batch, grade, residue, and destination states before allocation. Accepted output excludes rejects, losses, detached stems, and downgraded material."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_life
    applies_to: "establishment and long-lived assets"
    rule: "Attribute establishment, immature-year, replacement, and termination burdens once across actual accepted output during the declared service/productive life; do not repeat them in annual management."
    source_ids:
      - fao-ecocrop-clove
      - kau-clove-practices-2016
  - rule_id: allocation_mixed_crop
    applies_to: "mixed stands and shared infrastructure"
    rule: "Prefer measured use, area-time, irrigation volume, operating time, or another causal driver. If causality is unavailable and products have economic functions, use documented economic allocation with sensitivity."
    source_ids:
      - iso-14044-2006
      - kau-clove-practices-2016
  - rule_id: allocation_batches_routes
    applies_to: "harvest and drying"
    rule: "Link inputs, outputs, cleaning/changeover, and shared-run services to batches or periods; weight route strata by accepted output and count each shared burden once."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejects
    applies_to: "stems, residues, downgraded and rejected material"
    rule: "Retain burdens with the producing node until documented recovery or product function begins. Separately sold outputs trigger subdivision or allocation; wastes do not."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_assets
      process_id: "stand_establishment"
      flow_role: "planting, immature management, replacement, termination, shared assets"
      record_type: "invoice, stand log, asset register"
      raw_fields: "dates; planting identity/mass/count; density; site inputs; replacements; removals; materials; service life; consuming crops/nodes/periods; driver"
      collection_method: "Reconcile invoices, field logs, and asset register to cohorts; Raw aggregation and attribution: Divide causal share by accepted output over same service period"
      unit: "kg, count, ha, year"
      frequency: "each event and annual review"
      temporal_coverage: "establishment through termination/cut-off"
      site_scope: "each cohort and asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, georeferenced register, dated logs, maintenance record"
    - protocol_id: cp_nutrient_ledger
      process_id: "stand_establishment_annual_tree_management"
      flow_role: "all mineral/organic fertilizers and nutrient amendments"
      record_type: "invoice, application log, certificate"
      raw_fields: "product; mass; N/P2O5/K2O/other nutrients; form; moisture; date; area/trees; phase"
      collection_method: "Collect each actual product/formulation separately, retain its own atomic input card, physical product mass, composition, supplier, application event and native unit. Reconcile stocks and actual applications, derive nutrients analytically without duplicate product exchange, and attribute/normalize each supported quantity once through matched accepted final output."
      unit: "kg product, kg nutrient, fraction"
      frequency: "each application"
      temporal_coverage: "every establishment and productive year"
      site_scope: "each stand/block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, label, lab result, scale, application log"
    - protocol_id: cp_water_records
      process_id: "stand_establishment"
      flow_role: "supplemental water"
      record_type: "meter/runtime log"
      raw_fields: "source; volume; reading; runtime; pump; stand; date"
      collection_method: "Meter or validated discharge × runtime; Raw aggregation and attribution: Sum by phase and normalize after lifetime attribution"
      unit: "m3"
      frequency: "each event"
      temporal_coverage: "establishment and immature years"
      site_scope: "each source/stand"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, pump curve, dated log"
    - protocol_id: cp_annual_management_inputs
      process_id: "annual_tree_management"
      flow_role: "water and crop protection"
      record_type: "meter, invoice, stock/application log"
      raw_fields: "water volume; product and active ingredient; quantity; treated area; date; leftovers"
      collection_method: "Collect water and each product independently; Raw aggregation and attribution: Retain concrete exchanges; normalize to harvested clusters"
      unit: "m3, kg, L"
      frequency: "each event"
      temporal_coverage: "full year"
      site_scope: "each block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, invoices, labels, stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "annual_tree_management_harvest_grade"
      flow_role: "field and harvest energy"
      record_type: "receipt, meter, runtime, contractor log"
      raw_fields: "carrier; original quantity; conversion; equipment; runtime; node; batch/period; shared driver"
      collection_method: "Meter or reconcile purchases and stock; Raw aggregation and attribution: Convert while preserving carrier identity; allocate shared use once"
      unit: "MJ, kWh, kg, L, h"
      frequency: "each operation/month"
      temporal_coverage: "full year and all harvests"
      site_scope: "each carrier/node"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, receipts, machine logs"
    - protocol_id: cp_harvest_grade_records
      process_id: "annual_tree_management_harvest_grade"
      flow_role: "clusters, buds, stems, grades, losses and rejects"
      record_type: "lot mass-balance sheet"
      raw_fields: "stand; date; maturity; batch; cluster input; bud/stem condition; accepted fresh or drying input; downgraded/reject states and destinations; moisture"
      collection_method: "Weigh and inspect every state in the same lot; Raw aggregation and attribution: Input = accepted + downgraded + all residues ± documented difference; one accepted hand-off route"
      unit: "kg, moisture fraction"
      frequency: "each lot"
      temporal_coverage: "all harvests in year"
      site_scope: "each block/station"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales, inspection, moisture test, destination receipt"
    - protocol_id: cp_residue_records
      process_id: "annual_tree_management"
      flow_role: "field biomass"
      record_type: "weighing/sampling and destination log"
      raw_fields: "residue type; wet/dry mass; moisture; origin; destination; recovery"
      collection_method: "Weigh or representative sampling; Raw aggregation and attribution: Normalize dry matter to harvested clusters; preserve destination rows"
      unit: "kg wet/dry"
      frequency: "each event/campaign"
      temporal_coverage: "full year"
      site_scope: "each stand/destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scales, sampling plan, moisture and receipts"
    - protocol_id: cp_drying_records
      process_id: "conditional_drying"
      flow_role: "fresh input, energy, dried output, water loss, rejects"
      record_type: "batch sheet, meter, moisture test"
      raw_fields: "input/output/reject mass; input/final moisture and basis; method; dates; duration; carrier; temperature; weather/dryer state"
      collection_method: "Weigh and moisture-test each batch; meter energy; Raw aggregation and attribution: Fresh input = dried output + rejects + water/other loss; keep sun/solar/assisted routes separate"
      unit: "kg, fraction, MJ, kWh, h, °C"
      frequency: "each batch"
      temporal_coverage: "all dried lots"
      site_scope: "each dryer/mat/station"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale/meter calibration, moisture method, batch and weather/dryer log"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: calc_lifetime_attribution
      applies_to: "perennial phases and assets"
      rule: "Sum cohort/asset burdens assigned by service period and causal share / accepted output over that period"
      inputs:
        - events
        - "service years"
        - driver
        - "annual output"
      output: "burden per kg accepted product"
      source_ids:
        - fao-ecocrop-clove
        - iso-14044-2006
    - id: calc_nutrients
      applies_to: "individual nutrient products"
      rule: "Declare the nutrient-fraction basis for each product. For an as-received nutrient fraction, nutrient mass = measured as-received product mass × nutrient fraction. For a dry-matter nutrient fraction, nutrient mass = measured as-received product mass × measured dry-matter fraction × dry-matter nutrient fraction. Never apply the dry-matter correction twice; retain elemental versus oxide reporting and any conversion separately. Calculate each product independently, then sum nutrients analytically without merging physical product exchanges."
      inputs:
        - mass
        - moisture
        - composition
      output: "kg product and nutrient by form"
      source_ids:
        - kau-clove-practices-2016
    - id: calc_soil_n2o
      applies_to: "managed-soil N2O"
      rule: "Apply selected IPCC tier to synthetic/organic/residue N, volatilization, and leaching; convert N2O-N × 44/28"
      inputs:
        - "nutrient ledger"
        - "residue N"
        - "selected factors"
      output: "kg N2O per kg clusters"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest/grading/drying"
      rule: "Same-batch input = product outputs + wastes + elementary loss ± documented difference; accepted output excludes unresolved material"
      inputs:
        - "masses and moisture"
      output: "reconciliation and normalized flows"
      source_ids:
        - mass-balance-identity
    - id: calc_route_weighting
      applies_to: "route strata"
      rule: "Sum(route amount × accepted route output) / total accepted output after calculating each route separately"
      inputs:
        - "route inventories and outputs"
      output: "weighted inventory"
      source_ids:
        - iso-14044-2006
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_nutrient_ledger
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm species, unopened maturity, whole state, stem condition, grade, fresh/dried state, moisture basis, and farm gate for every lot."
      evidence: "specification, inspection/photo, moisture test, ticket"
    - id: dq_periods
      applies_to: "perennial system"
      requirement: "Cover establishment, immature/productive years, replacements, and termination or disclose censored phases and lifetime sensitivity."
      evidence: "cohort, multi-year yield/input, asset records"
    - id: dq_completeness
      applies_to: "harvest/grading/drying"
      requirement: "Account for at least 95% of same-batch input/output mass or explain and correct the gap."
      evidence: "mass-balance and calibration records"
    - id: dq_route
      applies_to: "alternatives"
      requirement: "Keep sole/mixed, rainfed/irrigated, and fresh/sun/assisted-dried records separate until output weighting."
      evidence: "stratified records and worksheet"
    - id: dq_temporal
      applies_to: "foreground"
      requirement: "Cover a complete year and all harvests; use at least three representative productive years when alternate bearing is material, or disclose limitation."
      evidence: "dated input, yield, and lot records"
    - id: dq_fertilizer
      applies_to: "nutrient inputs"
      requirement: "Retain every actual product and composition in its own card; a missing Tiangong UUID remains an explicit manifest review gap until independently verified."
      evidence: "ledger, label, invoice, lab certificate, resolution record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Verify the concrete identity against the selected actual species/organ, sowing or commodity use, fresh/cured/dried and shell state, grade, provider and declared gate, with Mass/kg support. This PCR retains the semantic route and measurement definition; it does not assert that one fixed UUID covers all alternative states. A fresh-state flow cannot automatically bind a cured/dried output, an ambiguous nut/kernel flow cannot prove both states, and commodity seed cannot establish seed-for-sowing identity. Preserve a verified compatible existing binding only for its supported state; otherwise keep the UUID explicitly unresolved until detail-confirmed. Do not change the product boundary, quantity or route to force a match."
    source_ids:
      - icar-iisr-clove
      - kau-clove-harvesting
  - rule_id: validate_period_attribution
    applies_to: "perennial life/shared assets"
    rule: "Require phase, period, replacement, termination, consuming-node, and attribution records; reject double attribution across establishment, annual management, mixed crops, and assets."
    source_ids:
      - fao-ecocrop-clove
      - iso-14044-2006
  - rule_id: validate_route_delta
    applies_to: "production/drying alternatives"
    rule: "Require parent activity, changed topology/inventory/calculation/data/validation fields, mutually exclusive lot route, and evidence for each stratum."
    source_ids:
      - kau-clove-practices-2016
      - unido-spice-postharvest-2015
  - rule_id: validate_batch_reconciliation
    applies_to: "harvest through drying"
    rule: "Require batch/period identifiers, input-output and cleaning/changeover linkage when present, mass reconciliation, and no duplicate shared-run burden."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routes
    applies_to: "grading/drying"
    rule: "Every accepted, downgraded, rejected, residue, recovery, and disposal state requires mass and hand-off; reject unresolved material in accepted output or undocumented rework."
    source_ids:
      - kau-clove-harvesting
      - unido-spice-postharvest-2015
  - rule_id: validate_nutrient_cardinality
    applies_to: "nutrient inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - kau-clove-practices-2016
  - rule_id: validate_drying_condition
    applies_to: "drying"
    rule: "If inactive, drying inputs and dried reference output are absent/zero. If active, require method, energy, fresh/dried mass, moisture, rejects, duration, and stabilized hand-off; count output once."
    source_ids:
      - kau-clove-harvesting
      - unido-spice-postharvest-2015
  - rule_id: validate_ranges
    applies_to: "all quantitative cards"
    rule: "For every supplied quantitative screen, verify the concrete exchange, bounds, compatible unit and denominator, basis, applicability, evidence kind and external sources; keep EN/ZH/projection equivalent. Provisional reasoned estimates are non-enforcing review prompts, not default quantities, allowed losses or proof of completeness. Where no compatible quantitative bound is supported, explicitly report screening unavailable and review measurements, matched component balances and uncertainty; do not invent a range to satisfy this check. Final reference normalization remains exact and is not an empirical yield. Actual exchange quantities, protocols and compatible unit/conversion evidence are required independently of screening."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production package for accepted whole raw cloves at farm gate"
  downstream_use: "Reviewed secondary or background datasets for products using farm-gate whole cloves after methodology, identity, route, and quality review"
  allowed_use: "Farm-gate LCA of declared fresh or farm-dried whole raw cloves; output-weighted aggregation of evidenced strata"
  excluded_use: "Oil, oleoresin, detached stems, ground spice, blends, manufactured products, retail packs, or fresh-to-dried conversion without moisture and route records"
  required_metadata: "Geography; planting stock; crop system; stand age/density; establishment/life treatment; reporting years; irrigation; maturity; grade; stem condition; fresh/dried state; moisture basis; drying route; all grade, reject, residue, and recovery destinations"
  required_quality_disclosure: "Perennial-phase coverage; data age; measured/estimated shares; route weights; mass-balance closure; nutrient coverage; shared-asset allocation; IPCC tier/factors; unresolved upstream identities; uncertainty/sensitivity"
  update_trigger: "Change in identity, productive-life assumption, crop/input regime, harvest/grading, drying, moisture specification, allocation, emission method, or material data refresh"
data_sources:
  - id: "icar-iisr-clove"
    type: "official_guidance"
    reference: "ICAR-IISR, “Clove – Syzygium aromaticum”, https://spices.res.in/products/spices/clove.html"
    used_for: "Identity, perennial growth, pre-opening harvest, downstream oil distinction"
  - id: "fao-ecocrop-clove"
    type: "dataset"
    reference: "FAO Ecocrop crop 2462, https://ecocrop.apps.fao.org/ecocrop/srv/en/cropView?id=2462"
    used_for: "Perennial phases, 60–100 year economic life, 1–12 kg/tree/year yield, route context"
  - id: "kau-clove-practices-2016"
    type: "official_guidance"
    reference: "Kerala Agricultural University, *Package of Practices Recommendations: Crops 2016*, clove section, https://www.celkau.in/library/pop2016.pdf"
    used_for: "Establishment, mixed cropping, irrigation, nutrients, harvest and drying"
  - id: "kau-clove-harvesting"
    type: "extension_guidance"
    reference: "Kerala Agricultural University, “Clove: Harvesting”, https://celkau.in/crops/spices/clove/harvesting.php"
    used_for: "Harvest maturity, bud/stem separation, sorting, immediate drying, 4–5 days and about two-thirds weight loss"
  - id: "tnau-clove-practices-2013"
    type: "official_guidance"
    reference: "Tamil Nadu Agricultural University, *Crop Production Guide: Horticulture Crops 2013*, clove section, https://agritech.tnau.ac.in/ta/pdf/2013/cpg_horti_2013.pdf"
    used_for: "Establishment/productive-tree nutrient guidance, harvest and yield context"
  - id: "tnau-clove-practices-web"
    type: "extension_guidance"
    reference: "TNAU Agritech Portal, “Horticulture: Spice Crops: Clove”, https://agritech.tnau.ac.in/horticulture/horti_spice%20crops_clove.html"
    used_for: "Supplemental irrigation and productive-tree management"
  - id: "unido-spice-postharvest-2015"
    type: "handbook"
    reference: "UNIDO/FAO, *Herbs, Spices and Essential Oils: Post-harvest Operations in Developing Countries*, https://downloads.unido.org/ot/47/88/4788781/20001-_23603.PDF"
    used_for: "Clove drying, turning, mould prevention, 4–6 days, about two-thirds weight loss, rejects/cleaning"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct/indirect N2O method"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "Functional-unit normalization, subdivision and allocation hierarchy"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity for a bounded process batch"
    used_for: "Harvest/grading/drying reconciliation and QA ranges"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
