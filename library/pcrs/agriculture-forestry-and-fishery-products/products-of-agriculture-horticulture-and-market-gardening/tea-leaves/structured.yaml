            ranges: []
      waste:
        - row_id: tea_reject_or_storage_loss
          role: "Off-spec tea, rejects, and storage loss"
          name: "Off-spec tea and storage loss (route-specific UUID unresolved)"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Identify every rejected or off-spec state and declare whether it is reworked, downgraded, recovered, returned to an upstream route, composted, used for energy recovery, or discarded. Do not count unresolved rejects as accepted tea output. Raw activity or stage basis: per 1 kg dry tea reference flow."
          amount:
            expression: "weighed rejected, downgraded, damaged, or lost material by lot and storage period"
            value_mode: "foreground_record"
            specificity: "route_specific"
            basis:
              text: "per declared reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_residue_destination_records
              source_ids: []
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "0.30"
                unit: "kg rejected or lost tea/kg graded input"
                basis: "grading rejects, handling loss, and storage loss before gate"
                basis_kind: "process_output"
                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        - row_id: tea_storage_emissions
          role: "Particulate matter, particle size unspecified, to air"
          name: "Particulate matter, particle size unspecified, to air"
          flow_type: "elementary"
          property_unit: "Mass / kg"
          description: "Record Particulate matter, particle size unspecified, to air as one substance and receiving-medium exchange only when measurement or the selected applicable method establishes this pathway. Retain the actual receiving compartment and verify the precise flow identity. Other substances require separate exchanges; this card does not imply a default release. Raw activity or stage basis: per 1 kg dry tea reference flow."
          amount:
            expression: "Measured or method-calculated mass of Particulate matter, particle size unspecified, to air, retaining activity data, factors, substance basis and receiving compartment; normalize once to the declared reference output."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per declared reference flow"
              kind: "storage_duration"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_emission_records
              source_ids: []
            ranges: []
  - id: declared_reference_handoff
    label: "Product Measurement at Declared Handoff"
    inputs:
      product:
        - row_id: actual_route_product_for_handoff
          role: "Actual route product at handoff"
          name: "Tea"
          flow_type: "product"
          property_unit: "Mass / kg"
