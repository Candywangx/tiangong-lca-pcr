allocation_rules:
  - rule_id: allocation_01
    applies_to: "plantation_phase"
    rule: "Attribute perennial establishment, replacement, land occupation, and plantation management to the reporting-period tea output using the declared period and output basis; do not allocate the same phase burden again at processing."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: allocation_02
    applies_to: "route_batch"
    rule: "Index inputs, outputs, cleaning, drying, changeover, and rejects by route, batch, campaign, or reporting period so shared runs cannot be counted twice."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "marketable_tea_outputs"
    rule: "Enumerate the accepted primary grade, marketable secondary grade, and recovered tea fraction when each is an intended tea output. Decision: use subdivision and direct measurement first; when outputs are physically inseparable, use allocation by measured dry tea mass as the default fallback, and disclose any economic allocation only as a documented sensitivity. Apply one method consistently to the affected process."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_04
    applies_to: "residues_and_rejects"
    rule: "A residue is not a co-product merely because it has a possible use. Treat it as an intended output only when there is a declared hand-off, destination, and product-quality record; otherwise retain the producing process burden and route it as residue or waste."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_05
    applies_to: "route_alternatives"
    rule: "Green, black, oolong, white, yellow, and dark routes are mutually exclusive per lot. Do not combine route burdens or assign oxidation, rolling, withering, fixation, or piling to a lot without route evidence."
    source_ids:
      - iso-20715-2023-tea-classification
  - rule_id: allocation_06
    applies_to: "multi_period_attribution"
    rule: "Link establishment, replacement, pruning, termination, inputs, outputs, and storage events to a reporting period or phase and prevent double attribution across periods."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: allocation_07
    applies_to: "rework_and_rejects"
    rule: "Rework loops, downgrades, recovery, and boundary exits must link back to the producing node; accepted tea output excludes unresolved rejects and rejected material cannot be counted at two hand-offs."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "tea_plantation_management_tea_plucking_collection_tea_green_leaf_handling_tea_grading_storage_gate"
      flow_role: "plantation area and phase; field inputs; water; energy; land occupation"
      record_type: "field register, invoice, application record, meter, GIS, and activity log"
      raw_fields: "area; phase; cultivar; input_product; amount; nutrient_content; water; fuel; electricity; date; operation; reporting_period"
      collection_method: "reconcile physical inputs and operations to each block, activity, and crop cycle; Raw aggregation and attribution: sum by physical identity, block, activity, and period; calculate nutrient mass without merging products"
      unit: "m2; m2·year; kg; L; MJ; kWh; date"
      frequency: "each event and annual reporting period"
      temporal_coverage: "establishment, replacement, productive crop cycle, harvest campaign, and reporting period"
      site_scope: "all included plantation blocks and associated pre-gate activities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; labels; calibrated meters; field logs; GIS or block register"
    - protocol_id: cp_harvest_output_records
      process_id: "tea_plantation_management_tea_plucking_collection"
      flow_role: "shoots; fresh leaf; harvested mass; harvest loss; receiving hand-off"
      record_type: "weigh ticket, plucking register, yield record, and green-leaf receiving log"
      raw_fields: "block; cultivar; plucking_date; shoot_standard; fresh_mass; harvest_loss; receiving_time; lot_id"
      collection_method: "reconcile harvested and received mass to the plucking lot and dry-tea route; Raw aggregation and attribution: preserve one-to-one plantation-to-green-leaf linkage and close harvested mass = received mass + loss"
      unit: "kg; date-time; lot identifier"
      frequency: "every plucking lot and hand-off"
      temporal_coverage: "complete crop cycle and harvest campaign"
      site_scope: "all harvested lots entering a selected route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale; lot log; receiving record; moisture or quality record"
    - protocol_id: cp_processing_batch_records
      process_id: "tea_green_leaf_handling_tea_route_processing"
      flow_role: "green leaf; route intermediates; dry made tea; processing residues; utility inputs"
      record_type: "batch sheet, scale, moisture test, process log, utility meter, and fuel record"
      raw_fields: "route; batch_id; input_state; intermediate_state; process_step; moisture; output; loss; fuel; electricity; water; operating_condition ; actual material/state/destination; representative stream measurement; all other component/stock terms; unexplained residual and uncertainty"
      collection_method: "reconcile each batch, route state, utility reading, moisture result, and mass balance; Raw aggregation and attribution: aggregate only after route, batch, utility, and mass reconciliation"
      unit: "kg; %; h; °C; L; MJ; kWh"
      frequency: "every batch or campaign"
      temporal_coverage: "reception through selected primary-processing route and drying"
      site_scope: "every selected route, batch, and processing facility within the gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale and moisture meter; batch sheet; meter reconciliation; route log"
    - protocol_id: cp_quality_and_storage_records
      process_id: "tea_grading_storage_gate"
      flow_role: "accepted grade; secondary grade; recovered tea product; rejects; storage; gate output"
      record_type: "grading log, sieve record, scale, warehouse log, and quality record"
      raw_fields: "grade; destination; accepted_mass; secondary_mass; recovered_mass; reject_mass; storage_start; storage_end; condition; loss; gate_date"
      collection_method: "enumerate every grade and destination, then reconcile storage duration, loss, and gate hand-off; Raw aggregation and attribution: enumerate intended outputs and rejects; aggregate duration and quality by lot; exclude downstream logistics"
      unit: "kg; grade; day; temperature; humidity; date"
      frequency: "every graded or stored lot"
      temporal_coverage: "post-drying grading through the declared gate"
      site_scope: "all output destinations and storage included before the declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale; sieve or grading record; warehouse log; gate release record"
    - protocol_id: cp_residue_destination_records
      process_id: "tea_plantation_management_tea_plucking_collection_tea_green_leaf_handling_tea_route_processing_tea_grading_storage_gate"
      flow_role: "pruning residue; harvest loss; process residue; reject; rework; recovery; disposal"
      record_type: "residue log, waste transfer record, recovery invoice, and rework log"
      raw_fields: "residue_state; amount; destination; recovery; rework; compost; disposal; producing_process; lot_id"
      collection_method: "link every residue or reject to its producing process and final destination; Raw aggregation and attribution: retain producing process and final disposition; do not double-count material returned or recovered"
      unit: "kg; destination; lot identifier"
      frequency: "every batch, operation, or disposition event"
      temporal_coverage: "crop cycle, harvest campaign, route batch, grading, and storage periods"
      site_scope: "all residue, reject, rework, and recovered-fraction destinations within the gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "residue ledger; transfer note; recovery invoice; rework record; destination evidence"
    - protocol_id: cp_emission_records
      process_id: "tea_plantation_management_tea_green_leaf_handling_tea_route_processing_tea_grading_storage_gate"
      flow_role: "named emissions to air, water, or soil; storage dust; treatment outputs"
      record_type: "measurement record, factor calculation, treatment log, and emission record"
      raw_fields: "substance; medium; source; factor; measurement; treatment; reporting_period; lot_id"
      collection_method: "report measured or calculated emissions with the named substance, medium, source, and method; Raw aggregation and attribution: aggregate by substance, medium, source, lot, and period; do not use broad unspecified categories"
      unit: "kg substance"
      frequency: "each event or reporting-period calculation"
      temporal_coverage: "field operations, processing, drying, grading, and included storage"
      site_scope: "all field and processing emission sources within the declared boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "measurement record; factor provenance; treatment log; model version; QA review"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "tea_plantation_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_01
      applies_to: "tea_route_processing"
      rule: "Calculate route yield as dry tea mass divided by fresh leaf mass and retain both wet-basis and dry-basis moisture records."
      inputs:
        - "fresh leaf mass"
        - moisture
        - "dry tea mass"
      output: "fresh-to-dry yield ratio with measured moisture basis"
      source_ids: []
    - id: calc_02
      applies_to: "tea_plantation_management"
      rule: "Allocate area-time and phase burdens to the declared tea output for the reporting period without double attribution across establishment, replacement, and productive phases."
      inputs:
        - area
        - period
        - "plantation phase"
        - output
      output: "area-time and phase burdens attributed once to reporting-period output"
      source_ids: []
    - id: calc_03
      applies_to: "tea_plantation_management"
      rule: "Convert formulated fertilizer products to nutrient mass for N, P, and K records while preserving product identity for background datasets."
      inputs:
        - "nutrient product records and nutrient content"
      output: "separate product quantities and declared nutrient-component masses"
      source_ids: []
    - id: calc_04
      applies_to: "route-wide processes"
      rule: "Reconcile each batch by mass balance; unresolved difference is a validation finding and cannot be silently assigned to accepted tea."
      inputs:
        - "batch inputs"
        - intermediates
        - outputs
        - residues
        - losses
      output: "reconciled batch mass balance and unexplained differences"
      source_ids: []
    - id: calc_05
      applies_to: "tea_grading_storage_gate"
      rule: "Classify primary grade, secondary grade, recovered tea product, residue, reject, rework, and disposal according to the declared hand-off."
      inputs:
        - "grade outputs and destinations"
      output: "intended output, residue, reject and rework classification by destination"
      source_ids: []
    - id: calc_06
      applies_to: "route-wide shared operations"
      rule: "Allocate shared services to route and period records using the documented operational basis; prevent shared-run burdens from appearing in more than one product system."
      inputs:
        - route
        - batch
        - energy
        - changeover
        - "storage period"
      output: "shared-service burdens attributed once by route, batch and period"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_emission_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
  data_quality_requirements:
    []
validation_rules:
  - rule_id: validation_01
    applies_to: "identity"
    rule: "The dataset must identify *Camellia sinensis*, one named tea type, one route, the dry-tea state, and the declared primary-processing gate."
    source_ids:
      - iso-20715-2023-tea-classification
  - rule_id: validation_02
    applies_to: "reference_flow"
    rule: "The reference output must use Tea d16090ca-ddbe-4fd4-a498-fe4cab8bb525, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and 1 kg unless a reviewed identity correction is issued."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_03
    applies_to: "route_completeness"
    rule: "Exactly one named route must be selected. Every included route state must have a preceding input, a following hand-off, and a recorded output or loss; inapplicable states must not be counted."
    source_ids:
      - iso-20715-2023-tea-classification
      - fao-tea-chain-processing
  - rule_id: validation_04
    applies_to: "plantation_and_harvest"
    rule: "Plantation phase, management inputs, plucking source, fresh-leaf output, and harvest loss must be linked to the same reporting period and lot or an identified upstream dataset."
    source_ids:
      - ipcc-2019-refinement-afolu
  - rule_id: validation_05
    applies_to: "batch_and_changeover"
    rule: "Batch, campaign, or continuous-run boundaries must link inputs, outputs, cleaning, changeover, yield, and shared services; no shared-run burden may be counted twice."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_06
    applies_to: "outputs_and_allocation"
    rule: "Every intended output and hand-off must be enumerated. Marketable secondary tea is separated from residue; one output cannot be counted at two hand-offs."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_07
    applies_to: "rejects_and_rework"
    rule: "Every rejected or off-spec state must have a rework, downgrade, recovery, disposal, or boundary-exit path. Accepted output excludes unresolved rejects."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_08
    applies_to: "mass_balance"
    rule: "Fresh leaf, route intermediates, dry tea, grade outputs, residues, rejects, storage losses, and declared evaporation or moisture changes must reconcile within the documented tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "data_quality"
    rule: "Missing material records, unresolved route selection, missing gate qualifiers, unsupported range substitutions, and unexplained mass-balance differences are findings that block reviewed or published use."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_10
    applies_to: "period_attribution"
    rule: "Establishment, replacement, productive phase, termination, inputs, outputs, and storage events must be linked to periods and must not be attributed twice."
    source_ids:
      - ipcc-2019-refinement-afolu
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "secondary_dataset for a foreground tea production package that has passed identity, route, mass-balance, and data-quality validation"
  downstream_use: "Construction of tea-related LCA process and lifecyclemodel projections at the declared primary-processing gate"
  allowed_use: "Named tea type and route matching the declared gate, geography, reporting period, grade, moisture basis, and included plantation-to-gate scope"
  excluded_use: "Herbal or fruit infusions, tea beverages, extracts, concentrates, instant tea, scented or flavoured tea, decaffeination, consumer brewing, packaging presentation, retail, or downstream logistics"
  required_metadata: "Reference flow UUIDs; tea type; route; gate; geography; plantation phase; period; lot or campaign; fresh-leaf and dry-tea basis; moisture; grade; residue destinations; reject treatment; storage duration; background dataset links"
  required_quality_disclosure: "Measured versus calculated values; provisional ranges; route coverage; plantation and harvest coverage; mass-balance tolerance; unresolved identities; exclusions; allocation method"
  update_trigger: "Change in route, grade system, gate, plantation phase, input formulation, processing technology, storage practice, background identity, or evidence-backed range"
data_sources:
  - id: "iso-20715-2023-tea-classification"
    type: "standard"
    reference: "https://www.iso.org/standard/75419.html"
    used_for: "named tea types, route states, and product identity"
  - id: "iso-11287-2011-green-tea"
    type: "standard"
    reference: "https://www.iso.org/standard/51540.html"
    used_for: "green-tea route and scope exclusion for further processing"
  - id: "iso-3720-2011-black-tea"
    type: "standard"
    reference: "https://www.iso.org/standard/51541.html"
    used_for: "black-tea route and product identity"
  - id: "fao-jmpr-tea-processing-2016"
    type: "official_guidance"
    reference: "FAO (2016), Submission and evaluation of pesticide residues data for the estimation of maximum residue levels in food and feed, 3rd edition, Appendix X, printed pp. 256–259; https://www.fao.org/fileadmin/templates/agphome/documents/Pests_Pesticides/JMPR/Manual/FAO_manual_3rd_edition_Final.pdf"
    used_for: "Specific tea sample-processing route and moisture context only; no universal commercial tea-yield interval"
  - id: "fao-tea-chain-processing"
    type: "official_guidance"
    reference: "https://www.fao.org/fileadmin/templates/est/meetings/IGGtea21/Presentation-MarketReportArgentina.pdf"
    used_for: "harvest, withering, rolling, oxidation, drying, classification, and packing decomposition"
  - id: "agris-black-tea-processing-2017"
    type: "literature"
    reference: "https://doi.org/10.1002/ffj.3385"
    used_for: "black-tea processing sequence and storage relevance"
  - id: "ipcc-2019-refinement-afolu"
    type: "method_factor"
    reference: "https://efdb.ipcc-nggip.iges.or.jp/public/2019rf/index.html"
    used_for: "perennial production phase, direct emissions, and attribution context"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "https://committee.iso.org/standard/38498.html"
    used_for: "boundary, allocation, data quality, and validation rules"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Method identity: incoming mass = intended outputs + residues + rejects + declared losses"
    used_for: "mass-balance calculations and validation"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
