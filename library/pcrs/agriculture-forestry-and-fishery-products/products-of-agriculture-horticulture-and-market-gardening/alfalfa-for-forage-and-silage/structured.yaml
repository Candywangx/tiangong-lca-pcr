published_dataset_profile:
  dataset_role: "foreground production dataset for fresh farm-gate alfalfa forage"
  downstream_use: "secondary dataset and background dataset after review"
  allowed_use: "crop-production inventories, livestock-feed supply chains and later silage systems that add downstream transformation explicitly"
  excluded_use: "direct representation of hay, silage, pellets, meal, grazed forage, seed production or feed manufacturing"
  required_metadata: "location, field, establishment year, stand age and life, reporting year, cut schedule, irrigation and management route, accepted fresh mass, dry-matter fraction, reject destinations and reference-gate evidence"
  required_quality_disclosure: "record completeness by phase and cut, mass estimation method, dry-matter sampling, route separation, prospective stand-life assumptions, concrete flow identity verification and emission-method version"
  update_trigger: "changed product gate, new route, revised stand-life attribution, changed cutting schedule, material yield or moisture change, new emission method, or newly verified flow identity"
data_sources:
  - id: "umn-alfalfa-establishment"
    type: "extension_guidance"
    reference: "University of Minnesota Extension, “Alfalfa establishment: Management strategies”, https://extension.umn.edu/agriculture/crop-production/forages/alfalfa-establishment-management-strategies"
    used_for: "pure-live-seed basis, seed rate, coating/inoculation, establishment nutrients and perennial establishment records"
  - id: "umn-alfalfa-fertilizer"
    type: "extension_guidance"
    reference: "University of Minnesota Extension, “Alfalfa fertilizer recommendations”, https://extension.umn.edu/agriculture/crop-production/nutrient-management-for-minnesota-crops/fertilizing-alfalfa"
    used_for: "soil-test and yield-goal nutrient decisions, lime timing and limits on routine N fertilizer"
  - id: "uc-alfalfa-establishment"
    type: "extension_guidance"
    reference: "UC Statewide IPM Program, “Planting and Establishing a Stand”, https://ipm.ucanr.edu/agriculture/alfalfa/planting-and-establishing-a-stand-stand-establishment/"
    used_for: "establishment operations, irrigation, seedbed and stand acceptance"
  - id: "uc-alfalfa-irrigation"
    type: "extension_guidance"
    reference: "UC Statewide IPM Program, “Irrigation and Wheel Traffic Considerations”, https://ipm.ucanr.edu/PMG/C001/m001scirrwheel.html"
    used_for: "irrigation timing, field traffic and regrowth management"
  - id: "uc-alfalfa-established-ipm"
    type: "extension_guidance"
    reference: "UC Statewide IPM Program, “Integrated Weed Management in Established Alfalfa”, https://ipm.ucanr.edu/agriculture/alfalfa/integrated-weed-management-in-established-alfalfa/"
    used_for: "established-stand management, irrigation timing and crop-protection records"
  - id: "umn-alfalfa-drought-2024"
    type: "extension_guidance"
    reference: "University of Minnesota Extension, “Alfalfa during drought”, reviewed 2024, https://extension.umn.edu/agriculture/crop-production/forages/alfalfa-during-drought"
    used_for: "crop water-use rate, irrigation scheduling and rainfed/irrigated route separation"
  - id: "umn-alfalfa-harvest-loss"
    type: "extension_guidance"
    reference: "University of Minnesota Extension, “Alfalfa scissors cut sampling procedure”, https://extension.umn.edu/agriculture/crop-production/forages/alfalfa-scissors-cut-sampling-procedure"
    used_for: "harvest quality sampling and harvest-loss evidence"
  - id: "usda-ars-alfalfa-irrigation"
    type: "literature"
    reference: "USDA Agricultural Research Service, “Effect of sprinkler irrigation depth and uniformity on alfalfa yield and quality”, https://www.ars.usda.gov/research/publications/publication/?seqNo115=337586"
    used_for: "seasonal water use, multiple cuts and water-productivity context"
  - id: "usda-ars-alfalfa-management-2024"
    type: "dataset"
    reference: "USDA Agricultural Research Service project report 440524, FY2024, https://www.ars.usda.gov/research/project/?accnNo=440524&fy=2024"
    used_for: "perennial stand life, cutting schedules, cut contribution and route-specific management"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 Guidelines, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "managed-soil N2O, indirect nitrogen emissions, lime/urea CO2 and forage-renewal residue N"
  - id: "area-time-identity"
    type: "method_factor"
    reference: "Physical area-time identity"
    used_for: "establishment and stand-year attribution"
  - id: "area-balance-identity"
    type: "method_factor"
    reference: "Physical area balance identity"
    used_for: "seeded, established and productive area checks"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Physical mass-conservation identity"
    used_for: "cut mass reconciliation and rejected biomass"
  - id: "reference-flow-identity"
    type: "method_factor"
    reference: "PCR normalization identity"
    used_for: "exact reference output and normalization"
