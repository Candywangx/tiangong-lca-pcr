allocation_rules:
  - rule_id: allocation_establishment_life
    applies_to: "establishment burdens"
    rule: "Attribute establishment inputs, emissions and losses to all accepted fresh output produced over the actual stand life. Use realized stand termination and output where known; disclose any prospective lifetime used for an incomplete stand. Do not allocate the same establishment burden again in later stand-years."
    source_ids:
      - umn-alfalfa-establishment
      - usda-ars-alfalfa-management-2024
  - rule_id: allocation_stand_year
    applies_to: "annual management burdens"
    rule: "Assign stand-year inputs first to the reporting hectare-year, then divide by accepted fresh output from that year. Do not spread annual inputs across other production years."
    source_ids:
      - area-time-identity
  - rule_id: allocation_cut
    applies_to: "cut-specific operations"
    rule: "Assign harvest energy, cut-specific irrigation and losses to the identified cut; shared annual operations use a documented physical basis such as area or accepted fresh mass across cuts."
    source_ids:
      - usda-ars-alfalfa-management-2024
  - rule_id: allocation_rejects
    applies_to: "rejected or downgraded biomass"
    rule: "Keep burdens with the producing stand-year and cut unless an evidenced recovered-product allocation is declared. Exclude rejected biomass from accepted reference output."
    source_ids: []
  - rule_id: allocation_no_double_count
    applies_to: "all periods"
    rule: "Establishment, stand-year and cut records carry unique phase and period identifiers; each input, output, loss and field event may enter the normalized result once only."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "stand_establishment"
      flow_role: "establishment inputs and successful area"
      record_type: "invoices, field-operation logs, seed tags, meter records, soil tests and stand survey"
      raw_fields: "field_id, seeded_area, established_area, seed_mass, pure_live_seed_fraction, inoculant_mass, nutrient_product_mass, nutrient_composition, water_volume, energy_carrier_quantity, operation_date, product_application"
      collection_method: "reconcile purchase and application records to the target field and survey establishment; Raw aggregation and attribution: sum event quantities; retain product identity; annualize only through calc_establishment_attribution"
      unit: "stated row units"
      frequency: "each event and end-of-establishment survey"
      temporal_coverage: "entire establishment phase"
      site_scope: "each target field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, seed certificates, calibrated meters, soil analyses and dated field logs"
    - protocol_id: cp_stand_year_records
      process_id: "annual_regrowth_management"
      flow_role: "productive area, management inputs and field emissions"
      record_type: "field logs, meter records, invoices, soil and tissue tests, weather and emission-model inputs"
      raw_fields: "field_id, stand_age, productive_area, date, regrowth_period, nutrient_product, nutrient_composition, irrigation_volume, energy_quantity, crop_protection_mass, residue_return, amendment_mass"
      collection_method: "collect every event against one field, stand-year and where possible one regrowth period; Raw aggregation and attribution: sum within stand-year; retain regrowth-period tags; normalize through annual accepted output"
      unit: "stated row units"
      frequency: "each event for a complete production year"
      temporal_coverage: "complete reporting stand-year"
      site_scope: "each productive field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "complete event log, meter calibration, invoices and method version"
    - protocol_id: cp_cut_records
      process_id: "forage_harvest_handoff"
      flow_role: "cut input, accepted fresh mass, dry matter, energy and rejects"
      record_type: "harvester or scale records, load tickets, fuel records and representative samples"
      raw_fields: "field_id, stand_year, cut_number, harvest_date, incoming_biomass, accepted_fresh_mass, rejected_mass, destination, dry_matter_fraction, energy_quantity"
      collection_method: "identify every cut and reconcile incoming, accepted and rejected mass; Raw aggregation and attribution: sum accepted loads by cut and year; retain cut-specific rejects and energy; normalize to 1,000 kg accepted fresh mass"
      unit: "kg, kg/kg, MJ"
      frequency: "every cut and load"
      temporal_coverage: "all cuts in the reporting production year"
      site_scope: "each target field and farm-gate hand-off"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale or documented yield-estimation method, sample chain and mass-balance reconciliation"
  calculation_rules:
    - id: calc_establishment_attribution
      applies_to: "establishment cards"
      rule: "establishment quantity × reporting-year accepted output / accepted output over actual stand life; for a completed stand use realized lifetime output"
      inputs:
        - "establishment quantity"
        - "stand-year outputs"
        - "termination date"
      output: "establishment burden assigned to reporting output"
      source_ids:
        - area-time-identity
    - id: calc_fresh_normalization
      applies_to: "all cards"
      rule: "attributed row quantity ÷ accepted fresh mass × 1,000 kg"
      inputs:
        - "attributed row quantity"
        - "accepted fresh mass"
      output: "row quantity per reference flow"
      source_ids:
        - reference-flow-identity
    - id: calc_energy
      applies_to: "energy cards"
      rule: "sum carrier quantity × declared net-energy conversion; retain carrier identity and do not add service and fuel representations of the same operation"
      inputs:
        - "carrier quantities"
        - electricity
        - "conversion factors"
        - "operation ids"
      output: "MJ by process and period"
      source_ids: []
    - id: calc_cut_mass_balance
      applies_to: "each cut"
      rule: "harvest-ready input = accepted fresh output + rejected/lost biomass + separately traced destinations, within stated measurement uncertainty"
      inputs:
        - "incoming biomass"
        - "accepted mass"
        - "rejected mass"
        - "other destinations"
      output: "reconciled cut mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_managed_soil_emissions
      applies_to: "nitrogen and amendment emissions"
      rule: "apply the declared inventory-method equations and factors to actual relevant N, urea, lime, residue and renewal activity data; separate species and compartments"
      inputs:
        - "recorded activity data"
        - "method version and factors"
      output: "species-specific elementary exchanges"
      source_ids:
        - ipcc-2019-managed-soils
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_stand_year_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm fresh, unprocessed, unensiled, undried and unbaled state at farm-gate hand-off."
      evidence: "product description, harvest and dispatch records"
    - id: dq_period_completeness
      applies_to: "multi-period attribution"
      requirement: "Identify establishment phase, every productive stand-year, every included cut, stand termination and any missing records; document prospective lifetime assumptions."
      evidence: "period index and stand history"
    - id: dq_mass_and_moisture
      applies_to: "accepted output"
      requirement: "Use calibrated fresh-mass measurement or a documented field estimate and a representative dry-matter sample for each cut."
      evidence: "calibration, sample and laboratory records"
    - id: dq_input_completeness
      applies_to: "all processes"
      requirement: "Reconcile seed, nutrient products, water, energy and crop-protection records to field area, operation and reporting period."
      evidence: "invoice-to-field reconciliation"
    - id: dq_route_separation
      applies_to: "alternative routes"
      requirement: "Keep rainfed/irrigated, management-system and harvest-technology strata separate unless production-weighted aggregation is demonstrated."
      evidence: "stratum records and weighting calculation"
    - id: dq_flow_resolution
      applies_to: "parameterized cards"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "concrete flow identity evidence"
validation_rules:
  - rule_id: validate_reference_gate
    applies_to: "reference product"
    rule: "Reject a package that includes ensiling, fermentation, drying, baling or feed manufacture in the reference-product process."
    source_ids: []
  - rule_id: validate_stand_periods
    applies_to: "all processes"
    rule: "Require establishment year, stand age, reporting stand-year, cut identifiers, actual or prospective stand life, and termination treatment; reject double attribution across periods."
    source_ids: []
  - rule_id: validate_nutrient_consolidation
    applies_to: "each applicable process"
    rule: "Require a separate atomic card for each actual fertilizer or amendment with measured product quantity and composition; do not bind a generic nutrient group as one exchange."
    source_ids: []
  - rule_id: validate_n_fixing_crop
    applies_to: "annual nutrient records"
    rule: "Do not accept routine mineral-N input without evidence of the route-specific need; require nodulation or soil/plant evidence when mineral N is reported."
    source_ids:
      - umn-alfalfa-fertilizer
  - rule_id: validate_cut_balance
    applies_to: "each cut"
    rule: "Require accepted output plus rejects and other destinations to reconcile with harvest-ready input within disclosed measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_irrigation_route
    applies_to: "water card"
    rule: "Require zero supplied irrigation water for rainfed strata and event-linked measured or calculated delivery for irrigated strata."
    source_ids: []
