allocation_rules:
  - rule_id: allocation_mass_balance
    applies_to: "each process"
    rule: "Reconcile input, intended output, moisture change, residues and rejects on the declared mass and moisture basis."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "cleaning and grading"
    rule: "Do not count rejected lots or screenings as accepted seed; record the destination before applying any avoided-product treatment."
    source_ids:
      - fao-ilri-forage-seed-1996
  - rule_id: allocation_coproduct
    applies_to: "saleable secondary outputs"
    rule: "Prefer subdivision or direct physical attribution; when allocation remains necessary, disclose the outputs, prices, period, formula and sensitivity."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "perennial production"
    rule: "Annualize establishment and termination over documented productive seed yield, retaining year-specific yield and loss records."
    source_ids: []
  - rule_id: allocation_batches
    applies_to: "shared runs and storage"
    rule: "Assign cleaning, changeover, testing and storage burdens using measured run time, mass throughput or another documented causal driver; do not count them twice."
    source_ids: []
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_parent_seed
      process_id: "field_multiplication"
      flow_role: "parent seed"
      record_type: "purchase and sowing record"
      raw_fields: "species, cultivar, class, supplier, mass, field, date"
      collection_method: "invoice and calibrated scale; Raw aggregation and attribution: sum accepted parent seed by field lot"
      unit: "kg"
      frequency: "each sowing event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, lot label, scale check"
    - protocol_id: cp_field_inputs
      process_id: "field_multiplication"
      flow_role: "nutrients and amendments"
      record_type: "application log"
      raw_fields: "product, nutrient composition, mass, date, field"
      collection_method: "invoice plus application record; Raw aggregation and attribution: sum by actual product and retain composition"
      unit: "kg product"
      frequency: "each application"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice and application log"
    - protocol_id: cp_irrigation
      process_id: "field_multiplication"
      flow_role: "irrigation water"
      record_type: "meter or pumping record"
      raw_fields: "volume, source, field, date, runtime"
      collection_method: "meter preferred; pump calculation documented; Raw aggregation and attribution: sum delivered water"
      unit: "m3"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration or pump specification"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "energy"
      record_type: "fuel, meter and equipment log"
      raw_fields: "carrier, quantity, unit, run, process, lot"
      collection_method: "invoice, meter and equipment log; Raw aggregation and attribution: convert carriers and allocate causally to lot"
      unit: "MJ or kWh"
      frequency: "each run or reporting interval"
      temporal_coverage: "complete lot route"
      site_scope: "each field and facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter reading, run log"
    - protocol_id: cp_harvest_mass
      process_id: "field_multiplication_harvest_thresh"
      flow_role: "crop and raw seed mass"
      record_type: "harvest ticket"
      raw_fields: "field, lot, date, gross mass, tare, moisture"
      collection_method: "calibrated scale; Raw aggregation and attribution: net mass by linked lot"
      unit: "kg"
      frequency: "each load"
      temporal_coverage: "complete harvest"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh ticket and scale check"
    - protocol_id: cp_lot_mass_quality
      process_id: "harvest_thresh_dry_condition_grade_pack"
      flow_role: "intermediate seed mass and moisture"
      record_type: "batch record"
      raw_fields: "lot, input mass, output mass, moisture, timestamp"
      collection_method: "calibrated scale and moisture test; Raw aggregation and attribution: retain stage-specific mass; no cross-lot substitution"
      unit: "kg; %"
      frequency: "each batch"
      temporal_coverage: "complete processing route"
      site_scope: "each lot and process"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch sheet, calibration, sample id"
    - protocol_id: cp_packaging
      process_id: "grade_pack"
      flow_role: "packaging"
      record_type: "packaging issue record"
      raw_fields: "package type, net package mass, count, lot"
      collection_method: "stock issue plus weighing; Raw aggregation and attribution: sum packaging consumed net of documented returns"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete released lot"
      site_scope: "each packaging line and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "stock record and package specification"
    - protocol_id: cp_release_tests
      process_id: "grade_pack"
      flow_role: "accepted seed"
      record_type: "release and laboratory record"
      raw_fields: "species, cultivar, class, purity, germination or viability, moisture, treatment, certification, net mass"
      collection_method: "lot sampling and recognized seed test method; Raw aggregation and attribution: accept only mass covered by release decision"
      unit: "kg; %"
      frequency: "each released lot"
      temporal_coverage: "release date"
      site_scope: "each processing lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "certificate, laboratory result, sample chain"
    - protocol_id: cp_residue_route
      process_id: "harvest_thresh"
      flow_role: "residues"
      record_type: "destination record"
      raw_fields: "type, mass, destination, date, lot"
      collection_method: "scale or documented mass balance; Raw aggregation and attribution: sum by destination"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "complete harvest lot"
      site_scope: "each field/facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "ticket, receiver record or mass balance"
    - protocol_id: cp_reject_route
      process_id: "grade_pack"
      flow_role: "rejects and downgraded material"
      record_type: "sorting and destination record"
      raw_fields: "reason, grade, mass, destination, lot"
      collection_method: "scale and dispatch record; Raw aggregation and attribution: sum by reason and destination"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete grading lot"
      site_scope: "each line and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "grading report and destination evidence"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "field_multiplication"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "amount per reference kg = lot amount / net accepted seed mass"
      inputs:
        - "lot amount"
        - "accepted net mass"
      output: "normalized amount per kg"
      source_ids: []
    - id: calc_water
      applies_to: "irrigation"
      rule: "delivered water = metered volume, or pump rate × verified runtime when no meter exists"
      inputs:
        - "meter or pump rate and runtime"
      output: "m3 delivered water"
      source_ids: []
    - id: calc_energy
      applies_to: "energy inputs"
      rule: "convert each recorded carrier to declared energy unit, then allocate by causal lot driver"
      inputs:
        - "carrier quantity"
        - conversion
        - "lot driver"
      output: "MJ or kWh per kg"
      source_ids: []
    - id: calc_loss
      applies_to: "each process"
      rule: "loss or residue = opening input + additions − intended output − closing stock, reconciled for moisture"
      inputs:
        - "mass and moisture records"
      output: "loss/residue mass"
      source_ids: []
    - id: calc_period
      applies_to: "perennial field"
      rule: "annualized establishment burden = total establishment input × current-year seed yield / documented productive-period seed yield"
      inputs:
        - "establishment inputs"
        - "annual yields"
      output: "current-year attributed burden"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference lot"
      requirement: "Species, cultivar, seed class and CPC scope must be explicit; a species-specific UUID cannot represent another species or the complete category."
      evidence: "lot label and identity review"
    - id: dq_mass_balance
      applies_to: "each process"
      requirement: "Mass balance shall reconcile within a disclosed tolerance and moisture basis."
      evidence: "weighing and moisture records"
    - id: dq_completeness
      applies_to: "foreground route"
      requirement: "Collect at least 95% of recorded operating days and all released/rejected lots; disclose estimated gaps."
      evidence: "coverage calculation"
    - id: dq_temporal
      applies_to: "crop and processing cycle"
      requirement: "Use data covering one complete multiplication and processing cycle; perennial stands retain age and yearly yield."
      evidence: "field and batch dates"
    - id: dq_flow_binding
      applies_to: "all cards"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "binding review record"
