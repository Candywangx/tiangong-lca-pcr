      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_moisture
      applies_to: "Grain hand-offs"
      rule: "dry matter = wet mass × (1 − moisture fraction); equivalent target mass = dry matter ÷ (1 − target fraction)"
      inputs:
        - "wet mass"
        - moisture
      output: "dry matter and adjusted mass"
      source_ids:
        - mass-balance-identity
    - id: calc_field_normalization
      applies_to: "Field inventory"
      rule: "field amount ÷ same-field net accepted grain"
      inputs:
        - "field amount"
        - "accepted grain"
      output: "amount/kg reference"
      source_ids:
        - mass-balance-identity
    - id: calc_direct_n2o
      applies_to: "Soil N2O"
      rule: "N2O-N = Σ(N pool × EF1); N2O = N2O-N × 44/28"
      inputs:
        - "N pools"
        - EF1
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_batch_balance
      applies_to: "Harvest/cleaning/drying"
      rule: "input = accepted + co-products/downgrades + rejects + losses + moisture change"
      inputs:
        - "all hand-off masses and moisture"
      output: "closure and residual"
      source_ids:
        - mass-balance-identity
    - id: calc_drying_water
      applies_to: "Stabilization"
      rule: "input wet mass × input moisture − output wet mass × output moisture"
      inputs:
        - "wet masses"
        - moisture
      output: "kg water removed"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference lot"
      requirement: "Species, class, state, crop year, geography, moisture, grade/destination and routes are present."
      evidence: "Lot and grade records"
    - id: dq_completeness
      applies_to: "All processes"
      requirement: "Every card has a value; zero use requires explicit evidence."
      evidence: "Process checklist and ledgers"
    - id: dq_route_traceability
      applies_to: "Alternatives"
      requirement: "Retain separate route identifiers until weighted aggregation."
      evidence: "Field/batch/campaign identifiers"
    - id: dq_mass_balance
      applies_to: "Harvest/cleaning/drying"
      requirement: "Investigate unexplained dry-matter residual above 5% of input."
      evidence: "Moisture-corrected worksheet"
    - id: dq_temporal
      applies_to: "Dataset"
      requirement: "Include a complete crop cycle and linked post-harvest batches."
      evidence: "Dates and crop-year records"
    - id: dq_representativeness
      applies_to: "Aggregation"
      requirement: "Production-mass weight contributors and disclose exclusions."
      evidence: "Aggregation workbook"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail unless output is mature whole dry *Pisum sativum* grain with moisture, grade/destination and route qualifiers."
    source_ids:
      - ndsu-field-pea-production-2021
  - rule_id: validate_route_topology
    applies_to: "Process map"
    rule: "Require field, harvest and cleaning nodes; require drying/aeration only when active, and reject unweighted mixed routes."
    source_ids:
      - saskatchewan-dry-pea-guide
  - rule_id: validate_nutrient_cardinality
    applies_to: "field_production"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - ndsu-field-pea-fertility-2023
  - rule_id: validate_output_destinations
    applies_to: "Outputs"
    rule: "Require one explicit hand-off for grain, residues, damage/downgrade, rework, foreign matter, rejects and loss; reject double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_rework
    applies_to: "Cleaning/stabilization"
    rule: "Link each rework return to source lot, destination and pass; accepted output excludes unresolved reject/rework mass."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_batch_mode
    applies_to: "Harvest/cleaning/stabilization"
    rule: "Require batch/campaign boundaries and assign clean-out, carryover and shared energy once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "Inventory"
    rule: "Check each supplied range for complete bounds, unit, basis, evidence and bilingual alignment. Require compatible quantitative evidence for any enforced limit. If no supported bound exists, retain measured quantities and explicitly report range screening unavailable; do not invent a range or declare that check complete. Investigate deviations rather than overwrite measured values."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Harvest/cleaning/drying"
    rule: "Require moisture-corrected reconciliation and review residual above 5%."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_drying_condition
    applies_to: "drying_aeration"
    rule: "Require input/output moisture and temperature, route, duration and energy; destination limits override the general storage screen."
    source_ids:
      - saskatchewan-dry-pea-guide
published_dataset_profile:
  dataset_role: "Foreground cradle-to-farm-gate mature dry whole pea production dataset"
  downstream_use: "Secondary or background dataset for compatible food, feed and processing models"
  allowed_use: "Dry whole pea grain at farm gate with compatible geography, year, regime, moisture and grade/destination"
  excluded_use: "Green peas, forage/silage, planting seed products, split/milled/fractionated/concentrated/canned/cooked peas or unidentified mixed pulses"
  required_metadata: "PCR id; CPC; UUID; species/class; geography; crop year; field/lot; water regime; harvest and conditioning routes; moisture; grade/destination; allocation; sources"
  required_quality_disclosure: "Coverage; zero-use evidence; measured/estimated shares; range exceptions; mass-balance residual; rework; allocation sensitivity; representativeness"
  update_trigger: "Material change in class, geography, system, yield, nutrient/water regime, harvest, conditioning, specification, allocation, IPCC factors or evidence"
