  - id: "ndsu-field-pea-fertility-2023"
    type: "extension_guidance"
    reference: "NDSU Extension, Soil Fertility Recommendations for Field Pea, Lentil and Chickpea (SF725), https://www.ndsu.edu/fileadmin/snrs/Files/sf725.pdf"
    used_for: "Soil-test-driven nutrient records"
  - id: "saskatchewan-dry-pea-guide"
    type: "official_guidance"
    reference: "Government of Saskatchewan, Dry Pea fact sheet, https://pubsaskdev.blob.core.windows.net/pubsask-prod/86385/86385-dry_pea.pdf"
    used_for: "Harvest, cleaning, grading, moisture, storage, aeration and drying"
  - id: "saskatchewan-pea-harvest-management"
    type: "extension_guidance"
    reference: "Saskatchewan Pulse Growers, Pea Harvest Management, https://saskpulse.com/resources/pea-harvest-management/"
    used_for: "Harvest routes, shatter, damage and storage"
  - id: "fao-crop-water-needs"
    type: "official_guidance"
    reference: "FAO, Crop Water Needs, https://www.fao.org/4/s2022e/s2022e02.htm"
    used_for: "Pea seasonal crop-water need 350–500 mm"
  - id: "fao-cropland-nutrient-balance-2025"
    type: "dataset"
    reference: "FAOSTAT Cropland Nutrient Balance metadata, December 2025, https://files-faostat.fao.org/production/ESB/ESB_e.pdf"
    used_for: "Dry-pea dry matter and harvest index context"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4 Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Direct soil N2O formula and EF1 uncertainty"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity applied to moisture-corrected field and batch records"
    used_for: "Balance, conversion, allocation and QA"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
