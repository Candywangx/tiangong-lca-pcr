allocation_rules:
  - rule_id: single_seed_output
    applies_to: "accepted and downgraded grain"
    rule: "Use physical mass subdivision by grade lot for the same seed product. Do not allocate twice to the same grain mass; rejected grain has no accepted reference output."
    source_ids:
      - cgc-canola-grading
  - rule_id: straw_decision
    applies_to: "removed straw"
    rule: "Treat removed straw as an independent co-product only when an evidenced sale or transfer for productive use occurs. Record separate seed and straw masses and hand-offs. Assign separable cutting, baling and removal burdens directly to straw; allocate inseparable field and harvest burdens between accepted seed and sold straw by their contemporaneous farm-gate economic values. Disclose prices, shares and a seed-only sensitivity result. Retained or chopped straw is a field residue, not a co-product, and waste has no allocation share. Each output and burden has one hand-off and one attribution."
    source_ids:
      - manitoba-canola-management
      - ipcc-2019-soils
  - rule_id: run_attribution
    applies_to: "field, harvest, cleaning and grading runs"
    rule: "Assign metered inputs, output and cleaning/changeover burdens to the fields or lots served using actual run records; document any shared-load allocation key and count each load once. Reprocessed grain keeps prior burdens and receives only incremental rework energy."
    source_ids:
      - manitoba-canola-lca
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "crop_management"
      flow_role: "seed, fertiliser, protection, irrigation"
      record_type: "invoice and field application log"
      raw_fields: "field_id, date, product, mass, nutrient analysis, water source and volume"
      collection_method: "reconcile purchases to field application; Raw aggregation and attribution: sum by field and substance, then link to accepted seed crop_protection_specific_input: Operation crop_management: Record applied seed, weed, disease and insect treatments by active product and dose. Original quantity method: application log quantity for sown area Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; m3"
      frequency: "each application"
      temporal_coverage: "full crop year"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, soil test"
    - protocol_id: cp_operations
      process_id: "crop_management"
      flow_role: "tillage, seeding, spraying energy"
      record_type: "meter and machine log"
      raw_fields: "field_id, operation, hours, fuel, electricity"
      collection_method: "fuel issue and meter records; Raw aggregation and attribution: sum and allocate shared equipment by logged hours field_energy_specific_input: Record fuel and purchased electricity for sowing, tillage, spraying and irrigation where used.  Amount rule: meter or machine-log use for crop field Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "L; kWh"
      frequency: "each operation"
      temporal_coverage: "full crop year"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "fuel slips and machine log"
    - protocol_id: cp_harvest
      process_id: "harvest"
      flow_role: "route, raw grain, shatter loss"
      record_type: "combine and weighbridge record"
      raw_fields: "field_id, route, run_id, date, raw_mass, moisture, fuel, loss_sample"
      collection_method: "separate swath and direct runs; weigh grain and sample losses; Raw aggregation and attribution: sum runs after removing duplicates"
      unit: "kg; %; L"
      frequency: "each run"
      temporal_coverage: "harvest season"
      site_scope: "each field/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, field loss sample"
    - protocol_id: cp_residues
      process_id: "harvest"
      flow_role: "straw and chaff fate"
      record_type: "field record and load ticket"
      raw_fields: "field_id, retained_area, removed_dry_mass, destination, burn_event"
      collection_method: "field inspection and load weighing; Raw aggregation and attribution: reconcile removed and retained fractions"
      unit: "ha; kg dry"
      frequency: "each harvest"
      temporal_coverage: "harvest season"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "load tickets, photographs"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "cleaning, drying, aeration and screenings"
      record_type: "lot operation record"
      raw_fields: "lot_id, before_mass, after_mass, before_moisture, after_moisture, temperature, energy, screenings_mass, destination ; all input/output water including rejects/residues; actual added/rain water; separate liquid exports; opening/closing water stock; moisture and density; supported evaporation"
      collection_method: "weigh and sample each intervention; Raw aggregation and attribution: sum energy and retain lot mass balance"
      unit: "kg; %; °C; kWh; L"
      frequency: "each lot/intervention"
      temporal_coverage: "harvest to hand-off"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, moisture meter, meter logs"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "accepted, downgraded and rejected seed"
      record_type: "grade certificate and dispatch ticket"
      raw_fields: "lot_id, grade, green_seed, dockage, accepted_mass, downgraded_mass, reject_mass, destination"
      collection_method: "representative sample and dispatch weighing; Raw aggregation and attribution: sum by final destination once"
      unit: "kg; %"
      frequency: "each dispatch lot"
      temporal_coverage: "hand-off season"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sample report, scale ticket"
    - protocol_id: cp_emissions
      process_id: "crop_management"
      flow_role: "managed-soil emissions"
      record_type: "calculation worksheet"
      raw_fields: "field_id, N_inputs, returned_residue_N, method_version, factors, climate"
      collection_method: "apply declared local factors or IPCC method to recorded activity; Raw aggregation and attribution: sum direct and indirect results, avoiding duplicate N pools"
      unit: "kg N; kg N2O"
      frequency: "annual"
      temporal_coverage: "full crop year"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor citation and calculation audit"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "crop_management"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: net_grade_mass
      applies_to: "dispatch lots"
      rule: "accepted mass = sum of weighed accepted lots; separately sum downgraded and rejected mass; each lot has one final destination."
      inputs:
        - "lot tickets and grade results"
      output: "kg accepted seed"
      source_ids:
        - cgc-canola-grading
    - id: dry_matter_balance
      applies_to: "conditioning"
      rule: "conserved seed dry matter = lot mass × (1 − wet-basis moisture fraction), less measured screenings and physical loss; flag unexplained residual rather than force it into accepted output."
      inputs:
        - "before/after mass"
        - moisture
        - screenings
      output: "kg seed dry matter and kg water removed"
      source_ids:
        - manitoba-canola-management
    - id: soil_n2o
      applies_to: "field N"
      rule: "Calculate direct and indirect N2O with declared factors, separating fertiliser N and returned residue N; do not reuse one emission result in multiple nodes."
      inputs:
        - "N inputs"
        - "residue fate"
        - "local factors"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-soils
    - id: normalized_inventory
      applies_to: "field and lot records"
      rule: "Divide correctly attributed crop-year or lot totals by net accepted reference seed mass, retaining raw totals and area."
      inputs:
        - "reconciled records"
        - "accepted mass"
      output: "inventory per kg"
      source_ids:
        - manitoba-canola-lca
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "seed product"
      requirement: "Verify crop identity and distinguish rape/colza from mustard, planting seed and processed oil."
      evidence: "field records, delivery grade"
    - id: dq_mass
      applies_to: "seed lots"
      requirement: "Use calibrated scales and wet-basis moisture readings; show raw, cleaned, accepted and loss mass balance."
      evidence: "weighbridge and meter checks"
    - id: dq_routes
      applies_to: "harvest and conditioning"
      requirement: "Preserve field/run and lot IDs so mutually exclusive harvest routes, actual aeration/drying and any rework cannot be counted twice."
      evidence: "operation log and lot genealogy"
    - id: dq_grade
      applies_to: "grade states"
      requirement: "Retain green-seed, dockage and rejection tests appropriate to the declared market; identify any downgrade destination."
      evidence: "grade report and sales/return tickets"
    - id: dq_emissions
      applies_to: "field emissions"
      requirement: "Identify factors, region, method version, N inputs and residue fate; report limitations if local data are absent."
      evidence: "calculation worksheet and source record"
validation_rules:
  - rule_id: validate_product
    applies_to: "reference flow"
    rule: "Reject a data package that reports oil, meal, mustard or a planting-seed market lot under this verified oilseed-grain reference flow; require all reference qualifiers."
    source_ids:
      - unsd-cpc-01443
  - rule_id: validate_routes
    applies_to: "harvest"
    rule: "Every harvest run chooses swath/pick-up or direct combining, never both for the same area; confirm corresponding cutting fuel, curing interval and route-specific loss records."
    source_ids:
      - canola-council-harvest
  - rule_id: validate_mass_balance
    applies_to: "seed chain"
    rule: "Reconcile raw grain with cleaned, accepted, downgraded, rejected, screenings, water removal and loss states using measured moisture; do not add the same internal intermediate as another final output."
    source_ids:
      - manitoba-canola-management
      - cgc-canola-grading
  - rule_id: validate_rework
    applies_to: "off-spec grain"
    rule: "Trace any return to cleaning or drying to its original lot, add only incremental service, and verify its final downgrade, recovery or waste exit; a rejected lot cannot be accepted without a recorded successful intervention."
    source_ids:
      - cgc-canola-grading
  - rule_id: validate_storage
    applies_to: "conditioning"
    rule: "If the delivered state is cooled or dried, require before/after moisture and temperature and actual energy records; if no intervention occurred, do not apply a generic drying load."
    source_ids:
      - manitoba-canola-lca
  - rule_id: validate_shared_load
    applies_to: "batch operations"
    rule: "Match each energy, cleaning or changeover record to a run or period and an allocation key; check that totals equal metered input and are counted once."
    source_ids:
      - manitoba-canola-lca
  - rule_id: validate_irrigation
    applies_to: "field route"
    rule: "Irrigated fields require measured water withdrawal, source and pumping energy; rainfed fields must not receive an assumed irrigation inventory."
    source_ids:
      - canola-council-establishment
  - rule_id: validate_residue
    applies_to: "straw and field emissions"
    rule: "Confirm straw removal/retention fate and its consistency with residue-N emissions and any co-product allocation."
    source_ids:
      - ipcc-2019-soils
published_dataset_profile:
  dataset_role: "Farm-gate foreground production dataset for unprocessed whole rape or colza seed"
  downstream_use: "secondary_dataset; background_dataset for food, feed, oil extraction or other later systems"
  allowed_use: "Comparable whole-seed supply at a matching grade, moisture, geography, crop year and management route"
  excluded_use: "Mustard seed, planting seed, rapeseed oil or meal, and systems with unreported off-farm conditioning"
  required_metadata: "crop identity, field area, region, year, yield, route shares, grade specification, wet-basis moisture, green-seed and dockage, residue fate, conditioning location"
  required_quality_disclosure: "primary-record coverage, lot mass balance, source/factor versions, unresolved flow UUID bindings, use of regional proxies and grade transfer limits"
  update_trigger: "Change in crop or market class, route, grade basis, moisture management, regional emission factors or available primary records"
