measurement_rules:
  - id: reference_mass
    applies_to: "accepted_seed"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net accepted seed mass at measured wet-basis moisture, excluding screenings, downgraded lots not in the chosen reference grade, and rejected seed."
  - id: moisture_conversion
    applies_to: "lot masses before and after conditioning"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "If a declared comparison moisture is needed, convert only from measured wet-basis moisture: corrected mass = as-weighed mass × (1 − measured moisture fraction) / (1 − comparison moisture fraction); retain the original as-weighed mass."
  - id: field_normalization
    applies_to: "field inputs and emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Attribute crop-year field totals to accepted seed with measured lot yields; maintain the field area and season as separate audit bases."
process_map:
  - id: crop_management
    name: "Managed field production"
    inclusion: "required"
    inclusion_condition: "Every annual crop lot"
    role: "Sowing and managed biological growth; hand-off is standing mature crop, not grain"
    quantitative_reference: "sown area, crop-year inputs and yield"
  - id: harvest
    name: "Harvest and capture"
    inclusion: "required"
    inclusion_condition: "Every crop lot"
    role: "Independent swath/pick-up or direct-combine removal and threshing; hand-off is uncleaned harvested seed, with shatter and residue fate tracked"
    quantitative_reference: "harvest run and raw-seed mass"
  - id: conditioning
    name: "Primary cleaning and conditional stabilization"
    inclusion: "required"
    inclusion_condition: "Cleaning always; aeration/drying only when performed"
    role: "Raw grain becomes cleaned whole grain; damp/warm usable grain is stabilized, and screenings/losses exit"
    quantitative_reference: "before/after lot mass and moisture"
  - id: grading
    name: "Quality grading and dispatch"
    inclusion: "required"
    inclusion_condition: "Every hand-off lot"
    role: "Classify cleaned grain into accepted, downgraded and rejected destination states"
    quantitative_reference: "grade-lot mass and sample results"
