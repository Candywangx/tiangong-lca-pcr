      record_type: "site/activity/method ledger"
      raw_fields: "actual production nodes; soil/substrate route; climate/soil; nutrient product mass and composition; residue fate/N; relevant mineralisation/organic-soil/excreta activity; method/tier/equation/version; pathway factors and units; lime/urea; actual fuels; substance/compartment; supplier coverage; site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_normalize_reference
      applies_to: "all inventory"
      rule: "recorded amount × 1,000 kg / accepted reference-root mass on same basis"
      inputs:
        - amount
        - "reference mass"
      output: "normalized amount"
      source_ids:
        - mass-balance-identity
    - id: calc_transport_work
      applies_to: "transport"
      rule: "tkm = transported tonnes × loaded kilometres"
      inputs:
        - load
        - distance
      output: "tkm"
      source_ids:
        - mass-balance-identity
    - id: calc_root_mass_balance
      applies_to: "nodes"
      rule: "inlet minus accepted, downgraded, rejected, solids, samples, and separately measured water loss"
      inputs:
        - "linked mass records"
      output: "unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_mass_conversion
      applies_to: "dry-matter comparison"
      rule: "dry mass = as-received mass × (1 − moisture fraction)"
      inputs:
        - mass
        - moisture
      output: "dry mass"
      source_ids:
        - mass-balance-identity
    - id: planting_material_identity_and_fate
      applies_to: "field_production"
      rule: "For the original planting_material collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_field_cycle_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_cycle_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_environment_coverage
      applies_to: "actual managed-production nodes"
      rule: "For the actual owned managed-production node(s), require an applicability ledger for direct soil N2O, volatilisation/deposition-derived indirect N2O, leaching/runoff-derived indirect N2O, NH3/NOx and nutrient losses, plus actual liming/urea-use CO2. Primary calculation precedence is a representative pathway measurement, then a validated site/national method applicable to the crop, soil and management; otherwise use the compatible 2006 IPCC/2019-refined managed-soil equations and climate/input-specific factor selection for N2O and lime/urea CO2. Retain the exact edition, equation, tier, activity and factor units, climate and management applicability; no universal dose or emission factor is prescribed. Non-soil/protected routes need a method valid for their actual medium; do not force soil factors onto an inapplicable route. Use the same period/field N ledger for synthetic and organic additions, residues, actual relevant mineralisation/organic-soil and excreta pathways; demonstrate absent pathways rather than infer zero. Calculate direct and each indirect component separately, then assign each once to matching existing or new concrete cards; never add a total to its components. Convert N2O-N to molecular N2O by 44/28 once. NH3, NOx and nutrient/pesticide loss require an applicable measured or documented substance/fate model; total N/P or an unexplained balance residual is not a compound release. Keep actual receiving compartments and molecular versus elemental/reporting bases explicit; indirect formation does not remove the same N from the source ledger twice. Include actual local combustion releases separately using fuel-specific combustion-only methods; purchased electricity/heat/services retain upstream coverage once. Add one identity-specific exchange only for a supported release and reuse an existing matching card, with verified UUID or explicit unresolved identity. Missing applicable method/activity/factor/identity blocks completeness; it is not a justified zero. Attribute raw activity/release totals and normalize once to the matched accepted reference output."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids:
        - review-ipcc-soils-2019
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm species, storage-root use, cultivar, curing, damage, soil removal, moisture basis, and hand-off."
      evidence: "lot, inspection, hand-off"
    - id: dq_traceability
      applies_to: "process graph"
      requirement: "Link crop cycles, harvest events, conditioning runs, and storage lots."
      evidence: "stable identifiers"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Cover material inputs, water, energy, root states, residues, losses, transport, treatment, and conditional utilities."
      evidence: "completeness reconciliation"
    - id: dq_route_delta
      applies_to: "alternative routes"
      requirement: "Every topology, inventory, calculation, or validation delta needs current records."
      evidence: "route evidence matrix"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Verify the concrete identity against the selected actual species/organ, sowing or commodity use, fresh/cured/dried and shell state, grade, provider and declared gate, with Mass/kg support. This PCR retains the semantic route and measurement definition; it does not assert that one fixed UUID covers all alternative states. A fresh-state flow cannot automatically bind a cured/dried output, an ambiguous nut/kernel flow cannot prove both states, and commodity seed cannot establish seed-for-sowing identity. Preserve a verified compatible existing binding only for its supported state; otherwise keep the UUID explicitly unresolved until detail-confirmed. Do not change the product boundary, quantity or route to force a match."
    source_ids:
      - fao-sweet-potato-postharvest
  - rule_id: validate_reference_uuid
    applies_to: "reference identity"
    rule: "Verify the concrete identity against the selected actual species/organ, sowing or commodity use, fresh/cured/dried and shell state, grade, provider and declared gate, with Mass/kg support. This PCR retains the semantic route and measurement definition; it does not assert that one fixed UUID covers all alternative states. A fresh-state flow cannot automatically bind a cured/dried output, an ambiguous nut/kernel flow cannot prove both states, and commodity seed cannot establish seed-for-sowing identity. Preserve a verified compatible existing binding only for its supported state; otherwise keep the UUID explicitly unresolved until detail-confirmed. Do not change the product boundary, quantity or route to force a match."
    source_ids: []
  - rule_id: validate_exclusions
    applies_to: "scope"
    rule: "Fail when planting material or any processed product is the reference product."
    source_ids:
      - fao-sweet-potato-postharvest
  - rule_id: validate_graph_links
    applies_to: "process graph"
    rule: "Require complete cycle, harvest, conditioning, and storage-lot links."
    source_ids: []
  - rule_id: validate_rejects
    applies_to: "reject states"
    rule: "Require explicit downgrade, rework, recovery, or discard destinations and exclude rejects from accepted output."
    source_ids:
      - fao-sweet-potato-postharvest
  - rule_id: validate_mass_balance
    applies_to: "nodes"
    rule: "Report residuals; never label total loss as water-to-air without separate moisture measurement."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_flow_resolution
    applies_to: "all cards"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_curing
    applies_to: "cured route"
    rule: "Require method, temperature, relative humidity, duration, and inlet/outlet state; omit the node for uncured route."
    source_ids:
      - fao-sweet-potato-postharvest
published_dataset_profile:
  dataset_role: "Foreground production package for fresh sweet-potato storage roots"
  downstream_use: "Generate processes and lifecycle models; secondary or background use when geography, route, state, and quality match"
  allowed_use: "Fresh-root routes with compatible identity, cycle, curing, damage, soil removal, moisture basis, and hand-off"
  excluded_use: "Planting-material production, processed products, undisclosed curing mixtures, or substitution for another root crop"
  required_metadata: "Cultivar, geography, cycle/event/run/lot, route, irrigation, curing conditions, storage duration, damage, soil removal, moisture, hand-off, UUIDs, concrete flow identity verification, and resolution evidence"
  required_quality_disclosure: "Period, coverage, measured/calculated shares, instruments, mass balances, route evidence, allocation, representativeness, and gaps"
  update_trigger: "Material change to boundary, identity, concrete flow identity verification"
data_sources:
  - id: "fao-sweet-potato-postharvest"
    type: "official_guidance"
    reference: "FAO, *Prevention of post-harvest food losses: Sweet potato crop profile*, https://www.fao.org/4/t0073e/T0073E08.htm"
    used_for: "Careful harvest, soil removal, damage grading, curing/storage, and boundary"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity applied to linked inlet, output, residual, sample, and measured-moisture records"
    used_for: "Normalization, reconciliation, dry-mass conversion, fixed reference amount"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct/indirect N2O and lime/urea CO2 method context; factors require actual applicability and site activity, not a product default."
