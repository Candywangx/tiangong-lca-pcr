allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all nodes"
    rule: "Separate field, curing, grading, and batch records; attribute shared meters/equipment by operating time, throughput, or occupied capacity before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_leaf_grades
    applies_to: "useful grades"
    rule: "Preserve grades and direct burdens; if subdivision is infeasible, use contemporaneous hand-off economic allocation and disclose mass sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_reject
    applies_to: "residues, rework, rejects"
    rule: "Do not allocate to internal rework or waste; prevent reworked leaf from becoming a second output."
    source_ids: []
  - rule_id: allocation_shared_infrastructure
    applies_to: "shared barns/assets"
    rule: "Attribute each shared asset once across batches/periods with documented use; prevent cross-node double counting."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_records
      process_id: "tobacco_field_production"
      flow_role: "planting, nutrients, water, energy, protection"
      record_type: "log, invoice, meter, contractor record"
      raw_fields: "field; area; variety; product; formulation; amount; assay; date; operation"
      collection_method: "reconcile inputs to field/cycle; Raw aggregation and attribution: sum by identity/field; normalize with matched yield"
      unit: "item; kg; L; m3; MJ; ha"
      frequency: "each event"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; labels; calibrated meters; logs"
    - protocol_id: cp_harvest_records
      process_id: "tobacco_field_production"
      flow_role: "green leaf, residue, reject"
      record_type: "harvest ticket, scale, moisture, destination"
      raw_fields: "field; date; mass; moisture; grade; residue; fate"
      collection_method: "weigh/reconcile each picking; Raw aggregation and attribution: separate accepted leaf and every residue fate"
      unit: "kg; percent; ha"
      frequency: "each picking"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; lot trace; moisture test"
    - protocol_id: cp_field_emissions
      process_id: "tobacco_field_production"
      flow_role: "emissions"
      record_type: "nutrient, soil, weather, residue, model"
      raw_fields: "N; residue N; soil; climate; application; drainage; factors; model"
      collection_method: "Within each compatible route/product/state, calculate attributable raw totals by field first. Aggregate final intensity = sum(attributable raw quantities) * declared reference quantity / sum(matched accepted final outputs). When source quantities are per-ha rates e_h and y_h, first recover raw totals as e_h*area and y_h*area; do not area-weight field totals again. A per-product intensity is weighted by its matched output, not area or an unweighted mean. Apply existing allocation once, preserve period/throughput and all source-unit conversions, and keep incompatible routes separate."
      unit: "kg N; kg emission; ha"
      frequency: "each event/cycle"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "activity and factor provenance; model file"
    - protocol_id: cp_curing_records
      process_id: "tobacco_leaf_curing"
      flow_role: "leaf, energy, rejects, emissions"
      record_type: "batch, scale, moisture, meter, barn log"
      raw_fields: "batch; method; barn; input mass/moisture; carrier; energy; time; outputs"
      collection_method: "match each run to inputs/outputs/meters; Raw aggregation and attribution: reconcile mass; allocate shared services by measured driver"
      unit: "kg; percent; kWh; MJ; h"
      frequency: "each batch/period"
      temporal_coverage: "full curing period"
      site_scope: "all barns and curing sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale/meter; invoice; barn log"
    - protocol_id: cp_grading_records
      process_id: "cured_leaf_grading_packing"
      flow_role: "grades, packaging, rework, rejects"
      record_type: "batch, scale, grade, issue, destination"
      raw_fields: "batch; input; moisture; accepted; downgrade; rework; reject; packaging"
      collection_method: "reconcile grades/destinations; Raw aggregation and attribution: count rework once and close mass balance cured_leaf_packaging_input_specific_input: Mandatory input identification, not a selected exchange. Preserved collection scope: Record actual wrap, carton, sack, liner, pallet, crate, strap, and reusable packaging separately.  Raw activity or stage basis: per 1,000 kg accepted packed leaf. Preserve each actual input separately, including its actual material/species, physical state, native property/unit, measured quantity, period, destination and unique handover. Before dataset completeness, instantiate a physically specific exchange per actual identity and confirm a compatible UUID or retain its exact unresolved identity. Keep original throughput/normalization, allocation and reuse/stock obligations. A material/function class is not one exchange; do not copy the retired class-level range to components, invent a recipe or infer zero from missing records. Do not duplicate actual quantities or products already represented by another card."
      unit: "kg; item; percent"
      frequency: "each batch"
      temporal_coverage: "full grading period"
      site_scope: "all grading and packing sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; grade sheet; package record"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
    - protocol_id: cp_phase1_environment_coverage
      process_id: "tobacco_field_production"
      flow_role: "managed environmental coverage by actual node"
      record_type: "site/activity/method ledger"
      raw_fields: "site and actual managed nodes; area; dated occupation intervals; co-users; establishment/immature history; actual prior/current land classes and transformation dates/areas; carbon-method coverage; upstream land coverage"
      collection_method: "Collect original records by the actual responsible production node and matched lot/period; retain provenance, method applicability and uncertainty. Reconcile with existing protocols and provider coverage, do not add duplicate events. Explicitly document inapplicability; absent evidence is a gap."
      unit: "native activity units; kg N or substance; area/time as applicable"
      frequency: "event and annual/lot reconciliation"
      temporal_coverage: "matched production/cohort period"
      site_scope: "all actual managed-production nodes"
      aggregation_rule: "apply applicable coverage calculations then final normalization once"
      quality_evidence: "original records, method worksheets and applicability evidence"
  calculation_rules:
    - id: calc_field_to_green_leaf
      applies_to: "field flows"
      rule: "Crop-cycle quantity / matched green-leaf mass gives only a per-kg-green-leaf intermediate. For a green-leaf reference multiply attributable totals by 1,000 kg / accepted green gate mass. For a cured-leaf reference, scale the per-kg-green contribution by actual linked green input per accepted cured kg under calc_green_to_cured_leaf, then multiply by 1,000 kg; add curing/grading contributions on that same final basis once. Preserve actual lots, losses, output shares and units; do not apply the green-to-cured conversion to direct curing quantities or divide final intensities again."
      inputs:
        - amount
        - area
        - "green leaf"
      output: "amount/kg green leaf"
      source_ids: []
    - id: calc_green_to_cured_leaf
      applies_to: "cured route"
      rule: "green-leaf-normalized amount × green-leaf input / cured output"
      inputs:
        - masses
        - moisture
        - rejects
      output: "amount/kg cured leaf"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_content
      applies_to: "nutrient supply"
      rule: "product amount × declared nutrient fraction"
      inputs:
        - identity
        - amount
        - assay
      output: "nutrient by product"
      source_ids: []
    - id: calc_managed_soil_emissions
      applies_to: "field emissions"
      rule: "applicable IPCC/regional method using inputs, residues, volatilization, and leaching"
      inputs:
        - activity
        - soil
        - climate
        - factors
      output: "emissions by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_curing_combustion
      applies_to: "curing"
      rule: "fuel quantity × carrier-specific factor; purchased electricity is not on-site combustion"
      inputs:
        - carrier
        - amount
        - factor
      output: "pollutant/batch"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_curing_mass_balance
      applies_to: "curing"
      rule: "green wet mass = cured leaf + rejects + water/other loss within uncertainty"
      inputs:
        - masses
        - moisture
      output: "reconciled outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_grading_mass_balance
      applies_to: "grading"
      rule: "input = accepted + downgraded + rejects + loss; count rework once"
      inputs:
        - "batch masses"
        - routes
      output: "reconciled grades"
      source_ids:
        - mass-balance-identity
    - id: tobacco_planting_material_input_identity_and_fate
      applies_to: "tobacco_field_production"
      rule: "For the original tobacco_planting_material_input collection role at this operation, identify the actual physical form, species/material, composition, state and supply/treatment boundary before creating exchanges. Each seed lot, transplant, crown, cutting, larval stage, formulation, coating, preservative or separated residue actually used/generated requires its own concrete card where relevant to this role; these examples are alternatives, not a required recipe. Retain existing collection records and route-specific source evidence. Count-based planting records require measured or supplier-supported mass-per-unit when matched to a mass-based provider; retain count and mass as linked attributes rather than two purchases. Do not merge separate husk/shell or separate agents. A real mixed stream requires composition and recipient evidence and is counted once. Before completeness, record every applicable amount and native unit, link a compatible verified UUID or explicitly unresolved identity, preserve stock/return attribution, and normalize the attributable raw quantity once to the accepted reference output. Missing records are not zero; aggregate ranges are not individual-input defaults."
      inputs:
        - cp_field_records
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
    - id: calc_managed_land_coverage
      applies_to: "actual managed-production nodes"
      rule: "For each actual owned managed-production site, collect the occupied area and dated occupation intervals, including attributable establishment/immature and production periods. Occupation is area multiplied by actual duration, converted explicitly to the selected area-time unit (1 ha = 10,000 m2; time in years); hectares per crop-cycle alone are not an area-time result without duration. Partition or take the union of overlapping establishment/management intervals so the same area-time is counted once, with shares across actual co-users summing to one. Record evidenced land transformation separately by actual from/to land class, event area and date under the declared land-use method; transformation has area units and is not added to occupation. Planting, continued occupation or missing prior-land data do not establish a transformation or zero transformation. Preserve actual historical-event attribution and carbon-stock/emission method coverage where applicable; no invented land conversion or generic carbon credit. Instantiate separate compatible elementary identities with verified UUIDs or explicit unresolved identities; attribute once and normalize to the matched final reference. Purchased completed biological inputs inherit compatible upstream land coverage once instead of duplicating it locally. Missing applicable land identity, area, duration or prior-state evidence remains a completeness gap; documented no transformation is a valid absence."
      inputs:
        - cp_phase1_environment_coverage
      output: "attributed native environmental quantities per matched final reference"
      source_ids: []
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "reference"
      requirement: "Distinguish green/cured and air/fire/flue/sun route; retain variety, grade, moisture, crop year, gate."
      evidence: "crop, curing, grade, sales records"
    - id: dq_temporal_alignment
      applies_to: "all rows"
      requirement: "Match field, harvest, curing, grading, energy, and outputs to the same crop/batches; disclose proxies."
      evidence: "dated records"
    - id: dq_mass_moisture
      applies_to: "transformations"
      requirement: "Use calibrated masses and paired moisture at green, cured, and packed states."
      evidence: "calibration; moisture records"
    - id: dq_route_completeness
      applies_to: "curing"
      requirement: "Record energy carrier and combustion location; zero energy requires passive-route evidence."
      evidence: "barn log; invoice; meter"
    - id: dq_identity_resolution
      applies_to: "parameterized/unresolved"
      requirement: "Resolve every emitted exchange to one verified UUID before process publication."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_terminal_route
    applies_to: "reference"
    rule: "Select exactly one terminal route: 1,000 kg green or 1,000 kg cured graded leaf; forbid fresh UUID for cured leaf."
    source_ids: []
  - rule_id: validation_curing_method
    applies_to: "cured route"
    rule: "Declare one primary curing method per batch and include its energy, barn service, emissions, rejects, and hand-off."
    source_ids:
      - who-tobacco-environment-2017
  - rule_id: validation_mass_balance
    applies_to: "harvest/curing/grading"
    rule: "Reconcile mass, moisture, grades, rework, rejects, and losses within documented uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrient_emissions
    applies_to: "field"
    rule: "Reconcile nutrient/residue N with N2O, NH3, and nitrate methods without duplicate pathways."
    source_ids:
      - ipcc-2019-managed-soils
      - emep-eea-2023-guidebook
  - rule_id: validation_rework
    applies_to: "curing/grading"
    rule: "Link rework to origin and count once; rejected material cannot be accepted reference product."
    source_ids: []
  - rule_id: validation_shared_assets
    applies_to: "barns/meters/equipment"
    rule: "Apply one attribution driver per period and prevent double counting."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unmanufactured tobacco leaf production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCA of green or cured unmanufactured tobacco preserving geography, crop year, state, curing technology, grade, moisture, gate, and allocation"
  excluded_use: "manufactured tobacco/nicotine products or a different curing route, grade, geography, or gate without reviewed proxy decision"
  required_metadata: "variety/market class; geography; crop year; area; yield; terminal state/gate; curing method; barn/energy; moisture; grade; packaging; residue/reject fate; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy periods; missing records; range exceedances; emission methods; meter/fuel reconciliation; mass/moisture balance; unresolved identities"
  update_trigger: "reviewed route evidence, technology or emission-method change, concrete flow identity verification"
data_sources:
  - id: "who-tobacco-environment-2017"
    type: "official_guidance"
    reference: "WHO, Tobacco and its environmental impact: an overview, 2017, https://iris.who.int/bitstream/handle/10665/255574/9789241512497-eng.pdf"
