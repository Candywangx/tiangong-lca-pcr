      evidence: "completeness review"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference"
    rule: "Fail whole fresh coconut, fresh meat, oil, press cake or meal and any fresh/unprocessed description lacking dry-state qualifiers."
    source_ids:
      - fao-coconut-postharvest-compendium
  - rule_id: validate_moisture
    applies_to: "copra"
    rule: "Require measured value, basis, method and lot; investigate values outside 5–12% wet-basis screen."
    source_ids:
      - fao-coconut-postharvest-compendium
      - fao-aflatoxin-copra
  - rule_id: validate_route
    applies_to: "drying"
    rule: "Require route, heat source, smoke contact, time and route-specific energy."
    source_ids:
      - fao-coconut-postharvest-compendium
  - rule_id: validate_nutrients
    applies_to: "nutrient inputs"
    rule: "Require one atomic product exchange per fertilizer or amendment actually used, with recorded quantity, composition and independently verified or disclosed unresolved identity."
    source_ids: []
  - rule_id: validate_bindings
    applies_to: "cards"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejects"
    rule: "Require destination and keep rejects out of accepted output."
    source_ids: []
