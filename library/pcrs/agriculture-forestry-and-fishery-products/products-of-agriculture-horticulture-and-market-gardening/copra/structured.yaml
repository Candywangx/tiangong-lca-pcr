allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "all nodes"
    rule: "Subdivide by site, crop period, route and lot; use direct measurement first."
    source_ids: []
  - rule_id: multi_output
    applies_to: "production and drying"
    rule: "Enumerate accepted, downgraded, husk, shell, residue and waste hand-offs; use dry-matter mass only when physical causality cannot be established."
    source_ids: []
  - rule_id: internal_fuel
    applies_to: "husk or shell fuel"
    rule: "Count internal transfer and combustion once; do not also claim sold co-product output."
    source_ids: []
  - rule_id: rework
    applies_to: "rejects"
    rule: "Record rework, downgrade, recovery or disposal and incremental burdens once; exclude rejected mass from accepted output."
    source_ids: []
  - rule_id: multi_period
    applies_to: "crop and storage periods"
    rule: "Link events to the affected period and prevent double attribution to batch and annual totals."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_coconut_production
      process_id: "coconut_production"
      flow_role: "all cards"
      record_type: "lot and meter records"
      raw_fields: "identity, mass, moisture, route, energy, destination"
