system_boundary:
  rules:
    - rule_id: boundary_required_foreground
      applies_to: "All datasets"
      rule: "Include propagation setup, nursery growth or spawn incubation, grading, quality screening, and producer-gate preparation performed by or for the reporting producer. Include associated water, energy, growing media or carriers, nutrient and crop-protection inputs, containers, packaging, yields, rejects, wastewater, and on-site waste handling."
      source_ids:
        - wur-floripefcr-2024
        - fao-quality-planting-material
    - rule_id: boundary_route_conditionals
      applies_to: "Route-specific operations"
      rule: "Include sterilization, aseptic transfer, inoculation, incubation, and contamination removal for mushroom-spawn production when performed. Include protected-environment heating, cooling, lighting, ventilation, irrigation recirculation, field operations, and phytosanitary treatment only when they occur in the declared plant-production route."
      source_ids:
        - fao-mushroom-cultivation-2001
        - ippc-ispm-36-2012
        - wur-floripefcr-2024
    - rule_id: boundary_recursive_input
      applies_to: "Same-category propagation inputs"
      rule: "Stop category recursion at the declared starting condition: represent purchased same-category material with an upstream dataset and a disclosed quantity, supplier, health or quality state, and proxy status."
      source_ids:
        - ippc-ispm-36-2012
    - rule_id: boundary_downstream_exclusion
      applies_to: "Post-gate stages"
      rule: "Exclude outbound distribution, retail, planting at the customer site, subsequent cultivation, harvest of crops or mushrooms, use-stage care, and end-of-life unless the study goal explicitly expands the boundary and reports those stages separately."
      source_ids:
        - wur-floripefcr-2024
        - ingram-et-al-2019-landscape-plants
    - rule_id: boundary_traceability
      applies_to: "Biological identity and plant health"
      rule: "Maintain forward and backward lot traceability, source-material identity, examinations, pest or contamination findings, corrective actions, treatments, and sanitation records for the foreground production period."
      source_ids:
        - ippc-ispm-36-2012
        - fao-mushroom-cultivation-2001
boundary_abstraction:
  declared_starting_condition: "Source plant, bulb, root, cutting, slip, tissue culture, mother-stock derivative, fungal culture, spawn inoculum, or other propagation input as received or established for the declared route"
  starting_condition_role: "Upstream propagation input or internally maintained biological source entering the foreground production system"
  product_classification_scope: "Products conforming to the semantic boundary of CPC 3.0 code 01961; classification is mapping context and does not define the canonical PCR identity"
  recursive_input_rule: "A purchased input that is itself in this product category is recorded once as an upstream product input. Do not recursively reconstruct its nursery or spawn-production inventory inside the receiving process."
  upstream_dataset_requirement: "Use a supplier-specific or representative upstream dataset for purchased same-category propagation material, growing media, carriers, fertilizers, energy, containers, and other material inputs; disclose any proxy, geography mismatch, or omitted upstream burden."
  disclosure: "Declare source-material origin and health status, production route, protected or open production, soil or soilless system, container and growing-medium configuration, mushroom-spawn carrier, producer-gate point, excluded downstream stages, and any same-category input treated by the recursive rule."
