allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "Shared production lines and operations"
    rule: "Subdivide processes and use meters, batch logs, material issues, or direct labour or equipment records before applying allocation. Keep nursery production, spawn production, and materially different protected, field, or laboratory routes separate where records permit."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_shared_space_time
    applies_to: "Shared nursery, greenhouse, field, clean-room, incubator, and gate utilities"
    rule: "Allocate unmetered shared burdens using the closest causal driver: occupied area-time and plant density for nursery space; measured load, chamber volume-time, or cycle time for sterilizers and incubators; throughput mass or handling time for grading. Report the driver and sensitivity."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_saleable_and_rejects
    applies_to: "Saleable product and non-saleable biological material"
    rule: "Treat rejects and contaminated material as waste when they have no intended product function or revenue. Do not assign an avoided-burden credit merely because they are composted, disinfected, reused, or sent to another treatment."
    source_ids:
      - ippc-ispm-36-2012
      - fao-mushroom-cultivation-2001
  - rule_id: allocation_multiple_saleable_products
    applies_to: "Multiple saleable species, grades, propagule types, or co-products"
    rule: "Prefer separate batch inventories or physical allocation by measured mass, occupied area-time, batch load, or another demonstrated causal relation. If no defensible physical relation exists, economic allocation may be used only with prices, period, currency, shares, and sensitivity disclosed."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: allocation_mother_stock
    applies_to: "Mother plants, stock cultures, and reusable source systems"
    rule: "Allocate measured maintenance and renewal burdens across the propagules or spawn batches produced during the represented productive period. Do not allocate historic establishment burdens without a documented service life and output basis."
    source_ids:
      - ippc-ispm-36-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_material
      process_id: "propagation_setup"
      flow_role: "Source biological propagation material"
      record_type: "Supplier receipt, internal transfer, and lot-identity record"
      raw_fields: "supplier; source lot; taxon; cultivar, clone, or strain; material type; origin; received mass; count; health or contamination status; treatment; destination batch"
      collection_method: "Reconcile receiving, transfer, quarantine, and production records by lot"
      unit: "kg; item; lot"
      frequency: "Every receipt or transfer"
      temporal_coverage: "Full represented production period"
      site_scope: "All source-material receiving points for included sites"
      aggregation_rule: "Sum mass and count by source lot and destination batch; retain rejected receipts separately"
      quality_evidence: "Supplier document, lot label, inspection or test record, and forward/backward traceability"
    - protocol_id: cp_medium_and_carrier
      process_id: "propagation_setup"
      flow_role: "Growing medium, substrate, or spawn carrier"
      record_type: "Batch formulation and issue record"
      raw_fields: "material identity; supplier; formulation; dry or as-received mass; moisture; reused mass; container or bed destination; carrier treatment"
      collection_method: "Weigh ingredients and reconcile inventory issues to prepared batches"
      unit: "kg; % moisture"
      frequency: "Every preparation batch"
      temporal_coverage: "Full represented production period"
      site_scope: "All media and carrier preparation for included products"
      aggregation_rule: "Sum by formulation and batch; do not combine peat, coir, mineral, soil, grain, or other materially different carriers without disclosure"
      quality_evidence: "Scale record, formulation sheet, supplier specification, and treatment log"
    - protocol_id: cp_water
      process_id: "propagation_setup_growth_and_incubation"
      flow_role: "Water input, recirculation, and discharge"
      record_type: "Meter, supplier invoice, tank, and irrigation-control record"
      raw_fields: "source; meter opening and closing; make-up volume; recirculated volume; incorporated volume; discharge volume; allocation driver; date"
      collection_method: "Read dedicated meters where available; otherwise reconcile site balance and documented allocation"
      unit: "m3"
      frequency: "Meter interval and each batch or irrigation cycle where available"
      temporal_coverage: "Full production cycle and at least the represented annual operating period for continuous sites"
      site_scope: "All included production zones and water sources"
      aggregation_rule: "Sum make-up water by source; keep recirculation and discharge separate; normalize to saleable output"
      quality_evidence: "Calibrated meter, invoice reconciliation, irrigation controller export, and water-balance check"
    - protocol_id: cp_nutrients_and_treatments
      process_id: "growth_and_incubation"
      flow_role: "Fertilizers, amendments, crop protection, disinfectants, and sanitation products"
      record_type: "Purchase, stock, mixing, and application record"
      raw_fields: "product; formulation; active ingredient; N, P, K content; opening stock; receipts; closing stock; applied mass; batch or area; date; treatment reason"
      collection_method: "Reconcile stock balance and application logs; retain product labels and concentration calculations"
      unit: "kg product; kg nutrient or active ingredient"
      frequency: "Every application or sanitation event; stock reconciliation at least monthly"
      temporal_coverage: "Full represented production period"
      site_scope: "All included production areas and clean or incubation rooms"
      aggregation_rule: "Sum formulated product and active or nutrient mass by product and batch; report unexplained stock variance"
      quality_evidence: "Invoice, stock record, application log, calibration record, label or safety data sheet"
    - protocol_id: cp_energy
      process_id: "growth_and_incubation_grading_and_gate_preparation"
      flow_role: "Electricity, fuel, heat, steam, cooling, and gate utilities"
      record_type: "Meter, fuel receipt, boiler, CHP, chamber-cycle, and equipment log"
      raw_fields: "carrier; meter opening and closing; purchased quantity; generated quantity; exports; efficiency; equipment; batch; operating time; allocation driver"
      collection_method: "Use submeters first; otherwise reconcile site energy and documented causal allocation"
      unit: "kWh; MJ; kg steam; native fuel unit"
      frequency: "Meter interval and every sterilization or major thermal cycle"
      temporal_coverage: "Full production cycle and represented annual operating period"
      site_scope: "All included buildings, fields, greenhouses, clean rooms, incubators, and gate areas"
      aggregation_rule: "Preserve carriers; sum by process and batch; subtract exports only as separately reported outputs"
      quality_evidence: "Meter calibration, invoice reconciliation, fuel log, boiler or CHP record, and cycle record"
    - protocol_id: cp_setup_yield
      process_id: "propagation_setup"
      flow_role: "Established propagation batch and setup rejects"
      record_type: "Batch mass-balance record"
      raw_fields: "source mass; medium or carrier mass; retained water; container mass; established batch mass; setup reject mass; unexplained difference"
      collection_method: "Weigh or count inputs, internal output, and rejects for the same batch boundary"
      unit: "kg; item; batch"
      frequency: "Every setup batch or representative sampled batches with coverage declared"
      temporal_coverage: "Full represented production period"
      site_scope: "All included setup routes"
      aggregation_rule: "Reconcile inputs to established batch, separately delivered container mass, rejects, and measured stock change"
      quality_evidence: "Signed batch sheet, scale checks, and mass-balance review"
    - protocol_id: cp_batch_yield_and_quality
      process_id: "growth_and_incubation_grading_and_gate_preparation"
      flow_role: "Viable transfer batch, saleable output, grade, and viability"
      record_type: "Production, grading, inspection, test, and packing record"
      raw_fields: "batch; taxon or strain; start date; end date; route; input count or mass; viable transfer mass; saleable net mass; count; grade; viability or establishment test; pest or contamination finding; rejected mass; weighing condition"
      collection_method: "Weigh and count the same lot; apply declared quality test and retain sample plan"
      unit: "kg; item; % viability; lot"
      frequency: "Every saleable batch"
      temporal_coverage: "Full production cycle; aggregate only comparable batches"
      site_scope: "All included production and grading sites"
      aggregation_rule: "Sum saleable net mass and count by homogeneous product and route; calculate weighted quality metrics from tested units"
      quality_evidence: "Calibrated scale, packing record, inspection or laboratory result, sample plan, and traceability record"
    - protocol_id: cp_packaging
      process_id: "grading_and_gate_preparation"
      flow_role: "Containers and packaging"
      record_type: "Bill of materials, issue, return, and reuse record"
      raw_fields: "article; material; mass per item; item count; recycled content; reusable trips; losses; supplier; destination batch"
      collection_method: "Weigh representative articles and reconcile issued and returned counts"
      unit: "kg; item; trip"
      frequency: "Each packaging specification and saleable batch"
      temporal_coverage: "Full represented production period"
      site_scope: "All gate preparation and packing operations"
      aggregation_rule: "Multiply verified mass per item by net issued count; divide reusable packaging by documented completed trips and include loss replacements"
      quality_evidence: "Supplier specification, sample weighing, stock reconciliation, and return log"
    - protocol_id: cp_waste_and_discharge
      process_id: "all_processes"
      flow_role: "Biological rejects, contaminated material, packaging waste, wastewater, and direct emissions"
      record_type: "Waste ticket, on-site treatment log, discharge meter, sample, and calculation record"
      raw_fields: "waste type; origin batch; mass or volume; contamination reason; treatment; destination; discharge volume; concentration; sample time; calculation method"
      collection_method: "Weigh transfers; meter discharges; pair representative samples with matching volumes; document on-site treatment"
      unit: "kg; m3; kg substance"
      frequency: "Every transfer or treatment batch; discharge sampling at declared frequency"
      temporal_coverage: "Full represented production period"
      site_scope: "All included waste and discharge points"
      aggregation_rule: "Sum gross outputs by type and destination; never net recycling or treatment credits against input quantities"
      quality_evidence: "Licensed transfer record, scale ticket, treatment log, laboratory result, and mass or water balance"
  calculation_rules:
    - id: calc_reference_mass
      applies_to: "Final saleable product"
      rule: "Net saleable reference mass = gross packed lot mass - detachable container and packaging mass - free water not part of the declared as-sold product. Include carrier or growing medium only when intentionally delivered as an inseparable product constituent."
      inputs:
        - cp_batch_yield_and_quality
        - cp_packaging
      output: "kg net saleable material"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_count_mass_conversion
      applies_to: "Count-based operating records"
      rule: "Items per kg = saleable item count / net saleable reference mass for the same sampled lot. Apply only to batches represented by the sampling plan."
      inputs:
        - cp_batch_yield_and_quality
      output: "item/kg and sampling coverage"
      source_ids:
        - fao-quality-planting-material
    - id: calc_inventory_normalization
      applies_to: "Every inventory row"
      rule: "Normalized amount = batch- or period-specific gross amount assigned to the product / net saleable reference mass from the same batch or represented period."
      inputs:
        - "Applicable collection protocol"
        - cp_batch_yield_and_quality
      output: "amount per kg reference product"
      source_ids: []
    - id: calc_setup_balance
      applies_to: "propagation_setup"
      rule: "Reconcile source material + medium or carrier + retained water + separately tracked containers = established batch + setup rejects + measured stock change + disclosed residual."
      inputs:
        - cp_source_material
        - cp_medium_and_carrier
        - cp_water
        - cp_setup_yield
        - cp_waste_and_discharge
      output: "kg and residual percentage"
      source_ids: []
    - id: calc_saleable_yield
      applies_to: "Growth, incubation, and grading"
      rule: "Saleable yield = net saleable reference mass / mass entering the represented growth or incubation batch. Report cull and contamination rates separately by cause."
      inputs:
        - cp_setup_yield
        - cp_batch_yield_and_quality
        - cp_waste_and_discharge
      output: "kg/kg and % rejects"
      source_ids:
        - fao-quality-planting-material
        - fao-mushroom-cultivation-2001
    - id: calc_discharge_emission
      applies_to: "Measured wastewater substances"
      rule: "Emitted mass = matched discharge volume × representative measured concentration, after unit conversion. Do not apply a sample from a different operating state without representativeness justification."
      inputs:
        - cp_water
        - cp_waste_and_discharge
      output: "kg substance"
      source_ids:
        - wur-floripefcr-2024
    - id: calc_shared_burden
      applies_to: "Unmetered shared operations"
      rule: "Allocate the gross shared amount using the declared causal driver and shares that sum to one. Use area-time and density, chamber load or volume-time, cycle time, throughput mass, or another documented driver appropriate to the operation."
      inputs:
        - cp_energy
        - "production and space records"
      output: "Allocated amount and allocation share"
      source_ids:
        - wur-floripefcr-2024
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "Product and source material"
      requirement: "Every saleable lot shall link backward to source material and production route and forward to the producer-gate batch. Record taxon, cultivar or strain where relevant, propagation type, and health or contamination status."
      evidence: "Lot register, labels, supplier documents, inspection or laboratory records, and batch linkage"
    - id: dq_measurement
      applies_to: "Mass, count, water, energy, and application data"
      requirement: "Use calibrated or verified instruments suitable for the measured range. Retain unit conversions, sampling design, meter allocation, and reconciliation residuals."
      evidence: "Calibration certificate, scale check, meter export, sampling record, and calculation workbook"
    - id: dq_temporal
      applies_to: "Foreground inventory"
      requirement: "Cover at least one complete production cycle for every represented route. Continuous operations shall additionally use a representative operating period of at least 12 months or disclose and justify shorter start-up or campaign data."
      evidence: "Dated production, meter, purchase, batch, and sales records"
    - id: dq_completeness
      applies_to: "Foreground boundary"
      requirement: "Include all required processes and all material water, energy, media or carrier, nutrient, treatment, container, packaging, yield, reject, wastewater, and direct-emission rows. Quantify or explicitly justify each omission."
      evidence: "Process map, input-output reconciliation, omission register, and reviewer sign-off"
    - id: dq_route_and_geography
      applies_to: "Upstream and foreground data"
      requirement: "Match species or strain, propagation route, protected or open production, substrate or carrier, technology, geography, and time as closely as available. Disclose every proxy and its expected direction of bias."
      evidence: "Dataset metadata, supplier geography, technology description, and proxy assessment"
    - id: dq_quality_and_health
      applies_to: "Saleable output"
      requirement: "Apply a declared marketable-grade and viability or establishment criterion. For plants for planting retain examination, pest-management, sanitation, corrective-action, and traceability records; for spawn retain contamination screening and incubation records."
      evidence: "Grade specification, sample plan, test result, examination log, sanitation record, and corrective-action record"
validation_rules:
  - rule_id: validation_identity
    applies_to: "Product identity"
    rule: "Fail when the required qualifiers do not identify a homogeneous product, route, market state, and producer-gate point, or when food, cut flowers, seed, substrate-only, harvested mushroom, or downstream cultivation is included without separation."
    source_ids: []
  - rule_id: validation_reference_mass
    applies_to: "Reference flow"
    rule: "Fail when net saleable mass cannot be reconciled to gross lot mass, included carrier or growing medium, detachable containers and packaging, and free water, or when count-to-mass conversion does not use the same representative lot."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validation_process_coverage
    applies_to: "Process inventory"
    rule: "Fail when any of propagation_setup, growth_and_incubation, or grading_and_gate_preparation is missing, or when route-conditional sterilization, incubation, protected-environment control, field operations, or phytosanitary treatment occurs but is omitted."
    source_ids:
      - fao-mushroom-cultivation-2001
      - ippc-ispm-36-2012
      - wur-floripefcr-2024
  - rule_id: validation_recursive_input
    applies_to: "Same-category inputs"
    rule: "Fail when a purchased same-category propagation input is neither linked to an upstream dataset nor disclosed as a proxy, or when its burdens are recursively reconstructed and double counted."
    source_ids: []
  - rule_id: validation_water_energy
    applies_to: "Water and utilities"
    rule: "Fail when make-up water, recirculation, discharge, electricity, heat, steam, or fuels are silently netted, duplicated, or merged across carriers, or when shared-site allocation lacks a causal driver and shares summing to one."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validation_material_inputs
    applies_to: "Media, carriers, nutrients, treatments, containers, and packaging"
    rule: "Fail when formulation or material identity, gross quantity, unit, and allocation to the represented batch are missing, or when nutrient or active-ingredient mass substitutes for formulated-product mass."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validation_spawn_route
    applies_to: "Mushroom spawn"
    rule: "Fail when carrier identity and moisture, sterilization or pasteurization record, inoculation and incubation batch, contamination screening, rejects, or product strain and viability criterion are missing."
    source_ids:
      - fao-mushroom-cultivation-2001
  - rule_id: validation_plant_health
    applies_to: "Plants for planting"
    rule: "Fail when source and lot traceability, examinations, pest or disease findings, sanitation, treatment, and corrective-action records required by the declared production or trade context are absent."
    source_ids:
      - ippc-ispm-36-2012
  - rule_id: validation_yield_waste_balance
    applies_to: "Yield, rejects, wastewater, and emissions"
    rule: "Fail when saleable output, setup rejects, culls, contaminated material, wastewater, and other material outputs are not gross-reported and reconciled, or when treatment or recycling credits are silently netted."
    source_ids:
      - ippc-ispm-36-2012
      - fao-mushroom-cultivation-2001
  - rule_id: validation_allocation
    applies_to: "Shared or multi-output systems"
    rule: "Fail when subdivision was feasible but not attempted, the chosen driver is unrelated to burden causation, economic allocation lacks price basis and sensitivity, or mother-stock burdens lack a documented productive period and output basis."
    source_ids:
      - wur-floripefcr-2024
  - rule_id: validation_no_functional_equivalence
    applies_to: "Interpretation and comparison"
    rule: "Fail any claim that equal kg results establish functional equivalence among different species, grades, propagule types, count per kg, viability, establishment performance, or spawn formulations."
    source_ids: []
  - rule_id: validation_tiangong_reference_identity
    applies_to: "Reference product flow"
    rule: "Validation remains inconclusive until a published Tiangong product flow semantically matching the declared planting or propagation material also carries a compatible mass flow property; do not substitute the CPC-matched CTUe-referenced generic flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground producer-gate data package for a homogeneous live planting or propagation material and declared route"
  downstream_use: "May be published as a secondary_dataset or background_dataset for crop establishment, nursery supply, vegetative propagation, grafting, or mushroom inoculation after review and UUID resolution; may support downstream process and lifecyclemodel projections"
  allowed_use: "Product footprinting, supply-chain inventory, production improvement, and background modelling where geography, technology, route, product state, quality, and reference-flow qualifiers are representative"
  excluded_use: "Functional-equivalence claims based only on kg; substitution among species, grades, propagule types, or spawn formulations without performance evidence; modelling edible crops, cut flowers, seeds, un-inoculated substrates, harvested mushrooms, or downstream cultivation as if covered by this producer-gate dataset"
  required_metadata: "PCR id and version; product and taxonomic identity; cultivar, clone, or strain where relevant; propagation-material type; production route; site and geography; reference period; producer-gate point; net-mass definition; count per kg where meaningful; carrier, growing medium, container, and packaging configuration; viability, grade, phytosanitary or contamination status; allocation; upstream proxies; Tiangong flow identities"
  required_quality_disclosure: "Primary-data share; temporal, geographic, and technological representativeness; instrument and sampling evidence; batch and mass-balance residuals; water and energy allocation; material and waste completeness; health and contamination checks; proxy limitations; unresolved Tiangong reference-product identity"
  update_trigger: "Change in species or strain, propagation route, carrier or growing medium, protected or open production, site, energy or water system, treatment regime, allocation method, product grade or viability criterion, packaging, upstream source, or correction of the Tiangong reference-product flow"
data_sources:
  - id: "ippc-ispm-36-2012"
    type: "standard"
    reference: "International Plant Protection Convention, *ISPM 36: Integrated measures for plants for planting*, adopted 2012, official PDF: https://www.ippc.int/static/media/files/publication/en/2016/01/ISPM_36_2012_En_2015-12-22_PostCPM10_InkAmReformatted.pdf (retrieved 2026-07-30)"
    used_for: "Plants-for-planting boundary, production-site plan, source and lot traceability, examinations, sanitation, pest management, records, corrective actions, growing-medium and irrigation-risk disclosure"
  - id: "wur-floripefcr-2024"
    type: "standard"
    reference: "Broekema et al., *Product Environmental Footprint Category Rules for Cut flowers and Potted plants: Final version*, Wageningen Economic Research Report 2024-023, DOI: https://doi.org/10.18174/549543 (retrieved 2026-07-30; used as 2024 method evidence, not as a claim of current validity after its stated 2025 validity date)"
    used_for: "Functional-unit structure, horticultural process boundary, water, energy, fertilizer, growing-medium, packaging, waste, primary-data, allocation, and quality-rule design"
  - id: "fao-quality-planting-material"
    type: "extension_guidance"
    reference: "FAO Family Farming Knowledge Platform / CIFOR-ICRAF, *Quality Planting Material through Good Nursery Management*, https://www.fao.org/family-farming/detail/en/c/1707870/ and linked full manual (retrieved 2026-07-30)"
    used_for: "Nursery production decomposition, marketable healthy planting-material quality, readiness for transplantation, nursery management, and foreground collection design"
  - id: "fao-mushroom-cultivation-2001"
    type: "extension_guidance"
    reference: "Food and Agriculture Organization of the United Nations, *Mushroom Cultivation for People with Disabilities: A Training Manual*, RAP Publication 2001/12, https://www.fao.org/4/ab497e/ab497e00.htm (retrieved 2026-07-30)"
    used_for: "Mushroom-spawn carrier preparation, sterilization, aseptic inoculation, incubation, contamination screening, rejects, sanitation, and recordkeeping"
  - id: "ingram-et-al-2019-landscape-plants"
    type: "literature"
    reference: "Ingram, Hall, and Knight, “Understanding Carbon Footprint in Production and Use of Landscape Plants,” *HortTechnology* 29(1), 2019, DOI: https://doi.org/10.21273/HORTTECH04220-18"
    used_for: "Corroboration of nursery and greenhouse foreground stages and the material relevance of energy, substrate, containers, fertilizer, and route-specific production conditions"
