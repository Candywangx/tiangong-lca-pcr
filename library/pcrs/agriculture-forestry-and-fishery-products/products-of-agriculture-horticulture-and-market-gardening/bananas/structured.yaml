      raw_fields: "material; unit mass; units; reuse status; batch; output mass"
      collection_method: "packaging count and specification reconciliation; Raw aggregation and attribution: sum packaging material per gate output and disclose reuse primary_packaging_input_specific_input: Operation banana_harvest_and_conditioning: Record the primary packaging that crosses the boundary before the declared gate, including reusable crates or pallets when the represented batch carries a documented share. Original quantity method: Use supplier specification and batch count; disclose material, unit mass, reuse status, and allocation to banana output. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
