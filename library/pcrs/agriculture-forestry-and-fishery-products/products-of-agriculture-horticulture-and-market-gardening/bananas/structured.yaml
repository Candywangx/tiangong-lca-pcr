      collection_method: "final scale and lot reconciliation; Raw aggregation and attribution: sum marketable output and final reject streams; normalize to 1,000 kg"
      unit: "kg wet bananas"
      frequency: "each dispatch lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale or lot record and grade record"
  calculation_rules:
    - id: calc_nutrient_mass
      applies_to: "fertilizer, manure, compost, mulch, and amendment rows"
      rule: "Product mass multiplied by the documented nutrient fraction; retain original product mass and nutrient basis."
      inputs:
        - "product invoice"
        - "nutrient concentration"
        - "application record"
      output: "kg N, kg P2O5, or kg K2O by cycle or year"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_cycle_normalization
      applies_to: "all crop-cycle and production-year inputs"
      rule: "Crop-cycle or production-year quantity divided by marketable fresh banana mass and multiplied by 1,000 kg."
      inputs:
        - "input record"
        - "marketable gate output"
      output: "normalized quantity per 1,000 kg output"
      source_ids: []
    - id: calc_plantation_attribution
      applies_to: "plantation establishment, replanting, ratoon renewal, and shared plantation inputs"
      rule: "Apply the documented stand-age, cycle-number, or production-year attribution rule to shared plantation inputs, then reconcile each cycle or year to its marketable output."
      inputs:
        - "plantation register"
        - dates
        - "input records"
        - "cycle output"
      output: "crop-cycle or production-year quantity"
      source_ids:
        - fao-banana-production-guide-2015
        - iso-14044-2006
    - id: calc_area_time
      applies_to: "plantation land occupation"
      rule: "Plantation or field area multiplied by the represented occupation period; disclose prior land use and any excluded land transformation."
      inputs:
        - "plantation register"
        - "crop or production dates"
      output: "area-time quantity"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_nitrogen_emission
      applies_to: "direct soil nitrous oxide and nutrient-loss rows"
      rule: "Apply the selected IPCC-compatible factor or site method to eligible nutrient inputs and declared residue fate; document factors and whether the result is reported as substance or element mass."
      inputs:
        - "nutrient records"
        - "residue records"
        - "method choice"
        - "soil or climate parameters"
      output: "kg substance emitted"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_gate_mass_balance
      applies_to: "harvest, conditioning, and gate preparation"
      rule: "Received harvest mass equals marketable gate output plus rejects, residue, wastewater-related solids, recovered product, and documented handling loss within measurement uncertainty."
      inputs:
        - "harvest tickets"
        - "conditioning records"
        - dispatch
        - routing
        - "and reject records"
      output: "reconciled mass balance"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_routing_balance
      applies_to: "residue and reject routing"
      rule: "Routed stream equals recovered product plus residual waste, treated wastewater, measured emissions basis, and any documented downstream transfer; do not credit an unverified destination."
      inputs:
        - "routed input"
        - "recovery record"
        - "treatment record"
        - "downstream receipt"
      output: "routing balance"
      source_ids:
        - fao-banana-production-guide-2015
        - iso-14044-2006
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_nutrient_records
        - cp_residue_and_reject_records
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flow and product records"
      requirement: "Declare banana form, cultivar or variety group, plantation or smallholder route, establishment or ratoon status, stand age or cycle number, gate, maturity, grade, wash or cooling state, packaging state, and residue or reject fate; resolve platform identities during foreground dataset construction where required."
      evidence: "lot record, product description, and reference-flow qualifiers"
    - id: quality_measurement
      applies_to: "inputs and outputs"
      requirement: "Prefer calibrated meters, scales, supplier invoices, nutrient plans, application logs, and treatment receipts; document estimation and allocation methods where direct measurement is unavailable."
      evidence: "meter calibration, scale record, invoice, receipt, or calculation sheet"
    - id: quality_temporal
      applies_to: "crop-cycle or production-year inventory"
      requirement: "Cover the full represented establishment or ratoon renewal, active management, harvest campaign, conditioning, routing, and gate hand-off period."
      evidence: "plantation register, application log, irrigation records, harvest tickets, batch sheets, and dispatch records"
    - id: quality_completeness
      applies_to: "crop-cycle or production-year balance"
      requirement: "Reconcile planting material, nutrients, irrigation, energy, crop protection, gross harvest, marketable output, field residue, rejects, wastewater, packaging, and routing streams."
      evidence: "crop-cycle or production-year input and mass reconciliation"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose annual or ratoon route, stand age or cycle number, irrigation source, nutrient basis, crop-protection products, harvest lots, washing, cooling, packaging, gate, and residue or reject destination."
      evidence: "dataset metadata and supporting records"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow and gate output"
    rule: "The declared reference output must be marketable fresh, unprocessed bananas at the declared gate and use mass in kg; processed banana products, retail products, and unqualified Musa products are outside this PCR."
    source_ids:
      - fao-banana-production-guide-2015
  - rule_id: validate_cycle_dates
    applies_to: "establishment, management, harvest, routing, and gate preparation"
    rule: "Establishment or ratoon renewal, applications, irrigation, harvest lots, conditioning, routing, and gate output must fall within the declared crop cycle or production year or be explicitly attributed to it."
    source_ids:
      - fao-banana-production-guide-2015
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: validate_nutrient_basis
    applies_to: "nutrient inputs and emissions"
    rule: "Product mass, nutrient concentration, nutrient basis, residue treatment, and emission calculation method must be present and internally consistent; do not count product mass and nutrient mass as the same exchange."
    source_ids:
      - fao-banana-production-guide-2015
      - ipcc-2019-refinement-afolu
  - rule_id: validate_mass_balance
    applies_to: "harvest, conditioning, and routing"
    rule: "Gross harvest and received mass must reconcile with marketable output, rejects, residue, wastewater-related solids, recovered product, downstream transfers, and losses within the declared measurement uncertainty."
    source_ids:
      - fao-banana-production-guide-2015
  - rule_id: validate_flow_identity_resolution
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Required qualifiers must be present, including cultivar or variety group, establishment or ratoon status, stand age or cycle number, harvest lots, maturity and grade, gate, washing, cooling, packaging, and residue, reject, and wastewater fate."
    source_ids:
      - fao-banana-production-guide-2015
      - globalgap-ifa-fruit-vegetables-v6
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh bananas at a farm-gate or pack-house gate"
  downstream_use: "secondary_dataset for fresh-banana product systems; background_dataset only when the provider explicitly publishes a representative regional or market-average dataset with the required metadata"
  allowed_use: "Comparative product studies, plantation or crop-cycle inventory modelling, farm improvement, and declared fresh-banana supply-chain assessments within the stated geography and product state"
  excluded_use: "Planting-material production, plantain or other Musa substitution without disclosure, dried, frozen, cooked, canned, retail, consumption, or downstream logistics after the declared gate; do not extrapolate across plantation ages, ratoon cycles, or conditioning routes without scenario disclosure"
  required_metadata: "product form; cultivar or variety group; plantation or smallholder route; establishment or ratoon status; stand age or cycle number; geography; dates or production year; harvest lots; declared gate; yield; irrigation source and quantity; nutrient basis; crop-protection program; washing and cooling; packaging; residue, reject, and wastewater fate"
  required_quality_disclosure: "temporal coverage, site scope, measurement versus calculated values, plantation-cycle attribution and allocation rules, mass-balance and routing results, platform identity resolution status, and all provisional estimates requiring replacement by foreground records"
  update_trigger: "change in cultivar or route, plantation age or cycle, irrigation method, nutrient program, crop-protection program, harvest form, wash or cooling line, packaging format, gate definition, residue or reject destination, or evidence that changes material quantities or boundary rules"
