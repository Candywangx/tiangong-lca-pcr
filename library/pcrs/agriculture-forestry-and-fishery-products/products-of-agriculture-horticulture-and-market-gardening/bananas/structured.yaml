      collection_method: "weigh each harvest lot or use documented lot reconciliation; Raw aggregation and attribution: sum gross harvest, marketable output, rejects, and losses by cycle or year"
      unit: "kg wet bananas"
      frequency: "each harvest lot or campaign"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot ticket, and grade record"
