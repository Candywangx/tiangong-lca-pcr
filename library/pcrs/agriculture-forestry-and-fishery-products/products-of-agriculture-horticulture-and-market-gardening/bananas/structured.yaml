      raw_fields: "area; unit; prior land use; planting or regrowth date; stand age; cycle number; crop dates; shared-use flag"
      collection_method: "verify register against field map and production records; Raw aggregation and attribution: calculate area-time and assign shared burdens with the declared rule"
      unit: "ha, m2, days, years, and crop-cycle identifier"
      frequency: "each crop cycle or production year"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field, plantation unit, or smallholder site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field map, production register, dates, and stand evidence"
    - protocol_id: cp_irrigation_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "crop irrigation and water withdrawal"
      record_type: "meter, pump, controller, or water-balance record"
      raw_fields: "source; meter start and end; event date; area; method; rainfall adjustment; withdrawal and return flow"
      collection_method: "meter reading or documented water-balance calculation; Raw aggregation and attribution: sum delivered irrigation and withdrawal by cycle, year, and source"
      unit: "m3"
      frequency: "each event or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meter or documented balance inputs"
    - protocol_id: cp_field_energy_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "plantation fuel and electricity"
      record_type: "fuel invoice, equipment activity log, and electricity meter"
      raw_fields: "fuel or electricity; equipment; operation; field; date; allocation basis"
      collection_method: "supplier record plus equipment or meter log; Raw aggregation and attribution: allocate shared operations by area, hours, throughput, or declared physical basis"
      unit: "L, MJ, or kWh"
      frequency: "each refuelling, operation, or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, equipment log, meter record, and allocation calculation"
    - protocol_id: cp_nutrient_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "nutrient and soil-amendment inputs"
      record_type: "nutrient plan, supplier invoice, and application log"
      raw_fields: "product; material description; nutrient concentration; date; area; quantity; method; soil or tissue test"
      collection_method: "reconcile product records with field application records; Raw aggregation and attribution: sum product and nutrient mass by cycle or year and declared basis nutrient_loss_emission_specific_emission: Use a declared surplus or loss-factor method based on nutrient records, soil or climate information, and documented water or soil pathway; do not estimate loss from purchase mass alone. Identify each applicable nutrient-loss substance and actual receiving compartment as a separate elementary exchange, with matched N/P activity, compatible factor basis and documented conversion from elemental to compound mass. Preserve the original crop-cycle/output normalization and actual upstream coverage; missing pathway records are not zero. Total nutrient loss is not one flow and must not all be assigned to nitrate or phosphate. Instantiate and verify the specific identities, or explicitly track unresolved identities, before dataset completeness. ipcc-2019-refinement-afolu"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label or supplier specification, soil or tissue evidence, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "crop-protection products and biosecurity actions"
      record_type: "treatment log, supplier record, and site hygiene register"
      raw_fields: "product; active ingredient; rate; area; date; target; equipment; hygiene action; site"
      collection_method: "record each application and relevant hygiene or biosecurity action; Raw aggregation and attribution: sum by product, active ingredient, action, and cycle or year crop_protection_input_specific_input: Operation managed_banana_crop_cycle: Record each crop-protection product or active ingredient used for the represented banana crop cycle, including the target and application method. Original quantity method: Sum supplier product quantity and, where available, calculate active-ingredient mass from the documented formulation. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg product, kg active ingredient, and declared action count"
      frequency: "each application or action"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "application log, product label, and site record"
    - protocol_id: cp_residue_and_reject_records
      process_id: "managed_banana_crop_cycle_banana_harvest_and_conditioning_banana_residue_and_reject_routing"
      flow_role: "field residue, rejects, trim, recovered material, and wastewater fate"
      record_type: "residue, reject, treatment, recovery, and destination record"
      raw_fields: "source stream; field or batch; date; wet or dry mass; volume; destination; recipient; quality basis"
      collection_method: "weigh or meter each stream and retain destination evidence; Raw aggregation and attribution: reconcile each source stream to recovered product, residual waste, treatment, or downstream transfer residue_reject_routing_input_specific_input: Record field residue, harvest rejects, conditioning trim, or wastewater entering an on-site or included recovery, treatment, composting, feed-use, or disposal route before the declared gate. Use the measured quantity and declared destination from the corresponding field, harvest, or conditioning record; do not duplicate a stream routed outside the boundary. This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied. fao-banana-production-guide-2015; globalgap-ifa-fruit-vegetables-v6"
      unit: "kg wet, kg dry, and m3"
      frequency: "each harvest lot, treatment batch, or routing event"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each field, plantation unit, preparation line, or treatment route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale or meter record, recipient record, and treatment or disposal receipt"
