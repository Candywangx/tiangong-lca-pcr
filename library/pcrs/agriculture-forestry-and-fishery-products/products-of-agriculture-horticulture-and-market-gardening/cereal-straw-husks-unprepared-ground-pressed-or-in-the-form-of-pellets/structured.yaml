validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require cereal, straw/husk, form, moisture fraction and basis, grade, route and plant gate."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Verify a distinct product identity against the actual cereal, straw versus husk, preparation state, feed grade and plant-gate hand-off before UUID binding. The cached Straw definition describes dry cereal stalk after grain and chaff removal and does not establish a husk identity; it is not a universal binding for this PCR. Keep identity explicitly unresolved until supported. Exclude chemical treatment, complete feed and fuel-only products."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Unprepared bypasses size reduction and forming; ground uses size reduction; pressed or pelletized uses forming; inactive nodes carry zero."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Every node declares before/after states, service roles, loss, reject and hand-off; every intended output has one destination."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Secondary origin requires evidence and an explicit inherited, allocated or cut-off burden decision with no duplication."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Rework links producing and receiving runs, and rejected material cannot be accepted output."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Shared batch or continuous-period inputs are assigned once."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Wet-mass and dry-matter balances separate water change from dry-matter loss."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Parameterized Product inputs resolve to verified UUIDs during foreground generation."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "The recovered-material set is inapplicable because its current groups cover recycled metal and paper fibre, not cereal residues. Nutrient, construction and waste-treatment sets are also inapplicable to this physical route."
    source_ids: []
