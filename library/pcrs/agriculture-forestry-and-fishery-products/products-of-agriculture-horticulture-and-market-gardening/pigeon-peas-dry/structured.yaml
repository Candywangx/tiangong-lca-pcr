allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "All nodes"
    rule: "Subdivide field, flush, lot, batch, technology and rework records before allocation when independent measurements exist."
    source_ids: []
  - rule_id: allocation_crop_cycle
    applies_to: "Shared cultivation"
    rule: "Attribute shared cultivation burdens once across all flushes in proportion to dry accepted and downgraded grain mass unless a reviewed causal method is used; never reapply them per flush."
    source_ids: []
  - rule_id: allocation_intended_outputs
    applies_to: "Grain, stems and pods"
    rule: "Treat outputs as co-products only with production intent, quality state, recipient and hand-off. Apply one declared economic, physical or reviewed causal method to the complete intended-output set and disclose sensitivity."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Re-drying and re-cleaning"
    rule: "Returned material retains prior burdens; add incremental burdens once and do not count returned mass as new input or accepted output before release."
    source_ids: []
  - rule_id: allocation_reject_exit
    applies_to: "Downgrade and waste"
    rule: "Downgraded outputs follow the complete-output attribution rule; treatment of waste remains with the producing node unless a disclosed downstream waste convention applies."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation
      process_id: "managed_cultivation"
      flow_role: "inputs, mature crop, loss, soil-emission activity"
      record_type: "field-cycle record"
      raw_fields: "field; area; dates; variety; crop system; seed; actual nutrient products/composition; irrigation; protection; energy; residue management; yield/loss"
      collection_method: "invoices, logs, meters, sampling and reconciliation; Raw aggregation and attribution: aggregate by field/cycle then normalize by accepted grain"
      unit: "native units, ha, kg"
      frequency: "each event; crop-cycle summary"
      temporal_coverage: "full crop cycle"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dates, calibration, labels, reconciliation"
    - protocol_id: cp_harvest
      process_id: "harvest_capture"
      flow_role: "crop input, services, collected state, loss"
      record_type: "harvest-lot/flush record"
      raw_fields: "field; cycle; route; flush; maturity; date; crop estimate; service; collected mass; retained crop; loss"
      collection_method: "scale, sampling and operation log; Raw aggregation and attribution: keep routes/flushes separate and reconcile states"
      unit: "kg and service units"
      frequency: "every lot/flush"
      temporal_coverage: "all contributing flushes"
      site_scope: "every field/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lot id, scale check, maturity evidence"
    - protocol_id: cp_predrying
      process_id: "field_floor_drying"
      flow_role: "wet input, dry output, moisture and loss"
      record_type: "drying-lot record"
      raw_fields: "lot; location; time; protection; input/output mass and moisture; damage; spill"
      collection_method: "scale, moisture meter and lot log; Raw aggregation and attribution: report water removal separately from physical loss"
      unit: "kg, %, day"
      frequency: "every lot"
      temporal_coverage: "full interval"
      site_scope: "every drying place"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, traceability, inspection"
    - protocol_id: cp_conditioning
      process_id: "thresh_clean_grade"
      flow_role: "batch input, services, grades, co-product and reject"
      record_type: "batch record"
      raw_fields: "batch; source lot; technology; input; moisture; energy; cleaning/changeover; outputs; grade; damage; destination"
      collection_method: "scale, meter, service and grade records; Raw aggregation and attribution: reconcile before grade/destination aggregation"
      unit: "kg, %, energy/service"
      frequency: "each batch/changeover"
      temporal_coverage: "all contributing batches"
      site_scope: "every route/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, lineage, destination receipt"
    - protocol_id: cp_final_drying
      process_id: "final_drying_rework"
      flow_role: "input, energy, moisture, release, downgrade and reject"
      record_type: "drying/rework batch"
      raw_fields: "batch; origin; reason; input/output mass/moisture; route; temperature; duration; energy; grade; destination"
      collection_method: "scale, moisture/temperature/time/energy records; Raw aggregation and attribution: retain prior burdens, add incremental burdens once, reconcile outputs"
      unit: "kg, %, °C, hour, energy"
      frequency: "every pass"
      temporal_coverage: "full intervention"
      site_scope: "every route/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, lineage, release record"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: calc_moisture
      applies_to: "Wet/dry mass"
      rule: "dry matter = wet mass × (1 - wet-basis moisture fraction); water removed preserves dry matter."
      inputs:
        - "mass and moisture"
      output: "dry matter and water removed"
      source_ids:
        - mass-balance-identity
    - id: calc_normalization
      applies_to: "All activities"
      rule: "Sum only linked records, divide by accepted as-delivered grain and multiply by 1,000 kg."
      inputs:
        - "linked quantities and accepted grain"
      output: "quantity per reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_soil_n2o
      applies_to: "N additions and residues"
      rule: "Apply the declared applicable IPCC or reviewed national Tier method, including relevant direct, volatilization/deposition and leaching/runoff pathways."
      inputs:
        - "N composition"
        - "residue N"
        - factors
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-managed-soils-2019
    - id: calc_reconciliation
      applies_to: "Every lot/batch"
      rule: "Input dry mass equals accepted, intended co-product, downgrade, reject and physical-loss dry mass; rework return is a transfer."
      inputs:
        - "linked input/output mass and moisture"
      output: "variance and completeness flag"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference output"
      requirement: "Confirm species, whole-grain state, farm-gate status, grade, moisture, damage and foreign matter."
      evidence: "release and specification"
    - id: dq_temporal
      applies_to: "Route lineage"
      requirement: "Cover every input event, flush, drying lot, batch and rework pass."
      evidence: "field-to-gate lineage"
    - id: dq_completeness
      applies_to: "Output states"
      requirement: "Classify every output as accepted, downgrade, intended co-product, rework, residue, waste or loss."
      evidence: "reconciled balance"
    - id: dq_measurement
      applies_to: "Quantities"
      requirement: "Use calibrated or verified equipment and state estimation methods and uncertainty."
      evidence: "calibration and records"
