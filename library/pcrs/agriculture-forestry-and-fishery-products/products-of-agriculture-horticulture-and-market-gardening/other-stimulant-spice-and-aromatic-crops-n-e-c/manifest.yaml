    status: unresolved
    note: This PCR is limited to single-species, single-plant-part, unmixed and
      unextracted agricultural crop products at harvest or the first
      primary-conditioning handoff. The CPC 3.0 explanatory note for 01699
      includes curry powders and pastes; this PCR excludes those manufactured
      mixtures. The accepted edge must therefore use the reviewed narrower
      relation and must not claim exact coverage of the full CPC leaf.
