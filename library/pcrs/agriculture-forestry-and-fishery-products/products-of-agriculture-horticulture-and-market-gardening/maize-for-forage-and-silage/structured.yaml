allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "field and harvest nodes"
    rule: "Prefer subdivision by field-season, irrigation route and harvest technology; normalize measured burdens once to accepted fresh output."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_output_destinations
    applies_to: "accepted, downgraded and discarded biomass"
    rule: "Treat accepted reference output, downgraded product and waste/loss as mutually exclusive destinations. If downgraded biomass is an independently intended co-product, apply a disclosed study-specific physical dry-mass allocation when causal; otherwise use and justify another method. Do not credit uncollected residue without a documented substitution claim."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_run_period
    applies_to: "fields, runs and lots"
    rule: "Use a single-period crop-cycle boundary. Link inputs, outputs, cleaning and changeover events to the field-season or harvest lot; allocate shared machinery burdens once by measured area, runtime or throughput and prevent double counting across strata."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rejects
    applies_to: "off-spec and rejected biomass"
    rule: "This fresh farm-gate route has no in-boundary rework loop. Route every off-spec mass to accepted after documented reassessment, downgraded alternate use, field retention or disposal; retain prior burdens and count mass only at its final destination."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_residual_precedence
    applies_to: "remaining common burden with no specified primary branch"
    rule: "Resolve any study-specific joint-product instruction in this PCR that has no specified primary branch using this precedence; retain an already explicitly prescribed category-specific primary method. First directly assign separable output-specific activities. For the remaining common burden B, use a physical driver d_i only when measured operation or biological-service records demonstrate the causal consumption represented by that driver. A product being weighable, valuable or lower grade alone is insufficient; do not switch arbitrarily between area, time, mass and revenue. For comparable grades receiving the same common handling, measured processed mass is applicable only with the same service demand, state and moisture basis demonstrated. Share a_i=d_i/sum(d_j); B_i=B*a_i. If no defensible causal physical driver exists for that common operation, use gate- and period-matched economic shares a_i=(q_i*p_i)/sum(q_j*p_j), with the complete independently intended output set, compatible quantity/price units, currency, representative prices and values before output-specific downstream processing. Missing price or denominator evidence makes the allocated result incomplete, not a zero-priced product or a single-output system. Report shares summing to one and sensitivity to a material alternative; an alternative is not an interchangeable primary result. Waste, retained residues and internal transfers receive no co-product share, while their attributable production/handling burdens remain with the producing saleable route. Retain unallocated physical quantities and mass balances separately. This branch gives no automatic substitution credit; any separately scoped substitution analysis retains the gross inventory and its actual displaced-function evidence."
    source_ids:
      - ghg-protocol-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "seed, nutrient and crop-protection inputs"
      record_type: "invoice, field log and product analysis"
      raw_fields: "field; date; product; formulation; amount; area; nutrient or active content"
      collection_method: "reconcile purchase and application records by field; Raw aggregation and attribution: sum each actual product once; retain composition"
      unit: "kg; L; m3; ha"
      frequency: "each application"
      temporal_coverage: "crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, label, analysis and signed log"
    - protocol_id: cp_irrigation
      process_id: "field_production"
      flow_role: "delivered irrigation water"
      record_type: "meter or pump log"
      raw_fields: "field; event; volume; source; runtime; irrigated area"
      collection_method: "meter preferred; otherwise documented pump-flow calculation; Raw aggregation and attribution: sum delivered volume; zero for rainfed strata"
      unit: "m3; h; ha"
      frequency: "each event"
      temporal_coverage: "crop cycle"
      site_scope: "each irrigated field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration or pump curve"
    - protocol_id: cp_energy_operations
      process_id: "all"
      flow_role: "field and harvest energy"
      record_type: "fuel ticket, meter and machine log"
      raw_fields: "process; field/lot; carrier; quantity; runtime; area or throughput"
      collection_method: "reconcile purchases, meters and runtime; Raw aggregation and attribution: convert with documented factor and allocate once"
      unit: "L; kg; kWh; MJ; h"
      frequency: "each operation"
      temporal_coverage: "crop cycle through hand-off"
      site_scope: "field and harvest lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter calibration and machine log"
    - protocol_id: cp_field_and_lot_trace
      process_id: "all"
      flow_role: "area, route and lot linkage"
      record_type: "field GIS/record and lot register"
      raw_fields: "field; area; dates; crop; route; harvest lot; destination"
      collection_method: "Within each compatible route/product/state, calculate attributable raw totals by field first. Aggregate final intensity = sum(attributable raw quantities) * declared reference quantity / sum(matched accepted final outputs). When source quantities are per-ha rates e_h and y_h, first recover raw totals as e_h*area and y_h*area; do not area-weight field totals again. A per-product intensity is weighted by its matched output, not area or an unweighted mean. Apply existing allocation once, preserve period/throughput and all source-unit conversions, and keep incompatible routes separate."
      unit: "ha; date; id"
      frequency: "field-season and lot"
      temporal_coverage: "crop cycle through hand-off"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "map, field register and lot ticket"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "managed-soil and applied-substance releases"
      record_type: "calculation sheet, model or measurement"
      raw_fields: "N by source; residue N; fertilizer form; event; weather; soil; factors; active substance; compartment"
      collection_method: "apply disclosed IPCC tier and documented site models or measurements; Raw aggregation and attribution: calculate by field and substance before aggregation"
      unit: "kg N; kg substance; ha"
      frequency: "each event and crop cycle"
      temporal_coverage: "crop cycle"
      site_scope: "each field stratum"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor version, model inputs and calculation audit"
    - protocol_id: cp_harvest_mass_balance
      process_id: "harvest_handoff"
      flow_role: "standing input, accepted, downgraded and loss outputs"
      record_type: "scale, yield monitor, moisture sample and destination ticket"
      raw_fields: "field; lot; technology; inlet estimate; accepted mass; downgrade mass; loss sample; moisture; destination"
      collection_method: "weigh outputs and sample losses and whole-plant moisture representatively; Raw aggregation and attribution: moisture-align and reconcile exclusive destinations"
      unit: "kg; %; ha"
      frequency: "each field and lot"
      temporal_coverage: "harvest to immediate farm-gate hand-off"
      site_scope: "each harvest lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, sample plan and closure worksheet"
  calculation_rules:
    - id: calc_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = stratum amount × 1,000 / accepted fresh mass"
      inputs:
        - "stratum amount"
        - "accepted fresh mass"
      output: "amount per 1,000 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter
      applies_to: "biomass comparisons"
      rule: "dry matter = fresh mass × (1 − moisture fraction)"
      inputs:
        - "fresh mass"
        - "wet-basis moisture fraction"
      output: "dry-matter mass"
      source_ids:
        - mass-balance-identity
    - id: calc_n2o
      applies_to: "managed soil"
      rule: "Apply the disclosed IPCC tier to collected N inputs and convert N2O-N to N2O by 44/28 when required."
      inputs:
        - "N activity data"
        - "emission factors"
        - "indirect-loss parameters"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest_handoff"
      rule: "standing biomass = accepted + downgraded + discarded/uncollected + measured stock change, on one moisture basis and within declared uncertainty"
      inputs:
        - "linked masses"
        - "moisture and destinations"
      output: "mass closure"
      source_ids:
        - mass-balance-identity
    - id: chemical_species_mass_accounting
      applies_to: "elementary_nutrient_emissions"
      rule: "Final elementary exchanges use the mass of the identified substance and one actual receiving compartment. Keep nutrient/activity ledgers separate: species-specific N2O-N × 44/28 gives N2O, NH3-N × 17/14 gives NH3, nitrate-N × 62/14 gives nitrate, and phosphate-P × 95/31 gives phosphate. If the selected flow is elemental phosphorus instead, report kg P and convert phosphate mass by 31/95 only when that species basis is evidenced. Apply a conversion exactly once only when the method output is on the elemental basis; measured compound mass is not reconverted. Total nutrient losses cannot be assigned to a single species without a supported split, and residual/retained soil nutrient is not an emission. Keep direct/indirect pathway ledgers and avoid repeating a pathway already included in the chosen method or upstream inventory. Factor uncertainty ranges screen factors on their stated basis, not final compound amounts or admissible site emissions. Normalize the attributable compound mass once using the accepted reference quantity and the matched measured output. Unknown activity, identity or compartment remains an evidence gap and blocks a completeness claim."
      inputs:
        - cp_field_emissions
        - "species-specific activity ledger"
        - "method pathway and factor basis"
        - "matched accepted output"
      output: "Identity-specific exchanges and reconciled activity records"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain hybrid/cultivar, crop year, harvest stage, whole-plant moisture or dry matter, accepted specification and fresh unprocessed gate."
      evidence: "field register, sample and lot ticket"
    - id: dq_completeness
      applies_to: "crop cycle and harvest"
      requirement: "Cover every represented field operation, application, irrigation event, harvest operation and exclusive biomass destination."
      evidence: "field-to-lot trace and completeness reconciliation"
    - id: dq_representativeness
      applies_to: "aggregated dataset"
      requirement: "Report geography, crop year, fields, route shares, harvest technologies, moisture basis, accepted yield and aggregation weights."
      evidence: "metadata and stratum index"
    - id: dq_uncertainty
      applies_to: "calculated and modelled rows"
      requirement: "Retain factor versions, model inputs, measurement uncertainty, missing-data substitutions and reasons for any Range exception."
      evidence: "calculation workbook and QA log"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Require the fixed product, Mass and unit-group UUIDs, 1,000 kg reference amount and all required qualifiers."
    source_ids: []
  - rule_id: validate_gate
    applies_to: "system boundary"
    rule: "Reject any inventory that includes ensiling, fermentation, storage, drying, baling, feed manufacture, downstream transport or feeding inside the fresh farm-gate reference process."
    source_ids:
      - fao-forage-maize-harvest-stage
  - rule_id: validate_routes
    applies_to: "field and harvest strata"
    rule: "Declare rainfed or irrigated status and one harvest technology per stratum; keep mutually exclusive alternatives separate and include their evidenced inventory and record deltas."
    source_ids:
      - fao-crop-water-needs
      - mass-balance-identity
  - rule_id: validate_nutrient_cardinality
    applies_to: "field_production"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_batch_period
    applies_to: "fields, operations and harvest lots"
    rule: "Link inputs, outputs, cleaning and changeover to one field-season or harvest lot and assign shared burdens once by measured area, runtime or throughput."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routing
    applies_to: "off-spec biomass"
    rule: "Require one exclusive accepted, downgraded, field-retained or discarded destination; do not count an unresolved reject as accepted output and do not create an unrecorded rework loop."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_mass_balance
    applies_to: "harvest_handoff"
    rule: "Reconcile standing input, accepted product, downgraded product, waste/loss and stock change on a common moisture basis within declared uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "all flow cards"
    rule: "Check each supplied range for complete bounds, unit, basis, evidence and bilingual alignment. Require compatible quantitative evidence for any enforced limit. If no supported bound exists, retain measured quantities and explicitly report range screening unavailable; do not invent a range or declare that check complete. Investigate deviations rather than overwrite measured values."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground fresh forage-maize production dataset at farm gate"
  downstream_use: "secondary_dataset; background_dataset after representativeness review"
  allowed_use: "LCA and footprints requiring fresh unprocessed whole-crop maize at farm gate as forage or input to a separately modelled silage process"
  excluded_use: "maize grain, seed, sweet corn, ensiled/fermented material, dried forage, formulated feed or undisclosed downstream processing"
  required_metadata: "geography; crop year; fields/lots; hybrid/cultivar; prior crop; tillage; rainfed/irrigated route; harvest technology and stage; moisture/dry matter; accepted specification; destinations; allocation"
  required_quality_disclosure: "primary-data coverage; calibration; missing data; model and factor versions; route weights; mass balance; uncertainty; Range exceptions"
  update_trigger: "changed geography, crop year, hybrid, management, irrigation share, harvest technology/stage, moisture specification, destination, allocation or emission method"
data_sources:
  - id: "fao-forage-maize-harvest-stage"
    type: "official_guidance"
    reference: "FAO, Silage from tropical cereals and forage crops, https://www.fao.org/4/x8486e/x8486e0q.htm"
    used_for: "maize forage context and harvest-stage evidence; ensiling remains outside this PCR"
  - id: "fao-crop-water-needs"
    type: "official_guidance"
    reference: "FAO, Crop Water Needs, Chapter 3, https://www.fao.org/4/s2022e/s2022e07.htm"
    used_for: "maize seasonal crop-water range and local crop-factor context"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4 Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "managed-soil N2O calculation and nitrogen activity data"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied to moisture-aligned standing biomass, accepted product, downgraded biomass, loss and stock change"
    used_for: "hand-offs, mass closure, destination exclusivity, allocation and reject routing"
  - id: "ghg-protocol-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General allocation hierarchy and comparable-gate economic basis. Applicability conditions and the explicit residual branch are this PCR's method convention; no product-specific causal coefficient, price or output quantity is prescribed by this source."
