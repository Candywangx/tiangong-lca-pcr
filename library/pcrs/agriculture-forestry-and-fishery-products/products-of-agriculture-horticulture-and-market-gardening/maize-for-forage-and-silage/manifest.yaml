      requirement: "Required substance-release records: derive every applicable crop-protection release from the actually recorded formulation and the selected fate method. Create separate exchanges for each identified substance and receiving compartment, preserving chemical form and substance-mass basis. An unresolved substance or compartment remains a completeness gap, not a generic elementary exchange or an assumed zero."
