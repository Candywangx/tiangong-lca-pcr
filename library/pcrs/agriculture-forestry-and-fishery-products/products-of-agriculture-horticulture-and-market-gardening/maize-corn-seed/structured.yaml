measurement_rules:
  - id: reference_mass
    applies_to: "Saleable reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1,000 kg net saleable seed at the declared dispatch moisture; do not include pallets or secondary and tertiary transport packaging in reference mass."
  - id: moisture_basis
    applies_to: "Seed input, intermediate seed, rejects, and saleable seed"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and % moisture"
    rule: "Record mass and moisture on the same lot and state wet-basis or dry-basis convention. When converting, use dry mass = wet mass x (1 - wet-basis moisture fraction); do not silently compare masses at different moisture contents (fao-seeds-toolkit-processing-2018; fao-seeds-toolkit-quality-2018)."
  - id: nutrient_basis
    applies_to: "Fertiliser and organic amendment records"
    required_property_ref:
      name: "Product mass and nutrient mass"
      uuid: ""
    required_unit: "kg product and kg N, P2O5, K2O or declared nutrient"
    rule: "Preserve formulated-product mass and calculate nutrient inputs from recorded composition. Nitrogen used in IPCC equations must be expressed as kg N (ipcc-2019-managed-soils)."
  - id: treatment_basis
    applies_to: "Seed-treatment or coating material"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg product and kg active ingredient"
    rule: "Record formulated product and active ingredient separately and normalize both to 1,000 kg saleable seed; retain treated/untreated status and application rate."
  - id: energy_basis
    applies_to: "Field, conditioning, and storage energy"
    required_property_ref:
      name: "Energy or fuel volume with density and net calorific value"
      uuid: ""
    required_unit: "kWh, MJ, kg, or L as recorded"
    rule: "Preserve metered electricity and purchased fuel units. Any conversion must retain the conversion factor, source, and whether lower or higher heating value was used."
  - id: quality_test_basis
    applies_to: "Germination, purity, moisture, health, and varietal tests"
    required_property_ref:
      name: "Test result and sample basis"
      uuid: ""
    required_unit: "%, count, or declared laboratory unit"
    rule: "Store the sampling method, test method, sample size, laboratory, date, and pass/fail criterion with each result; do not substitute a certificate statement for the underlying lot result (fao-seeds-toolkit-quality-2018; eu-cereal-seed-directive-66-402)."
process_map:
  - id: seed_crop_production
    name: "Seed-crop establishment, genetic-purity management, and harvest"
    inclusion: "required"
    inclusion_condition: "Always included"
    role: "Foreground multiplication and harvest; TianGong process 3849645d-260b-42d7-98b0-9e3dc41b4f67 is a related maize-production identity reference only and supplies no PCR amount"
    quantitative_reference: "Per harvested seed-crop mass delivered from the field and normalized to 1,000 kg saleable seed"
  - id: field_to_conditioner_transport
    name: "Field-to-conditioning transport"
    inclusion: "conditional"
    inclusion_condition: "Include when harvested material moves between separately modelled field and conditioning sites; otherwise record zero distance and co-location"
    role: "Transport of harvested seed crop without duplicating vehicle burdens already included in field or conditioning records"
    quantitative_reference: "tonne-kilometres and transported wet mass normalized to 1,000 kg saleable seed"
  - id: conditioning_and_grading
    name: "Reception, drying, shelling, cleaning, and grading"
    inclusion: "required"
    inclusion_condition: "Always included; record route-specific operations that are not used as zero"
    role: "Foreground conversion of harvested seed crop into a clean, graded seed lot; TianGong process c1933b4e-86c6-4282-a27f-a06bf7ce85f7 is a generic conditioning identity reference only"
    quantitative_reference: "Per clean graded seed mass before treatment and normalized to 1,000 kg saleable seed"
  - id: treatment_testing_packaging_storage
    name: "Treatment, quality testing, packaging, storage, and dispatch"
    inclusion: "required"
    inclusion_condition: "Always include testing, packaging, storage, and dispatch; treatment or coating is included only when applied"
    role: "Final lot qualification and saleable product output"
    quantitative_reference: "1,000 kg net saleable maize seed at dispatch"
