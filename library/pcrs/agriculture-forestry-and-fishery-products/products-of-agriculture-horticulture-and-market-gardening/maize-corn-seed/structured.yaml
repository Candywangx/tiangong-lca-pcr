allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "separately_measured_fields_lots_and_operations"
    rule: "Avoid allocation by subdividing field blocks, parental rows, batches, conditioning lines, storage zones, and separately metered operations whenever records allow direct assignment."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_recycling_internal_flows
    applies_to: "reprocessed_seed_and_internal_returns"
    rule: "Return reprocessed seed, recovered treatment mix, and internal packaging returns to the process as explicit internal flows; do not assign an avoided-product credit without an evidenced external function."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_physical_relationship
    applies_to: "unavoidable_joint_field_or_conditioning_burdens"
    rule: "When subdivision or system expansion is not practicable, allocate using an evidenced causal physical relationship. Use dry-mass allocation only when dry mass reasonably represents the shared process driver and preserve moisture measurements."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_economic_fallback
    applies_to: "co_products_without_causal_physical_relationship"
    rule: "If no defensible physical relationship exists, use a documented economic relationship based on contemporaneous prices at the point of separation, report the price basis and period, and test sensitivity to price variability."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_residue_fate
    applies_to: "residues_rejects_and_nonseed_maize"
    rule: "Treat material as a co-product only when it has an evidenced external function and destination. Waste treatment receives the measured waste flow; material left on field remains in the field process and is not credited as an avoided product."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_disclosure
    applies_to: "all_multifunctional_processes"
    rule: "Report the selected hierarchy step, products and wastes at each separation point, quantities and moisture, allocation factors, prices or physical relationship, and sensitivity result."
    source_ids:
      - eu-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_seed_and_lot_identity
      process_id: "seed_crop_production"
      flow_role: "source seed and lot identity"
      record_type: "purchase, certificate, issue, and sowing records"
      raw_fields: "supplier; lot; species; variety or hybrid; parental line; generation or class; scheme; treatment; mass; moisture; field; sowing date; upstream dataset"
      collection_method: "reconcile received, issued, returned, and sown quantities to field maps"
      unit: "kg and % moisture"
      frequency: "each lot and field"
      temporal_coverage: "full declared multiplication campaign"
      site_scope: "all included seed fields"
      aggregation_rule: "sum source-seed mass by lot and field; retain identity without blending unlike classes"
      quality_evidence: "supplier record; certificate or quality declaration; calibrated scale; field map; reconciliation"
    - protocol_id: cp_field_material_inputs
      process_id: "seed_crop_production"
      flow_role: "fertiliser, amendment, and crop-protection inputs"
      record_type: "invoice, stock, formulation, and application records"
      raw_fields: "product; formulation; active ingredient or nutrient fraction; quantity; stock movement; field; treated area; date; method"
      collection_method: "reconcile purchases and stocks to application logs"
      unit: "kg product; kg nutrient; kg active ingredient; ha"
      frequency: "each application and monthly stock close"
      temporal_coverage: "full declared multiplication campaign"
      site_scope: "all included fields"
      aggregation_rule: "sum by product and field, calculate nutrient or active-ingredient mass, then normalize by saleable output"
      quality_evidence: "invoices; batch labels; stock ledger; calibrated applicator; field log"
    - protocol_id: cp_field_energy
      process_id: "seed_crop_production"
      flow_role: "field fuel and electricity"
      record_type: "fuel issue, invoice, meter, and equipment-hour records"
      raw_fields: "fuel type; quantity; meter reading; equipment; operation; field; date; allocation driver"
      collection_method: "direct meter or tank record; allocate shared use by measured hours or field area with justification"
      unit: "L; kg; MJ; kWh; h"
      frequency: "each operation, delivery, or meter period"
      temporal_coverage: "full declared multiplication campaign"
      site_scope: "all included fields and directly controlled equipment"
      aggregation_rule: "sum by energy carrier and operation, preserve original units, normalize by saleable output"
      quality_evidence: "invoices; meter calibration; tank reconciliation; equipment logs"
    - protocol_id: cp_irrigation_water
      process_id: "seed_crop_production"
      flow_role: "supplied or directly abstracted irrigation water"
      record_type: "meter, pump, source, and irrigation-event records"
      raw_fields: "source; compartment; delivered or abstracted volume; pump runtime; flow rate; field; date; loss boundary"
      collection_method: "calibrated meter preferred; otherwise runtime x verified flow rate"
      unit: "m3"
      frequency: "each irrigation event or meter period"
      temporal_coverage: "full irrigation season"
      site_scope: "all irrigated included fields"
      aggregation_rule: "sum by source and field; prohibit duplication between product supply and elementary abstraction"
      quality_evidence: "meter calibration; pump test; water right or supplier invoice; field log"
    - protocol_id: cp_field_output_and_residues
      process_id: "seed_crop_production"
      flow_role: "harvested seed crop, co-products, rejects, and residues"
      record_type: "scale, container, field-sampling, moisture, and destination records"
      raw_fields: "field; lot; output type; wet mass; moisture; dry matter; destination; date"
      collection_method: "calibrated scale; approved stratified field sampling for retained residues"
      unit: "kg wet; kg dry matter; % moisture"
      frequency: "each harvest load and residue survey"
      temporal_coverage: "harvest period for the full campaign"
      site_scope: "all included fields"
      aggregation_rule: "reconcile field output and fate by lot; convert moisture basis explicitly; normalize by saleable output"
      quality_evidence: "scale tickets; moisture tests; field sampling plan; destination receipts"
    - protocol_id: cp_field_transport
      process_id: "field_to_conditioner_transport"
      flow_role: "harvested-seed transport"
      record_type: "dispatch, receiving, route, payload, and fuel or freight records"
      raw_fields: "lot; wet mass; dispatch moisture; received mass; received moisture; origin; destination; mode; vehicle; loaded distance; empty return"
      collection_method: "weighbridge and route records; distance from verified route"
      unit: "kg; t; km; tkm"
      frequency: "each load"
      temporal_coverage: "all field-to-conditioning movements in campaign"
      site_scope: "all included routes"
      aggregation_rule: "calculate tkm by load and route; reconcile dispatch and receipt after moisture adjustment"
      quality_evidence: "scale tickets; bill of lading; route evidence; receiving record"
    - protocol_id: cp_conditioning_mass_balance
      process_id: "conditioning_and_grading"
      flow_role: "seed input, clean output, rejects, dust, and stock change"
      record_type: "scale, moisture, bin, batch, reject, and destination records"
      raw_fields: "lot; operation; input mass and moisture; output mass and moisture; reject type; captured dust; uncaptured dust measurement; opening and closing stock"
      collection_method: "calibrated scales and bin inventory; direct dust measurement or approved factor"
      unit: "kg; % moisture"
      frequency: "each batch with campaign inventory close"
      temporal_coverage: "full conditioning campaign"
      site_scope: "all included conditioning lines and stores"
      aggregation_rule: "reconcile moisture-adjusted input = products + wastes + samples + stock change within measurement uncertainty"
      quality_evidence: "scale calibration; moisture tests; batch sheets; waste receipts; dust-control records"
    - protocol_id: cp_conditioning_energy
      process_id: "conditioning_and_grading"
      flow_role: "electricity, fuel, and heat"
      record_type: "meter, invoice, fuel stock, dryer, and equipment-hour records"
      raw_fields: "carrier; quantity; meter period; dryer inlet and outlet moisture; temperature; runtime; throughput; allocation driver"
      collection_method: "submeter preferred; otherwise documented allocation of facility meter or fuel stock"
      unit: "kWh; MJ; kg; L; h"
      frequency: "each batch, delivery, or meter period"
      temporal_coverage: "full conditioning campaign"
      site_scope: "all included conditioning equipment"
      aggregation_rule: "sum by carrier; allocate shared energy by causal measured driver; normalize to clean graded seed"
      quality_evidence: "meter calibration; invoice; fuel reconciliation; dryer log; equipment runtime"
    - protocol_id: cp_treatment_and_packaging_inputs
      process_id: "treatment_testing_packaging_storage"
      flow_role: "treatment, coating, packaging, and label inputs"
      record_type: "formulation, batch, issue, return, bill-of-material, and packed-unit records"
      raw_fields: "product; active fraction; issued and returned quantity; treated mass; packaging material; item mass; item count; lot"
      collection_method: "reconcile stock movement to applicator and packing records"
      unit: "kg product; kg active ingredient; kg packaging; item"
      frequency: "each treatment and packing batch"
      temporal_coverage: "full final-preparation campaign"
      site_scope: "all included treatment and packing lines"
      aggregation_rule: "sum by material and lot; calculate application rate; normalize by saleable output"
      quality_evidence: "product label; batch certificate; calibrated applicator; stock ledger; packaging specification"
    - protocol_id: cp_final_energy_and_storage
      process_id: "treatment_testing_packaging_storage"
      flow_role: "treatment, testing, packing, storage, and dispatch energy"
      record_type: "submeter, facility meter, equipment runtime, occupancy, temperature, and inventory records"
      raw_fields: "carrier; meter period; equipment; runtime; stored mass; floor area; storage start and dispatch date; temperature-control status"
      collection_method: "submeter preferred; otherwise documented causal allocation"
      unit: "kWh; MJ; kg; L; day"
      frequency: "meter period and each lot dispatch"
      temporal_coverage: "from final preparation through dispatch"
      site_scope: "all included final-preparation and storage areas"
      aggregation_rule: "allocate shared energy by measured equipment time, throughput, or mass-days; disclose driver"
      quality_evidence: "meter calibration; invoices; equipment logs; warehouse inventory; dispatch record"
    - protocol_id: cp_final_mass_balance
      process_id: "treatment_testing_packaging_storage"
      flow_role: "saleable seed, samples, rejects, spills, returns, and stock"
      record_type: "scale, pack count, net content, sample, reject, rework, and stock records"
      raw_fields: "lot; input mass and moisture; packed units; net unit mass; saleable mass; samples; rejects; rework; opening and closing stock"
      collection_method: "calibrated scales and package net-content checks"
      unit: "kg; item; % moisture"
      frequency: "each batch and lot close"
      temporal_coverage: "full final-preparation campaign"
      site_scope: "all included final-preparation lines and stores"
      aggregation_rule: "reconcile input = saleable output + samples + rejects + stock change after documented moisture adjustment"
      quality_evidence: "scale calibration; packing report; sample register; reject log; stock reconciliation"
    - protocol_id: cp_quality_tests
      process_id: "treatment_testing_packaging_storage"
      flow_role: "lot identity and quality"
      record_type: "sampling, laboratory, inspection, certificate, seal, and label records"
      raw_fields: "lot; sampling method; sample size; test method; laboratory; date; germination; analytical purity; varietal purity; moisture; health; result; criterion; certificate; seal; label"
      collection_method: "representative lot sampling and competent laboratory or official scheme procedure"
      unit: "%; count; declared test unit"
      frequency: "each saleable lot and required field inspection"
      temporal_coverage: "field inspection through dispatch"
      site_scope: "every included saleable lot and its source fields"
      aggregation_rule: "no averaging across lots that would conceal a failed criterion; retain individual results and scheme decision"
      quality_evidence: "sampling record; laboratory report; field inspection; certificate or quality declaration; label and seal (fao-seeds-toolkit-quality-2018; oecd-seed-schemes-2026; eu-cereal-seed-directive-66-402)"
  calculation_rules:
    - id: calc_normalize_reference_output
      applies_to: "all inventory rows"
      rule: "normalization factor = 1,000 kg / measured net saleable seed output; multiply each campaign inventory amount by this factor after any explicit moisture-basis conversion"
      inputs:
        - "measured saleable seed mass"
        - "inventory amount"
        - "moisture where converted"
      output: "amount per 1,000 kg saleable seed"
      source_ids: []
    - id: calc_moisture_conversion
      applies_to: "seed and residue mass comparisons"
      rule: "dry mass = wet mass x (1 - wet-basis moisture fraction); conversion back to a declared wet basis must show the target moisture fraction"
      inputs:
        - "wet mass"
        - "wet-basis moisture fraction"
        - "target moisture when used"
      output: "dry mass or explicitly converted wet mass"
      source_ids:
        - fao-seeds-toolkit-processing-2018
        - fao-seeds-toolkit-quality-2018
    - id: calc_nutrient_and_active_mass
      applies_to: "fertiliser and crop-protection products"
      rule: "nutrient or active-ingredient mass = formulated-product mass x declared mass fraction; keep formulated-product mass as a separate inventory amount"
      inputs:
        - "formulated-product mass"
        - "verified composition"
      output: "kg nutrient or active ingredient and kg formulated product"
      source_ids: []
    - id: calc_transport_work
      applies_to: "field-to-conditioning transport"
      rule: "transport work = sum over loads of transported wet tonnes x loaded distance in km; model empty return separately when applicable"
      inputs:
        - "load mass"
        - distance
        - mode
        - "empty return"
      output: "tkm per 1,000 kg saleable seed"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "managed-soil direct and indirect N2O"
      rule: "Apply the declared IPCC Tier 1, Tier 2, Tier 3, or approved national method to synthetic and organic N, returned residue N, mineralised soil N, volatilisation, and leaching or runoff terms; convert N2O-N to N2O by 44/28 and normalize to the reference output"
      inputs:
        - "kg N by source"
        - "residue N"
        - "applicable fractions and emission factors"
        - "climate or soil conditions"
        - "saleable output"
      output: "kg N2O per 1,000 kg saleable seed"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_conditioning_mass_balance
      applies_to: "conditioning and final preparation"
      rule: "moisture-adjusted input = saleable and intermediate product outputs + co-products + wastes + samples + change in stock; report residual and compare it with combined measurement uncertainty"
      inputs:
        - "lot masses"
        - moisture
        - stock
        - samples
        - rejects
        - co-products
      output: "mass-balance residual and closure percentage"
      source_ids: []
    - id: calc_allocation_factor
      applies_to: "unavoidable multifunctionality"
      rule: "selected allocation factor for each output = its declared physical or economic driver divided by the sum of that driver across co-products at the separation point; report unallocated waste separately"
      inputs:
        - "co-product quantities and moisture"
        - "causal driver or prices"
        - "separation point"
      output: "allocation factors summing to 1 for allocated products"
      source_ids:
        - eu-environmental-footprint-2021
  data_quality_requirements:
    - id: dq_lot_traceability
      applies_to: "all seed flows"
      requirement: "Preserve linkage from source-seed lot and field through conditioning batches, quality samples, treatment, packaged lot, and dispatch; document controlled commingling."
      evidence: "Lot ledger, field map, batch record, sample register, certificate or quality declaration, label, and dispatch record"
    - id: dq_measurement
      applies_to: "mass, moisture, water, energy, and application records"
      requirement: "Use calibrated instruments or documented verified methods; state precision, calibration date, missing-data treatment, and moisture convention."
      evidence: "Calibration certificates, meter logs, laboratory methods, and data-gap register"
    - id: dq_temporal
      applies_to: "foreground campaign"
      requirement: "Use records covering the full declared multiplication, conditioning, and storage period. Partial records require a documented extrapolation and uncertainty assessment."
      evidence: "Campaign calendar, invoices, meter periods, stock closes, and dispatch records"
    - id: dq_geographic_technology
      applies_to: "fields, conditioning, and upstream datasets"
      requirement: "Report geography, irrigation status, seed-production system, hybrid or open-pollinated route, equipment, drying technology, treatment, and storage controls; assess proxies for representativeness."
      evidence: "Field and facility metadata plus proxy comparison"
    - id: dq_completeness
      applies_to: "required processes and important flows"
      requirement: "Reconcile material and energy records across every required process; a missing major input, reject, residue, direct emission, or conditional operation is a data gap, not a zero."
      evidence: "Mass and energy balances, completeness checklist, and unresolved-data register (eu-environmental-footprint-2021)"
    - id: dq_quality_conformance
      applies_to: "saleable lot"
      requirement: "Retain actual lot results and applicable criteria for identity, varietal and analytical purity, germination, moisture, health, treatment, packaging, sealing, and labelling."
      evidence: "Laboratory report, field inspection, certificate or quality declaration, and label (fao-seeds-toolkit-quality-2018; oecd-seed-schemes-2026; eu-cereal-seed-directive-66-402)"
    - id: dq_reasoned_estimates
      applies_to: "provisional QA ranges"
      requirement: "Treat every reasoned_estimate range as a replaceable screening aid, not a default inventory value or conformity limit. Compare foreground values with the range, investigate material exceedances, and replace the range when reviewed evidence becomes available."
      evidence: "Foreground record, investigation note, and subsequent reviewed evidence"
    - id: dq_method_consistency
      applies_to: "emissions and allocation"
      requirement: "Store the method version, factors, units, compartments, allocation hierarchy step, and sensitivity assumptions; prevent upstream and direct-emission double counting."
      evidence: "Calculation workbook or machine-readable rule trace, factor source, and allocation record"
validation_rules:
  - rule_id: validate_identity_and_scope
    applies_to: "product_identity"
    rule: "Confirm *Zea mays* seed intended for sowing, CPC classification context, variety or hybrid, seed class or generation, scheme and jurisdiction, treatment status, lot, geography, production year, and conditioning site; reject food, feed, industrial, forage, silage, sweet-corn, or rejected seed scope."
    source_ids:
      - oecd-seed-schemes-2026
      - eu-cereal-seed-directive-66-402
  - rule_id: validate_reference_flow
    applies_to: "reference_product"
    rule: "Confirm exactly 1,000 kg net saleable Corn Seeds flow 23f01fdc-33b5-4cc9-bd0f-b0cb39d7daa6 using Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66, and kg, at declared dispatch moisture."
    source_ids: []
  - rule_id: validate_process_coverage
    applies_to: "foreground_system"
    rule: "Confirm every required process is present, each conditional operation is declared as included or not applicable with evidence, and downstream crop cultivation is excluded."
    source_ids:
      - fao-seeds-toolkit-processing-2018
  - rule_id: validate_recursion_boundary
    applies_to: "source_seed_input"
    rule: "Confirm same-category source seed remains a non-zero product input linked to a representative upstream dataset or disclosed proxy, with no recursive deletion or double counting."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_mass_balance
    applies_to: "field_conditioning_and_final_preparation"
    rule: "Confirm moisture conventions are consistent and each lot or campaign mass balance closes within combined measurement uncertainty; investigate unexplained residuals and prohibit negative wastes or stock changes used to force closure."
    source_ids:
      - fao-seeds-toolkit-processing-2018
      - fao-seeds-toolkit-quality-2018
  - rule_id: validate_field_emissions
    applies_to: "managed_soil_and_field_emissions"
    rule: "Confirm N inputs, residue fate, volatilisation and leaching conditions, applicable factors, 44/28 conversion, compartments, and selected IPCC or national tier are recorded; confirm lime and urea CO2 applicability and no upstream double counting."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validate_seed_quality
    applies_to: "saleable_lot"
    rule: "Confirm representative sampling and lot-specific identity, purity, germination, moisture, health, treatment, sealing, and labelling evidence satisfy the declared applicable scheme; do not apply EU or OECD thresholds outside their declared jurisdiction without justification."
    source_ids:
      - fao-seeds-toolkit-quality-2018
      - oecd-seed-schemes-2026
      - eu-cereal-seed-directive-66-402
  - rule_id: validate_treatment_and_packaging
    applies_to: "final_preparation"
    rule: "Confirm treatment products, active ingredients, loading, treated mass, packaging materials, storage duration, and sample or off-specification fate reconcile to stock and lot records; untreated seed must have explicit evidence."
    source_ids:
      - fao-seeds-toolkit-processing-2018
  - rule_id: validate_allocation
    applies_to: "multifunctional_processes"
    rule: "Confirm subdivision was attempted first, every co-product has an evidenced function and destination, allocation factors sum to 1 at each separation point, waste is not credited, and physical or economic fallback and sensitivity are disclosed."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_data_quality_and_estimates
    applies_to: "dataset_readiness"
    rule: "Confirm full temporal coverage, calibration, geography and technology representativeness, data-gap treatment, and uncertainty disclosure. reasoned_estimate ranges may screen records but may not replace required foreground amounts or become publication-critical allowed ranges without review."
    source_ids:
      - eu-environmental-footprint-2021
published_dataset_profile:
  dataset_role: "Foreground maize-seed production dataset normalized to a saleable seed lot at conditioning-facility gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use as a reviewed upstream dataset for maize seed inputs or in comparative models only when product identity, seed class, geography, route, treatment, quality scheme, moisture, and temporal representativeness are compatible and all validation rules pass"
  excluded_use: "Direct representation of maize grain for food, feed, industrial use, or bioenergy; forage or silage maize; crop cultivation after sowing; rejected seed; untreated seed when the dataset represents treated seed or vice versa; materially different geography or production technology without a documented proxy assessment"
  required_metadata: "PCR id and version state; CPC classification reference; reference-flow UUIDs; species; variety or hybrid and parental system; seed class or generation; scheme and jurisdiction; treatment; lot; quality results and methods; geography; production year; field and conditioning route; irrigation; storage duration; packaging; source-seed upstream dataset; process coverage; allocation; data sources"
  required_quality_disclosure: "Primary-data coverage; calibration and sampling evidence; mass-balance residual; missing-data and proxy treatment; representativeness; IPCC or national emission tier and factors; allocation hierarchy and sensitivity; each remaining reasoned_estimate; uncertainty; exclusions and their estimated significance"
  update_trigger: "New or changed seed law or scheme; changed PCR scope or reference flow; revised IPCC or national field-emission method; material change in hybrid route, irrigation, drying, treatment, packaging, storage, geography, technology, allocation, or upstream source-seed dataset; foreground evidence that narrows or replaces a provisional range"
