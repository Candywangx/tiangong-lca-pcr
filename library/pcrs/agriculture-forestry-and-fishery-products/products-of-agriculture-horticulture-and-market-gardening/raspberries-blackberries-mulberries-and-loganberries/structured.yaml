      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_marketable_rejects` | outputs and rejects | Avoid allocation through justified process subdivision or an explicitly justified expanded system where applicable. Otherwise identify the actual independently transferred co-products and use a justified physical relationship; use a documented alternative such as economic allocation only when physical attribution is unsuitable, with sensitivity. Disposed rejects are not automatically co-products and retain their production/treatment burden with saleable output. Shared establishment burdens use documented productive-period/output attribution once; neither equal annual yields nor a universal lifetime is assumed. | `iso-14044-2006` |\n| `allocation_multi_period` | perennial systems | Allocate shared establishment and stand-management burdens over the productive period using disclosed yield or time shares. | `iso-14044-2006` |\n\nConcrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness.\n\n"
