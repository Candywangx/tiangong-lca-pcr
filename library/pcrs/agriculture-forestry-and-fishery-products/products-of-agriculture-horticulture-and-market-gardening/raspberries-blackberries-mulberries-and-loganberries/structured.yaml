allocation_rules:
  - rule_id: allocation_marketable_rejects
    applies_to: "outputs and rejects"
    rule: "Avoid allocation through justified process subdivision or an explicitly justified expanded system where applicable. Otherwise identify the actual independently transferred co-products and use a justified physical relationship; use a documented alternative such as economic allocation only when physical attribution is unsuitable, with sensitivity. Disposed rejects are not automatically co-products and retain their production/treatment burden with saleable output. Shared establishment burdens use documented productive-period/output attribution once; neither equal annual yields nor a universal lifetime is assumed."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_multi_period
    applies_to: "perennial systems"
    rule: "Allocate shared establishment and stand-management burdens over the productive period using disclosed yield or time shares."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "process_crop_establishment"
      flow_role: "inputs and land"
      record_type: "field log, invoice, area map"
      raw_fields: "area, age, plants, materials, dates"
      collection_method: "reconcile field and purchase records; Raw aggregation and attribution: allocate by declared period"
      unit: "kg, ha, year"
      frequency: "event/annual"
      temporal_coverage: "establishment and productive period"
      site_scope: "each block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, maps, review"
    - protocol_id: cp_input_records
      process_id: "process_crop_management"
      flow_role: "inputs"
      record_type: "invoice, meter, application log"
      raw_fields: "product, nutrient content, amount, date, field"
      collection_method: "primary records and reconciliation; Raw aggregation and attribution: sum by season"
      unit: "kg, kg nutrient, m3, kWh, L"
      frequency: "event/monthly"
      temporal_coverage: "full season"
      site_scope: "block/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meters"
    - protocol_id: cp_yield_records
      process_id: "process_harvest"
      flow_role: "outputs"
      record_type: "weigh ticket, harvest log"
      raw_fields: "species, grade, mass, date, block"
      collection_method: "weigh each lot and outlet; Raw aggregation and attribution: sum lots and grades"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full season"
      site_scope: "block/outlet"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale"
    - protocol_id: cp_harvest_records
      process_id: "process_harvest"
      flow_role: "harvest materials"
      record_type: "issue/waste log"
      raw_fields: "material, quantity, route"
      collection_method: "issue and return reconciliation; Raw aggregation and attribution: sum by material harvest_materials_specific_input: Operation process_harvest: Record actual harvest aids and field packaging by harvest period. Original quantity method: issue and return reconciliation Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg"
      frequency: "harvest period"
      temporal_coverage: "full season"
      site_scope: "harvest operation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "inventory records"
    - protocol_id: cp_conditioning_records
      process_id: "process_conditioning_grading"
      flow_role: "conditioning inputs"
      record_type: "meter, packing log, invoice"
      raw_fields: "input, amount, lot, energy"
      collection_method: "lot-linked records; Raw aggregation and attribution: allocate by lot mass Route-specific requirements: conditioning_energy_identification: Actual electric cooling, washing, sorting and packing equipment for the berry lot at this node; retain upstream field consumption separately. Raw activity or stage basis: per 1 kg marketable fresh berry. (route-energy-fao) Verify actual use, equipment and supply for each applicable input; create one specific exchange per actual carrier before dataset completeness. Missing identity or quantity evidence remains unresolved, never zero. Distinguish purchased supply, internal generation and inclusive contractor services; count their energy once. Do not substitute the conditional examples for an unverified route."
      unit: "kg, m3, kWh"
      frequency: "lot/daily"
      temporal_coverage: "full season"
      site_scope: "conditioning unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters, invoices"
    - protocol_id: cp_reject_records
      process_id: "process_reject_routing"
      flow_role: "rejects and destinations"
      record_type: "grading/destination log"
      raw_fields: "mass, quality, destination, treatment"
      collection_method: "mass-balance each lot; Raw aggregation and attribution: reconcile all outputs"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full season"
      site_scope: "site/outlet"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "receipts, balance"
    - protocol_id: cp_emission_calculation
      process_id: "all_relevant_processes"
      flow_role: "elementary exchanges"
      record_type: "calculation record"
      raw_fields: "activity, factor, method, uncertainty"
      collection_method: "apply declared method; Raw aggregation and attribution: calculate then normalize"
      unit: "kg substance or MJ"
      frequency: "reporting period"
      temporal_coverage: "declared period"
      site_scope: "site/block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "cited method"
    - protocol_id: cp_managed_soil_nitrogen
      process_id: "process_crop_management"
      flow_role: "direct and indirect soil emissions"
      record_type: "nitrogen activity and method ledger"
      raw_fields: "N sources and amounts; amendments; residue N and fate; area; dates; climate; soil; volatilisation; leaching; precursor; factors and units; receiving medium; upstream owner; stocks; accepted output"
      collection_method: "Reconcile compatible N activity by pathway, retain source worksheets and method applicability, then attribute and normalize once. For each nitrogen pathway, record whether it is quantified locally, included once in a named compatible upstream process, demonstrably inapplicable, or unresolved. Choose the IPCC tier and applicable climate/soil/input categories before selecting factors; retain N activity, factor units, uncertainty and molecular conversions. NH3/NOx and nitrate/other leached species require justified partitioning rather than treating total precursor N as one compound. Audit actual urea and liming application CO2 separately from manufacture and N2O; document method, carbon basis and upstream ownership. Inventory other applicable land-use, soil-carbon, pesticide, phosphorus, combustion and water-regime emissions under a compatible documented method; four nitrogen cards alone do not establish complete emission coverage. Material unquantified pathways prevent dataset completeness."
      unit: "kg N; kg compound"
      frequency: "application and period close"
      temporal_coverage: "complete represented plot/season"
      site_scope: "actual plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "activity records; original factor source; precursor balance; uncertainty"
    - protocol_id: cp_species_route_evidence
      process_id: "process_crop_establishment_process_crop_management_process_harvest_process_conditioning_grading"
      flow_role: "route and parameter applicability"
      record_type: "field register and source assessment"
      raw_fields: "species; cultivar; geography; soil; water regime; purpose; operations; parameter source; compatibility; output"
      collection_method: "Separate raspberry/blackberry/Logan cane management from Morus fruit-tree management. Document cane growth habit, support and harvest route for caneberries; document fruit-purpose tree management for mulberries. Do not transfer leaf-production or sericulture yield, pruning, fertilization or co-product assumptions to a fruit-only system. Record species/cultivar, location, soil and tissue evidence where relevant, stand age, actual operations, yield, loss and reporting period. For each adopted agronomic parameter, retain a primary or regional source and explain product, climate, soil, technology and period compatibility. The cited regional guidance supports route questions, not universal rates. Data gaps block claims for the affected dataset; this PCR does not manufacture site measurements."
      unit: "native units with explicit conversions"
      frequency: "route/season and material change"
      temporal_coverage: "complete represented period"
      site_scope: "actual source plots"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "farm records; source applicability decision; uncertainty and unresolved-data register"
  calculation_rules:
    - id: calc_normalize_marketable
      applies_to: "all rows"
      rule: "inventory amount / marketable fresh berry mass"
      inputs:
        - "process amount"
        - "marketable mass"
      output: "per kg"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_nutrient_application
      applies_to: "fertilizer card"
      rule: "product mass × declared nutrient fraction; retain product mass"
      inputs:
        - "product mass"
        - "nutrient fraction"
      output: "product and nutrient amounts"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_perennial_share
      applies_to: "establishment"
      rule: "shared burden × declared season/yield share"
      inputs:
        - burden
        - period
        - yield
      output: "season amount"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_mass_balance
      applies_to: "harvest and routing"
      rule: "harvested = marketable + rejects + losses within declared tolerance"
      inputs:
        - "all mass records"
      output: "reconciled balance"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_managed_soil_nitrogen
      applies_to: "process_crop_management"
      rule: "Select compatible direct and indirect methods for fertilizer, organic amendments, returned residues and applicable managed-soil sources. Direct N2O-N = sum of eligible N activity times applicable EF1-family factors plus separately applicable sources; indirect N2O-N = volatilised N precursor times EF4 plus leached/runoff N precursor times EF5, where applicable. Convert N2O-N by44/28 once. Quantify NH3 and nitrate with separately justified species-specific loss fractions, not by assigning all NH3+NOx to NH3 or all leached N to nitrate. Convert NH3-N by17/14 and nitrate-N by62/14 once. Keep components, source pools, media, method uncertainty and burden owner distinct; already covered emissions are not repeated. Missing applicable data prevent completeness; do not invent an emission default."
      inputs:
        - cp_managed_soil_nitrogen
      output: "molecular emission amounts per declared reference flow"
      source_ids:
        - ipcc-managed-soils-2019
        - mass-balance-identity
  data_quality_requirements:
    []
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference flow"
    rule: "Confirm one product flow, mass property and kg unit; unresolved identity remains a review finding."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validation_completeness
    applies_to: "foreground package"
    rule: "Required processes and protocols must be present or marked not applicable with justification."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validation_mass_balance
    applies_to: "harvest and routing"
    rule: "Check harvested mass against marketable output, rejects and losses; unexplained gaps fail validation."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validation_nutrient_basis
    applies_to: "fertilizer and amendments"
    rule: "Check product, nutrient content, amount, date, area and source record; generic unlabeled totals fail."
    source_ids:
      - fao-gap-framework-2003
      - source-ipcc-2019-refinement
  - rule_id: validation_managed_soil_coverage
    applies_to: "nitrogen inputs, residues and emissions"
    rule: "Require each applicable nitrogen pathway to be quantified under the stated method or covered by a named compatible upstream dataset once. Supported inapplicability is recorded; missing activity, factors, species split, medium or attribution remains a blocking completeness gap. Reject automatic zero or double counting of direct/indirect components."
    source_ids:
      - ipcc-managed-soils-2019
  - rule_id: validation_species_route_evidence
    applies_to: "all represented processes"
    rule: "Separate raspberry/blackberry/Logan cane management from Morus fruit-tree management. Document cane growth habit, support and harvest route for caneberries; document fruit-purpose tree management for mulberries. Do not transfer leaf-production or sericulture yield, pruning, fertilization or co-product assumptions to a fruit-only system. Record species/cultivar, location, soil and tissue evidence where relevant, stand age, actual operations, yield, loss and reporting period. For each adopted agronomic parameter, retain a primary or regional source and explain product, climate, soil, technology and period compatibility. The cited regional guidance supports route questions, not universal rates. Data gaps block claims for the affected dataset; this PCR does not manufacture site measurements."
    source_ids:
      - osu-caneberry-nutrition
      - osu-caneberry-route
      - fao-mulberry-use
  - rule_id: validation_evidence_based_ranges
    applies_to: "quantities and screening limits"
    rule: "Do not apply a universal 0–1000 range to land, materials, water, product or losses. Use measured records and justified uncertainty, reconcile like-unit physical balances and retain the exact declared reference amount. Any future numeric screening bound must state its input, unit, denominator, applicability and evidence; an outlier triggers investigation, not automatic substitution."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_field_emission_coverage
    applies_to: "field emissions and upstream coverage"
    rule: "For each nitrogen pathway, record whether it is quantified locally, included once in a named compatible upstream process, demonstrably inapplicable, or unresolved. Choose the IPCC tier and applicable climate/soil/input categories before selecting factors; retain N activity, factor units, uncertainty and molecular conversions. NH3/NOx and nitrate/other leached species require justified partitioning rather than treating total precursor N as one compound. Audit actual urea and liming application CO2 separately from manufacture and N2O; document method, carbon basis and upstream ownership. Inventory other applicable land-use, soil-carbon, pesticide, phosphorus, combustion and water-regime emissions under a compatible documented method; four nitrogen cards alone do not establish complete emission coverage. Material unquantified pathways prevent dataset completeness."
    source_ids:
      - ipcc-managed-soils-2019
      - ipcc-liming-urea-2006
      - mass-balance-identity
