system_boundary:
  rules:
    - rule_id: boundary_required_stages
      applies_to: "foreground seed production"
      rule: "Include parent-seed supply, soil preparation and sowing, crop management, irrigation when used, fertiliser and crop-protection application, machinery and energy use, harvest, post-harvest drying or handling, cleaning and grading, and treatment, packaging, and storage when performed before the declared gate."
      source_ids:
        - environdec-pcr-2020-07
        - fao-seeds-toolkit-module-2
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs and services"
      rule: "Link upstream datasets for seed, fertilisers, soil amendments, crop-protection products, irrigation supply, fuels, electricity, heat, packaging, treatment products, and contracted operations that cross the system boundary."
      source_ids:
        - environdec-pcr-2020-07
        - ec-pef-2021-2279
    - rule_id: boundary_field_emissions
      applies_to: "managed soil and field operations"
      rule: "Include direct and indirect field emissions that are material to the declared route. Use measured data or an applicable national, regional, or IPCC method with activity data, factors, compartments, and climate or leaching conditions disclosed."
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_reject_destinations
      applies_to: "off-specification seed, cleaning rejects, straw, and residues"
      rule: "Record each output and its destination. Classify it as reference product, co-product, recyclable material, waste, or field-returned residue from evidence; do not infer zero burden from the label “reject”."
      source_ids:
        - fao-seeds-toolkit-module-2
        - ec-pef-2021-2279
    - rule_id: boundary_quality_operations
      applies_to: "seed release"
      rule: "Include sampling, testing, certification, conditioning, tagging, and other quality operations when they consume material or energy before the declared gate; always retain their lot-level records even when their burdens are negligible."
      source_ids:
        - fao-seeds-toolkit-module-3
        - ista-rules-seed-testing
        - eu-cereal-seed-directive-66-402
    - rule_id: boundary_data_gaps
      applies_to: "all required processes"
      rule: "Do not omit a required process solely because foreground or upstream data are missing. Use an explicitly disclosed proxy or report the data gap and its likely significance."
      source_ids:
        - ec-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "A traceable parent barley-seed lot enters the declared multiplication field or contracted grower system with variety, class, treatment state, quantity, source, and upstream dataset status declared"
  starting_condition_role: "Upstream product input to the seed-multiplication foreground system, not burden-free biological material"
  product_classification_scope: "Barley cultivated specifically for seed purposes and released as sowing-quality seed; ordinary barley grain remains outside this product category"
  recursive_input_rule: "Record parent barley seed once as a product input to the multiplication process and link an upstream seed dataset when available; do not recursively expand the same foreground campaign as its own input"
  upstream_dataset_requirement: "Use a geographically, temporally, technologically, and seed-class-representative upstream dataset for parent seed and all other product inputs; disclose proxies, exclusions, and missing upstream datasets"
  disclosure: "Declare parent-seed class and source, crop campaign, field geography, cultivation system, irrigation status, harvest and drying route, cleaning and grading route, treatment and packaging state, storage, product and reject destinations, allocation choices, and the exact release gate"
