allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "all multifunctional foreground processes"
    rule: "First avoid allocation by subdividing separately measured operations or, where consistent with goal and scope, by system expansion. Document the decision and the affected flows."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_physical_relation
    applies_to: "unavoidable multifunctionality"
    rule: "If subdivision or system expansion is not applicable, use a causal physical relationship that reflects how burdens change with the co-products. State the relation, formula, quantities, and sensitivity."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_other_relation
    applies_to: "no defensible physical relation"
    rule: "Only when no defensible physical relation exists, use another justified relation such as economic value. Use matched geography and period, disclose price sources and volatility, and report sensitivity."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_output_classification
    applies_to: "straw, off-specification seed, cleaning rejects, and packaging returns"
    rule: "Determine destination and economic or functional role before allocation. A sold feed stream or useful material is not automatically waste; a waste label does not by itself justify zero burden."
    source_ids:
      - fao-seeds-toolkit-module-2
      - ec-pef-2021-2279
  - rule_id: allocation_parent_seed
    applies_to: "parent barley seed input"
    rule: "Carry the upstream parent-seed dataset as an input burden. Do not allocate the current campaign backward to its own parent-seed input."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable bags, bins, and pallets"
    rule: "Allocate production and end-of-life burdens over documented expected uses and include loss, cleaning, and return transport where within scope."
    source_ids:
      - ec-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_lot_inputs
      process_id: "seed_crop_production"
      flow_role: "parent seed input"
      record_type: "seed purchase, issue, return, and lot records"
      raw_fields: "lot id; variety; class; treatment; supplier; source geography; certification scheme; gross, tare, net, issued, returned, and sown mass; upstream dataset ref"
      collection_method: "reconcile supplier documents, calibrated scale tickets, store issues, drill-loading records, and field logs"
      unit: "kg and descriptive fields"
      frequency: "each lot and field issue"
      temporal_coverage: "complete declared crop campaign"
      site_scope: "all declared fields and parent-seed lots"
      aggregation_rule: "sum net sown mass by matched field and campaign; retain lot links"
      quality_evidence: "supplier record, lot label, certification or quality record, scale calibration, reconciliation sign-off"
    - protocol_id: cp_field_inputs_operations
      process_id: "seed_crop_production"
      flow_role: "fertilisers, amendments, crop protection, fuel, land, and operations"
      record_type: "invoices, stock movement, application logs, machinery logs, contractor records, field GIS, and soil records"
      raw_fields: "product identity; formulation; nutrient or active content; quantity; returns; application date and rate; field id and area; machinery hours; fuel; soil and land-use history"
      collection_method: "reconcile purchases and stocks to georeferenced field-operation records"
      unit: "kg, kg nutrient, kg active ingredient, L or kg fuel, h, ha, dates"
      frequency: "every delivery and application; campaign reconciliation"
      temporal_coverage: "complete declared crop campaign"
      site_scope: "all declared fields and contractors"
      aggregation_rule: "aggregate only after identity, field, period, and unit harmonisation; allocate shared operations by disclosed causal key"
      quality_evidence: "invoices, labels, calibrated applicator or tank records, contractor statements, field maps, soil analyses"
    - protocol_id: cp_irrigation_water
      process_id: "seed_crop_production"
      flow_role: "irrigation water"
      record_type: "meter, abstraction, pump, and irrigation logs"
      raw_fields: "source; meter start and end; volume; irrigated field and area; dates; pump energy; conversion density"
      collection_method: "calibrated meter preferred; otherwise documented engineering estimate with uncertainty"
      unit: "m3 raw and kg converted"
      frequency: "each irrigation event or meter interval"
      temporal_coverage: "complete irrigation season"
      site_scope: "all irrigated declared fields"
      aggregation_rule: "sum matched events; preserve source and conversion records"
      quality_evidence: "meter calibration, abstraction permit or supplier invoice, pump record, field log"
    - protocol_id: cp_field_output_mass
      process_id: "seed_crop_production"
      flow_role: "harvested seed and field co-products"
      record_type: "harvester, weighbridge, storage intake, moisture, and destination records"
      raw_fields: "field id; lot id; gross, tare, net mass; moisture; harvest date; co-product mass and destination"
      collection_method: "calibrated weighbridge or scale with lot reconciliation"
      unit: "kg and percent moisture"
      frequency: "each load and lot"
      temporal_coverage: "complete harvest of declared crop campaign"
      site_scope: "all declared fields and receiving stores"
      aggregation_rule: "sum matched net masses; prevent duplicate tickets; retain moisture basis"
      quality_evidence: "scale calibration, ticket sequence check, moisture test, field-to-lot reconciliation"
    - protocol_id: cp_field_emissions
      process_id: "seed_crop_production"
      flow_role: "managed-soil and crop-protection emissions"
      record_type: "emission calculation workbook linked to field activity data"
      raw_fields: "N form and content; applied N; organic N; crop-residue N; soil and climate class; volatilisation and leaching conditions; method edition; factor source; active substance; compartment"
      collection_method: "calculate from approved field records using the declared regional or IPCC inventory method"
      unit: "kg N, kg N2O, kg NH3, kg nitrate, kg emitted substance"
      frequency: "once per field and crop campaign; update when input data change"
      temporal_coverage: "complete declared crop campaign"
      site_scope: "all declared fields"
      aggregation_rule: "calculate field first, then aggregate by output mass; keep direct and indirect components and compartments"
      quality_evidence: "locked formulas, method citation, factor table, reviewer check, input-record links"
    - protocol_id: cp_postharvest_mass_energy
      process_id: "harvest_postharvest"
      flow_role: "harvested seed, losses, drying, and handling energy"
      record_type: "intake and output scale tickets, moisture tests, meters, fuel, runtime, and storage logs"
      raw_fields: "lot id; mass in and out; moisture in and out; energy carrier and quantity; drying temperature; runtime; losses and fate"
      collection_method: "calibrated scales and meters; runtime allocation only when sub-metering is unavailable"
      unit: "kg, percent moisture, kWh, MJ, h"
      frequency: "each lot, batch, and meter interval"
      temporal_coverage: "harvest through conditioning handoff"
      site_scope: "all included harvest, drying, and handling sites"
      aggregation_rule: "reconcile lot mass and energy to conditioning intake; disclose shared-facility allocation"
      quality_evidence: "calibration, tickets, meter or invoice records, moisture tests, operator sign-off"
    - protocol_id: cp_conditioning_mass_energy
      process_id: "seed_conditioning"
      flow_role: "reception, cleaning, grading, rejects, dust, and energy"
      record_type: "reception, batch, equipment, meter, scale, dust-control, and reject records"
      raw_fields: "lot id; mass in; accepted mass; each reject mass; rework; meter values; runtime; equipment; captured and emitted dust data"
      collection_method: "calibrated scales and meters with batch mass balance"
      unit: "kg, kWh, MJ, h"
      frequency: "each lot or conditioning batch"
      temporal_coverage: "complete conditioning campaign"
      site_scope: "all included conditioning lines and lots"
      aggregation_rule: "aggregate after batch mass balance; allocate shared energy by disclosed causal key"
      quality_evidence: "calibration, lot trace, batch report, meter or invoice, dust-control record, supervisor sign-off"
    - protocol_id: cp_seed_quality_release
      process_id: "seed_conditioning"
      flow_role: "accepted reference product and quality release"
      record_type: "sampling, laboratory, certification, tagging, and release records"
      raw_fields: "lot id; sample id; sampling method and date; laboratory; method edition; germination; analytical purity; moisture; seed health; varietal identity; release decision; accepted mass"
      collection_method: "representative lot sampling and competent laboratory testing under the declared scheme"
      unit: "kg, percent, count, dates, descriptive fields"
      frequency: "each lot and required retest"
      temporal_coverage: "current for the released lot"
      site_scope: "every reference-product lot"
      aggregation_rule: "no averaging across lots unless the scheme permits blending and traceability is preserved"
      quality_evidence: "sample chain of custody, laboratory report, certification or quality declaration, label, release approval"
    - protocol_id: cp_final_operations
      process_id: "treatment_packaging_storage"
      flow_role: "treatment, packaging, storage, and final energy"
      record_type: "treatment batch, formulation, packaging issue, meter, inventory, and storage logs"
      raw_fields: "lot id; treated mass; product and active ingredient; amount; packaging material and count or mass; reusable cycles; meter data; storage dates and conditions"
      collection_method: "reconcile issued materials and energy to released lots"
      unit: "kg, item, kWh, MJ, days, descriptive fields"
      frequency: "each batch, package issue, and meter interval"
      temporal_coverage: "conditioning release through declared gate"
      site_scope: "all included treatment, packaging, and storage sites"
      aggregation_rule: "aggregate by released lot; storage allocation reflects duration; disclose reuse model"
      quality_evidence: "batch record, label, safety and product record, inventory reconciliation, meter or invoice, warehouse log"
    - protocol_id: cp_coproduct_waste_destinations
      process_id: "seed_crop_production_seed_conditioning_treatment_packaging_storage"
      flow_role: "co-products, rejects, residues, and wastes"
      record_type: "scale tickets, transfer notes, sales, treatment, and destination records"
      raw_fields: "material identity; mass; contamination or hazard status; destination; price or physical relation; date; receiver"
      collection_method: "weigh and reconcile each outbound stream to receiving evidence"
      unit: "kg, currency where economic allocation is used, descriptive fields"
      frequency: "each shipment or disposal event"
      temporal_coverage: "complete declared crop and conditioning campaign"
      site_scope: "all foreground sites and outbound streams"
      aggregation_rule: "sum by material and destination; preserve co-product versus waste decision and allocation evidence"
      quality_evidence: "scale calibration, transfer or consignment note, invoice, receiver acceptance, treatment certificate"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory row"
      rule: "normalized amount = process-scoped amount / accepted reference-product mass at the declared gate, after allocation where applicable"
      inputs:
        - "process amount"
        - "accepted reference-product mass"
        - "allocation factor"
      output: "amount per 1 kg reference product"
      source_ids: []
    - id: calc_process_mass_balance
      applies_to: "field output, post-harvest, conditioning, and final operations"
      rule: "mass-balance difference = total measured mass inputs - total measured product, co-product, waste, environmental loss, and inventory-change outputs on the same moisture basis"
      inputs:
        - "matched lot masses"
        - "moisture bases"
        - "inventory changes"
        - "measured or calculated losses"
      output: "absolute and percentage reconciliation difference with explanation"
      source_ids:
        - fao-seeds-toolkit-module-2
    - id: calc_moisture_conversion
      applies_to: "any explicitly requested dry- or common-moisture comparison"
      rule: "convert only after declaring wet- or dry-basis convention; retain measured as-received mass and moisture result as source values"
      inputs:
        - mass
        - "measured moisture"
        - "basis convention"
      output: "converted comparison mass, never a silent replacement of the reference flow"
      source_ids:
        - fao-seeds-toolkit-module-3
        - ista-rules-seed-testing
    - id: calc_managed_soil_n2o
      applies_to: "direct and indirect managed-soil N2O"
      rule: "apply the selected national, regional, or IPCC tier equations to matched synthetic N, organic N, crop-residue N, mineralisation, volatilisation, leaching, soil, and climate activity data; convert N2O-N to N2O explicitly where required"
      inputs:
        - "field N activity data"
        - "method equations"
        - factors
        - "climate and leaching conditions"
      output: "kg direct N2O and kg indirect N2O by field and campaign"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_n_volatilisation_and_leaching
      applies_to: "ammonia and nitrate losses"
      rule: "apply a method appropriate to the fertiliser form, application and incorporation, soil, climate, irrigation, and receiving compartment; preserve N-species conversions"
      inputs:
        - "field N activity data"
        - method
        - factors
        - "site conditions"
      output: "kg NH3 to air and kg nitrate to selected water compartment"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_energy_conversion
      applies_to: "fuels and energy"
      rule: "converted energy = recorded carrier quantity × declared conversion factor; do not apply a calorific value to electricity"
      inputs:
        - "invoices or meters"
        - carrier
        - "net calorific value or other conversion factor and source"
      output: "carrier-specific quantity and optional MJ for comparison"
      source_ids: []
    - id: calc_allocation
      applies_to: "multifunctional foreground process"
      rule: "apply the selected allocation rule only after subdivision and system-expansion screening; allocated amount = unallocated amount × documented allocation factor"
      inputs:
        - "unallocated inventory"
        - "co-product quantities"
        - "physical relation or matched economic data"
      output: "allocated inventory and sensitivity result"
      source_ids:
        - ec-pef-2021-2279
    - id: calc_seed_quality_status
      applies_to: "reference-product lot"
      rule: "compare lot-specific test results with the explicitly declared scheme, jurisdiction, contract, and seed class; report measured values and decision separately"
      inputs:
        - "laboratory results"
        - "method edition"
        - "declared limits"
        - "lot identity"
      output: "accepted, held, reworked, or rejected status with evidence"
      source_ids:
        - fao-seeds-toolkit-module-3
        - ista-rules-seed-testing
        - eu-cereal-seed-directive-66-402
  data_quality_requirements:
    - id: dq_identity_traceability
      applies_to: "all foreground records"
      requirement: "Preserve an unbroken link among field, parent seed, harvested load, conditioning batch, quality sample, released lot, and reference-product mass."
      evidence: "Lot ledger, labels, scale tickets, batch records, laboratory chain of custody, and release record; fao-seeds-toolkit-module-2; fao-seeds-toolkit-module-3"
    - id: dq_temporal_coverage
      applies_to: "crop campaign and conditioning"
      requirement: "Cover the complete crop and conditioning campaign, including opening and closing stocks and storage before the declared gate. State any mismatch between activity-data and background-dataset years."
      evidence: "Dated records, stock reconciliation, and temporal representativeness review; ec-pef-2021-2279"
    - id: dq_geographic_technology
      applies_to: "foreground and upstream datasets"
      requirement: "Match production region, cultivation system, irrigation status, machinery, drying, conditioning, treatment, and energy mix; justify proxies."
      evidence: "Site description and geographical and technological representativeness assessment; ec-pef-2021-2279"
    - id: dq_completeness_mass_balance
      applies_to: "all required processes"
      requirement: "Complete process mass balances and reconcile purchases, applications, outputs, rejects, wastes, and inventory changes. Explain unresolved differences rather than forcing balance."
      evidence: "Reconciliation reports, missing-record log, and reviewer sign-off."
    - id: dq_measurement_control
      applies_to: "meters, scales, laboratory tests, and calculated values"
      requirement: "Record calibration or competence evidence, raw units, conversion factors, formulas, factor versions, and responsible reviewer."
      evidence: "Calibration certificates, laboratory scope, locked calculation workbook, and audit trail."
    - id: dq_seed_quality
      applies_to: "reference-product lot"
      requirement: "Use representative lot sampling and an identified test method for germination, analytical purity, moisture, and other claimed attributes. Keep measured results separate from legal or contract limits."
      evidence: "fao-seeds-toolkit-module-3; ista-rules-seed-testing; eu-cereal-seed-directive-66-402"
    - id: dq_phytosanitary_scope
      applies_to: "internationally moved seed or regulated pest claims"
      requirement: "Declare applicable phytosanitary requirements and retain inspection, sampling, testing, and certification evidence; do not generalise one destination's requirements to all lots."
      evidence: "ippc-ispm-38 and lot-specific phytosanitary documents."
    - id: dq_emission_method
      applies_to: "field and facility emissions"
      requirement: "State method, edition, factors, units, conversion steps, compartments, regional conditions, and whether results are measured or calculated."
      evidence: "Calculation record and cited method; ipcc-2019-managed-soils-n2o."
    - id: dq_yield_context
      applies_to: "yield plausibility review"
      requirement: "Compare only with a matched official national or regional series and treat the comparison as QA context, not a conformance threshold or replacement for measured yield."
      evidence: "Foreground field/output records and faostat-crops-livestock-production."
validation_rules:
  - rule_id: validate_identity
    applies_to: "product category and reference flow"
    rule: "Confirm that the product is barley grown specifically for seed purposes and that the selected Tiangong reference flow, Mass property, Units of mass group, and kg unit exactly match the identifiers in section 3."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "every reference-product lot"
    rule: "Fail completeness when any required qualifier is absent or when treatment, certification, quality-test, packaging, storage, geography, or gate statements conflict."
    source_ids:
      - fao-seeds-toolkit-module-3
      - ista-rules-seed-testing
      - eu-cereal-seed-directive-66-402
  - rule_id: validate_process_coverage
    applies_to: "foreground system"
    rule: "Confirm that all required processes and every conditional operation actually performed before the gate are represented; verify parent-seed and purchased-input upstream links or explicit data gaps."
    source_ids:
      - environdec-pcr-2020-07
      - fao-seeds-toolkit-module-2
      - ec-pef-2021-2279
  - rule_id: validate_lot_mass_balance
    applies_to: "each process and lot"
    rule: "Recalculate the mass balance on consistent moisture bases, identify rework and inventory change, and investigate unexplained differences."
    source_ids:
      - fao-seeds-toolkit-module-2
  - rule_id: validate_field_emissions
    applies_to: "managed-soil and crop-protection emissions"
    rule: "Check activity-data lineage, method applicability, factor edition, species conversions, receiving compartments, and normalization. Do not accept applied product mass as emitted mass."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validate_allocation
    applies_to: "multifunctional processes"
    rule: "Verify the allocation hierarchy, output classification, formula, factor sum, matched price or physical data, and sensitivity disclosure."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_flow_identity
    applies_to: "every UUID-bearing row"
    rule: "Re-query Tiangong without a dataset version and confirm flow name, flow type, classification or compartment, reference property, and modelling role. A semantically similar but mismatched row is not a default."
    source_ids: []
  - rule_id: validate_data_quality
    applies_to: "foreground and upstream evidence"
    rule: "Check completeness, temporal, geographical, technological, measurement, and precision evidence and disclose proxy or missing-data limitations."
    source_ids:
      - ec-pef-2021-2279
  - rule_id: validate_quality_release
    applies_to: "accepted reference product"
    rule: "Confirm lot-specific representative sampling, laboratory method, measured results, release decision, and the applicable scheme or jurisdiction. This PCR supplies no universal germination, purity, or moisture threshold."
    source_ids:
      - fao-seeds-toolkit-module-3
      - ista-rules-seed-testing
      - eu-cereal-seed-directive-66-402
  - rule_id: validate_reasoned_estimates
    applies_to: "any future provisional quantitative range"
    rule: "A reasoned_estimate may be used only as a replaceable QA screening range, never as a default inventory amount, legal limit, acceptance threshold, or proof of conformance; identify it explicitly and replace it when reviewed evidence becomes available."
    source_ids: []
  - rule_id: validate_sources
    applies_to: "all source-backed rules"
    rule: "Confirm that every cited source id exists in section 11 and that web-hosted sources record the retrieval date; source discovery snippets and Tiangong query traces are not evidence records."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground barley-seed data package and linked unit-process inventory; an aggregated dataset may be derived only after the foreground package passes validation"
  downstream_use: "secondary_dataset; background_dataset; supporting flow, process, and lifecyclemodel projections"
