allocation_rules:
  - rule_id: single_product
    applies_to: "Grain with retained stalk and loss"
    rule: "Attribute crop burdens to saleable seed; field-retained stalks and unrecovered or unsold seed are not reference product. Record actual residue destination."
    source_ids:
      - ncstate-sesame-2026
  - rule_id: grade_split
    applies_to: "Accepted and sold downgraded grain"
    rule: "Keep grades and masses separate. If both are sold, allocate common burdens on physical seed mass, disclosing shares and grade criteria; economic allocation requires a justified exception and documented prices."
    source_ids:
      - tamu-sesame-2007
  - rule_id: sold_residue
    applies_to: "Deliberately sold stalk or chaff"
    rule: "If residues are marketed, record dry mass and destination and review multi-output allocation before release; do not assume zero burden."
    source_ids:
      - ncstate-sesame-2026
  - rule_id: run_rework
    applies_to: "Shared runs and re-cleaning"
    rule: "Attribute shared machinery, cleaning and changeovers once using recorded time or mass. A reworked lot retains original burdens plus each actual additional pass; intermediate mass is not counted twice."
    source_ids:
      - tamu-sesame-2007
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field
      process_id: "crop_management"
      flow_role: "Crop inputs and water"
      record_type: "Field log and invoice"
      raw_fields: "Field; area; crop year; cultivar; water route; field sample seed mass; each input identity and mass; fuel L; electricity kWh; irrigation m3"
      collection_method: "Match application and meter logs to each field; Raw aggregation and attribution: Sum actual use; apportion shared operations once protection_input_specific_input: Operation crop_management: Record each herbicide, insecticide or fungicide used, including active ingredient and concentration, without assuming an application. Original quantity method: Actual kg of this formulation applied in the field-cycle. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default. field_fuel_specific_input: Operation crop_management: Record fuel for actual planting, cultivation, spraying or pumping operations; share equipment use by logged time or area. Original quantity method: Measured or invoiced litres attributed to the field-cycle. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; L; kWh; m3; ha"
      frequency: "Each operation"
      temporal_coverage: "Whole crop cycle"
      site_scope: "Every contributing field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoices, meter and application logs"
    - protocol_id: cp_harvest
      process_id: "harvest_thresh"
      flow_role: "Capture, loss, residue"
      record_type: "Harvest log and field survey"
      raw_fields: "Field; run; capsule trait; harvest mode; fuel; labor; raw kg; moisture; estimated loss; residue path"
      collection_method: "Weigh lots and survey loss by stated method; Raw aggregation and attribution: Join lot to field cycle; sum actual runs harvest_fuel_specific_input: Operation harvest_thresh: Record fuel for actual cutting, threshing or combining machines. For shattering varieties, cutting, field drying, bundling and manual threshing labor hours stay in cp_harvest; a direct-combine run reports combine passes. These technology routes are mutually exclusive for a harvest run. [ncstate-sesame-2026] Original quantity method: Actual litres consumed by harvest run. Identify the actual input for this operation from supplier specifications, equipment and primary records. This is a mandatory collection requirement, not an exchange. Before dataset completeness, represent each used material, formulated product, carrier or independently purchased service by one physically specific card with its native quantity/property; confirm a compatible UUID, or retain an explicit unresolved identity and do not claim a fully linked dataset. Do not substitute a conditional example for an unknown actual input, invent a recipe, omit required use or infer zero from missing records. Attribute shared use, reusable assets and inclusive services once; preserve the original stage/period and measured throughput link to final reference output. The former aggregate range is not a component limit or consumption default."
      unit: "kg; h; L; percent"
      frequency: "Each run"
      temporal_coverage: "Whole harvest"
      site_scope: "Each field/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, moisture and loss records"
    - protocol_id: cp_condition
      process_id: "first_clean_dry"
      flow_role: "Cleaning, drying and rejects"
      record_type: "Batch log and meter"
      raw_fields: "Lot; pass; input/output kg and moisture; cleaning kWh; drying kWh; drying fuel L; off-spec seed kg and path; screenings kg and path"
      collection_method: "Weigh and test each pass or record bypass; Raw aggregation and attribution: Count each pass once drying_fuel_specific_input: Include thermal fuel only when fuel-fired pre-gate drying actually occurs; state fuel identity. Metered or invoiced litres by lot and drying pass. This is a mandatory specific-input collection requirement, not a selected exchange. Identify every actual formulation, carrier or independently supplied service from primary records, with physical identity, state, native quantity and supplier specifications. Create a separate concrete card for each actual input before dataset completeness; verify a compatible UUID or explicitly retain its unresolved identity. Product mass and contained active-substance mass are different ledgers: convert only using documented composition and never count both as two purchases. Finished feed and separately added ingredients must not duplicate its recipe. Distinguish fuel purchase, purchased electricity/heat and inclusive machinery services; charge only their actual boundaries once. Preserve the original operation, period, attribution and final-output normalization. Missing identity or records do not establish zero use; no universal component range or invented recipe is supplied."
      unit: "kg; percent; kWh; L"
      frequency: "Each pass"
      temporal_coverage: "Before gate"
      site_scope: "Farm and contracted pre-gate site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, meter, test and disposal tickets"
    - protocol_id: cp_gate
      process_id: "grade_gate"
      flow_role: "Accepted and other grade states"
      record_type: "Grade and transfer ticket"
      raw_fields: "Lot; accepted kg; moisture; color; foreign matter; broken seed; grade; downgraded/rejected kg and path"
      collection_method: "Weigh, inspect and grade before transfer; Raw aggregation and attribution: Sum accepted output for denominator; retain other destinations"
      unit: "kg; percent"
      frequency: "Each lot"
      temporal_coverage: "Crop year"
      site_scope: "Each gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Signed ticket and quality report"
  calculation_rules:
    - id: reconcile_seed
      applies_to: "Harvest through gate"
      rule: "Estimate available standing seed as captured seed plus separately surveyed field loss. For the post-capture lot, captured mass = accepted + downgraded + rejected + conditioning loss + moisture-change adjustment; investigate residual difference."
      inputs:
        - Scale
        - "moisture and field-loss records"
      output: "Reconciled lot balance with separate field-loss record"
      source_ids:
        - tamu-sesame-2007
        - ncstate-sesame-2026
    - id: normalize_gate
      applies_to: "All attributed inventory"
      rule: "Divide attributed input/emission totals by net accepted gate kg; retain field/run links."
      inputs:
        - "Input records"
        - "allocation and gate tickets"
      output: "Per-kg inventory"
      source_ids: []
    - id: capture_loss_rate
      applies_to: "Harvest route comparison"
      rule: "Report surveyed lost seed mass relative to estimated available seed, with method and uncertainty."
      inputs:
        - "Loss survey and captured mass"
      output: "Capture-loss fraction"
      source_ids:
        - ncstate-sesame-2026
  data_quality_requirements:
    - id: product_identity
      applies_to: "Final product"
      requirement: "Verify whole sesame grain, cultivar, color, grade, farm-gate state; no sowing-seed substitution."
      evidence: "Crop and sale records"
    - id: mass_moisture
      applies_to: "Harvest and gate"
      requirement: "Keep original scale and moisture tests; disclose any estimates and unexplained balance difference."
      evidence: "Scale and lab/sample sheets"
    - id: route_coverage
      applies_to: "Field and batches"
      requirement: "Show complete field/run coverage and final paths for rework, sold downgrade, waste and residue."
      evidence: "Field, run and disposition logs"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Gate product"
    rule: "Require fixed whole-seed UUID, mass property/group, kg and actual gate state; reject oil, dehulled and sowing-seed products under this flow."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "Field and harvest"
    rule: "Require rainfed/irrigated and manual/direct-combine choices with cultivar and run evidence; include pumping for irrigation and prevent default simultaneous harvest routes."
    source_ids:
      - ncstate-sesame-2026
      - tamu-sesame-2007
  - rule_id: validate_loss_grades
    applies_to: "Harvest and conditioning"
    rule: "Require loss method, moisture, cleaning/drying passes or bypass, and accepted/downgraded/rejected destinations; no rejected seed in accepted mass."
    source_ids:
      - ncstate-sesame-2026
      - tamu-sesame-2007
  - rule_id: validate_run_burdens
    applies_to: "Shared machinery and rework"
    rule: "Count each run, cleaning/changeover and rework pass once; resolve unexplained mass imbalance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground farm-gate whole sesame grain dataset"
  downstream_use: "secondary_dataset; background_dataset after review"
  allowed_use: "Whole commodity sesame grain at a comparable farm gate with disclosed region, year, route, moisture and grade"
  excluded_use: "Any sowing-seed output; oil, meal, dehulled, roasted or ground products; assuming regional extension input rates are universal"
  required_metadata: "Farm and crop year; field area; variety and shattering trait; water and harvest mode; lot lineage; gate; moisture, color and grade"
  required_quality_disclosure: "Coverage and missing inputs; measured versus estimated losses; shared-run attribution; rejected and residue paths; upstream seed identity"
  update_trigger: "Verified planting-seed flow, materially new harvest or conditioning route, changed gate or allocation evidence"
