          markdown: "# Farmed fresh whole sugar kelp: spore nursery to first food-quality release\n\nThis is an attributional crop-production method for one physically defined food supply route. Site data remain to be collected; evidence supports the technical synthesis, not a measured farm inventory or approval. All below conditions and native-identity restrictions travel with the rules.\n\n"
    - unit_id: "normative_103101"
      family: "allocation"
      span:
