allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The conditions in a_scope govern every rule in this section; the residual rule is conditional on the preceding steps."
    source_ids: []
  - rule_id: a_scope
    applies_to: "attributional_model"
    rule: "Apply this hierarchy only to a declared attributional partitioning case: Situation C2 or another ILCD situation where its goal-specific provisions establish allocation after subdivision, virtual subdivision and relevant substitution/system expansion have been assessed as unavailable or infeasible. Document the chosen decision context; no free choice of allocation versus substitution is implied."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_dedicated
    applies_to: "exchange_attribution"
    rule: "First separate independently metered nursery batches, dedicated gear, trips, cooling and release activities. Use virtual subdivision for materials embodied solely in one output. Failed culture, rejected food and abnormal/idle/cleanup activity remain burdens of their actual crop/function; do not allocate them away by assuming saleable output."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_physical
    applies_to: "remaining_joint_exchanges"
    rule: "For each genuinely remaining shared exchange identify and demonstrate its determining physical causal relation to each function. Gear occupation time, trip payload and refrigeration load are candidates only when actual measurements demonstrate causality for that exchange. Nutrient content or wet/dry mass is not automatically a driver of boat fuel, capital or all emissions. Reconcile allocated vectors to the original vector without changing physical output masses."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "residual_joint_exchanges"
    rule: "Only when a determining physical causality remains unavailable after the preceding steps use contemporaneous representative market value at the SAME joint-process exit and actual condition/quantity. Derive gate-equivalent values by removing downstream conditioning, packaging, storage and transport costs. Retain prices, dates, quantities, currency, sensitivity and the reason for this residual criterion. No fixed split or automatic choice of economic/physical allocation is provided."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_noncredits
    applies_to: "biomass_and_residues"
    rule: "Rejected tissue, rope waste, meltwater and measured C/N/P uptake are not automatic saleable co-functions or credits. Keep their actual fates and treatment burdens. Photosynthetic uptake is a physical exchange, not permanent carbon storage or avoided nutrient production. No substitution, negative carbon burden or nutrient-removal credit is authorized by this food-crop inventory. An actual additional marketed function needs separate evidence and goal-consistent treatment."
    source_ids: []
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
