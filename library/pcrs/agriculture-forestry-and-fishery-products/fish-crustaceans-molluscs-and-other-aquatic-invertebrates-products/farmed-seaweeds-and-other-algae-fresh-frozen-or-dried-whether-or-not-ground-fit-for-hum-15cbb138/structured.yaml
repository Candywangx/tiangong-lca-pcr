system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "cultivation_to_release"
      rule: "Include authorized sorus collection and nursery water treatment, enrichment, spore inoculation, lit/chilled/aerated nursery, seeded twine transport, installation, deployment, monitoring, thinning if actually needed, maintenance, retrieval, harvest, cooling, sampling, inspection, packaging and first food-quality release. Purchased seed does not erase its nursery chain: obtain complete supplier foreground/upstream inventory or explicitly retain the missing upstream burden. This route cannot begin at bought edible kelp."
      source_ids:
        - ctsg-kelp-nursery-2014
        - ctsg-seaweed-food-hazards-2020
    - rule_id: b_scope
      applies_to: "fresh_food_route"
      rule: "Only cultivated S. latissima raw whole blades under documented food suitability are included. Wild-harvest food, S. japonica, Laminaria digitata, Gracilaria, microalgae, feed/fertilizer/bioremediation biomass, extracts and mixed taxa are excluded. Frozen, dried, ground, washed/blanched or reduced-oxygen packed products require separately evidenced state/process extensions; a CPC leaf is not proof of such coverage."
      source_ids:
        - ctsg-kelp-nursery-2014
        - ctsg-seaweed-food-hazards-2020
    - rule_id: b_assets
      applies_to: "capital_and_auxiliaries"
      rule: "Collect every installed asset and its supplier production, installation, service life, replacement and end treatment under the same scope; no unsupported capital cutoff. Article mass is assigned by justified service use before normalization and is excluded from biological mass inputs. The listed asset configuration is a transparent technical collection design, not a claimed single documented factory bill. Add each actual cable, fitting, building component or other real input as its own specific exchange when outside an already purchased whole article."
      source_ids: []
    - rule_id: b_gate
      applies_to: "first_release_and_service"
      rule: "Q is the first food-quality release of new compliant net wet tissue for a defined cohort; delivery, storage transfer, reinspection or rework never creates second production. Same-cohort released closing FG is already part of Q. Keep manufacture, pending-release WIP and released FG/service physical gates separately; paired internal transfers cancel in consolidation. Packaging, storage, handling and dispatch services after release remain separate cohort service accounts, with historical FG burdens retained for the cohort served. Never add historical production to current Q."
      source_ids: []
    - rule_id: b_atomic
      applies_to: "all_exchanges"
      rule: "Every real purchased preparation crosses once at whole as-supplied mass; active ingredients, dry solids, carrier water and assay are constituent subledgers. Internally prepared formulations require separate actual purchased materials, water, energy and losses. Record every real emission species and actual receiving compartment or treatment. No other, utility, packaging or pollutant aggregate can hide unlisted exchanges; add conditional specific rows before calculating. No steam, boiler or external hot-water return is presumed by this electrical nursery/cold-chain configuration; if one actually exists record supply/return mass, temperature, enthalpy and supplier water/energy agreement as separate exchanges."
      source_ids: []
