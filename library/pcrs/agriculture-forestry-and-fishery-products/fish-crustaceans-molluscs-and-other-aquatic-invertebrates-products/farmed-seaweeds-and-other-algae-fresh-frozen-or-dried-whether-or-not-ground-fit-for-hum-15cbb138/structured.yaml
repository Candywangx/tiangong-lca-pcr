measurement_rules:
  - id: wet_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference is 1 kg newly first-released net wet S. latissima tissue. Weigh on calibrated scales after a declared repeatable drainage protocol; separately measure and exclude free/attached seawater, ice, twine, containers and fouling. Measure dry matter or moisture independently on representative tissue at a documented drying method; report residual salt separately. Never equate 1 kg dried algae with 1 kg fresh algae or assert nutritional/edible equivalence."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass or energy"
      uuid: ""
    required_unit: "kg or MJ"
    rule: "Retain raw readings with units, rates versus totals, temperature and uncertainty. Convert kWh by 3.6 MJ/kWh. Convert only actual rates by integrating over time; do not multiply an already integrated liquid/gas volume by duration. Use independently measured material-specific density and gas temperature/pressure/composition. Do not use secondary-property ratios to invent density or per-item mass."
  - id: whole_formula
    applies_to: "pes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Whole purchased PES is one mass input. Assay, active salts, dry matter and carrier water are nested analytical quantities only. No reliable cross-supplier concentrate potency or LCI dose range is provided; collect each exchange raw amount and actual supplier specification."
  - id: single_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass or energy"
      uuid: ""
    required_unit: "kg or MJ"
    rule: "Every final exchange has per reference flow basis. Data collection retains raw period amounts only; its aggregation label states the final destination basis and does not execute normalization. The sole §8 normalization derives the final amount after raw conversion, exchange-specific attribution and WIP burden reconciliation. Reference output remains exactly 1 kg."
