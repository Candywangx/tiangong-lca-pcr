  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "U_i = raw_i * unit_factor_i; electricity kWh uses factor 3.6 MJ/kWh. Integrate genuine rates only. Volume factors need independent state-specific density; stock and mixture subledgers do not duplicate purchases."
      inputs:
        - raw_i
        - unit_factor_i
        - density_i
        - state_i
      output: "U_i"
      source_ids: []
    - id: cohort_numerator
      applies_to: "all inventory rows"
      rule: "A_i = attributable converted raw_i + opening_WIP_burden_i - closing_WIP_burden_i; apply actual direct/virtual subdivision and justified residual allocation before forming A_i. Internal nursery/harvest transfers carry their inherited vectors and cancel only on consolidation. Do not subtract released closing FG from first-release manufacturing output or its already assigned burden."
      inputs:
        - U_i
        - allocation_i
        - opening_WIP_burden_i
        - closing_WIP_burden_i
      output: "A_i"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: release_total
      applies_to: "released_kelp"
      rule: "Q = sum(newly first-released compliant net wet tissue mass); count each cohort lot once after calibrated net weighing and documented release. No opening FG, second inspection, delivery or returned/reworked previously released mass creates additional Q. Retain same-cohort closing FG within this Q."
      inputs:
        - new_release_mass
        - lot_id
        - release_record
        - cp_release
      output: "Q"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q > 0; A_i is the unnormalized attributable exchange numerator in kg or MJ and Q is kg first-released net wet tissue. This is the sole division by Q. For Q = 0 keep A_i and stocks as absolute burdens and issue no unit result; the reference output is exactly 1 kg."
      inputs:
        - A_i
        - Q
      output: "x_i"
      source_ids: []
    - id: biomass_subledger
      applies_to: "released_kelp"
      rule: "dry_tissue = net_wet_tissue * independently_measured_dry_fraction; water_tissue = net_wet_tissue - dry_tissue. Salt is a measured constituent of dry tissue, not additional output. Carbon/nitrogen/phosphorus = independently measured dry biomass * measured dry-basis element fraction for each stock and fate; speciation requires independent evidence."
      inputs:
        - net_wet_tissue
        - measured_dry_fraction
        - measured_salt
        - measured_element_fractions
      output: "biomass_water_salt_element_subledgers"
      source_ids: []
    - id: packaging_balance
      applies_to: "tote; liner; label"
      rule: "Opening_empty + opening_attached_WIP_FG + opening_reusable + purchases + external_returns_received = closing_empty + closing_attached_WIP_FG + closing_reusable + gross_dispatch_packaging + external_returns_sent + waste, component by component. Cancel internal reuse, not gross dispatch, only at consolidation."
      inputs:
        - packaging_open
        - packaging_close
        - purchases
        - external_returns
        - gross_dispatch
        - waste
      output: "component_balance"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Full source-specific state and process support; no source registration or tool success substitutes for applicability"
      evidence: "Primary originals and dated site records with method limitations"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Each exchange has raw collection obligation and range warning; include every conditional exchange actually present and report missing values; never hide in zero or other"
      evidence: "Per-card protocol logs and stock/species reconciliation"
    - id: dq_food
      applies_to: "released_kelp"
      requirement: "Current site/destination suitability and required tests; general hazard knowledge does not approve a lot"
      evidence: "Water and batch analyses; time/temperature records; release decision"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "Represent full named cycle with date, geography, technology and nonproduction loads; disclose supplier/process substitution and uncertainty"
      evidence: "Complete primary logs; calibration and sensitivity analysis"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Algae retains contrary wild/unfit native metadata and unknown owner intent; independently verify supplied product quality and never auto-select wild/nonfood upstream providers. Each UUID uses its verified complete identity restrictions; unresolved auxiliaries stay physically specific and are rechecked before dataset completion"
      evidence: "Exact-state native identity and support-chain records plus actual supplier identity"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "These requirements apply to the whole declared cohort and its actual conditional exchanges, including Q = 0. Engineering inspection can verify declared structure and consistency only; missing measurements or food-suitability decisions cannot be reported as scientifically verified."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all_rows"
    rule: "Confirm S. latissima, farmed route, fresh raw state and all qualifiers. A generic Algae UUID does not establish food suitability, farmed provenance or an accepted CPC mapping. Reject dried/pressed Laminaria identity for this wet crop; retain every UUID restriction and unresolved auxiliary identity in consumable context."
    source_ids: []
  - rule_id: v_food
    applies_to: "released_kelp"
    rule: "Before Q require documented current-site food-suitability decision, authorized harvest waters and seed provenance, microbial/chemical sampling with methods/limits, contaminant and iodine risk assessment, sanitation, cold chain and fouling-allergen communication. For the Connecticut reference configuration the 2020 guide specifies cooling within two hours of harvest start and refrigeration set below 41 F (5 C); verify the current applicable authority and operational controls rather than treating this historical guide as current legal clearance. It does not validate shelf life, a pathogen kill step or food-safety certification. Frozen/dried/reduced-oxygen routes have different hazards and cannot inherit this release."
    source_ids:
      - ctsg-seaweed-food-hazards-2020
  - rule_id: v_mass
    applies_to: "physical_gates"
    rule: "Reconcile each nursery, grow-out, release and service physical gate, then the consolidated gate: opening stock + actual external inputs + biological net additions = closing stock + all actual outputs/losses. Preserve dry biomass, salt, intrinsic water, attached seawater, ice and each packaging material separately; reactions/respiration and actual dissolved/gas species need independent evidence. Do not adjust moisture or one unknown flux to close two unknowns. No universal residual tolerance is supplied: use measured uncertainty and investigate imbalance."
    source_ids: []
  - rule_id: v_elements
    applies_to: "growout"
    rule: "Use independent dry matter and measured C/N/P composition for every biomass stock and destination and independently determined environmental species fluxes. Conserve carbon, nitrogen and phosphorus across uptake, released/standing biomass, losses, respiration and actual discharges. Convert element mass to a chemical species only with measured speciation, correct stoichiometry and charge. Indicators DIC, COD, total N/P and VOC do not identify molecules. No unsupported carbon credit or persistent storage claim."
    source_ids: []
  - rule_id: v_period
    applies_to: "campaign_and_stock"
    rule: "Include failed/zero-output cycles, startup, shutdown, idle, cleanup, sampling, rework and returns. For each exchange retain opening/closing WIP quantity, stage and inherited burden vector. Reverse the original transfer on returns; assign only incremental rework once. Do not renormalize already normalized historical burdens. Released FG stock cannot create a second Q on inspection or delivery."
    source_ids: []
  - rule_id: v_packaging
    applies_to: "tote_liner_label"
    rule: "For each distinct packaging component reconcile opening empty + opening attached WIP/FG + opening reusable stock + purchases + external returns received = closing counterparts + material on GROSS physical dispatch + external returns sent + waste. Eliminate internal reuse and transfers only on consolidation. Returned full packs retain their actual contents and historical burden; split empties. Packaging and ice never enter net tissue Q and reuse never implies repurchase or automatic co-product."
    source_ids: []
  - rule_id: v_calc
    applies_to: "all_inventory_rows"
    rule: "Convert raw units and allocate attributable raw exchange numerators first; apply the single normalization calculation once for Q greater than zero. Cards and protocol aggregation refer to that same result and must not divide it again. Q equal to zero retains absolute activity and inherited burdens and produces no per-unit result. Missing raw data, biological species fluxes or safety decisions remain explicit unavailable findings, not zero or an asserted pass."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared fresh raw S. latissima food biomass at the first-release gate with separately identified postrelease services"
  allowed_use: "Attributional inventory consistent with actual species, wet basis, gate, site, season and technology after data completion and review"
  excluded_use: "Automatic food certification or nutritional equivalence; dried/frozen/ground substitutions; avoided fertilizer or carbon credits; universal species inventories"
  required_metadata: "species Saccharina latissima; farmed origin and seed provenance; culture site and season; spore-seeded longline route; raw fresh whole blades; first-release gate and timestamp; Q net wet tissue and drainage method; independently measured dry matter and moisture; salt disclosure and attached-water exclusion; food-suitability evidence and destination requirements; harvest-water status; microbial and chemical test methods and detection limits; iodine and contaminant assessment; harvest-to-cooling time and temperature; unsealed packaging and allergen communication; cohort stock and inherited burden vectors; capital service attribution; actual postrelease service scope; uncertainty and identity restrictions; contrary native wild and unfit metadata with unknown owner intent; independent supply quality and no automatic wild/nonfood upstream dataset or provider"
  required_quality_disclosure: "Missing raw values and conditional rows; uncertainty; full source scope; native UUID limitations; stock vectors; source state compatibility and ordinary identity gaps"
  update_trigger: "Species/state/route/gate change; new food hazards or authority conditions; supplier formulation or equipment changes; revised measurements or native identities"
data_sources:
  - id: "ctsg-kelp-nursery-2014"
    type: "handbook"
    reference: "Redmond et al. 2014. New England Seaweed Culture Handbook: Nursery Systems. CTSG-14-01. https://repository.library.noaa.gov/view/noaa/44208/noaa_44208_DS1.pdf"
    used_for: "pp. 8–11 water treatment/media context; pp. 17–29 kelp identity and direct spore seeding; nursery equipment; seawater change; field longline maintenance; vegetative-culture counterexample. No food authorization or universal inventory coefficients."
  - id: "ctsg-seaweed-food-hazards-2020"
    type: "official_guidance"
    reference: "Concepcion, DeRosia-Banick and Balcom. 2020. Seaweed Production and Processing in Connecticut: A Guide to Understanding and Controlling Potential Food Safety Hazards. CTSG-20-01. https://seagrant.uconn.edu/wp-content/uploads/sites/1985/2020/01/Seaweed-Hazards-Guide_Jan2020_accessible.pdf"
    used_for: "Note to users and pp. 3–9 species/process hazards and contamination; p. 12 raw whole state and allergen context; pp. 13–18 raw versus processed branches; p. 21 model harvest/dockside/cooling/distribution plan. Historical CT guidance; actual current requirements must be checked; no food certification."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. 2010. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance. First edition March 2010. §§7.9.2–7.9.3 pp. 255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional subdivision and virtual subdivision; exchange-specific determining physical causality; residual common-gate actual-condition market value and inventory conservation. No seaweed industrial recipe or fixed split."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:0285098457116423868a4329605cfb56729229edc857dedb4b14841f32090278"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6899"
      family: "system_boundary"
      span:
        start:
          offset: 6899
          line: 60
          column: 1
        end:
          offset: 11003
          line: 81
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Authorized fresh S. latissima sorus acquisition plus actual installed asset and supplier input production |\n| starting_condition_role | foreground_starting_condition |\n| product_classification_scope | CPC 3.0 04932 context; only the narrower fresh whole food crop described here |\n| recursive_input_rule | Seeded twine is an internal stage; bought seed retains its full nursery burden. No infinite recursive edible-kelp input or burden-free bought finished crop |\n| upstream_dataset_requirement | Match actual material/formulation, supply state, geography and energy boundary; retain technology and temporal representativeness and unresolved gaps |\n| disclosure | Site; cohort; seed provenance; asset configuration; actual chemicals; raw water; food release; stock vectors; downstream service scope; exclusions |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_complete | cultivation_to_release | Include authorized sorus collection and nursery water treatment, enrichment, spore inoculation, lit/chilled/aerated nursery, seeded twine transport, installation, deployment, monitoring, thinning if actually needed, maintenance, retrieval, harvest, cooling, sampling, inspection, packaging and first food-quality release. Purchased seed does not erase its nursery chain: obtain complete supplier foreground/upstream inventory or explicitly retain the missing upstream burden. This route cannot begin at bought edible kelp. | ctsg-kelp-nursery-2014; ctsg-seaweed-food-hazards-2020 |\n| b_scope | fresh_food_route | Only cultivated S. latissima raw whole blades under documented food suitability are included. Wild-harvest food, S. japonica, Laminaria digitata, Gracilaria, microalgae, feed/fertilizer/bioremediation biomass, extracts and mixed taxa are excluded. Frozen, dried, ground, washed/blanched or reduced-oxygen packed products require separately evidenced state/process extensions; a CPC leaf is not proof of such coverage. | ctsg-kelp-nursery-2014; ctsg-seaweed-food-hazards-2020 |\n| b_assets | capital_and_auxiliaries | Collect every installed asset and its supplier production, installation, service life, replacement and end treatment under the same scope; no unsupported capital cutoff. Article mass is assigned by justified service use before normalization and is excluded from biological mass inputs. The listed asset configuration is a transparent technical collection design, not a claimed single documented factory bill. Add each actual cable, fitting, building component or other real input as its own specific exchange when outside an already purchased whole article. |  |\n| b_gate | first_release_and_service | Q is the first food-quality release of new compliant net wet tissue for a defined cohort; delivery, storage transfer, reinspection or rework never creates second production. Same-cohort released closing FG is already part of Q. Keep manufacture, pending-release WIP and released FG/service physical gates separately; paired internal transfers cancel in consolidation. Packaging, storage, handling and dispatch services after release remain separate cohort service accounts, with historical FG burdens retained for the cohort served. Never add historical production to current Q. |  |\n| b_atomic | all_exchanges | Every real purchased preparation crosses once at whole as-supplied mass; active ingredients, dry solids, carrier water and assay are constituent subledgers. Internally prepared formulations require separate actual purchased materials, water, energy and losses. Record every real emission species and actual receiving compartment or treatment. No other, utility, packaging or pollutant aggregate can hide unlisted exchanges; add conditional specific rows before calculating. No steam, boiler or external hot-water return is presumed by this electrical nursery/cold-chain configuration; if one actually exists record supply/return mass, temperature, enthalpy and supplier water/energy agreement as separate exchanges. |  |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 354
              line: 10
              column: 1
            end:
              offset: 430
              line: 10
              column: 77
