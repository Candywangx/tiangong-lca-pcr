allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable live, fresh, or chilled farmed tuna output"
    rule: "Treat the declared reference product as the single reference product unless roe, offal, mortalities, residues, or processing outputs are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "capture-based aquaculture routes"
    rule: "Do not allocate away wild stock capture, transfer losses, or mortality by excluding them from the foreground package. Assign them to the aquaculture product unless a reviewed upstream wild-stock dataset and allocation rule are declared."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "multi-species, multi-lot, or shared-service farms"
    rule: "Allocate shared electricity, vessel fuel, oxygen, site service, net cleaning, and holding infrastructure by measured meter, batch log, biomass-time, cage-time, or another declared physical driver before economic allocation."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "mixed-product packing or delivery"
    rule: "Allocate packaging, ice, live-holding, refrigeration, and delivery loads by measured product mass, package count, pallet, trip, temperature-control zone, or tonne-km as applicable."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock_origin_capture_transfer_and_stocking_records
      process_id: "stock_capture_hatchery_transfer_and_stocking_growout_fattening_and_husbandry"
      flow_role: "biological stock, capture-based stock, transfer, accepted stocking"
      record_type: "hatchery record, supplier invoice, capture log, permit, transfer log, stocking log, mortality log"
      raw_fields: "species, origin, capture area, permit, supplier, life stage, count, mean mass, total mass, transfer route, stocking date, cage or tank, accepted count, accepted mass, transfer mortality"
      collection_method: "batch records reconciled to cage or tank inventory"
      unit: "kg, item, date, permit id"
      frequency: "each stocking event"
      temporal_coverage: "full reporting period or production campaign"
      site_scope: "hatchery, supplier, capture vessel, transfer route, cage, tank, or farm site"
      aggregation_rule: "reconcile source stock plus transfers minus mortalities and rejects to accepted stocked biomass; normalize to marketable output"
      quality_evidence: "supplier documents, permits, transfer logs, cage inventory, mortality records, and manager sign-off"
    - protocol_id: cp_feed_bait_and_feed_composition_records
      process_id: "growout_fattening_and_husbandry"
      flow_role: "feed, fresh bait, formulated feed, additives, feeding losses"
      record_type: "feed invoice, feed log, bait purchase, bait species log, formulation sheet, feeding record"
      raw_fields: "feed or bait type, supplier, species, mass, dry/wet/as-fed basis, moisture, feeding date, cage or lot, uneaten feed, additive or medication, marine ingredient disclosure"
      collection_method: "weigh tickets, supplier declarations, feed-system records, and stockkeeper logs"
      unit: "kg, %, dose, date"
      frequency: "each feed delivery and feeding period"
      temporal_coverage: "full grow-out or fattening campaign"
      site_scope: "each cage, tank, site, and feed supplier"
      aggregation_rule: "sum feed or bait mass by batch and basis; convert only with moisture or supplier evidence; normalize to marketable output"
      quality_evidence: "invoices, feed declarations, feed logs, formulation sheets, and reconciliation to inventory"
    - protocol_id: cp_water_energy_vessel_cage_and_site_records
      process_id: "growout_fattening_and_husbandry_stock_capture_hatchery_transfer_and_stocking"
      flow_role: "water, oxygen, electricity, fuel, vessel service, cage materials, site service"
      record_type: "meter log, fuel invoice, vessel log, oxygen log, cage maintenance log, net cleaning log, service invoice"
      raw_fields: "electricity, fuel, oxygen, water, vessel hours, distance, cage, net, anchor, float, cleaning, maintenance, allocation driver, site and batch"
      collection_method: "metered records, invoices, vessel logs, and maintenance records"
      unit: "kWh, L, MJ, kg, m3, item, m, h, tonne-km"
      frequency: "monthly and each major operation"
      temporal_coverage: "full reporting period or campaign"
      site_scope: "farm site, vessel, cage, tank, hatchery, or delivery route"
      aggregation_rule: "allocate shared records by direct meter, operation log, biomass-time, cage-time, or declared physical driver"
      quality_evidence: "meter readings, invoices, service logs, allocation worksheet, and calibration records where relevant"
    - protocol_id: cp_mortality_residue_and_escape_records
      process_id: "stock_capture_hatchery_transfer_and_stocking_growout_fattening_and_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "mortalities, rejected stock, residue, uneaten feed, sludge, escapes, wastewater"
      record_type: "mortality log, escape report, residue log, wastewater record, disposal note"
      raw_fields: "date, species, count, mass, cause, cage or tank, fate, disposal route, recovery route, escape count, corrective action, receiving environment"
      collection_method: "daily husbandry records, incident reports, waste tickets, and treatment records"
      unit: "kg, item, m3, date"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "full reporting period or campaign"
      site_scope: "cage, tank, transfer route, harvest area, packhouse, or waste route"
      aggregation_rule: "sum and classify by fate; reconcile stock balance and product mass; normalize to reference output"
      quality_evidence: "mortality records, waste transfer notes, escape incident files, treatment records, and supervisor review"
    - protocol_id: cp_harvest_product_packout_records
      process_id: "growout_fattening_and_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "harvest biomass, grading, product form, marketable output"
      record_type: "harvest log, grading sheet, packout record, sales note, scale ticket"
      raw_fields: "harvest date, species, cage or tank, live mass, product form, count, size grade, bleeding or gutting status, chilled or live state, rejected mass, marketable mass, destination"
      collection_method: "calibrated scales, grading records, sales records, and packhouse reconciliation"
      unit: "kg, item, grade, date"
      frequency: "each harvest and packing lot"
      temporal_coverage: "full reporting period or campaign"
      site_scope: "harvest site, live-holding unit, packhouse, or dispatch gate"
      aggregation_rule: "reconcile harvested biomass plus purchases minus rejects and residues to marketable output; normalize all flows to 1 kg reference product"
      quality_evidence: "scale calibration, harvest sheets, packout records, dispatch records, and sales reconciliation"
    - protocol_id: cp_packaging_ice_chilling_and_dispatch_records
      process_id: "harvest_live_holding_chilling_and_packout"
      flow_role: "packaging, ice, live holding, chilling, washing, refrigerant service"
      record_type: "packaging invoice, ice log, temperature log, water meter, oxygen log, refrigerant service record, dispatch sheet"
      raw_fields: "packaging material, item count, tare, ice mass, oxygen, water, electricity, refrigerant service, temperature, holding time, lot, destination"
      collection_method: "invoices, meters, temperature records, and dispatch records"
      unit: "kg, item, m3, kWh, deg C, h"
      frequency: "each packing lot and monthly reconciliation"
      temporal_coverage: "harvest, holding, packing, and dispatch period"
      site_scope: "packhouse, live-holding unit, cold room, dispatch gate"
      aggregation_rule: "allocate to product lots by measured lot, package count, product mass, holding time, or temperature-control zone"
      quality_evidence: "invoices, temperature logs, calibration records, dispatch sheets, and operator review"
    - protocol_id: cp_delivery_records
      process_id: "delivery_to_declared_gate"
      flow_role: "delivered product, transport energy, live or chilled delivery condition"
      record_type: "delivery note, transport invoice, fuel record, route plan, temperature or live-holding log"
      raw_fields: "origin, destination, distance, mode, load mass, fuel, electricity, ice, oxygen, temperature, live-holding duration, return logistics"
      collection_method: "carrier documents, vehicle logs, meter records, and dispatch reconciliation"
      unit: "kg, km, tonne-km, L, kWh, h, deg C"
      frequency: "each delivery route"
      temporal_coverage: "delivery period in declared scope"
      site_scope: "delivery route, vehicle, vessel, or carrier"
      aggregation_rule: "calculate tonne-km and allocate fuel or service by load mass, distance, temperature zone, and return logistics where relevant"
      quality_evidence: "carrier invoice, route record, temperature log, and dispatch sign-off"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "normalized amount = collected amount / marketable reference product mass, with unit and product-form basis retained"
      inputs:
        - "collected amount"
        - "marketable product mass"
        - "product basis"
      output: "kg, kWh, L, item, m3, or tonne-km per kg reference product"
      source_ids:
        - mass-balance-identity
    - id: stock_acceptance_balance
      applies_to: "stocking and transfer"
      rule: "accepted stocked biomass = source stock mass + transferred-in mass - transfer mortalities - rejected stock - documented transfer losses"
      inputs:
        - "source stock"
        - transfers
        - mortalities
        - rejects
        - "transfer loss"
      output: "accepted stocked biomass"
      source_ids:
        - fao-capture-based-aquaculture-guidelines-2011
    - id: growth_and_survival_balance
      applies_to: "grow-out and fattening"
      rule: "harvest-size biomass = stocked biomass + biological growth - mortalities - escapes - rejects, checked against harvest records"
      inputs:
        - "stocked biomass"
        - "feed or bait records"
        - mortalities
        - escapes
        - "harvest records"
      output: "harvest-size biomass and survival disclosure"
      source_ids:
        - fao-atlantic-bluefin-tuna-culture
        - asc-farm-standard-2025
    - id: feed_or_bait_conversion_disclosure
      applies_to: "feed and bait rows"
      rule: "feed or bait ratio = feed or bait mass on declared basis / live biomass gain or marketable output; do not mix dry, wet, live, or thawed bases without conversion evidence"
      inputs:
        - "feed or bait mass"
        - "moisture or basis"
        - "biomass gain"
        - "marketable output"
      output: "declared feed or bait ratio and basis"
      source_ids:
        - asc-feed-standard-2026
        - fao-capture-based-aquaculture-2008
    - id: product_form_yield
      applies_to: "harvested and packed product"
      rule: "marketable product mass = harvested mass - rejected mass - bleed, gutting, drainage, ice, tare, and handling losses according to declared product basis"
      inputs:
        - "harvest mass"
        - "rejected mass"
        - "product-form records"
        - "packout records"
      output: "marketable live, fresh, or chilled mass"
      source_ids:
        - codex-cxc-52-2003
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "tonne-km = delivered product mass in tonnes x one-way or contract-declared route distance; allocate temperature-control or live-holding inputs by load share"
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "temperature or live-holding condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and biological stock"
      requirement: "Species, product category, farmed or aquaculture-fattened status, stock origin, capture-based status, culture route, product form, and declared gate must be explicit."
      evidence: "reference flow metadata, stocking records, permits, harvest records, and sales or dispatch records"
    - id: dq_capture_based_traceability
      applies_to: "capture-based aquaculture routes"
      requirement: "Wild stock capture or purchase, permit, transfer loss, stocking event, controlled fattening period, and harvest output must be traceable and reconciled."
      evidence: "capture logs, supplier invoices, movement permits, transfer logs, cage inventory, mortality records, and harvest records"
    - id: dq_mass_balance
      applies_to: "stock, feed, mortality, harvest, and packout"
      requirement: "Stocking, growth, mortality, escape, residue, harvest, reject, and marketable product records must reconcile within declared tolerance; unexplained gaps require disclosure."
      evidence: "mass-balance worksheet, scale tickets, cage records, packout records, and supervisor review"
    - id: dq_feed_bait_basis
      applies_to: "feed and bait records"
      requirement: "Feed and bait basis must distinguish formulated feed, fresh bait, frozen bait, live feed, dry matter, wet mass, thawed mass, medicated feed, and supplier species or composition where available."
      evidence: "feed invoices, bait species logs, formulation sheets, feed declarations, and feeding records"
    - id: dq_temporal_coverage
      applies_to: "all foreground rows"
      requirement: "Data must cover the full production or fattening campaign and final handling period, or disclose partial-year, partial-batch, or proxy coverage."
      evidence: "reporting calendar, batch records, harvest records, and coverage statement"
    - id: dq_boundary_disclosure
      applies_to: "all datasets"
      requirement: "The dataset must disclose whether upstream stock capture, hatchery production, feed, bait, packaging, delivery, capital goods, and infrastructure are foreground, linked upstream datasets, or excluded by scope."
      evidence: "dataset boundary statement, supplier records, upstream dataset links, and scope declaration"
