published_dataset_profile:
  dataset_role: "foreground production dataset for farmed tunas, skipjack, or stripe-bellied bonito, live, fresh, or chilled"
  downstream_use: "secondary_dataset; background_dataset; foreground reference for process or lifecyclemodel construction when site-specific aquaculture records are retained"
  allowed_use: "LCA modelling of declared farmed or aquaculture-fattened tuna-category live, fresh, or chilled product at farm, harvest, dispatch, packhouse, or delivered gate"
  excluded_use: "wild tuna that is only captured and handled; frozen tuna; processed tuna; canned tuna; fillets or loins; non-tuna farmed fish; ornamental fish; fish seed; roe, oil, offal, mortalities, sludge, or residues as separate products; ecosystem-service credits without a separate reviewed method"
  required_metadata: "canonical PCR id; CPC 3.0 code; species; stock origin; capture-based status; culture system; stocking date and biomass; product form; size grade; live/fresh/chilled state; feed or bait basis; mortality and escape disclosure; harvest and holding condition; packaging state; declared gate; geography; reporting period; data owner; unresolved UUID substitutions"
  required_quality_disclosure: "farmed production evidence, capture-based stock traceability where applicable, mass balance closure, feed and bait basis, temporal coverage, allocation basis, upstream dataset links, missing foreground records, proxy rows, and reasoned-estimate ranges used only for QA screening"
  update_trigger: "new Tiangong flow identities for tuna eggs, larvae, juveniles, formulated feed, bait species, oxygen, cage materials, escapes, residues, ice, or delivery services; reviewed quantitative evidence for feed conversion, mortality, transfer loss, fuel, cage service, or chilling ranges; updated FAO, Codex, ASC, or legal requirements; classification mapping change"
data_sources:
  - id: "fao-atlantic-bluefin-tuna-culture"
    type: "official_guidance"
    reference: "FAO Cultured Aquatic Species Information Programme, Atlantic bluefin tuna (Thunnus thynnus) cultured species profile, https://www.fao.org/fishery/culturedspecies/thunnus_thynnus/en"
    used_for: "tuna aquaculture route, product boundary, stock and husbandry context"
  - id: "fao-capture-based-aquaculture-2008"
    type: "literature"
    reference: "FAO Fisheries Technical Paper No. 508, Capture-based aquaculture: global overview, including bluefin tuna chapter, https://openknowledge.fao.org/handle/20.500.14283/y5258e"
    used_for: "capture-based aquaculture process decomposition, stock capture and fattening context"
  - id: "fao-capture-based-aquaculture-guidelines-2011"
    type: "official_guidance"
    reference: "FAO Technical Guidelines for Responsible Fisheries, Responsible use of wild fishery resources for capture-based aquaculture, https://www.fao.org/4/ba0059e/ba0059e.pdf"
    used_for: "capture-based boundary, stock traceability, transfer, permit, and responsible-use disclosure"
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "Codex Alimentarius Code of Practice for Fish and Fishery Products, CXC 52-2003, https://www.fao.org/input/download/standards/10273/CXP_052e.pdf"
    used_for: "live, fresh, chilled fish handling, hygiene, product-state and final handling context"
  - id: "asc-farm-standard-2025"
    type: "standard"
    reference: "Aquaculture Stewardship Council, ASC Farm Standard v1.0.1, 2025, https://programme-centre.asc-aqua.org/app/uploads/2025/08/ASC-STD-001-ASC-Farm-Standard-V1.0.1-Aug-2025.pdf"
    used_for: "farm management, traceability, mortality, escape, health, welfare, and environmental disclosure"
  - id: "asc-feed-standard-2026"
    type: "standard"
    reference: "Aquaculture Stewardship Council, ASC Feed Standard v1.2 update, https://asc-aqua.org/producers/get-certified-feed-mill/asc-feed-standard-v1-2-update/"
    used_for: "feed supplier and ingredient disclosure context"
  - id: "mass-balance-identity"
