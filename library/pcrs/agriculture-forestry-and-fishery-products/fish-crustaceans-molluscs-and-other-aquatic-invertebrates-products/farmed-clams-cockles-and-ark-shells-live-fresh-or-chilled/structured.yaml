  calculation_rules:
    - id: cr_output_normalization
      applies_to: "all foreground inventory rows"
      rule: "amount_per_kg = recorded_cycle_amount / dispatched_reference_product_kg"
      inputs:
        - "recorded cycle amounts"
        - "dispatched reference product mass"
      output: "inventory amount normalized to 1 kg reference product"
      source_ids: []
    - id: cr_electricity_unit_conversion
      applies_to: "electricity rows"
      rule: "electricity_MJ = electricity_kWh x 3.6"
      inputs:
        - "metered electricity in kWh"
      output: "electricity amount on an energy basis where the dataset requires it"
      source_ids: []
    - id: cr_nutrient_balance
      applies_to: "nutrient_n_exchange; nutrient_p_exchange"
      rule: "net_nutrient_exchange = fertilizer_nutrient_input + influent_water_nutrient - harvested_biomass_nutrient - declared_sediment_retention; a negative result denotes net removal from the water and must be disclosed with its calculation inputs"
      inputs:
        - "fertilizer records"
        - "influent water nutrient tests"
        - "harvested biomass nutrient tests"
      output: "net nitrogen or phosphorus exchange per kg reference product"
      source_ids: []
    - id: cr_harvest_mass_closure
      applies_to: "harvesting; landing_site_handling"
      rule: "harvested_mass = dispatched_mass + grading_reject_mass + handling_mortality_mass; deviations beyond 10 percent must be explained in the data package"
      inputs:
        - "harvest yield records"
        - "dispatch records"
        - "reject records"
      output: "reconciled harvest-to-dispatch mass closure"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference flow and UUID-bearing rows"
      requirement: "Selected Tiangong flow, flow property and unit group UUIDs match the names declared in this PCR and are confirmed by lookup before publication."
      evidence: "lookup confirmation record retained outside PCR content"
    - id: dq_measurement
      applies_to: "collected foreground amounts"
      requirement: "Amounts derive from calibrated meters, scales, invoices or laboratory analyses; any estimation method is declared."
      evidence: "calibration records; invoices; laboratory certificates"
    - id: dq_temporal_coverage
      applies_to: "foreground dataset"
      requirement: "Records cover at least one full grow-out production cycle including its harvest and handling season."
      evidence: "stocking, harvest and dispatch logs spanning the cycle"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Every required process and flow row is populated or explicitly justified as not applicable to the declared route."
      evidence: "completeness checklist against the process map"
    - id: dq_disclosure
      applies_to: "dataset metadata"
      requirement: "Culture system, site, fertilization practice, depuration practice, survival rate, allocation keys and cut-off choices are disclosed."
      evidence: "dataset metadata fields"
validation_rules:
  - rule_id: vr_reference_flow_identity
    applies_to: "reference flow definition"
    rule: "The data package reference flow carries the product flow, flow property and unit group UUIDs declared in section 3, with reference amount 1 and unit kg."
    source_ids: []
  - rule_id: vr_required_qualifiers
    applies_to: "dataset metadata and reference flow comment"
    rule: "Every required qualifier in section 3 is declared; a data package with a missing qualifier fails validation."
    source_ids: []
  - rule_id: vr_mass_closure
    applies_to: "harvest and handling mass balance"
    rule: "Harvested mass reconciles with dispatched mass plus rejects and handling mortality within 10 percent, and the closure calculation is documented."
    source_ids: []
  - rule_id: vr_unit_consistency
    applies_to: "inventory rows"
    rule: "Amounts use the units declared in the flow rows and section 4; electricity is stored consistently in kWh or MJ with the conversion documented."
    source_ids: []
  - rule_id: vr_range_conformance
    applies_to: "collected foreground amounts"
    rule: "Collected amounts outside a QA guardrail range are flagged with an explanation or corrected before the data package is treated as conforming."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_product_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Life cycle modelling of farmed clams, cockles and ark shells supplied live, fresh or chilled; upstream dataset for same-category transfers between farms under this PCR"
  excluded_use: "Representing wild-caught products; representing processed, frozen or preserved clam products; use outside the declared culture system, region and cycle without remodelling"
  required_metadata: "required qualifiers of section 3; data quality disclosures of section 8; allocation keys; cut-off disclosures"
  required_quality_disclosure: "measurement basis, temporal coverage, completeness against the process map, and guardrail range flags"
  update_trigger: "new production cycle data; change of culture system, fertilization or depuration practice; correction of a referenced Tiangong UUID; methodological update of this PCR"
data_sources:
  - id: "un-cpc-ver-3-0"
    type: "standard"
    reference: "United Nations Central Product Classification Version 3.0, code 04452"
    used_for: "product category identity and classification scope"
  - id: "fao-cultured-aquatic-species-ruditapes-philippinarum"
    type: "official_guidance"
    reference: "FAO Cultured Aquatic Species Information Programme, Ruditapes philippinarum fact sheet"
    used_for: "process decomposition, culture systems, representative product and boundary starting condition"
  - id: "fao-fishstat-aquaculture-production"
    type: "dataset"
    reference: "FAO FishStat global aquaculture production statistics"
    used_for: "market state and production scale"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006 Environmental management - Life cycle assessment - Requirements and guidelines"
