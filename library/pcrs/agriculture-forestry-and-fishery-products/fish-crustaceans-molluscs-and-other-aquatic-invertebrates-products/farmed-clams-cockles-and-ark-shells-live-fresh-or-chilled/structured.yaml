allocation_rules:
  - rule_id: al_shell_part_of_product
    applies_to: "reference product"
    rule: "Shells are part of the live in-shell reference product; no allocation between meat and shell is performed."
    source_ids: []
  - rule_id: al_polyculture_shared_inputs
    applies_to: "shared pond or flat inputs in multi-species culture"
    rule: "Where clams share ponds, flats or equipment with other species, shared inputs are allocated to the clam output by economic value of the harvested outputs over the cycle; physical mass allocation is used only when value data are unavailable, and the applied key is disclosed."
    source_ids:
      - iso-14044-2006
  - rule_id: al_mortality_no_coproduct
    applies_to: "dead stock, rejects and returned undersized clams"
    rule: "Mortalities, grading rejects and returned undersized clams carry no economic value and receive no allocated burden; all foreground burdens remain with the dispatched reference product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_stocking_records
      process_id: "grow_out_culture"
      flow_role: "clam seed input"
      record_type: "stocking log"
      raw_fields: "seed batch id; stocked mass; seed count; size grade; stocking date"
      collection_method: "farm stocking records with supplier delivery notes"
      unit: "kg"
      frequency: "per stocking event"
      temporal_coverage: "full grow-out cycle"
      site_scope: "each pond or culture parcel"
      aggregation_rule: "sum of stocked seed mass per cycle"
      quality_evidence: "supplier invoices; signed stocking log"
    - protocol_id: cp_fertilizer_records
      process_id: "grow_out_culture"
      flow_role: "fertilizer inputs"
      record_type: "purchase and application log"
      raw_fields: "product name; nutrient content; applied mass; application date"
