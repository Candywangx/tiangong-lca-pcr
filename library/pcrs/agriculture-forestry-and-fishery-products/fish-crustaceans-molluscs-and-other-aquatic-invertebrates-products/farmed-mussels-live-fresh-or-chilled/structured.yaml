      requirement: "Keep shell-on, live, fresh, chilled, drained, washed, wet, dry, count, container, and net mass bases separate unless measured conversion evidence exists."
      evidence: "scale records, product specifications, count per kg records, container tare, drainage or moisture evidence"
    - id: no_feed_and_material_disclosure
