system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Spat or seed sourcing, including on-site hatchery and nursery activity when controlled by the reporting operator, or purchased spat and wild-collected spat brought under declared aquaculture control when supplied by another hatchery, collector, or nursery."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Grow-out husbandry, including culture-unit preparation, spat collection or stocking, socking or re-socking, thinning, grading at sea when performed, gear deployment and retrieval, fouling and predator management, controlled water movement, mortalities, and directly controlled maintenance."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Harvest, washing, grading, debyssing when performed, depuration, relaying, purging, live holding, chilling, packaging, and declared gate release when these operations are performed before the reference product leaves the foreground boundary."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Delivery to the declared gate when the reference flow is delivered product rather than farm-gate, harvest-area, dispatch-centre, or packhouse product."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Capital goods, long-lived infrastructure, and long-term habitat modification are included only when the declared data package scope requires them. Spat, seed, gear, packaging, ice, electricity, fuel, and other purchased inputs require upstream datasets unless the same operator controls and reports their production in the foreground package."
      source_ids: []
