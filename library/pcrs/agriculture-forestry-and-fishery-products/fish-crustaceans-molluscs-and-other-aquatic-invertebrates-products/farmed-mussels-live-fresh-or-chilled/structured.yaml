measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference flow must be expressed as kg farmed mussels in the declared live, fresh, or chilled product form."
  - id: product_state_and_shell_basis
    applies_to: "shell-on live, fresh, chilled, drained, or other declared product records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Product mass must state whether it is shell-on live weight, shell-on chilled weight, drained weight after washing or depuration, debyssed or cleaned weight, or another contract-declared basis. Convert only with measured yield or drainage evidence."
  - id: count_to_mass_conversion
    applies_to: "seed, stocking, harvest, grading, sales, sack, mesh bag, crate, cluster, and count-grade records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Count-based or container-based records must include net mass, mean individual mass or count per kg, container tare, size grade, and sampling method before normalization to kg product."
  - id: spat_lot_identity
    applies_to: "hatchery spat, wild-collected spat under aquaculture control, nursery stock, and transferred seed lots"
    required_property_ref:
      name: "Mass or count"
      uuid: ""
    required_unit: "kg and item"
    rule: "Spat and seed records must retain supplier, hatchery or collection area, species, batch, count, mean size or mass, transfer date, health or movement permission, and mortality or rejection records."
  - id: no_external_feed_default
    applies_to: "grow-out husbandry"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Filter-feeding grow-out is treated as having no external feed input by default. Any intentional feed, fertilization, pond enrichment, or supplemental algal input must be declared as a product input with quantity, purpose, and source evidence."
  - id: water_volume_or_mass
    applies_to: "hatchery, nursery, depuration, relaying, live holding, washing, chilling, and wastewater"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Record only water that is pumped, supplied, metered, treated, recirculated, or discharged under foreground control. Ambient seawater passing through open suspended, raft, pole, bottom, or rack systems is a boundary condition, not a process water input."
  - id: culture_area_time
    applies_to: "longline, raft, pole, rack, tray, bottom plot, or other grow-out area"
    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "ha-year or m2-day"
    rule: "Record licensed or occupied culture area and active culture duration when needed for stocking density, habitat disclosure, or allocation in shared sites."
  - id: gear_and_socking_material_basis
    applies_to: "ropes, socks, longlines, floats, buoys, anchors, poles, racks, trays, clips, ties, and reusable gear"
    required_property_ref:
      name: "Mass or item count"
      uuid: ""
    required_unit: "kg or item"
    rule: "Gear records must retain material type, item count, mass, deployment period, service life, recovery, reuse, recycling, disposal, or loss fate before allocation to the reference flow."
  - id: energy_and_fuel_inventory
    applies_to: "pumping, aeration, hatchery, nursery, boat, vehicle, washing, depuration, chilling, live holding, and delivery energy"
    required_property_ref:
      name: "Energy or fuel quantity"
      uuid: ""
    required_unit: "kWh, MJ, L, or kg"
    rule: "Record original electricity, fuel, or energy carrier units before normalizing to the reference flow. Do not double count supplier transport already included in purchased inputs."
  - id: packaging_and_ice_basis
    applies_to: "sacks, mesh bags, boxes, labels, liners, ice, gel packs, pallets, and reusable containers"
    required_property_ref:
      name: "Mass or item count"
      uuid: ""
    required_unit: "kg or item"
    rule: "Packaging and ice records must retain material type, item count, tare or fill mass, reuse rate where relevant, and destination before conversion to kg per reference product."
