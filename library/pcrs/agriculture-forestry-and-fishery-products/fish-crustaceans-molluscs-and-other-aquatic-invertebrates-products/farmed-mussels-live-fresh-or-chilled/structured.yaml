  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all foreground rows"
      rule: "normalized_amount = measured_or_calculated_amount / marketable_reference_product_mass. Preserve raw records and product-state basis."
      inputs:
        - "measured amount"
        - marketable_reference_product_mass
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_spat_acceptance_and_survival
      applies_to: "spat_supply_hatchery_and_nursery and growout_husbandry"
      rule: "accepted_spat_or_seed = received_or_collected_spat - rejected_spat; survival_to_harvest = harvested_count / accepted_spat_count when count records are available. Retain count-to-mass conversion separately."
      inputs:
        - "received spat"
        - "collected spat"
        - "rejected spat"
        - "stocked count"
        - "harvested count"
        - "mortality count"
      output: "accepted spat or seed, survival indicator, and QA check"
      source_ids:
        - mass-balance-identity
    - id: calculate_area_time_intensity
      applies_to: "growout_husbandry"
      rule: "area_time = active_culture_area * active_culture_duration; allocate shared area by culture-unit records, biomass-time, or product mass as declared."
      inputs:
        - "culture area"
        - "active days"
        - "allocation basis"
        - "product mass"
      output: "ha-year or m2-day per reference product"
      source_ids:
        - mass-balance-identity
    - id: apply_no_external_feed_default
      applies_to: "growout_husbandry"
      rule: "grow-out feed amount is zero only when no intentional feed, fertilization, pond enrichment, or supplemental algal input is recorded. If such inputs are used, record them as product inputs and disclose purpose and quantity."
      inputs:
        - "feed records"
        - "enrichment records"
        - "farm declaration"
      output: "feed or enrichment applicability flag and material amount"
      source_ids:
        - asc-farm-standard-2025
    - id: reconcile_packout_mass
      applies_to: "harvest_washing_depuration_and_packout"
      rule: "harvested_input_mass = reference_product_mass + offgrade_saleable_mass + reject_mass + measured holding or drainage loss on the same product-form basis."
      inputs:
        - harvested_input_mass
        - reference_product_mass
        - offgrade_mass
        - reject_mass
        - holding_loss
      output: "pack-out mass balance"
      source_ids:
        - mass-balance-identity
    - id: calculate_controlled_discharge
      applies_to: "water intake and discharge rows"
      rule: "controlled_discharge = measured_discharge or intake - recirculated_volume - retained_or_removed_water adjustment when meters are incomplete. Ambient open-water exchange is excluded."
      inputs:
        - intake
        - discharge
        - "recirculated volume"
        - "retained water"
        - "removed water"
      output: "controlled discharge volume by process"
      source_ids:
        - mass-balance-identity
    - id: calculate_packaging_and_ice_mass
      applies_to: "packaging and ice rows"
      rule: "material_mass = item_count * tare_or_supplier_mass, adjusted for reuse allocation where applicable."
      inputs:
        - "item count"
        - "tare mass"
        - "supplier mass"
        - "reuse rate"
        - "ice mass"
      output: "kg packaging or ice per reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_delivery_transport_service
      applies_to: "delivery_to_declared_gate"
      rule: "transport_service = delivered_product_mass_tonnes * one-way controlled delivery distance."
      inputs:
        - "delivered mass"
        - "controlled distance"
        - route
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: identity_and_scope
      applies_to: "all datasets"
      requirement: "Declare CPC code, species or species group, culture system, spat or seed source, harvest area, product state, purification status, geography, and declared gate."
      evidence: "dataset metadata, stocking records, harvest records, product description, permit, certification, or movement evidence"
