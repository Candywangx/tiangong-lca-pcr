allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation where batch records can partition burdens by culture area, culture unit, species, harvest lot, size grade, product form, purification route, or destination. Separate live, fresh, chilled, size-grade, off-grade, and delivery products by measured mass before applying allocation."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "When a single foreground batch produces several saleable grades within CPC 04432, allocate shared spat, gear, grow-out, harvest, washing, depuration, holding, chilling, packaging, and delivery burdens by declared product mass unless a reviewed market-value rule is documented. Shells, mortalities, wastewater, sludge, sediment, biofouling residue, discarded gear, and broken or dead product are waste or treatment outputs unless they are sold with a separate product dataset and reference flow."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "If the same site grows multiple species or other aquaculture products in the same area, raft, rope system, pole field, rack, bottom plot, or vessel route, allocate shared records by directly measured culture-unit service, area-time, biomass-time, or product mass in that order of preference. Do not allocate filtration, nutrient removal, carbon storage, or habitat-service credits to the reference product unless a separate reviewed ecosystem-service method is in scope and the credited service is not double counted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_spat_stocking_records
      process_id: "spat_supply_hatchery_and_nursery_growout_husbandry"
      flow_role: "spat, seed, nursery stock input and accepted stock output"
      record_type: "hatchery transfer, spat collection record, supplier invoice, stocking log, movement or health certificate"
      raw_fields: "species; batch id; supplier, hatchery, nursery, or collection area; count; mean size; mean mass where available; total mass; size grade; health or movement status; transfer date"
      collection_method: "supplier records, hatchery logs, collection permits, stocking count, sampling and weighing"
      unit: "item, shell length, and kg"
      frequency: "each spat receipt, spat collection, nursery transfer, or stocking event"
      temporal_coverage: "complete production batch or reporting year"
      site_scope: "supplier, hatchery, nursery, collection area, and grow-out unit"
      aggregation_rule: "sum accepted spat counts and masses by batch; calculate mean size, mean mass, and survival to grow-out or harvest"
      quality_evidence: "signed transfer records, permit or collection evidence, sampling sheet, weighing record, health or movement document"
    - protocol_id: cp_hatchery_nursery_records
      process_id: "spat_supply_hatchery_and_nursery"
      flow_role: "on-site hatchery and nursery microalgae, culture media, settlement substrate, collectors, and seed-production inputs"
      record_type: "hatchery log, algal culture log, substrate issue record, collector deployment record, supplier invoice"
      raw_fields: "input type; quantity; concentration where relevant; batch id; purpose; date; settlement or nursery unit"
      collection_method: "hatchery batch records, supplier documents, metering, weighing, or inventory issue"
      unit: "kg, L, item, or concentration unit"
      frequency: "each batch or reporting period"
      temporal_coverage: "seed-production or nursery period linked to market batch"
      site_scope: "on-site hatchery, larval room, settlement unit, collector line, or nursery"
      aggregation_rule: "normalize seed-production inputs to accepted spat or seed and then to reference product"
      quality_evidence: "hatchery batch sheet, supplier invoice, inventory log, production reconciliation"
    - protocol_id: cp_culture_gear_and_area_records
      process_id: "growout_husbandry"
      flow_role: "culture area, ropes, socks, longlines, floats, buoys, anchors, poles, rafts, racks, trays, and shared-site allocation"
      record_type: "lease record, farm map, gear issue log, service-life record, maintenance record"
      raw_fields: "culture area; coordinates or plot id; gear type; material; item count; mass; service life; deployment date; retrieval date; loss or reuse fate"
      collection_method: "lease documents, GIS map, farm log, gear inventory, weighing, maintenance record"
      unit: "ha, m2, item, kg, ha-year, or m2-day"
      frequency: "deployment event, retrieval event, or reporting period"
      temporal_coverage: "grow-out period and shared-site allocation period"
      site_scope: "licensed area, raft, line, pole field, rack, tray, bottom plot, or vessel-supported area"
      aggregation_rule: "calculate area-time and allocated material use by culture unit, batch, or product mass"
      quality_evidence: "permit or lease, gear inventory, maintenance log, retrieval record"
    - protocol_id: cp_feed_fertilizer_and_chemical_records
      process_id: "growout_husbandry"
      flow_role: "intentional feed, fertilizer, supplemental algae, pond enrichment, predator-control chemicals, disinfectants, or other material applications"
      record_type: "application log, purchase invoice, safety data sheet, permit record"
      raw_fields: "product; active ingredient; quantity; concentration; target; application area; date; legal or certification status"
      collection_method: "farm application log, supplier invoice, chemical inventory, permit report"
      unit: "kg, L, or active ingredient unit"
      frequency: "each application"
      temporal_coverage: "grow-out, pond, or treatment period"
      site_scope: "grow-out area, pond, treatment unit, or storage area"
      aggregation_rule: "normalize applied product or active ingredient to culture area and marketable output; record zero only when no external-feed declaration is present"
      quality_evidence: "application record, invoice, permit or certification evidence, inventory reconciliation"
    - protocol_id: cp_water_quality_and_discharge_records
      process_id: "spat_supply_hatchery_and_nursery_growout_husbandry_harvest_washing_depuration_and_packout"
      flow_role: "water intake, pumped seawater, depuration water, live holding water, water-quality monitoring, wastewater, sludge, and discharge"
      record_type: "meter readings, pump logs, depuration records, water-quality tests, discharge permits"
      raw_fields: "intake volume; make-up water; recirculated volume; discharge volume; sludge mass; water source; discharge route; treatment; salinity; temperature; microbial or biotoxin monitoring where relevant"
      collection_method: "meter, pump runtime calculation, depuration log, water-quality testing, permit report, or water management log"
      unit: "m3, kg, or test result unit"
      frequency: "daily, batch, harvest lot, or reporting period"
      temporal_coverage: "process-specific operation period"
      site_scope: "hatchery, grow-out, depuration, relaying, live holding, packhouse, and discharge point"
      aggregation_rule: "reconcile intake, recirculation, discharge, and ambient water exclusions; normalize controlled water, wastewater, and sludge to process output and reference flow"
      quality_evidence: "meter calibration, depuration log, laboratory result, permit report, water-quality monitoring record"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "spat_supply_hatchery_and_nursery_growout_husbandry_harvest_washing_depuration_and_packout_delivery_to_declared_gate"
