allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable live, fresh, or chilled n.e.c. aquatic invertebrate output"
    rule: "Treat the declared reference product as the single reference product unless rejected biomass, bycatch, mortalities, or residues are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "all datasets"
    rule: "If a more specific canonical PCR exists for the species, route, or product state, use that PCR instead of this fallback category."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "bycatch, non-target material, mortalities, rejected biomass, and residues"
    rule: "Do not allocate away bycatch, mortalities, rejects, drainage, or residue by excluding them from the foreground package. Record fate and allocate only when a recovered co-product is documented."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "multi-species trips, shared aquaculture systems, or shared handling services"
    rule: "Allocate shared vessel fuel, gear service, stock inputs, feed, electricity, water, ice, oxygen, packaging, and handling by direct measurement, trip log, culture-unit record, accepted mass, holding time, package count, or another declared physical driver before economic allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_production_harvest_collection_and_receipt_records
      process_id: "production_harvest_collection_and_receipt"
      flow_role: "route, species, harvest, collection, aquaculture, receipt, accepted lot"
      record_type: "vessel log, collector log, farm log, landing note, receipt note, supplier invoice, permit, feed or stock record"
      raw_fields: "species, route, area or site, gear or culture system, supplier, trip or batch, date, fuel, electricity, water, stock, feed, gross mass, rejected mass, accepted mass, landing or receipt site, n.e.c. justification"
      collection_method: "trip, farm, receipt, landing, supplier, permit, and weigh records"
      unit: "kg, L, kWh, MJ, item, date, area"
      frequency: "each trip, production batch, receipt, or landing lot"
      temporal_coverage: "full reporting period or declared season/cycle"
      site_scope: "vessel, collector, farm, harvest area, landing site, supplier, or packhouse"
      aggregation_rule: "reconcile produced, collected, landed, or received mass minus rejects and losses to accepted lot; normalize to marketable output"
      quality_evidence: "landing tickets, scale records, farm logs, supplier records, permits, invoices, and operator sign-off"
    - protocol_id: cp_packout_product_state_and_mass_records
      process_id: "sorting_holding_chilling_and_packout"
      flow_role: "sorting, drainage, product state, marketable output"
      record_type: "sorting sheet, wash log, drainage record, temperature log, live-holding log, packout record, sales note"
      raw_fields: "accepted mass, product state, wet or drained basis, washing, drainage time, temperature, holding duration, rejected mass, marketable mass, package count, destination"
      collection_method: "calibrated scales, handling logs, temperature records, packout records, and sales reconciliation"
      unit: "kg, item, deg C, h, date"
      frequency: "each handling or packing lot"
      temporal_coverage: "full handling and dispatch period"
      site_scope: "landing site, farm, holding unit, packhouse, dispatch gate"
      aggregation_rule: "reconcile accepted lot mass minus rejects, mortalities, drainage, and handling losses to marketable output; normalize all flows to 1 kg reference product"
      quality_evidence: "scale calibration, temperature logs, packout sheets, sales records, and supervisor review"
    - protocol_id: cp_packaging_ice_chilling_and_dispatch_records
      process_id: "sorting_holding_chilling_and_packout"
      flow_role: "water, ice, electricity, packaging, live holding, chilling"
      record_type: "packaging invoice, ice log, water meter, electricity meter, temperature log, oxygen log, dispatch sheet"
      raw_fields: "packaging material, item count, tare, ice mass, water, electricity, oxygen, temperature, holding time, lot, destination"
      collection_method: "invoices, meters, temperature records, and dispatch records"
      unit: "kg, item, m3, kWh, deg C, h"
      frequency: "each packing lot and monthly reconciliation"
      temporal_coverage: "handling and dispatch period"
      site_scope: "packhouse, live-holding unit, cold room, dispatch gate"
      aggregation_rule: "allocate to product lots by measured lot, package count, product mass, holding time, or temperature-control zone"
      quality_evidence: "invoices, meter readings, temperature logs, dispatch sheets, and operator review"
    - protocol_id: cp_reject_residue_bycatch_mortality_and_discharge_records
