allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "Separable unit operations and batches"
    rule: "Avoid allocation by subdividing processes, meters, batches, grades, and material families wherever records permit."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_2
    applies_to: "Incoming processing residues, by-products, or wastes"
    rule: "Preserve the supplier's documented product or waste status and upstream burden rule. Do not assign zero upstream burden solely because the incoming material was called waste."
    source_ids:
      - eu-pef-method-2021
      - oyster-shell-lca-2012
  - rule_id: allocation_rule_3
    applies_to: "Shared preparation producing multiple saleable grades"
    rule: "When subdivision is not possible, use a causal physical relationship such as measured dry mass, equipment time, or metered energy if that relationship explains resource use. State the basis and formula."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_4
    applies_to: "Multi-functional process without a defensible physical relationship"
    rule: "Use another documented relationship, including economic allocation where appropriate, only after subdivision and physical allocation are shown unsuitable; disclose prices, period, geography, and a sensitivity result."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_rule_5
    applies_to: "Recovered residues and off-spec fractions"
    rule: "Treat a fraction as a co-product only when it has a separate reference flow and documented destination or market. Otherwise retain it as waste requiring recovery, treatment, or disposal modelling."
    source_ids:
      - eu-pef-method-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_receipt
      process_id: "source_qualification_and_receipt"
      flow_role: "Source, accepted material, and receipt rejects"
      record_type: "Batch receipt and provenance record"
      raw_fields: "supplier or collection ID; taxon or material family; source route and geography; prior product or waste status; permit or CITES references where applicable; gross and net mass; moisture or solids; reject mass and fate"
      collection_method: "Weighbridge, calibrated scale, supplier document, collection log, inspection, and permit check"
      unit: "kg; mass fraction"
      frequency: "Each batch or lot"
      temporal_coverage: "All batches represented by the dataset period"
      site_scope: "Every included source and receiving site"
      aggregation_rule: "Sum masses only after harmonizing moisture basis; retain source-level records"
      quality_evidence: "Scale calibration; supplier document; inspection record; applicable permit or CITES evidence"
    - protocol_id: cp_collection_transport
      process_id: "controlled_collection_and_delivery"
      flow_role: "Material movement, fuel, and losses"
      record_type: "Trip, vessel, or equipment activity log"
      raw_fields: "route; mode; origin and destination; loaded and delivered mass; distance; fuel or energy; load factor; empty return; loss mass"
      collection_method: "Trip log, GPS or route record, fuel record, invoice, and receiving check"
      unit: "kg; km; tkm; kWh; MJ; L"
      frequency: "Each controlled trip or campaign"
      temporal_coverage: "All controlled collection and delivery represented by the dataset"
      site_scope: "Every controlled route and vehicle or vessel class"
      aggregation_rule: "Calculate mass-distance per trip; sum fuel and losses; normalize to accepted material and final product"
      quality_evidence: "Route evidence; fuel invoices; meter records; load tickets"
    - protocol_id: cp_preparation_material
      process_id: "cleaning_drying_and_sorting"
      flow_role: "Material input and prepared output"
      record_type: "Batch production and moisture record"
      raw_fields: "input mass; output mass; moisture or solids; material family; cleaning route; drying route; grade; timestamps"
      collection_method: "Calibrated scales, moisture test, batch sheet, and production log"
      unit: "kg; mass fraction"
      frequency: "Each preparation batch"
      temporal_coverage: "Representative operating period including normal route variation"
      site_scope: "Each preparation line and material family"
      aggregation_rule: "Calculate dry mass before combining batches; report weighted moisture and total output"
      quality_evidence: "Scale and moisture-method records; batch reconciliation"
    - protocol_id: cp_preparation_water
      process_id: "cleaning_drying_and_sorting"
      flow_role: "Freshwater, seawater, reused water, and wastewater"
      record_type: "Meter or batch water record"
      raw_fields: "source; meter start and end; tank refill; reuse volume; discharge volume; salinity; suspended solids or organic load when required"
      collection_method: "Calibrated meter, tank record, invoice, or documented water balance"
      unit: "kg or m3"
      frequency: "Each batch or meter-reading interval"
      temporal_coverage: "Same period as preparation production"
      site_scope: "Each water source and preparation line"
      aggregation_rule: "Keep sources separate; sum by source and normalize to prepared and final product"
      quality_evidence: "Meter calibration; invoices; laboratory or discharge records"
    - protocol_id: cp_preparation_energy_and_agents
      process_id: "cleaning_drying_and_sorting"
      flow_role: "Energy carriers and cleaning agents"
      record_type: "Meter, invoice, fuel, and dosing record"
      raw_fields: "carrier or agent; Tiangong flow; quantity; unit; concentration; equipment; batch or period; recovery"
      collection_method: "Submeter, utility bill, fuel log, purchase record, and dosing system"
      unit: "kWh; MJ; kg; L"
      frequency: "Each batch or billing interval"
      temporal_coverage: "Same period as preparation production"
      site_scope: "Each process line and utility or agent"
      aggregation_rule: "Direct meter first; otherwise allocate shared use using a documented causal driver"
      quality_evidence: "Meter calibration; invoices; dosing logs; allocation record"
    - protocol_id: cp_waste_and_wastewater
      process_id: "source_qualification_and_receipt_cleaning_drying_and_sorting_packaging_storage_and_gate_release"
      flow_role: "Solid rejects, residues, wastewater, and packaging waste"
      record_type: "Waste ticket, discharge, or internal recovery record"
      raw_fields: "waste identity; mass or volume; moisture; source process; internal recycle; transporter; treatment or discharge destination"
      collection_method: "Scale, container count, manifest, discharge meter, laboratory record, or reconciled balance"
      unit: "kg or m3"
      frequency: "Each shipment, discharge, or reporting interval"
      temporal_coverage: "Same period as associated production"
      site_scope: "Every foreground waste and wastewater destination"
      aggregation_rule: "Keep destinations and treatment routes separate; normalize after summing verified records"
      quality_evidence: "Waste manifest; treatment receipt; discharge permit or test; balance reconciliation"
    - protocol_id: cp_size_reduction_and_grading
      process_id: "size_reduction_and_grading"
      flow_role: "Material, energy, grades, off-spec fractions, and captured dust"
      record_type: "Campaign production and equipment record"
      raw_fields: "input and output mass; moisture; target size; sieve results; equipment time; energy; recycle; off-spec and dust mass"
      collection_method: "Scales, sieve analysis, equipment meter, and production log"
      unit: "kg; mm or µm; kWh; MJ"
      frequency: "Each campaign"
      temporal_coverage: "All campaigns represented by the dataset"
      site_scope: "Each line, material family, and grade"
      aggregation_rule: "Reconcile grade fractions and recycle; allocate shared energy by causal equipment record"
      quality_evidence: "Scale, sieve, and meter calibration; campaign balance"
    - protocol_id: cp_packaging_and_gate_release
      process_id: "packaging_storage_and_gate_release"
      flow_role: "Final product, packaging, storage, and gate output"
      record_type: "Lot, bill-of-materials, utility, and dispatch record"
      raw_fields: "product mass and moisture; package material and mass; reusable cycles; storage duration; storage energy; dispatch ID"
      collection_method: "Final scale, packaging BOM, inventory, meter, and dispatch document"
      unit: "kg; item; day; kWh; MJ"
      frequency: "Each lot and utility interval"
      temporal_coverage: "Same period as final production"
      site_scope: "Each package format and storage condition"
      aggregation_rule: "Normalize packaging and allocated storage energy to dispatched reference product"
      quality_evidence: "Final scale check; BOM; meter and dispatch records"
    - protocol_id: cp_direct_releases
      process_id: "controlled_collection_and_delivery_cleaning_drying_and_sorting_size_reduction_and_grading"
      flow_role: "Direct resource use and elementary releases"
      record_type: "Monitoring, permit, or calculation record"
      raw_fields: "flow UUID; compartment; measured concentration or quantity; gas or water volume; sampling period; factor and source; control efficiency"
      collection_method: "Direct monitoring or approved calculation from collected activity data"
      unit: "Selected Tiangong reference unit"
      frequency: "Each monitoring event or required reporting interval"
      temporal_coverage: "Same period as the generating process"
      site_scope: "Every controlled emission point or collection area"
      aggregation_rule: "Integrate measured values over the period; avoid duplication with provider or treatment datasets"
      quality_evidence: "Calibration; laboratory chain of custody; permit report; cited factor and formula"
  calculation_rules:
    - id: calc_accepted_mass
      applies_to: "Source qualification and receipt"
      rule: "accepted mass = incoming mass - receipt rejects, using the same moisture basis"
      inputs:
        - "incoming mass"
        - "reject mass"
        - "moisture basis"
      output: "accepted source material mass"
      source_ids: []
    - id: calc_dry_mass
      applies_to: "Moisture-basis conversion"
      rule: "dry mass = measured mass × measured solids mass fraction"
      inputs:
        - "measured mass"
        - "measured moisture or solids fraction"
      output: "dry mass"
      source_ids: []
    - id: calc_normalized_amount
      applies_to: "Every inventory quantity"
      rule: "normalized amount = reporting-period quantity / reporting-period reference product mass"
      inputs:
        - "verified period quantity"
        - "verified reference output"
      output: "amount per 1 kg reference product"
      source_ids:
        - eu-pef-method-2021
    - id: calc_transport_service
      applies_to: "Controlled collection and delivery"
      rule: "transport service = transported tonnes × route kilometres; model empty returns separately when included"
      inputs:
        - "trip mass"
        - "route distance"
        - "empty-return treatment"
      output: "tkm"
      source_ids: []
    - id: calc_material_balance
      applies_to: "Receipt, preparation, and grading"
      rule: "Reconcile dry material input plus measured added solids with dry product, co-product, waste, captured dust, and measured solids in wastewater; report the unclosed difference and the acceptance threshold used."
      inputs:
        - "dry inputs"
        - "dry outputs"
        - residues
        - "wastewater solids"
        - "captured dust"
      output: "mass-balance result and closure difference"
      source_ids: []
    - id: calc_shared_utility
      applies_to: "Shared meters or utilities"
      rule: "Allocate shared utility only with the declared causal driver; retain total utility, driver totals, and allocated share."
      inputs:
        - "total utility"
        - "process driver"
        - "total driver"
      output: "allocated process utility"
      source_ids:
        - eu-pef-method-2021
  data_quality_requirements:
    - id: dq_identity_and_provenance
      applies_to: "Every source lot"
      requirement: "Retain material family or taxon where known, source route, geography, prior product or waste status, and applicable legal, permit, and CITES evidence."
      evidence: "Source and inspection records; current CITES check where applicable; unsd-cpc3-hs-scope; cites-current-coral-controls"
    - id: dq_measurement
      applies_to: "Mass, moisture, water, energy, agents, and waste"
      requirement: "Use calibrated or verified measurement systems, preserve original units, and identify calculated rather than measured values."
      evidence: "Calibration, meter, invoice, laboratory, and calculation records; eu-pef-method-2021"
    - id: dq_temporal
      applies_to: "Reporting period"
      requirement: "Cover the declared normal production route and document shutdowns, abnormal batches, seasonality, and excluded periods."
      evidence: "Production calendar, batch list, utility intervals, and exception log"
    - id: dq_geography_and_technology
      applies_to: "Foreground and background data"
      requirement: "Match source, collection, preparation technology, energy, water, packaging, waste treatment, and transport geography, or disclose substitutions."
      evidence: "Site and supplier metadata; background dataset metadata"
    - id: dq_completeness
      applies_to: "Process inventory"
      requirement: "Include every applicable prescribed row or record an explicit not-applicable reason; reconcile product, co-product, waste, wastewater, and direct releases."
      evidence: "Applicability matrix and material, water, and utility balances; eu-pef-method-2021"
    - id: dq_allocation
      applies_to: "Shared and multi-output processes"
      requirement: "Retain subdivision evidence, allocation driver, formula, period, and sensitivity information when allocation is used."
      evidence: "Meter and batch records, allocation worksheet, and eu-pef-method-2021"
    - id: dq_traceability
      applies_to: "Published data package"
      requirement: "Each normalized value shall trace to a raw record, calculation rule, Tiangong identity, and applicable external source without embedding private credentials or lookup logs."
      evidence: "Record IDs, calculation links, UUIDs, and source IDs"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "Product identity and scope"
    rule: "Confirm that the output is unworked or simply prepared and unshaped, or is a declared powder or waste fraction within the category; reject chemically transformed or finished downstream products."
    source_ids:
      - unsd-cpc3-hs-scope
  - rule_id: validation_rule_2
    applies_to: "Reference flow"
    rule: "Confirm the reference product, mass flow property, mass unit group, 1 kg amount, and every required qualifier."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "Process applicability"
    rule: "Include every applicable process and flow row or provide a documented not-applicable reason; do not apply mollusc-shell preparation assumptions to another material family without disclosure."
    source_ids:
      - shell-waste-management-2023
      - bivalve-shell-valorization-2022
  - rule_id: validation_rule_4
    applies_to: "Instantiated flow identities"
    rule: "Resolve every instantiated product, waste, and elementary row to the applicable Tiangong UUID before publishing a dataset; route-specific placeholders are not complete flow selections."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "Foreground records"
    rule: "Verify that normalized values trace to the declared collection protocol and retain unnormalized totals, units, temporal scope, and site or route scope."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_6
    applies_to: "Mass and moisture balance"
    rule: "Reconcile receipt, preparation, grading, and final output on a consistent moisture or dry-mass basis and disclose the unclosed difference and acceptance threshold."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "Cleaning water screening"
    rule: "When freshwater salt-reduction cleaning applies, compare the recorded result with 0.2–0.8 m3/t shell feed as literature screening evidence; values outside this interval require explanation but are not automatically nonconforming."
    source_ids:
      - shell-waste-management-2023
  - rule_id: validation_rule_8
    applies_to: "Allocation and prior burden"
    rule: "Verify the subdivision or allocation hierarchy, prior product or waste status, formula, data period, and sensitivity; reject undocumented zero-burden assumptions."
    source_ids:
      - eu-pef-method-2021
      - oyster-shell-lca-2012
  - rule_id: validation_rule_9
    applies_to: "Wastewater, residues, and direct releases"
    rule: "Confirm identities, quantities, compartments or destinations, and absence of double counting with energy-provider or treatment datasets."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_rule_10
    applies_to: "Coral legality and provenance"
    rule: "For coral or coral-derived source material, check the current applicable CITES listing and retain required permits, certificates, source and trade terms, or documented exemption evidence."
    source_ids:
      - cites-current-coral-controls
published_dataset_profile:
  dataset_role: "Foreground production data package for a declared CPC 04911 preparation route; after review it may support a secondary_dataset or background_dataset."
  downstream_use: "Construction of Tiangong process data and downstream lifecyclemodel projections for unworked or simply prepared coral-like material, shell, or cuttle-bone at the facility gate."
  allowed_use: "Route-, geography-, material-family-, moisture-, grade-, and provenance-matched modelling where applicable processes, upstream burden treatment, waste routes, and background substitutions are declared."
  excluded_use: "Live aquatic organisms; edible seafood; aquaculture or fishery production not covered by an upstream dataset; chemically transformed derivatives; calcined products; formulated downstream products; cut-to-shape, carved, jewellery, or other finished articles; undisclosed coral provenance."
  required_metadata: "PCR id and version; Tiangong reference flow UUID; material family or taxon; source route and geography; prior product, by-product, or waste status; preparation route; moisture basis; grade or particle size; legal and provenance status; process applicability; reporting period; technology and site; allocation; packaging; waste and wastewater destinations; background dataset references."
  required_quality_disclosure: "Measurement and calibration coverage; material and water balance closure; temporal, geographic, and technological representativeness; missing or estimated records; allocation sensitivity; source and permit limitations; background substitutions; validation findings."
  update_trigger: "Change in product scope, material family, source or CITES status, collection route, technology, cleaning or drying method, grade, moisture basis, energy or water system, waste treatment, allocation, packaging, site or geography, Tiangong identity, external evidence, or applicable legal requirement."
data_sources:
  - id: "unsd-cpc3-hs-scope"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 and HS 2022 correspondence for subclass 04911 / subheading 050800, https://unstats.un.org/unsd/classifications/Family/Detail/2100 and https://unstats.un.org/unsd/classifications/Econ/Detail/EN/2089/050800 (retrieved 2026-08-07)."
    used_for: "Product-category identity; unworked or simply prepared, unshaped, powder, and waste scope; exclusions."
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30 and https://eplca.jrc.ec.europa.eu/permalink/PEF_method.pdf (retrieved 2026-08-07)."
    used_for: "Foreground primary data, system boundary, co-product and waste visibility, allocation hierarchy, data quality, and disclosure."
  - id: "cites-current-coral-controls"
    type: "official_guidance"
    reference: "CITES, current Appendices and Resolution Conf. 11.10 on trade in stony corals, https://cites.org/eng/app/appendices.php and https://cites.org/eng/imp/Exemptions_and_special_procedures (retrieved 2026-08-07)."
    used_for: "Coral taxon, source, legal and provenance checks; permit, certificate, trade-term, or exemption evidence where applicable."
  - id: "shell-waste-management-2023"
    type: "literature"
    reference: "Topić Popović, N. et al. (2023), Shell Waste Management and Utilization: Mitigating Organic Pollution and Enhancing Sustainability, Applied Sciences 13(1), 623, https://doi.org/10.3390/app13010623."
    used_for: "Cleaning and preparation process decomposition; water and energy significance; 0.2–0.8 m3/t shell-cleaning water screening range."
  - id: "bivalve-shell-valorization-2022"
    type: "literature"
    reference: "Summa, D. et al. (2022), Trends and Opportunities of Bivalve Shells' Waste Valorization in a Prospect of Circular Blue Bioeconomy, Resources 11(5), 48, https://doi.org/10.3390/resources11050048."
    used_for: "Washing, crushing, grading, and route-specific preparation evidence; boundary between simple preparation and downstream valorization."
  - id: "oyster-shell-lca-2012"
    type: "literature"
