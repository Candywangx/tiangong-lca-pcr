      frequency: "each batch and monthly reconciliation"
      temporal_coverage: "hatchery and nursery period"
      site_scope: "hatchery, nursery, tank, pond, or supplier"
      aggregation_rule: "sum by batch and basis; convert only with measured moisture, supplier, or formulation evidence"
      quality_evidence: "invoices, logs, meter readings, supplier specifications, and operator review"
    - protocol_id: cp_growout_husbandry_records
      process_id: "growout_and_fattening_husbandry"
