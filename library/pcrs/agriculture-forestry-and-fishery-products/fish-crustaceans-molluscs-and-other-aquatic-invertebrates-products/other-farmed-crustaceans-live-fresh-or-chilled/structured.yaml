      raw_fields: "stocked biomass, feed, bait, water, salinity, electricity, fuel, oxygen, chemical, treatment, culture unit, dates"
      collection_method: "farm logs, meters, invoices, and treatment records"
      unit: "kg, m3, kWh, L, MJ, dose, item"
      frequency: "each batch and monthly reconciliation"
      temporal_coverage: "full grow-out or fattening cycle"
      site_scope: "pond, cage, tank, raceway, RAS, or farm site"
      aggregation_rule: "allocate shared records by direct meter, batch log, biomass-time, culture-unit-time, or declared physical driver"
      quality_evidence: "farm logs, invoices, meter readings, allocation worksheet, and supervisor review"
    - protocol_id: cp_harvest_product_packout_records
      process_id: "growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "harvest biomass, product form, packaging, marketable output"
      record_type: "harvest log, grading sheet, live-holding log, temperature log, packout record, sales note"
      raw_fields: "harvest date, species, culture unit, live mass, product form, count, size grade, chilled or live state, packaging, ice, rejected mass, marketable mass, destination"
      collection_method: "calibrated scales, grading records, temperature logs, sales records, and packhouse reconciliation"
      unit: "kg, item, grade, date"
      frequency: "each harvest and packing lot"
      temporal_coverage: "full reporting period or cycle"
      site_scope: "harvest site, live-holding unit, packhouse, or dispatch gate"
      aggregation_rule: "reconcile harvested biomass plus purchases minus rejects and residues to marketable output; normalize all flows to 1 kg reference product"
      quality_evidence: "scale calibration, harvest sheets, packout records, dispatch records, and sales reconciliation"
    - protocol_id: cp_mortality_residue_and_discharge_records
      process_id: "all_foreground_processes"
      flow_role: "mortalities, molts, shells, sludge, wastewater, escapes, packaging waste"
      record_type: "mortality log, residue log, discharge record, waste ticket, escape report"
      raw_fields: "date, species, count, mass, cause, culture unit, fate, disposal route, recovery route, receiving environment"
      collection_method: "husbandry records, incident reports, waste tickets, and discharge records"
      unit: "kg, m3, item, date"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "full reporting period or cycle"
      site_scope: "culture unit, hatchery, harvest area, packhouse, or waste route"
      aggregation_rule: "sum and classify by fate; reconcile stock, residue, and product mass; normalize to reference output"
      quality_evidence: "mortality logs, waste transfer notes, discharge files, incident records, and supervisor review"
    - protocol_id: cp_delivery_records
      process_id: "delivery_to_declared_gate"
      flow_role: "delivered product, transport energy, live or chilled delivery condition"
      record_type: "delivery note, transport invoice, fuel record, route plan, temperature or live-holding log"
      raw_fields: "origin, destination, distance, mode, load mass, fuel, electricity, ice, oxygen, temperature, live-holding duration, return logistics"
      collection_method: "carrier documents, vehicle logs, meter records, and dispatch reconciliation"
      unit: "kg, km, tonne-km, L, kWh, h, deg C"
      frequency: "each delivery route"
      temporal_coverage: "delivery period in declared scope"
      site_scope: "delivery route, vehicle, vessel, or carrier"
      aggregation_rule: "calculate tonne-km and allocate fuel or service by load mass, distance, temperature zone, and return logistics where relevant"
      quality_evidence: "carrier invoice, route record, temperature log, and dispatch sign-off"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "normalized amount = collected amount / marketable reference product mass, with unit and product-form basis retained"
      inputs:
        - "collected amount"
        - "marketable product mass"
        - "product basis"
      output: "kg, kWh, L, item, m3, or tonne-km per kg reference product"
      source_ids:
        - mass-balance-identity
    - id: stock_acceptance_balance
      applies_to: "stocking and transfer"
      rule: "accepted stocked biomass = source stock mass + transferred-in mass - transfer mortalities - rejected stock - documented transfer losses"
      inputs:
        - "source stock"
        - transfers
        - mortalities
        - rejects
        - "transfer loss"
      output: "accepted stocked biomass"
      source_ids:
        - mass-balance-identity
    - id: growth_and_survival_balance
      applies_to: "grow-out and fattening"
      rule: "harvest-size biomass = stocked biomass + biological growth - mortalities - escapes - rejects, checked against harvest records"
      inputs:
        - "stocked biomass"
        - feed
        - mortalities
        - escapes
        - "harvest records"
      output: "harvest-size biomass and survival disclosure"
      source_ids:
        - asc-farm-standard-2025
    - id: product_form_yield
      applies_to: "harvested and packed product"
      rule: "marketable product mass = harvested mass - rejected mass - mortality mass - drainage, ice, tare, and handling losses according to declared product basis"
      inputs:
        - "harvest mass"
        - "rejected mass"
        - "product-form records"
        - "packout records"
      output: "marketable live, fresh, or chilled mass"
      source_ids:
        - codex-cxc-52-2003
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "tonne-km = delivered product mass in tonnes x one-way or contract-declared route distance; allocate live-holding or temperature-control inputs by load share"
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "temperature or live-holding condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
