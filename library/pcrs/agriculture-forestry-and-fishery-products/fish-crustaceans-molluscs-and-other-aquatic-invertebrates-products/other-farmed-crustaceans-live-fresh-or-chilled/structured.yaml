dataset_production:
  collection_protocols:
    - protocol_id: cp_biological_stocking_records
      process_id: "hatchery_nursery_and_stocking"
      flow_role: "biological stock, life stage, accepted stocking"
      record_type: "hatchery log, supplier invoice, permit, transfer log, stocking log, mortality log"
      raw_fields: "species, n.e.c. justification, supplier, life stage, count, mean mass, total mass, transfer route, stocking date, pond/cage/tank, accepted count, accepted mass, transfer mortality"
      collection_method: "batch records reconciled to culture-unit inventory"
      unit: "kg, item, date, permit id"
      frequency: "each stocking event"
      temporal_coverage: "full reporting period or production cycle"
      site_scope: "hatchery, supplier, transfer route, pond, cage, tank, or farm site"
      aggregation_rule: "reconcile source stock plus transfers minus mortalities and rejects to accepted stocked biomass; normalize to marketable output"
      quality_evidence: "supplier documents, permits, transfer logs, culture-unit inventory, mortality records, and manager sign-off"
    - protocol_id: cp_hatchery_nursery_input_records
      process_id: "hatchery_nursery_and_stocking"
