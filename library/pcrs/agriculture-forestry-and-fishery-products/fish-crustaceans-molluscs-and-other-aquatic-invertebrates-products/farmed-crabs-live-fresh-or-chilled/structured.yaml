allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Avoid allocation where batch records can partition burdens by species, hatchery batch, nursery unit, grow-out unit, fattening unit, harvest lot, size grade, sex or maturity class, product form, live/fresh/chilled state, or destination. Separate live, fresh, chilled, soft-shell, fattened, off-grade, and delivery products by measured mass before applying allocation."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "When a single foreground batch produces several saleable grades within CPC 04312, allocate shared hatchery, nursery, grow-out, fattening, harvest, holding, chilling, packaging, and delivery burdens by declared product mass unless a reviewed market-value rule is documented. Shells, molts, mortalities, wastewater, sludge, feed residue, packaging rejects, and dead product are waste or treatment outputs unless they are sold with a separate product dataset and reference flow."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "If the same site grows multiple species or products in the same pond, pen, cage, box, RAS, tank, vehicle, vessel, or packhouse route, allocate shared energy, water, feed preparation, oxygenation, filtration, labour service, and maintenance records by measured subprocess use, culture unit, biomass-time, area-time, or product mass in that order of preference. The selected allocation basis must be disclosed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_biological_stocking_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry"
      flow_role: "broodstock, larvae, megalopae, juveniles, seed crabs, soft-shell crabs, stocked crabs, and accepted transfer output"
      record_type: "hatchery transfer, supplier invoice, fisher or collector declaration where legally allowed, stocking log, health certificate, batch sheet"
      raw_fields: "species; batch id; life stage; supplier, hatchery, collector, or farm; count; mean size; mean mass where measurable; total mass; sex or maturity class where relevant; health status; biosecurity status; transfer date"
      collection_method: "supplier records, hatchery logs, transfer documents, stocking count, sampling and weighing"
      unit: "item, stage count, carapace width, and kg"
      frequency: "each receipt, hatchery batch, nursery transfer, or stocking event"
      temporal_coverage: "complete production batch or reporting year"
      site_scope: "supplier, hatchery, nursery, grow-out unit, pond, pen, cage, box, tank, or RAS module"
      aggregation_rule: "sum accepted counts and masses by batch; calculate mean size, survival, and transfer losses before harvest normalization"
      quality_evidence: "signed transfer records, sampling sheet, weighing record, health certificate, permit, or certification evidence"
    - protocol_id: cp_feed_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry"
      flow_role: "live feed, formulated feed, trash fish, mollusc meat, broodstock feed, starter feed, and supplementary feed"
      record_type: "feed issue log, supplier invoice, feed formulation, farm recipe, leftover record"
      raw_fields: "feed product; feed type; wet/dry/as-fed basis; quantity issued; leftovers; feed source; marine ingredient fraction where relevant; batch id"
      collection_method: "feed inventory, supplier declarations, farm recipe, feeding logs"
      unit: "kg, g, L, item, or cyst count"
      frequency: "each feed issue or batch summary"
      temporal_coverage: "hatchery, nursery, grow-out, or fattening period"
      site_scope: "hatchery, nursery, pond, pen, cage, box, tank, or RAS module"
      aggregation_rule: "normalize net feed supplied to accepted stock, harvest-size output, and reference product; retain wet/dry/live-feed conversion basis"
      quality_evidence: "feed purchase records, supplier formulation, farm recipe, stock movement logs"
    - protocol_id: cp_water_salinity_and_discharge_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "controlled water intake, salinity, exchange, recirculation, live holding water, wastewater, and discharge"
      record_type: "meter readings, pump logs, sensor records, water-quality tests, discharge permits"
      raw_fields: "intake volume; make-up water; exchanged volume; recirculated volume; discharge volume; salinity; dissolved oxygen; water source; discharge route; treatment"
      collection_method: "meter, pump runtime calculation, sensor log, permit report, water management log"
      unit: "m3, kg, ppt, kg O2, or test result unit"
      frequency: "daily, batch, harvest lot, or reporting period"
      temporal_coverage: "process-specific operation period"
      site_scope: "hatchery, nursery, grow-out, fattening unit, live holding, packhouse, and discharge point"
      aggregation_rule: "reconcile intake, exchange, recirculation, discharge, and retained water; normalize controlled water to process output and reference flow"
      quality_evidence: "meter calibration, sensor records, permit report, water-quality monitoring record"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "electricity, fuel, aeration, pumping, oxygen generation, filtration, chilling, and non-fuel energy"
      record_type: "meter reading, utility bill, fuel invoice, tank drawdown, submeter, equipment log"
      raw_fields: "electricity use; fuel type; meter id; process allocation; operating hours; temperature-control service; vessel or pump use"
      collection_method: "utility bill, submeter, runtime allocation, equipment log, fuel invoice"
      unit: "kWh, MJ, L, or kg"
      frequency: "monthly, batch, or reporting period"
      temporal_coverage: "reporting period and production batch overlap"
      site_scope: "farm, hatchery, nursery, grow-out unit, live holding area, packhouse, or directly controlled route"
      aggregation_rule: "allocate by metered subprocess first, then operating hours, water volume, biomass-time, or product mass"
      quality_evidence: "utility bill, submeter records, fuel invoice, equipment log, allocation worksheet"
    - protocol_id: cp_health_treatment_and_chemical_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "disinfectants, medicines, probiotics, salt, lime, oxygen, water-treatment chemicals, and health treatments"
      record_type: "treatment log, veterinary or health plan, diagnosis record, purchase invoice, safety data sheet, permit record"
      raw_fields: "product; active ingredient; quantity; concentration; target; diagnosis or purpose; treatment area; date; withdrawal or eligibility status"
      collection_method: "farm application log, health plan, supplier invoice, chemical inventory, permit report"
      unit: "kg, L, g active ingredient, or m3 gas"
      frequency: "each application or treatment period"
      temporal_coverage: "hatchery, nursery, grow-out, fattening, live holding, or pack-out period"
      site_scope: "treatment unit, pond, pen, cage, box, tank, RAS, storage area, or packhouse"
      aggregation_rule: "normalize applied product or active ingredient to process output and reference product; retain non-eligible product segregation"
      quality_evidence: "application record, diagnosis record, health plan, invoice, permit or certification evidence"
    - protocol_id: cp_mortality_molt_residue_and_sludge_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout_delivery_to_declared_gate"
      flow_role: "mortalities, molts, shells, feed residue, sludge, rejects, wastewater, and delivery losses"
      record_type: "mortality log, molting log, sludge record, reject sheet, waste manifest, recovery record"
      raw_fields: "count; mass; reason; fate; date; culture unit; shell, molt, sludge, feed residue, wastewater, or reject category"
      collection_method: "farm log, hatchery log, packhouse reject record, weighing, waste contractor record"
      unit: "item, kg, and m3"
      frequency: "event, batch, harvest lot, delivery route, or reporting period"
      temporal_coverage: "full production batch, pack-out period, or delivery period"
      site_scope: "hatchery, nursery, grow-out unit, packhouse, waste handling route, or delivery route"
      aggregation_rule: "sum by fate and normalize to process output and reference product"
      quality_evidence: "signed waste record, mortality log, molting log, sludge record, reject sheet, mass balance"
    - protocol_id: cp_harvest_and_product_records
      process_id: "growout_and_fattening_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "harvest-size product, marketable reference product, off-grade product, and product state"
      record_type: "harvest log, grading sheet, sales invoice, dispatch record, pack-out record"
      raw_fields: "harvest date; culture unit; species; product state; whole or declared basis; grade; count; sex or maturity class; mass; destination"
      collection_method: "harvest weighing, grader records, live holding records, packhouse records, invoice"
