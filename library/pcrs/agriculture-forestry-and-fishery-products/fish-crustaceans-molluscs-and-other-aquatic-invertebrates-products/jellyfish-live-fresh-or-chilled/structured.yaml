allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable live, fresh, or chilled jellyfish output"
    rule: "Treat the declared reference product as the single reference product unless rejected biomass, bycatch, or residues are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "bycatch, non-target material, rejected jellyfish, and residues"
    rule: "Do not allocate away bycatch, rejects, drainage, or residue by excluding them from the foreground package. Record fate and allocate only when a recovered co-product is documented."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "multi-species trips or shared landing services"
    rule: "Allocate shared vessel fuel, gear service, landing energy, water, ice, and packaging by direct measurement, trip log, catch mass, holding time, package count, or another declared physical driver before economic allocation."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "mixed-product delivery"
    rule: "Allocate delivery fuel, ice, live-holding, refrigeration, and reusable packaging loads by product mass, package count, trip, temperature-control zone, or tonne-km as applicable."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_harvest_collection_and_landing_records
      process_id: "harvest_collection_and_landing"
      flow_role: "harvest or collection, accepted landing, fuel, gear, landing inputs"
      record_type: "vessel log, collector log, landing note, catch ticket, fuel invoice, gear log, permit"
      raw_fields: "species, harvest area, gear, vessel or collector, trip, date, fuel, collection input, gross catch, rejected mass, accepted landed mass, landing site, intended use"
      collection_method: "trip records, landing records, weigh tickets, and permit or traceability documents"
      unit: "kg, L, MJ, item, date, area"
      frequency: "each trip or landing lot"
      temporal_coverage: "full reporting period or declared season"
      site_scope: "vessel, collector, harvest area, landing site, or supplier"
      aggregation_rule: "reconcile catch plus purchases minus rejects and losses to accepted landed jellyfish; normalize to marketable output"
      quality_evidence: "landing tickets, scale records, trip logs, permits, invoices, and operator sign-off"
    - protocol_id: cp_packout_product_state_and_mass_records
      process_id: "sorting_holding_chilling_and_packout"
      flow_role: "sorting, drainage, product state, marketable output"
      record_type: "sorting sheet, wash log, drainage record, temperature log, live-holding log, packout record, sales note"
      raw_fields: "accepted mass, product state, wet or drained basis, washing, drainage time, temperature, holding duration, rejected mass, marketable mass, package count, destination"
      collection_method: "calibrated scales, handling logs, temperature records, packout records, and sales reconciliation"
      unit: "kg, item, deg C, h, date"
      frequency: "each handling or packing lot"
      temporal_coverage: "full handling and dispatch period"
      site_scope: "landing site, holding unit, packhouse, dispatch gate"
      aggregation_rule: "reconcile accepted landed mass minus rejects, drainage, and handling losses to marketable output; normalize all flows to 1 kg reference product"
      quality_evidence: "scale calibration, temperature logs, packout sheets, sales records, and supervisor review"
    - protocol_id: cp_packaging_ice_chilling_and_dispatch_records
      process_id: "sorting_holding_chilling_and_packout"
      flow_role: "water, ice, electricity, packaging, live holding, chilling"
      record_type: "packaging invoice, ice log, water meter, electricity meter, temperature log, oxygen log, dispatch sheet"
      raw_fields: "packaging material, item count, tare, ice mass, water, electricity, oxygen, temperature, holding time, lot, destination"
      collection_method: "invoices, meters, temperature records, and dispatch records"
      unit: "kg, item, m3, kWh, deg C, h"
      frequency: "each packing lot and monthly reconciliation"
      temporal_coverage: "handling and dispatch period"
      site_scope: "packhouse, live-holding unit, cold room, dispatch gate"
      aggregation_rule: "allocate to product lots by measured lot, package count, product mass, holding time, or temperature-control zone"
      quality_evidence: "invoices, meter readings, temperature logs, dispatch sheets, and operator review"
    - protocol_id: cp_reject_residue_bycatch_and_discharge_records
      process_id: "harvest_collection_and_landing_sorting_holding_chilling_and_packout"
      flow_role: "bycatch, rejected jellyfish, drainage, wastewater, residues, packaging waste"
      record_type: "reject log, bycatch record, wastewater record, disposal note, waste ticket"
      raw_fields: "date, species or material, count, mass, volume, cause, fate, disposal route, recovery route, receiving environment"
      collection_method: "landing records, handling records, waste tickets, and discharge records"
      unit: "kg, m3, item, date"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "full reporting period or season"
      site_scope: "vessel, landing site, packhouse, discharge route, or waste route"
      aggregation_rule: "sum by material and fate; reconcile to catch, accepted mass, marketable output, and disposal route"
      quality_evidence: "reject logs, waste transfer notes, discharge records, and supervisor review"
    - protocol_id: cp_delivery_records
