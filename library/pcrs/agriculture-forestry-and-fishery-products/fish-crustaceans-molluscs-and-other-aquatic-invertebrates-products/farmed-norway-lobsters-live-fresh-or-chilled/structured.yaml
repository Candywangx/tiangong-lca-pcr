allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Use physical subdivision when records identify separate culture units, batches, species, size grades, or handling lots."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Use causal physical allocation when resource use is driven by measured biomass, count, compartment occupancy, feed intake, water volume, holding duration, tonne-kilometres, or live-tank service."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Use economic allocation only when physical subdivision and causal physical allocation are not possible; disclose prices, period, market, and sensitivity."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Treat mortalities, culls, molts, wastewater, sludge, spent substrate, and used packaging as waste unless they leave the system as saleable co-products with documented market value and handling."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Wild Norway lobsters, Homarus lobsters, rock lobster and other sea crawfish, and processed Norway lobster products must be separated into their own PCR categories or modelled as co-products with explicit classification disclosure."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_biological_stocking_records
      process_id: "broodstock_hatchery_nursery_and_stocking"
      flow_role: "biological starting stock, accepted stock, stocking, transfers"
      record_type: "hatchery logs, supplier invoices, movement permits, batch records"
      raw_fields: "species, life stage, source, batch id, count, mass where available, mean size, health status, movement date, accepted count, rejected count"
      collection_method: "collect from hatchery, nursery, supplier, stocking, and transfer records"
      unit: "kg, item, egg count, larval count, juvenile count"
      frequency: "each batch or transfer"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all biological stock entering the declared production route"
      aggregation_rule: "sum accepted stock and losses by species, life stage, and batch before normalization to reference product"
      quality_evidence: "supplier document, hatchery log, health certificate, movement permit, count or weighing record"
    - protocol_id: cp_feed_records
      process_id: "broodstock_hatchery_nursery_and_stocking_growout_and_burrow_husbandry"
      flow_role: "feed, bait, live feed, natural-foraging claim"
      record_type: "feed invoices, recipes, feeding logs, compartment records"
      raw_fields: "feed type, supplier, batch, wet/dry/as-fed basis, live-feed counts, quantity, feeding date, target life stage, zero-added-feed evidence where claimed"
      collection_method: "collect from invoices, hatchery recipes, feed logs, and grow-out records"
      unit: "kg, g, L, item, cyst count, compartment-month"
      frequency: "each feeding event or batch summary"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all feed and natural-foraging evidence for included production units"
      aggregation_rule: "aggregate by feed type and basis, convert only with measured moisture or supplier data"
      quality_evidence: "invoice, recipe, feed log, natural-foraging system record, mass or count measurement"
    - protocol_id: cp_substrate_shelter_and_culture_unit_records
      process_id: "growout_and_burrow_husbandry"
      flow_role: "sediment, shelters, artificial burrows, compartments, tanks, density"
      record_type: "culture-unit log, substrate issue record, cleaning log, maintenance record"
      raw_fields: "substrate type, shelter type, item count, mass, area, volume, animal count, density, deployment date, cleaning or replacement date, fate"
      collection_method: "collect from culture-unit records, inventory logs, weighing, and cleaning records"
      unit: "kg, item, m2, m3, animal count"
      frequency: "each deployment, replacement, cleaning, or batch"
      temporal_coverage: "full grow-out period"
      site_scope: "all grow-out culture units"
      aggregation_rule: "allocate substrate and shelter service by culture unit, batch duration, or product mass"
      quality_evidence: "inventory record, culture-unit map, cleaning record, disposal record"
    - protocol_id: cp_water_temperature_salinity_and_discharge_records
      process_id: "all_foreground_processes"
      flow_role: "water, temperature, salinity, discharge, direct releases, escapes"
      record_type: "water meter, pump log, salinity and temperature records, water-quality tests, discharge records, escape logs"
      raw_fields: "intake volume, exchange volume, recirculation, temperature, salinity, dissolved oxygen where measured, effluent volume, nutrient or solids concentration, escape count"
      collection_method: "collect from meters, monitoring logs, laboratory tests, and incident records"
      unit: "m3, kg, deg C, ppt, mg/L, kg load, item"
      frequency: "at least per batch and when discharge or escape events occur"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all controlled water systems and direct releases"
      aggregation_rule: "normalize intake, discharge, and calculated loads to reference product; retain salinity and temperature basis"
      quality_evidence: "meter records, monitoring sheets, lab reports, incident reports"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "all_foreground_processes"
      flow_role: "electricity, fuel, temperature control, vessel work, equipment"
      record_type: "meter readings, invoices, vessel logs, fuel receipts, allocation records"
      raw_fields: "energy carrier, quantity, meter id, equipment or process, date, allocation key, vessel trip, refrigeration or oxygenation link"
      collection_method: "collect from meters, invoices, fuel logs, and allocation worksheets"
      unit: "kWh, MJ, L, kg"
      frequency: "monthly, per batch, or per trip"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all energy and fuel used by included processes"
      aggregation_rule: "allocate by direct meter first, then equipment hours, biomass, compartment service, or batch duration"
      quality_evidence: "meter record, invoice, fuel receipt, vessel or equipment log"
    - protocol_id: cp_treatment_biosecurity_and_health_records
      process_id: "growout_and_burrow_husbandry"
      flow_role: "health, disinfectant, treatment, biosecurity"
      record_type: "treatment logs, veterinary records, chemical invoices, health plans"
      raw_fields: "product name, active ingredient, dose, quantity, target unit, diagnosis or reason, legal status, date, withdrawal or harvest eligibility"
      collection_method: "collect from treatment records, prescriptions, health plans, and invoices"
      unit: "kg, L, g active ingredient, m3 gas"
      frequency: "each treatment event"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all included culture units and holding systems"
      aggregation_rule: "aggregate by product and active ingredient, retain event purpose and legal status"
      quality_evidence: "treatment log, health plan, veterinary record, invoice"
    - protocol_id: cp_mortality_molt_residue_and_sludge_records
      process_id: "all_foreground_processes"
      flow_role: "mortality, molts, shells, sludge, culls, residues, rejects"
      record_type: "mortality logs, grading records, cleaning logs, waste transfer notes"
      raw_fields: "count, mass, life stage, process, reason, disposal route, recovery route, date"
      collection_method: "collect from mortality, cleaning, grading, and waste records"
      unit: "kg, item, m3"
      frequency: "each event or batch summary"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all included production and handling units"
      aggregation_rule: "sum by residue type and route; calculate loss fraction against accepted or marketable mass"
      quality_evidence: "mortality log, waste note, weighing record, disposal certificate"
    - protocol_id: cp_harvest_and_product_mass_records
      process_id: "growout_and_burrow_husbandry_harvest_live_holding_chilling_and_packout"
      flow_role: "harvest-size output, reference product, product grade"
      record_type: "harvest records, grading logs, sales records, packing records"
      raw_fields: "harvest date, species, count, net mass, size grade, product state, mortality, culls, packed mass, gate"
      collection_method: "collect from harvest weighing, grading, packing, and sales records"
      unit: "kg, item, count per kg"
      frequency: "each harvest or packing lot"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all product lots included in the reference flow"
      aggregation_rule: "reconcile harvested, packed, rejected, and delivered mass before normalization"
      quality_evidence: "scale ticket, packing record, sales note, batch reconciliation"
    - protocol_id: cp_packaging_live_holding_and_chilling_records
      process_id: "harvest_live_holding_chilling_and_packout"
      flow_role: "packaging, holding water, ice, oxygen, live transport preparation"
      record_type: "packaging inventory, live tank logs, ice logs, oxygen logs"
      raw_fields: "material type, item count, mass, reuse rate, water volume, oxygen quantity, ice mass, holding duration"
      collection_method: "collect from inventory, tank logs, and pack-out records"
      unit: "kg, item, m3, L, m3 gas, hour"
      frequency: "each pack-out lot"
      temporal_coverage: "full production batch or reporting period"
      site_scope: "all final handling and pack-out activities"
      aggregation_rule: "allocate by product lot mass, holding duration, or direct issue record"
      quality_evidence: "inventory issue, live tank log, weighing record, oxygen invoice"
    - protocol_id: cp_delivery_and_route_records
      process_id: "delivery_to_declared_gate"
      flow_role: "delivery transport and route losses"
      record_type: "delivery log, vehicle record, fuel receipt, customer receipt"
      raw_fields: "origin, destination, distance, product mass, vehicle or service, fuel, electricity, ice, oxygen, delivery condition, loss count or mass"
      collection_method: "collect from delivery, vehicle, freight, and receipt records"
      unit: "km, tonne-km, L, kg, kWh, item"
      frequency: "each delivery route"
      temporal_coverage: "deliveries within reporting period"
      site_scope: "all delivery routes included in the declared gate"
      aggregation_rule: "calculate tonne-km or direct route inventory and normalize to delivered mass"
      quality_evidence: "route log, fuel receipt, freight invoice, delivery receipt"
  calculation_rules:
    - id: calc_reference_product_mass
      applies_to: "reference product"
      rule: "net marketable product mass = packed or delivered acceptable mass minus rejects and mortalities within the declared product boundary"
      inputs:
        - cp_harvest_and_product_mass_records
        - cp_packaging_live_holding_and_chilling_records
        - "cp_delivery_and_route_records when delivery is included"
      output: "kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_count_to_mass
      applies_to: "count-based records"
      rule: "mass = count x measured mean individual mass, or count / measured count per kg; retain sampling method and grade"
      inputs:
        - cp_biological_stocking_records
        - cp_harvest_and_product_mass_records
      output: "kg equivalent mass"
      source_ids:
        - mass-balance-identity
    - id: calc_stock_acceptance_and_survival
      applies_to: "biological stock and grow-out"
      rule: "accepted or surviving fraction = accepted or surviving count or biomass divided by input count or biomass for the same life stage and batch"
      inputs:
        - cp_biological_stocking_records
        - cp_mortality_molt_residue_and_sludge_records
        - cp_harvest_and_product_mass_records
      output: "accepted stock, survival, loss, and residue indicators"
      source_ids:
        - nephrops-hatchery-handbook-2019
    - id: calc_waterborne_load
      applies_to: "discharge and direct releases"
      rule: "load = discharge volume x measured concentration, adjusted for units and background where documented"
      inputs:
        - cp_water_temperature_salinity_and_discharge_records
      output: "kg nutrient, solids, treatment residue, or other load"
      source_ids:
        - asc-farm-standard-2025
    - id: calc_energy_allocation
      applies_to: "shared energy systems"
      rule: "allocate direct meters first; otherwise allocate by equipment hours, batch duration, water volume, compartment occupancy, or product mass with the selected key disclosed"
      inputs:
        - cp_energy_and_fuel_records
        - cp_harvest_and_product_mass_records
      output: "kWh, MJ, or fuel per reference flow"
      source_ids:
        - asc-farm-standard-2025
    - id: calc_delivery_transport_service
      applies_to: "delivery"
      rule: "tonne-km = delivered product mass in tonnes x route distance in km; route-specific fuel may replace tonne-km where direct records are available"
      inputs:
        - cp_delivery_and_route_records
      output: "tonne-km or direct delivery inventory per reference flow"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_species_and_category_identity
      applies_to: "all datasets"
      requirement: "Dataset must identify Nephrops norvegicus and show that the reference product belongs to CPC 04342, not wild Norway lobster, Homarus lobster, rock lobster, sea crawfish, or processed Norway lobster categories."
      evidence: "species records, classification mapping, product description, sales record"
    - id: dq_farmed_proof
      applies_to: "all datasets"
      requirement: "Dataset must prove controlled aquaculture production through hatchery, nursery, grow-out, sediment-substrate, compartment, recirculating, or enhancement records."
      evidence: "stocking log, hatchery record, grow-out record, permit, production plan"
    - id: dq_mass_balance
      applies_to: "biological stock, harvest, reference product"
      requirement: "Biological input, mortality, cull, residue, harvest, packed, and delivered product records must reconcile at batch or reporting-period level."
      evidence: "batch reconciliation, scale tickets, mortality logs, packing records"
    - id: dq_water_and_energy_completeness
      applies_to: "water, discharge, energy, fuel"
      requirement: "Water, temperature, salinity, discharge, electricity, fuel, oxygenation, and temperature-control records must cover all foreground processes in scope."
      evidence: "meter logs, invoices, monitoring records, allocation worksheet"
    - id: dq_substrate_and_shelter_traceability
      applies_to: "grow-out systems"
      requirement: "Sediment, artificial burrow, shelter, tank, and compartment records must retain material, density, cleaning, replacement, and fate."
      evidence: "culture-unit map, substrate log, cleaning log, disposal record"
    - id: dq_treatment_and_biosecurity_traceability
      applies_to: "health and treatment inputs"
      requirement: "Treatments, disinfectants, anesthetics, oxygen, salt, and water-quality inputs must retain purpose, active ingredient where applicable, legal status, and harvest eligibility consequence."
      evidence: "treatment log, health plan, veterinary record"
    - id: dq_live_product_handling
      applies_to: "final product and delivery"
      requirement: "Live holding, chilling, packaging, delivery duration, and mortality or rejection must be traceable to the final product lot."
      evidence: "live tank log, pack-out record, delivery receipt"
    - id: dq_unresolved_uuid_disclosure
      applies_to: "any row with site-specific flow selection"
      requirement: "Any blank or generic flow identity must be disclosed before reviewed publication and replaced with selected Tiangong UUIDs where available."
      evidence: "manifest review metadata, UUID review record"
