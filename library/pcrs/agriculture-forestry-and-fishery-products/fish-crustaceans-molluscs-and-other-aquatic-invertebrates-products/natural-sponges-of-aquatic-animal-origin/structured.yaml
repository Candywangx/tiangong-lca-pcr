allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable natural sponge output"
    rule: "Treat the declared reference product as the single reference product unless trimming residues, damaged sponge, or non-target material are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "damaged sponge, non-target material, residues, and protected habitat disclosure"
    rule: "Do not allocate away rejected sponge, damaged material, or habitat disturbance by excluding them from the foreground package. Record fate and disclose bed or protected-area status where relevant."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "multi-product trips or shared preparation services"
    rule: "Allocate shared vessel fuel, diving support, electricity, water, drying, storage, and packaging by direct measurement, trip log, accepted mass, dry-mass output, holding or drying time, package count, or another declared physical driver before economic allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_harvest_collection_and_landing_records
      process_id: "harvest_collection_and_landing"
      flow_role: "harvest or collection, accepted landing, fuel, diver, gear, landing inputs"
      record_type: "vessel log, diver log, collector log, landing note, catch ticket, fuel invoice, gear log, permit"
      raw_fields: "species or grade, harvest area, method, diver, vessel or collector, trip, date, fuel, air compression, gear, gross sponge, rejected mass, accepted landed mass, landing site, permit"
      collection_method: "trip records, landing records, weigh tickets, diver logs, and permit or traceability documents"
      unit: "kg, L, kWh, MJ, item, h, date, area"
      frequency: "each trip or landing lot"
      temporal_coverage: "full reporting period or declared season"
      site_scope: "diver, vessel, collector, harvest area, landing site, or supplier"
      aggregation_rule: "reconcile collected mass plus purchases minus rejects and losses to accepted landed sponge; normalize to marketable output"
      quality_evidence: "landing tickets, scale records, trip logs, diver logs, permits, invoices, and operator sign-off"
    - protocol_id: cp_preparation_product_state_and_mass_records
      process_id: "primary_preparation_drying_and_packout"
      flow_role: "cleaning, drying, trimming, product state, marketable output"
      record_type: "wash log, drying log, trimming record, grade sheet, packout record, sales note"
      raw_fields: "accepted mass, wet/dry/cleaned basis, washing, drying time, drying temperature where relevant, rejected mass, grade, marketable mass, package count, destination"
      collection_method: "calibrated scales, handling logs, drying records, packout records, and sales reconciliation"
      unit: "kg, %, item, h, date"
      frequency: "each preparation or packing lot"
      temporal_coverage: "full handling and dispatch period"
      site_scope: "landing site, drying yard, packhouse, dispatch gate"
      aggregation_rule: "reconcile accepted landed mass minus rejects, trimming, moisture loss, and handling losses to marketable output; normalize all flows to 1 kg reference product"
      quality_evidence: "scale calibration, drying logs, packout sheets, sales records, and supervisor review"
    - protocol_id: cp_preparation_packaging_and_storage_records
      process_id: "primary_preparation_drying_and_packout"
      flow_role: "water, chemicals, electricity, drying fuel, packaging, storage"
      record_type: "water meter, chemical invoice, electricity meter, drying fuel record, packaging invoice, storage log, dispatch sheet"
      raw_fields: "water, chemical type, concentration, electricity, fuel, drying time, packaging material, item count, tare, lot, destination"
      collection_method: "invoices, meters, drying logs, and dispatch records"
      unit: "kg, L, m3, kWh, MJ, %, item, h"
      frequency: "each preparation lot and monthly reconciliation"
      temporal_coverage: "handling, storage, and dispatch period"
      site_scope: "preparation site, drying yard, storage room, dispatch gate"
      aggregation_rule: "allocate to product lots by measured lot, product mass, dry-mass output, drying time, or package count"
      quality_evidence: "invoices, meter readings, drying logs, dispatch sheets, and operator review"
    - protocol_id: cp_reject_residue_and_discharge_records
      process_id: "harvest_collection_and_landing_primary_preparation_drying_and_packout"
      flow_role: "damaged sponge, rejected sponge, trimming residue, wash water, wastewater, packaging waste"
      record_type: "reject log, residue record, wastewater record, disposal note, waste ticket"
      raw_fields: "date, species or material, count, mass, volume, cause, fate, disposal route, recovery route, receiving environment"
      collection_method: "landing records, handling records, waste tickets, and discharge records"
      unit: "kg, L, m3, item, date"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "full reporting period or season"
      site_scope: "vessel, landing site, preparation site, discharge route, or waste route"
      aggregation_rule: "sum by material and fate; reconcile to collected mass, accepted mass, marketable output, and disposal route"
      quality_evidence: "reject logs, waste transfer notes, discharge records, and supervisor review"
    - protocol_id: cp_delivery_records
      process_id: "delivery_to_declared_gate"
      flow_role: "delivered product, transport energy, moisture-protection condition"
      record_type: "delivery note, transport invoice, fuel record, route plan, storage or moisture log"
      raw_fields: "origin, destination, distance, mode, load mass, fuel, electricity, packaging support, moisture protection, return logistics"
      collection_method: "carrier documents, vehicle logs, meter records, and dispatch reconciliation"
      unit: "kg, km, tonne-km, L, kWh, h"
      frequency: "each delivery route"
      temporal_coverage: "delivery period in declared scope"
      site_scope: "delivery route, vehicle, vessel, or carrier"
